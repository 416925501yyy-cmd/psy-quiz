    { t:'term', k:'行为主义', a:'代表人物：华生（创始人）、斯金纳\n标志：1913 年华生发表《行为主义者眼中的心理学》\n主张：心理学只研究可观察的行为，反对研究意识，提出 S—R 公式\n地位：被称为心理学“第一势力”。', f:3, tip:'1913 + 华生 + S-R' },
    { t:'term', k:'格式塔心理学（完形心理学）', a:'代表人物：韦特海默、考夫卡、苛勒\n主张：反对元素分析，强调心理现象的整体性，“整体大于部分之和”\n贡献：系统研究了知觉的组织原则。', f:2 },
    { t:'term', k:'精神分析', a:'创始人：弗洛伊德\n主张：重视无意识、本能和早期经验对人格的影响\n方法：自由联想、梦的解析\n地位：被称为心理学“第二势力”。', f:2 },
    { t:'term', k:'人本主义', a:'代表人物：马斯洛、罗杰斯\n主张：强调人的价值、潜能与自我实现，关注健康人的心理\n地位：被称为心理学“第三势力”。', f:3, tip:'三大势力：行为主义、精神分析、人本主义' },
    { t:'term', k:'认知心理学', a:'核心观点：以信息加工观点研究心理过程，把人看作信息加工系统\n研究内容：注意、记忆、思维、语言等内部过程\n地位：现代心理学的主流取向。', f:2 },
    { t:'table', k:'构造主义 vs 机能主义 vs 行为主义', a:'构造主义：冯特、铁钦纳｜研究意识经验的要素｜实验内省法\n机能主义：詹姆斯、杜威｜研究意识的机能与适应｜强调实用\n行为主义：华生、斯金纳｜研究可观察的行为｜S—R 公式，反对研究意识', f:3 },
    { t:'short', k:'心理学的主要流派及代表人物', a:'1）构造主义：冯特、铁钦纳——意识要素，内省法；\n2）机能主义：詹姆斯、杜威——意识机能与适应；\n3）行为主义：华生、斯金纳——可观察行为，S—R；\n4）格式塔：韦特海默、考夫卡、苛勒——整体性；\n5）精神分析：弗洛伊德——无意识与早期经验；\n6）人本主义：马斯洛、罗杰斯——价值与自我实现；\n7）认知心理学——信息加工观点。', f:3 },
    { t:'term', k:'实验法', a:'定义：在严格控制条件下，主动操纵自变量以考察其与因变量关系的方法。\n核心特征：主动操纵自变量 + 控制额外变量 + 随机分配被试。\n优点：能确定因果关系，可重复验证。\n缺点：情境人为性可能降低外部效度。', f:3 },
    { t:'term', k:'相关研究（相关法）', a:'定义：测量两个或多个变量之间的共变关系（相关系数 r，−1 到 +1）。\n关键限制：只能说明变量间存在联系，不能确定因果方向和因果机制。\n价值：能研究无法操纵的变量（性别、人格等），可为实验研究提供假设。', f:3, tip:'常考：相关高 ≠ 有因果' },
    { t:'short', k:'心理学研究的基本方法', a:'1）观察法：自然情境中系统观察记录行为，生态效度高但难确定因果；\n2）实验法：操纵自变量、控制额外变量，能确定因果关系；\n3）调查法：用问卷或访谈收集大量资料，效率高但受自我报告限制；\n4）个案法：对单一被试深入研究，资料丰富但难以推广；\n5）测验法：用标准化测验测量心理特质。', f:3 }
  ]
},

/* ------------------------------ 第 2 章 ------------------------------ */
{
  name: '第2章 心理的神经生理机制',
  cards: [
    { t:'term', k:'神经元', a:'定义为神经系统结构和功能的基本单位（神经细胞）。\n结构：细胞体、树突（接受信息）、轴突（传出信息）三部分。\n功能：接受、整合、传递信息。', f:3 },
    { t:'term', k:'突触', a:'定义为神经元与神经元之间（或神经元与效应器之间）传递信息的接点。\n组成：突触前膜、突触间隙、突触后膜。\n传递方式：突触前膜释放神经递质 → 作用于突触后膜受体，是化学传递，具有单向性。', f:3 },
    { t:'short', k:'神经冲动的传导过程', a:'神经元内部：电传导（动作电位）。\n突触间隙：化学传导（神经递质释放与受体结合）。\n整体为“电—化学—电”的过程，突触传递是单向的。', f:3, tip:'一句话：电-化学-电，单向' },
    { t:'table', k:'交感神经 vs 副交感神经', a:'交感神经：应激状态兴奋｜心跳加快、瞳孔放大、消化抑制、动员能量\n副交感神经：安静状态兴奋｜心率降低、促进消化、储存能量\n二者同属自主（植物性）神经系统，作用相互拮抗又协调。', f:3 },
    { t:'term', k:'网状结构', a:'位置：脑干（延髓、脑桥、中脑）中的神经纤维网络。\n功能：维持觉醒状态，调节睡眠与觉醒周期，参与注意和情绪。\n意义：是上行激活系统的核心。', f:2 },
    { t:'term', k:'丘脑', a:'位置：间脑。\n功能：除嗅觉外，所有感觉信息传向大脑皮层的中继站（感觉接替核）。\n常考：嗅觉是唯一不经过丘脑中继的感觉。', f:3 },
    { t:'term', k:'下丘脑', a:'位置：间脑，丘脑下方。\n功能：调节内脏活动和内分泌活动的重要中枢，控制体温、摄食、饮水、水平衡和性行为。\n别称：与情绪有关的“内脏脑”的一部分。', f:2 },
    { t:'term', k:'边缘系统', a:'组成：海马、杏仁核、扣带回、下丘脑等。\n功能：与情绪、记忆和动机密切相关。\n记忆要点：杏仁核管情绪（尤其恐惧），海马管记忆。', f:3 },
    { t:'term', k:'海马', a:'功能：与记忆特别是短时记忆向长时记忆的转化密切相关。\n证据：海马损伤后无法形成新的外显记忆（如 H.M. 病人），但内隐记忆相对保留。', f:3 },
    { t:'term', k:'杏仁核', a:'功能：参与情绪尤其是恐惧的产生与识别。\n证据：杏仁核损伤者对恐惧表情的识别受损，恐惧条件反射难以建立。', f:2 },
    { t:'table', k:'大脑皮层四大分区与功能', a:'额叶：运动区 + 高级认知（计划、决策、言语表达）\n顶叶：躯体感觉区\n颞叶：听觉区\n枕叶：视觉区', f:3, tip:'额顶颞枕：动、感、听、视' },
    { t:'term', k:'布洛卡区', a:'位置：额下回后部（额叶）。\n损伤表现：表达性失语症——能理解语言但说话困难、不流利。\n记忆：布洛卡 = 说话（表达）。', f:3 },
    { t:'term', k:'威尔尼克区', a:'位置：颞上回后部（颞叶）。\n损伤表现：接受性（听觉性）失语症——说话流利但内容无意义，听不懂别人说话。\n记忆：威尔尼克 = 听懂（理解）。', f:3, tip:'一个管说、一个管听' },
    { t:'exp', k:'割裂脑研究', a:'研究者：斯佩里（1981 年诺贝尔生理学或医学奖），加扎尼加为合作者。\n方法：切断胼胝体，使两半球不能互通信息，分别向左右视野呈现刺激。\n结论：支持大脑两半球功能一侧化——左半球优势在言语、逻辑与分析，右半球优势在空间关系、音乐、情绪识别。', f:3 },
    { t:'short', k:'大脑两半球功能一侧化', a:'左半球：言语、阅读、书写、逻辑推理、分析性加工。\n右半球：空间关系、图形识别、音乐、情绪识别、整体性加工。\n证据：割裂脑研究（斯佩里）、临床失语症病例、脑成像研究。\n注意：一侧化是相对的，多数任务需要两半球协同。', f:3 }
  ]
},

/* ------------------------------ 第 3 章 ------------------------------ */
{
  name: '第3章 感觉',
  cards: [
    { t:'term', k:'感觉', a:'定义为脑对直接作用于感觉器官的客观事物个别属性的反映。\n与知觉的区别：感觉反映个别属性，知觉反映整体属性。\n地位：一切心理活动的基础。', f:3 },
    { t:'term', k:'感受性与感觉阈限', a:'感受性：对刺激的感觉能力。\n感觉阈限：能引起感觉的刺激量。\n关系：二者成反比——阈限越低，感受性越高。', f:3, tip:'反比关系必考' },
    { t:'term', k:'绝对感觉阈限与绝对感受性', a:'绝对感觉阈限：刚刚能引起感觉的最小刺激量。\n绝对感受性：觉察最小刺激量的能力。\n关系：成反比。', f:3 },
    { t:'term', k:'差别阈限与差别感受性', a:'差别阈限（最小可觉差 JND）：刚刚能引起差别感觉的刺激的最小变化量。\n差别感受性：觉察刺激微小差别的能力。\n关系：成反比。', f:3 },
    { t:'term', k:'韦伯定律', a:'公式：ΔI / I = K\n含义：差别阈限与原刺激强度的比值是常数 K，即差别阈限与原刺激强度成正比。\n适用：中等强度的刺激；K 值因感觉通道而异。', f:3, tip:'ΔI/I=K' },
    { t:'term', k:'费希纳定律', a:'公式：S = K·lgR\n含义：感觉强度与刺激强度的对数成正比。\n条件：只适用于中等强度刺激。\n与韦伯定律的关系：费希纳在韦伯定律基础上推导而来。', f:3, tip:'对数关系' },
    { t:'term', k:'史蒂文斯幂定律', a:'公式：S = K·Iⁿ\n提出者：史蒂文斯，用数量估计法研究。\n优点：适用范围比费希纳定律更广，可处理强弱两端。', f:2 },
    { t:'table', k:'棒体细胞 vs 锥体细胞', a:'棒体细胞（视杆）：数量多｜中央窝极少｜负责暗视觉｜感光敏锐、不能辨色｜主要管明暗\n锥体细胞（视锥）：数量少｜集中在中央窝｜负责明视觉｜能分辨颜色和细节', f:3 },
    { t:'short', k:'视觉的适宜刺激与感光机制', a:'适宜刺激：波长约 380—780 纳米的电磁波。\n感光细胞：棒体细胞负责暗视觉，锥体细胞负责明视觉和颜色视觉。\n传导路线：光 → 视细胞 → 双极细胞 → 神经节细胞 → 视神经 → 丘脑 → 枕叶视觉区。', f:2 },
    { t:'table', k:'三色说 vs 对立过程理论', a:'三色说（杨—赫尔姆霍兹）：视网膜上有红绿蓝三种感受器，能解释颜色混合和色盲，不能解释负后像与互补色\n对立过程理论（黑林四色说）：存在黑白、红绿、黄蓝三对对立机制，能解释负后像、互补色和色盲成对出现\n现代观点：视网膜水平是三色机制，视觉通路和中枢是对立机制', f:3 },
    { t:'term', k:'暗适应与明适应', a:'暗适应：从亮处到暗处，视觉感受性逐渐提高的过程，主要由棒体细胞完成，速度较慢（约 30—40 分钟）。\n明适应：从暗处到亮处，感受性逐渐降低的过程，主要由锥体细胞完成，速度很快（约 1 分钟）。', f:3, tip:'暗慢明快，棒暗锥明' },
    { t:'term', k:'视觉后像', a:'定义：刺激停止作用后暂时保留的感觉印象。\n正后像：与原刺激性质相同（如看灯后仍有亮点）。\n负后像：与原刺激性质相反、颜色互补（如看红灯后出现绿色）。\n负后像支持对立过程理论。', f:2 },
    { t:'short', k:'听觉的四种理论', a:'1）频率理论（罗·费尔德）：基底膜按刺激频率振动，适合低频；\n2）共鸣理论（赫尔姆霍兹）：不同部位纤维对不同频率共鸣，适合中高频；\n3）行波理论（贝克西）：声波引起基底膜行波，不同频率最大振幅部位不同，获诺贝尔奖；\n4）神经齿轮说（韦弗尔）：神经冲动排放频率组合编码频率。', f:3 },
    { t:'table', k:'声音的三个属性', a:'音调：与频率有关\n音响（响度）：与振幅有关\n音色：与波形有关', f:2 },
    { t:'term', k:'感觉对比与联觉', a:'感觉对比：同一感受器接受不同刺激而使感受性发生变化，分同时对比与继时对比。\n联觉：一种感觉兼有另一种感觉的现象，如红色感觉温暖、蓝色感觉清凉。', f:1 },
    { t:'term', k:'感觉适应', a:'定义：刺激物持续作用于感受器而使感受性发生变化的现象。\n方向：既可使感受性提高（暗适应），也可使感受性降低（明适应、嗅觉适应）。\n特例：痛觉几乎不发生适应，具有保护意义。', f:3 }
  ]
},

/* ------------------------------ 第 4 章 ------------------------------ */
{
  name: '第4章 知觉',
  cards: [
    { t:'term', k:'知觉', a:'定义为脑对直接作用于感觉器官的客观事物整体属性的反映。\n与感觉的关系：在感觉基础上整合信息，但不是感觉的简单相加。', f:3 },
    { t:'short', k:'知觉的四个基本特性', a:'1）整体性：把对象作为整体来反映，整体大于部分之和；\n2）选择性：把对象从背景中分离出来；\n3）恒常性：条件变化时知觉映象保持相对稳定；\n4）理解性：以过去经验为依据解释当前对象（仁者见仁）。', f:3, tip:'整选恒理' },
    { t:'term', k:'知觉恒常性', a:'定义：当知觉的客观条件在一定范围内变化时，知觉映象在相当程度上保持相对稳定。\n种类：大小恒常性、形状恒常性、明度恒常性、颜色恒常性。\n意义：使人能在变化环境中稳定地认识世界。', f:3 },
    { t:'table', k:'深度知觉的单眼线索 vs 双眼线索', a:'单眼线索：调节、线条透视、空气透视、遮挡（对象重叠）、纹理梯度、运动视差、相对高度、明暗阴影\n双眼线索：双眼视差（最重要）、双眼辐合（辐辏）\n记忆：视差是深度知觉最主要的线索', f:3 },
    { t:'exp', k:'视觉悬崖实验', a:'研究者：吉布森和沃克。\n装置：中间有视觉落差的玻璃平台，分浅区和深区。\n结果：约 6 个月的婴儿在爬到深区边缘时犹豫、回避或心率变化。\n结论：婴儿在会爬之前就已具有深度知觉。', f:3 },
    { t:'term', k:'似动现象', a:'定义：在一定时间和空间条件下，静止的刺激被人知觉为运动的现象。\n四种形式：①动景运动（电影、霓虹灯）；②诱导运动（云动月不动）；③自主运动（游动效应）；④运动后效（瀑布效应）。', f:3, tip:'动景、诱导、自主、后效' },
    { t:'term', k:'错觉', a:'定义：在特定条件下对客观事物必然产生的、具有固定倾向的歪曲知觉。\n特点：必然性、固定倾向性，正常人都会有，不能靠意志消除。\n常见种类：缪勒—莱耶错觉（长度）、佐尔拉错觉、波根多夫错觉（方向）、潘佐错觉。', f:3 },
    { t:'short', k:'错觉的主要理论解释', a:'1）眼动理论：错觉与眼球运动有关，如缪勒—莱耶错觉由扫描幅度不同造成；\n2）神经抑制作用理论：轮廓的相互抑制使神经兴奋中心位移；\n3）深度加工和恒常性误用理论：把二维图形当三维加工，错误运用大小恒常性；\n4）常性误用说还强调过去经验的作用。', f:2 },
    { t:'short', k:'图形组织的知觉原则（格式塔）', a:'1）邻近性：距离近的易被知觉为一体；\n2）相似性：相似的易被组合；\n3）对称性；\n4）良好连续（连续性）；\n5）共同命运；\n6）封闭性。\n这些原则说明知觉具有主动组织性。', f:2 },
    { t:'term', k:'时间知觉', a:'定义：对客观现象延续性和顺序性的反映。\n影响因素：活动的内容与性质、情绪状态、态度与兴趣、感觉通道性质（听觉估计时间最准确）。\n线索：自然界的周期性变化、计时工具、生理节律。', f:2 },
    { t:'term', k:'大小恒常性', a:'定义：物体在视网膜上成像大小改变时，知觉到的实际大小保持相对不变。\n条件：物体距离不能太远，需有距离线索；缺乏距离线索时恒常性破坏。', f:2 },
    { t:'term', k:'形状恒常性', a:'定义：物体在视网膜上成像形状改变时（如倾斜观察），知觉到的形状仍保持相对不变。\n实验：让被试在不同倾斜角度观察同一物体，发现知觉形状的变化远小于视网膜像的变化。', f:2 },
    { t:'term', k:'知觉的理解性', a:'定义：人以过去的知识经验为依据，对知觉对象作出解释，使其具有一定意义。\n表现：“仁者见仁，智者见智”；不完整图形可被补全为有意义的整体。\n意义：理解性使知觉更迅速、更准确。', f:2 }
  ]
},

/* ------------------------------ 第 5 章 ------------------------------ */
{
  name: '第5章 意识和注意',
  cards: [
    { t:'term', k:'注意', a:'定义为心理活动或意识对一定对象的指向和集中。\n两个特点：指向性（选择某些对象而离开另一些）、集中性（对所选对象的贯注程度）。\n性质：不是独立的心理过程，而是伴随其他心理过程的意识状态。', f:3 },
    { t:'short', k:'注意的功能', a:'1）选择功能：选择有意义的、符合需要的刺激；\n2）维持（保持）功能：使心理活动在一定时间内保持在对象上；\n3）调节和监督功能：对活动进行调节与控制，使人能及时转移和分配注意。', f:3 },
    { t:'table', k:'不随意注意 vs 随意注意 vs 随意后注意', a:'不随意注意（无意注意）：无预定目的、不需意志努力｜由刺激物特点和主体状态引起\n随意注意（有意注意）：有预定目的、需意志努力｜人类特有\n随意后注意（有意后注意）：有目的但不需意志努力｜在随意注意基础上发展而来，是高水平的注意状态', f:3, tip:'有没有目的 × 要不要努力' },
    { t:'term', k:'注意广度（注意范围）', a:'定义：在同一时间内能清楚地把握对象的数量。\n数值：成人一般 5—9 个（7±2），黑点实验证明。\n影响因素：对象的特点（越集中、越有规律越大）、主体的知识经验、注意的紧张度。', f:3 },
    { t:'term', k:'注意的分配', a:'定义：在同一时间内把注意指向不同的对象或活动。\n条件：①同时进行的活动至少有一种是熟练的；②活动之间有内在联系；③可通过训练提高。\n例子：边听课边记笔记。', f:3 },
    { t:'term', k:'注意的稳定性', a:'定义：注意在一定时间内保持在某个对象或活动上。\n注意的起伏（动摇）：注意强度周期性变化，是稳定性的表现之一。\n与注意分散的区别：分散是被无关刺激干扰而被动离开对象。', f:2 },
    { t:'short', k:'选择性注意的四个模型', a:'1）过滤器模型（布罗德本特）：注意是“全或无”的过滤器，位于知觉早期，单通道；\n2）衰减模型（特瑞斯曼）：非注意通道信息不被完全滤掉而是衰减，阈限低的词仍可识别（鸡尾酒会效应）；\n3）后期选择模型（多伊奇）：所有信息都得到充分加工，选择发生在反应阶段；\n4）多阶段选择模型（约翰斯顿和汉斯）：选择可发生在不同阶段。', f:3 },
    { t:'exp', k:'双耳分听实验', a:'研究者：彻里首创，布罗德本特、特瑞斯曼等发展。\n方法：同时向两耳呈现不同材料，要求被试只听一只耳（追随耳）并复述。\n发现：被试对非追随耳的内容几乎一无所知，但对自己名字等阈限低的词能觉察。\n意义：支持选择性注意的过滤器模型和衰减模型。', f:3 },
    { t:'term', k:'资源限制理论', a:'提出者：卡尼曼。\n观点：注意是一种有限的认知资源，刺激或任务越复杂占用资源越多；资源分配取决于唤醒水平和任务需求。\n意义：从资源分配角度解释注意选择，能解释双任务干扰现象。', f:2 },
    { t:'term', k:'特征整合理论', a:'提出者：特瑞斯曼和格拉德。\n观点：视觉加工早期是平行的、以特征为单位；特征“自由漂浮”，需要通过集中注意捆绑成完整客体。\n推论：特征搜索是平行加工（不受项目数影响），联合搜索需要系列加工（项目越多越慢）。', f:3 },
    { t:'term', k:'Stroop 效应', a:'范式：呈现颜色词（如“红”字用绿色写），要求被试报告字的墨色。\n现象：字义与颜色不一致时，颜色命名显著变慢。\n解释：字义加工是自动化的，与颜色命名任务产生冲突，反映自动化加工与注意控制的冲突。', f:3 },
    { t:'term', k:'返回抑制', a:'发现者：波斯纳。\n现象：线索与目标间隔（SOA）较长（约大于 300 毫秒）时，出现在先前被提示位置上的目标反应反而更慢。\n意义：有助于提高视觉搜索效率，避免注意反复回到已搜索过的位置。', f:2 },
    { t:'term', k:'注意瞬脱', a:'现象：在快速序列视觉呈现（RSVP）中，正确识别第一个目标后，约 200—500 毫秒内对第二个目标的识别正确率显著下降。\n解释：反映注意在时间维度上的容量限制。', f:2 },
    { t:'short', k:'睡眠的阶段与特点', a:'1）第一阶段：浅睡，脑电波幅变小、频率变慢，出现睡眠锭；\n2）第二阶段：出现纺锤波（睡眠锭）和 K 复合波；\n3）第三阶段：慢波睡眠，出现 δ 波；\n4）第四阶段：深度睡眠，δ 波为主，最难唤醒；\n5）快速眼动睡眠（REM）：眼球快速运动，脑电接近清醒状态，梦境大多发生于此。\n整夜睡眠在慢波与 REM 之间周期性循环（约 90 分钟一个周期）。', f:2 }
  ]
},

/* ------------------------------ 第 6 章 ------------------------------ */
{
  name: '第6章 记忆',
  cards: [
    { t:'short', k:'记忆过程的三个环节', a:'1）编码（识记）：信息进入记忆系统时的加工；\n2）存储（保持）：信息在记忆中保存；\n3）提取：从记忆中取出信息，包括再认和回忆。\n提取失败或提取错误都属于遗忘的表现。', f:3 },
    { t:'short', k:'记忆的三级系统（阿特金森和希夫林）', a:'1）感觉记忆：保持 0.25—4 秒，容量大，以感觉后像形式存在；\n2）短时记忆：保持约 15—30 秒（无复述），容量 7±2 个组块，以听觉编码为主；\n3）长时记忆：保持 1 分钟以上直至终身，容量无限，以语义编码为主。\n信息通过注意和复述从一级进入下一级。', f:3 },
    { t:'exp', k:'斯柏林的部分报告法', a:'研究者：斯柏林（1960）。\n设计：向被试呈现 3×3 或 3×4 字母矩阵，用不同音调提示报告其中一行。\n结果：全部报告法只能回忆 4—5 个；部分报告法可回忆约 9—10 个。\n结论：证明视觉感觉记忆（图像记忆）的存在，容量大但保持时间极短（约 1 秒以内）。', f:3 },
    { t:'term', k:'组块', a:'定义：把若干小单位的信息联合成较大单位的信息加工过程或结果。\n作用：有效扩大短时记忆的容量。\n依据：米勒提出短时记忆容量为 7±2 个组块。\n关键：组块大小依赖个体的知识经验，专家能形成更大的组块。', f:3, tip:'7±2 是“组块”数，不是“字”数' },
    { t:'table', k:'短时记忆 vs 长时记忆', a:'短时记忆：容量 7±2 组块｜保持 15—30 秒（无复述）｜以听觉编码为主｜完全系列扫描提取\n长时记忆：容量几乎无限｜保持 1 分钟以上｜以语义编码为主｜依赖线索提取\n联系：短时记忆经复述进入长时记忆', f:3 },
    { t:'exp', k:'斯滕伯格的加因素法实验', a:'问题：短时记忆的提取方式。\n设计：给被试呈现 1—6 个数字，再呈现一个探测数字，测量反应时。\n结果：反应时随识记项目数线性增加；“是”与“否”的反应时基本相同。\n结论：短时记忆的提取是完全系列扫描，而非自动停止扫描。', f:3 },
    { t:'exp', k:'皮特森—皮特森分散注意法', a:'设计：给被试呈现三个字母后，立即让其做减数运算（防复述），间隔不同时间后回忆。\n结果：回忆率随间隔延长迅速下降，18 秒后几乎全部遗忘。\n结论：短时记忆在无复述条件下约 15—30 秒后迅速遗忘。', f:3 },
    { t:'exp', k:'康拉德的听觉编码实验', a:'设计：要求被试回忆字母序列，分析错误类型。\n结果：错误多为发音相似的字母混淆（如 B 记成 P、V），而非形状相似。\n结论：短时记忆以听觉（言语听觉）编码为主。', f:3, tip:'短时=听觉，长时=语义' },
    { t:'exp', k:'艾宾浩斯遗忘曲线', a:'材料：无意义音节（排除已有经验影响）。\n方法：节省法，用节省率作为保持量指标。\n规律：遗忘进程先快后慢，呈负加速；20 分钟遗忘约 42%，一天后约 66%，之后趋于平缓。\n启示：及时复习、分散复习、过度学习。', f:3 },
    { t:'short', k:'遗忘的四种理论', a:'1）衰退说：记忆痕迹随时间自然消退，难以解释“想不起来但一提示就想起”；\n2）干扰说：学习和回忆之间相互干扰（前摄抑制、倒摄抑制），睡眠实验支持；\n3）压抑说：由动机性压抑造成，与情绪经验有关；\n4）提取失败说：信息仍在长时记忆中，只是缺乏适当提取线索（舌尖现象）。', f:3 },
    { t:'table', k:'前摄抑制 vs 倒摄抑制', a:'前摄抑制：先学习的内容对后学习内容的干扰｜“前面挡后面”\n倒摄抑制：后学习的内容对先前学习内容的干扰｜“后面盖前面”\n应用：系列位置效应中，中间部分同时受两种抑制，记忆效果最差。', f:3 },
    { t:'term', k:'系列位置效应', a:'定义：在自由回忆中，材料在序列中的位置影响回忆效果。\n首因效应：开头部分回忆率高，源于长时记忆（有更多复述机会）。\n近因效应：末尾部分回忆率高，源于短时记忆。\n验证：回忆前加分心任务，近因效应减弱，首因效应不受影响。', f:3 },
    { t:'term', k:'过度学习', a:'定义：学习达到刚好成诵后继续学习的部分。\n最佳量：学习程度达到 150%（即过度学习 50%）时保持效果最好，超过则效率下降。', f:3 },
    { t:'term', k:'加工水平说', a:'提出者：克雷克和洛克哈特。\n观点：记忆效果取决于信息加工的深度——物理（浅层）加工 < 语言加工 < 语义（深层）加工。\n意义：强调加工的质而非复述的量，能解释很多记忆现象。', f:2 },
    { t:'table', k:'情景记忆 vs 语义记忆（图尔文）', a:'情景记忆：对个人经历的具体事件和情境的记忆｜有时间和空间背景｜容易受干扰而遗忘\n语义记忆：对一般知识和规律的记忆｜无具体时空背景｜相对稳定、不易遗忘', f:2 },
    { t:'table', k:'外显记忆 vs 内隐记忆', a:'外显记忆：有意识提取｜用直接测量（自由回忆、线索回忆、再认）｜受加工水平、学习意向影响大｜依赖海马和内侧颞叶\n内隐记忆：无意识使用过去经验｜用间接测量（词干补笔、知觉辨认等启动效应）｜受影响小｜更多依赖皮层相关区域和基底节', f:3 },
    { t:'term', k:'工作记忆（巴德利和希奇）', a:'定义：在完成认知任务过程中，对信息进行暂时加工和存储的、容量有限的系统。\n成分：①中央执行系统（核心，负责注意控制与协调）；②语音环路（言语听觉信息）；③视空间模板（视觉空间信息）；④情景缓冲器（后补充，整合多通道信息）。\n与短时记忆的区别：强调主动加工而非被动存储。', f:3 },
    { t:'exp', k:'DRM 范式（错误记忆）', a:'设计：学习与某个关键诱饵词（如“床”）高度语义关联的词表，然后自由回忆或再认。\n结果：被试以很高比例错误“回忆”出从未呈现过的关键诱饵词。\n结论：记忆不是经验的精确复制，而具有建构性。', f:2 },
    { t:'exp', k:'洛夫特斯的目击者记忆研究', a:'方法：先让被试看交通事故影片，事后用不同措辞提问（“撞碎” vs “碰到”）。\n结果：提问措辞影响被试对车速和破碎玻璃的错误记忆。\n结论：事后误导信息可整合进原有记忆，产生错误记忆，对司法实践有重要启示。', f:2 }
  ]
},

/* ------------------------------ 第 7 章 ------------------------------ */
{
  name: '第7章 思维',
  cards: [
    { t:'term', k:'思维', a:'定义为脑对客观事物的间接的、概括的反映。\n两个特征：间接性（借助已有知识经验推知事物）、概括性（反映一类事物的共同本质特征和内在联系）。\n地位：认识过程的高级阶段，是智力的核心成分。', f:3 },
    { t:'table', k:'聚合思维 vs 发散思维', a:'聚合思维（辐合思维）：把问题提供的信息聚合起来，朝一个方向得出唯一答案｜与创造性关系较小\n发散思维（辐射思维）：沿不同方向探索，产生多种新颖答案｜是创造性思维的核心\n发散思维三指标：流畅性、变通性、独特性', f:3, tip:'吉尔福特提出' },
    { t:'term', k:'概念形成的假设检验说', a:'提出者：布鲁纳等。\n观点：概念形成是个体主动提出假设并加以检验的过程。\n策略：聚焦策略（整体聚焦、部分聚焦）、扫描策略等。', f:2 },
    { t:'term', k:'原型说', a:'提出者：罗斯。\n观点：概念主要由原型（最具代表性的样例）以及范畴成员的相似性程度来表征。\n与特征表说的区别：不要求所有成员共享定义性特征。', f:2 },
    { t:'table', k:'算法策略 vs 启发式策略', a:'算法策略：逐一尝试所有可能方案｜能保证找到答案｜费时费力\n启发式策略：根据经验缩小搜索范围｜效率高｜不保证成功\n常用启发式：手段—目的分析、逆向搜索、爬山法', f:3 },
    { t:'term', k:'手段—目的分析', a:'提出者：纽厄尔和西蒙。\n含义：不断把当前状态与目标状态的差异找出来，通过设置子目标、逐步缩小差异来解决问题。\n地位：最典型的启发式策略，是问题空间理论的核心算子。', f:3 },
    { t:'term', k:'功能固着', a:'提出者：邓克尔（蜡烛问题）。\n定义：个体只看到物体的通常功能，难以发现其他可能用途，从而妨碍问题解决。\n启示：克服功能固着需要灵活地表征物体的多种用途。', f:3, tip:'蜡烛 + 火柴盒' },
    { t:'term', k:'定势', a:'定义：由先前活动形成的影响当前问题解决的心理准备状态。\n双重作用：既可能促进问题解决（同类问题的快速解决），也可能妨碍（固守旧方法）。\n经典实验：卢钦斯的量水实验。', f:3 },
    { t:'exp', k:'卢钦斯的量水实验', a:'设计：先让被试做若干可用固定公式（B−A−2C）解决的问题，再呈现可用更简单方法解决的问题。\n结果：许多被试仍沿用旧公式，未能发现更简洁的解法。\n结论：证明定势对问题解决既有促进作用也有阻碍作用。', f:2 },
    { t:'short', k:'影响问题解决的主要因素', a:'1）知识经验：专家图式丰富，能抓住问题实质；\n2）定势：既可促进也可妨碍（卢钦斯量水实验）；\n3）功能固着：妨碍发现新用途（邓克尔蜡烛问题）；\n4）动机强度：中等强度最有利，任务越难最佳动机水平越低（耶克斯—多德森定律）；\n5）情绪状态：紧张焦虑干扰思路；\n6）原型启发与酝酿效应；\n7）个性特征：独立、自信、灵活者更易解决问题。', f:3 },
    { t:'short', k:'动机强度对问题解决的影响', a:'规律：动机强度与解决问题的效率呈倒 U 形曲线，中等强度动机效率最高；任务越困难，最佳动机水平越低（耶克斯—多德森定律）。\n解释：动机过弱缺乏动力，动机过强导致紧张焦虑、注意范围变窄，反而干扰思路。\n应用：考试遇到难题时应降低紧张程度，先做会的题建立信心。', f:2 },
    { t:'term', k:'问题空间', a:'提出者：纽厄尔和西蒙（信息加工观点）。\n含义：问题解决者对问题的一切可能的认识状态，包括初始状态、目标状态和中间状态（算子）。\n问题解决的过程：在问题空间中进行搜索，从初始状态经过算子达到目标状态。', f:2 },
    { t:'term', k:'原型启发与酝酿效应', a:'原型启发：从其他事物中获得解决问题的启示，如鲁班从草叶得到启示发明锯子，是创造性解决问题的重要途径。\n酝酿效应：暂时搁置问题后反而更容易找到解决办法，说明思维定势的暂时解除有助于问题解决。', f:2 },
    { t:'short', k:'创造性思维及其培养', a:'创造性思维是产生新颖、独特且有社会价值产品的思维，核心成分是发散思维。\n三个指标：流畅性（数量多）、变通性（类别广）、独特性（新颖）。\n培养：①保护好奇心与求知欲；②鼓励发散思维与多角度思考；③提供原型启发；④宽容与众不同的答案；⑤在宽松、低评价压力的环境中进行。', f:2 }
  ]
},

/* ------------------------------ 第 8 章 ------------------------------ */
{
  name: '第8章 语言',
  cards: [
    { t:'short', k:'语言的层次结构', a:'由小到大：音位 → 语素 → 词 → 句子。\n音位：语言中最小的语音单位，本身不表意；\n语素：语言中最小的音义结合单位（如“书”“们”）；\n词：能独立运用的最小单位；\n句子：表达完整意思的语言单位。', f:2 },
    { t:'short', k:'语言的基本特征', a:'1）创造性：能用有限规则生成无限句子；\n2）结构性：受语法规则约束；\n3）意义性：每个词句都表达一定意义；\n4）指代性：指代客观事物或现象；\n5）社会性与个体性：语言是社会现象，言语是个体运用语言的活动。', f:2 },
    { t:'table', k:'语言 vs 言语', a:'语言：社会现象｜音义结合的词汇和语法系统｜相对稳定、共同约定\n言语：个体现象｜运用语言进行交际的过程｜具有个体差异、动态\n联系：语言在言语中产生和发展，言语离不开语言。', f:2 },
    { t:'table', k:'语言习得：乔姆斯基 vs 斯金纳', a:'斯金纳（强化说/后天论）：语言通过强化和模仿习得，属行为主义\n乔姆斯基（先天论）：儿童具有先天的语言获得装置（LAD）和普遍语法，能由有限输入生成无限句子\n其他：皮亚杰的认知相互作用说、班杜拉的社会学习说', f:2 },
    { t:'term', k:'语言获得装置（LAD）', a:'提出者：乔姆斯基。\n含义：儿童天生具有的一种语言习得机制，能在有限语言输入下迅速掌握本族语语法规则，生成无限句子。\n意义：支持语言获得的先天论，与斯金纳的强化说相对立。', f:2 },
    { t:'term', k:'沃尔夫假说（语言相对假说）', a:'提出者：萨丕尔、沃尔夫。\n观点：语言结构影响甚至决定人的思维方式和认知。\n强式版本（语言决定论）已被质疑，弱式版本（语言影响思维）获得较多支持。', f:2 },
    { t:'term', k:'花园路径句', a:'定义：读者最初按一种句法结构理解、后来发现被“引人歧途”的句子（如“因为老王生病了，所以没来上班的是他”）。\n用途：研究句子理解中的句法分析过程，支持“先句法后语义”或并行加工的理论争论。', f:1 },
    { t:'short', k:'词汇识别的影响因素', a:'1）词频：高频词识别快；\n2）词长：词越长识别越慢；\n3）语境：语境能促进词的识别（启动效应）；\n4）正字法规则与语音中介；\n5）语义透明度。', f:1 }
  ]
},

/* ------------------------------ 第 9 章 ------------------------------ */
{
  name: '第9章 动机',
  cards: [
    { t:'term', k:'动机', a:'定义为引起和维持个体活动、并使活动朝向某一目标的内在心理过程（内部动力）。\n产生条件：需要（内部基础）+ 诱因（外部条件）。\n功能：激活、指向、维持与调整。', f:3 },
    { t:'term', k:'需要与诱因', a:'需要：有机体内部的不平衡状态，是有机体对内外环境客观需求的反映，是动机产生的基础。\n诱因：能引起机体动机行为的外部刺激或情境。\n关系：需要与诱因共同作用产生动机。', f:2 },
    { t:'short', k:'马斯洛需要层次理论', a:'由低到高五个层次：①生理需要；②安全需要；③归属与爱的需要；④尊重需要；⑤自我实现需要（最高层次）。\n早期还包括认知需要和审美需要。\n基本观点：低层次需要基本满足后，高层次需要才占主导，但这种递进不是绝对的；前四种为缺失性需要，自我实现为成长性需要。', f:3 },
    { t:'term', k:'成就动机', a:'提出者：麦克利兰、阿特金森。\n定义：个体追求自认为有价值的工作并使之达到完美状态的动机。\n阿特金森模型：成就行为取决于追求成功的动机与避免失败的动机之差；追求成功者倾向选择中等难度任务，避免失败者倾向选择很难或很容易的任务。', f:3 },
    { t:'table', k:'追求成功动机 vs 避免失败动机', a:'追求成功（希望成功的人）：选择中等难度任务｜敢于冒险｜成功时归因于能力，失败时归因于努力不够\n避免失败的人：选择很容易或很难的任务｜回避风险｜失败时更容易归因于能力不足，产生无助感', f:2 },
    { t:'term', k:'韦纳的归因理论', a:'三个维度：内外源（内部—外部）、稳定性（稳定—不稳定）、可控性（可控—不可控）。\n四个典型因素：能力（内部、稳定、不可控）、努力（内部、不稳定、可控）、任务难度（外部、稳定、不可控）、运气（外部、不稳定、不可控）。\n意义：归因方式影响后续的情绪、期望和努力程度。', f:3, tip:'能力—努力—难度—运气' },
    { t:'table', k:'韦纳四因素的三个维度', a:'能力：内部 · 稳定 · 不可控\n努力：内部 · 不稳定 · 可控\n任务难度：外部 · 稳定 · 不可控\n运气：外部 · 不稳定 · 不可控\n把失败归于“能力”最不利——内部、稳定且不可控，易产生习得性无助。', f:3 },
    { t:'term', k:'习得性无助', a:'提出者：塞利格曼（狗的逃避电击实验）。\n定义：在反复经历失败或无法控制的负性事件后，个体形成的无能为力、放弃努力的心理状态。\n表现：动机降低、认知停滞、情绪抑郁。\n对策：训练归因于努力等可控因素。', f:2 },
    { t:'term', k:'自我效能感', a:'提出者：班杜拉。\n定义：个体对自己能否成功完成某一行为、达到某一目标的主观判断和信念。\n作用：影响活动选择、努力程度和坚持性。\n影响因素：①直接经验（成败经验，最重要）；②替代经验；③言语说服；④情绪与生理状态。', f:3 },
    { t:'term', k:'控制点（罗特）', a:'又名心理控制源。\n内控型：认为行为结果由自身努力和能力决定，更主动、更努力。\n外控型：认为结果由外部力量（运气、他人）决定，更被动、易焦虑。\n测量：内外控制点量表。', f:2 },
    { t:'term', k:'耶克斯—多德森定律', a:'动机强度与工作效率呈倒 U 形曲线，中等强度动机效率最高。\n任务越容易，最佳动机水平越高；任务越困难，最佳动机水平越低。', f:3 },
    { t:'table', k:'内在动机 vs 外在动机', a:'内在动机：由活动本身的兴趣、好奇、成就感引起｜持续时间长、质量高\n外在动机：由外部奖励、惩罚、压力引起｜持续时间短，过度使用可能削弱内在动机（德西效应）\n应用：学习中以激发内在动机为主，外部奖励为辅。', f:1 },
    { t:'short', k:'意志行动与意志品质', a:'意志：自觉地确定目的，并据此支配、调节行动、克服困难以实现目的的心理过程。\n意志行动的特征：①有自觉的目的；②与克服困难相联系；③以随意运动为基础。\n良好意志品质：自觉性、果断性、坚韧性、自制力。', f:1 }
  ]
},

/* ------------------------------ 第 10 章 ------------------------------ */
{
  name: '第10章 情绪和情感',
  cards: [
    { t:'term', k:'情绪和情感', a:'定义为人对客观事物是否满足自身需要而产生的态度体验及相应的行为反应。\n三种成分：①主观体验；②生理唤醒；③外部表现（表情）。\n功能：适应、动机、组织、信号（社会交往）功能。', f:3 },
    { t:'table', k:'情绪 vs 情感', a:'情绪：与生理需要相联系｜出现较早，人兽共有｜情境性、暂时性、易变｜外部表现明显、有冲动性\n情感：与社会需要相联系｜出现较晚，人类特有｜稳定性、深刻性、持久性｜较为内隐\n联系：情感通过情绪表现，情绪是情感的外部表现，情感是情绪的本质内容。', f:3 },
    { t:'table', k:'詹姆斯—兰格理论 vs 坎农—巴德学说', a:'詹姆斯—兰格（外周理论）：情绪是对身体生理变化的知觉，“因为哭所以悲伤”｜强调外周变化，无法解释生理反应相似而情绪不同\n坎农—巴德（丘脑说）：丘脑是情绪活动的中心，情绪体验与生理变化同时发生｜注意到中枢的作用', f:3, tip:'一个说先有身体，一个说同时' },
    { t:'term', k:'情绪的两因素理论', a:'提出者：沙赫特和辛格。\n公式：情绪 = 生理唤醒 + 认知评价，其中认知因素起决定作用。\n经典实验：给被试注射肾上腺素并给予不同解释，处于不同情境的被试产生不同情绪体验。\n意义：强调认知在情绪产生中的决定作用。', f:3 },
    { t:'term', k:'阿诺德的评定—兴奋说', a:'观点：情绪产生是先对刺激进行认知评价，评价引起情绪体验和相应的生理变化。\n顺序：刺激 → 评估 → 情绪 → 生理反应。\n与詹姆斯—兰格的区别：强调评价在生理变化之前。', f:2 },
    { t:'term', k:'拉扎鲁斯的认知—评价理论', a:'观点：情绪是人与环境相互作用的产物，取决于个体对情境的认知评价。\n评价分三层：初评价（情境与己是否有利害关系）、次评价（自己能否应对）、再评价（评价结果的有效性）。\n强调情绪调节与应对过程。', f:1 },
    { t:'short', k:'情绪的三种状态', a:'1）心境：微弱、持久、具有弥漫性的情绪状态，影响人的整体精神面貌；\n2）激情：强烈、短暂、爆发式的情绪状态，常伴随明显生理变化和外部表现，容易出现“意识狭窄”；\n3）应激：在意外紧急情境下产生的高度紧张的情绪状态，适度应激有助于调动潜能，过度应激会损害认知功能。', f:3, tip:'心境—激情—应激' },
    { t:'short', k:'情感的分类', a:'1）道德感：根据社会道德标准评价他人或自己行为时产生的情感体验；\n2）理智感：在智力活动中产生的认知体验（好奇、求知、怀疑、惊讶等）；\n3）美感：根据美的标准评价事物时产生的情感体验。', f:2 },
    { t:'exp', k:'艾克曼的跨文化表情研究', a:'方法：向不同文化背景的人（包括与世隔绝的新几内亚部落）呈现面部表情照片，让其辨认情绪。\n结果：快乐、悲伤、恐惧、愤怒、惊讶、厌恶六种基本情绪的面部表情具有跨文化一致性。\n结论：基本情绪的面部表情具有先天性和普遍性，支持情绪的表情具有生物基础。', f:3 },
    { t:'short', k:'表情（情绪的外部表现）', a:'1）面部表情：通过面部肌肉变化表达情绪，是最重要的情绪外部指标；\n2）身段表情：身体姿态、动作、手势（如垂头丧气、手舞足蹈）；\n3）言语表情：语音、语调、语速、节奏等。\n表情具有先天性和社会性双重属性，可通过训练和学习调节。', f:2 },
    { t:'term', k:'情绪调节', a:'定义：个体对情绪的产生、体验和表达进行监控、评估和调整的过程。\n策略：情境选择、情境修正、注意分配、认知重评、表达抑制（格罗斯过程模型）。\n其中认知重评通常比表达抑制更有利于身心健康。', f:1 },
    { t:'short', k:'情绪的维度理论', a:'冯特提出情绪三维度：愉快—不愉快、紧张—松弛、激动—平静。\n施洛伯格三维度：愉快—不愉快、注意—拒绝、激活水平。\n普拉切克的三维模式：快乐—不快乐、注意—拒绝、激活水平，用倒锥体模型表示，相邻情绪相似、对面情绪对立。', f:1 },
    { t:'term', k:'心境', a:'定义：一种微弱、持久、具有弥漫性的情绪状态。\n特点：强度弱、持续时间长、能影响人的整体心理活动和行为表现，使一切都染上情绪色彩。\n例子：“人逢喜事精神爽”。', f:2 },
    { t:'short', k:'情绪的功能', a:'1）适应功能：情绪是有机体适应生存和发展的重要方式；\n2）动机功能：情绪能激发和引导行为，提高活动效率；\n3）组织功能：情绪对其他心理活动具有组织作用，正性情绪促进认知，负性情绪干扰认知；\n4）信号（社会交往）功能：通过表情传递信息、沟通思想。', f:1 }
  ]
},

/* ------------------------------ 第 11 章 ------------------------------ */
{
  name: '第11章 能力',
  cards: [
    { t:'term', k:'能力', a:'定义为直接影响活动效率、使活动顺利完成的个性心理特征。\n分类：一般能力（智力）与特殊能力；认知能力、操作能力与社交能力。\n与知识技能的关系：知识技能是能力形成的基础，能力是掌握知识技能的前提，但二者不等同。', f:3 },
    { t:'term', k:'斯皮尔曼的二因素说', a:'观点：智力由一般因素（G 因素）和特殊因素（S 因素）构成。\nG 因素是智力的核心，决定个体在多种任务上的总体表现；S 因素只在特定任务中起作用。\n方法：因素分析。', f:3 },
    { t:'term', k:'卡特尔：流体智力与晶体智力', a:'流体智力（Gf）：与基本心理过程有关，较少受教育和文化影响，如知觉速度、机械记忆、图形推理；主要受遗传影响，20 岁左右达顶峰后逐渐下降。\n晶体智力（Gc）：通过后天学习和经验积累获得，如词汇、知识、言语理解；受教育和文化影响大，一生可持续增长。', f:3, tip:'流体先长后降，晶体一直长' },
    { t:'term', k:'吉尔福特的三维结构理论', a:'三个维度：内容（4 种）、操作（5 种）、产品（6 种）。\n共 4×5×6=120 种能力组合。\n贡献：突破了智力单维结构的观点，突出发散思维与创造性。', f:2 },
    { t:'term', k:'加德纳的多元智力理论', a:'观点：智力不是单一能力，而是多种相对独立的智力。\n八种智力：言语、逻辑—数学、空间、音乐、身体—运动、人际、内省、自然观察。\n意义：为因材施教和多元评价提供依据。', f:2 },
    { t:'term', k:'斯腾伯格的三元智力理论', a:'三个亚理论：①组合性智力（内部认知加工，与传统智力测验对应）；②经验性智力（处理新异任务与自动化的能力）；③情境性智力（适应、选择与塑造环境的能力）。\n意义：把智力与社会文化情境联系起来，强调实践智力。', f:2 },
    { t:'exp', k:'比奈—西蒙量表', a:'时间：1905 年。\n目的：鉴别需要特殊教育的儿童。\n地位：世界上第一个智力量表。\n后续发展：斯坦福—比奈量表（推孟修订），首次提出比率智商。', f:3, tip:'1905 是第一个量表' },
    { t:'term', k:'比率智商', a:'公式：IQ =（智力年龄 MA / 实际年龄 CA）× 100\n提出者：斯腾（后由推孟在斯坦福—比奈量表中应用）。\n局限：假定智力随年龄线性增长，成人阶段不适用。', f:3 },
    { t:'term', k:'离差智商', a:'定义：以同龄组的平均数和标准差为单位计算的标准分数，反映个体在同龄群体中的相对位置。\n提出者：韦克斯勒。\n公式：IQ = 100 + 15×(X − M)/SD（韦氏量表平均数 100，标准差 15）。\n优点：适用于各年龄段。', f:3, tip:'韦氏：100 / 15' },
    { t:'short', k:'智力的分布与个体差异', a:'分布：智力在人群中呈正态分布，IQ 70—130 约占人群 95%。\n个体差异表现在三方面：\n1）水平差异：智力高低不同；\n2）类型差异：优势能力不同（言语型、操作型）；\n3）发展早晚差异：有人早熟（如莫扎特），有人大器晚成。', f:3 },
    { t:'short', k:'遗传与环境对智力的影响', a:'遗传：双生子研究发现同卵双生子智力相关显著高于异卵双生子，即使分开抚养也如此，说明遗传有重要影响。\n环境：收养研究显示养子女智力与养父母相关，贫困环境中儿童智力通过早期干预可以提升。\n结论：智力是遗传与环境交互作用的结果，遗传提供可能性范围，环境决定实际表现水平。', f:2 },
    { t:'short', k:'能力形成与发展的影响因素', a:'1）遗传素质：提供物质基础和可能性；\n2）环境和教育：起决定（主导）作用；\n3）实践活动：是能力形成和发展的关键环节；\n4）主观努力（勤奋）：内部动力；\n5）早期经验与关键期：早期丰富刺激有利于能力发展。', f:2 },
    { t:'table', k:'一般能力 vs 特殊能力', a:'一般能力（智力）：多数活动都需要，如观察力、记忆力、思维力、想象力、注意力\n特殊能力：只在专门活动中需要，如音乐听觉、色彩辨别力、数学能力\n关系：特殊能力以一般能力为基础，一般能力在特殊活动中得到发展。', f:1 }
  ]
},

/* ------------------------------ 第 12 章 ------------------------------ */
{
  name: '第12章 人格',
  cards: [
    { t:'term', k:'人格', a:'定义为构成一个人思想、情感及行为的特有模式，是该个体区别于他人的稳定心理品质的总和。\n特征：独特性、稳定性、统合性（整体性）、功能性。\n结构：气质、性格、认知风格、自我调控等。', f:3 },
    { t:'table', k:'气质 vs 性格', a:'气质：心理活动的动力特征（强度、速度、稳定性、指向性）｜受生物因素影响大、天赋性｜稳定、难改变｜无好坏之分\n性格：对现实的态度和行为方式中的较为稳定的心理特征｜受社会环境影响大｜有社会评价意义、有好坏之分｜是人格的核心\n联系：气质影响性格的表现方式，性格可在一定程度上掩盖和改造气质。', f:3, tip:'气质无好坏，性格有好坏' },
    { t:'term', k:'气质', a:'定义为表现在心理活动的强度、速度、稳定性和指向性等动力特征上的人格特征。\n特点：天赋性、稳定性，受神经系统特性制约。\n类型：胆汁质、多血质、黏液质、抑郁质。\n重要结论：气质无好坏之分。', f:3 },
    { t:'short', k:'四种气质类型与神经活动类型', a:'巴甫洛夫高级神经活动类型 → 气质类型：\n1）强、不平衡 → 胆汁质：热情直率、精力旺盛、易冲动、脾气暴躁；\n2）强、平衡、灵活 → 多血质：活泼好动、反应迅速、善于交际、兴趣易变；\n3）强、平衡、不灵活 → 黏液质：安静稳重、沉默寡言、情绪不外露、反应慢；\n4）弱型 → 抑郁质：行为孤僻、敏感多疑、体验深刻、易疲劳。', f:3, tip:'强不平衡—胆汁；强灵活—多血' },
    { t:'term', k:'奥尔波特的特质理论', a:'分类：共同特质（同一文化下多数人共有）与个人特质（个体独有）。\n个人特质三层：①首要特质（最具概括性、支配性，如林黛玉的忧郁）；②中心特质（5—10 个，描述个体的核心特征）；③次要特质（在特殊情境下才表现）。', f:2 },
    { t:'term', k:'卡特尔的人格特质理论', a:'方法：因素分析。\n分类：表面特质（直接观察到的行为表现）与根源特质（内在的、决定表面特质的基础）。\n成果：提出 16 种根源特质，编制 16PF（卡特尔 16 种人格因素问卷）。', f:2 },
    { t:'term', k:'艾森克的三维度人格理论', a:'三个维度：内外向（E）、神经质（N）、精神质（P），另有测谎量表 L。\n测量工具：艾森克人格问卷（EPQ）。\n观点：人格维度具有生物基础，E 与皮层唤醒水平有关。', f:3 },
    { t:'term', k:'大五人格', a:'五个因素：开放性（O）、责任心/尽责性（C）、外倾性（E）、宜人性（A）、神经质（N），缩写 OCEAN。\n特点：用词汇学和因素分析方法得出，跨文化一致性较好，是目前较公认的人格结构模型。', f:3, tip:'OCEAN' },
    { t:'short', k:'弗洛伊德的人格结构', a:'1）本我：最原始的部分，遵循快乐原则，追求本能满足；\n2）自我：从本我分化而来，遵循现实原则，调节本我与超我、现实的关系；\n3）超我：遵循道德原则，包括良心和自我理想，是内化的社会规范。\n三者平衡则人格健康，失衡则产生焦虑和心理冲突，自我使用防御机制应对。', f:3 },
    { t:'table', k:'弗洛伊德 vs 埃里克森（人格发展观）', a:'弗洛伊德（心理性欲发展）：以性本能和生物因素为核心｜阶段到青春期基本结束（口唇、肛门、性器、潜伏、生殖期）｜强调早期经验决定人格\n埃里克森（心理社会发展）：以社会文化因素和自我为核心｜人生全程八个阶段｜每个阶段有心理社会危机，成功解决形成积极品质，可终身发展', f:2 },
    { t:'table', k:'自陈量表 vs 投射测验', a:'自陈量表：被试自己报告｜结构明确、计分客观、易实施｜易受社会赞许性影响｜如 MMPI、16PF、EPQ\n投射测验：用模糊刺激引发无意识投射｜无结构、可绕过防御机制｜计分主观、信效度争议大｜如罗夏墨迹测验、主题统觉测验 TAT', f:3 },
    { t:'term', k:'罗夏墨迹测验', a:'类型：投射测验。\n材料：10 张对称的墨迹图，部分彩色部分黑白。\n实施：让被试说出图“像什么”，从反应部位、决定因素、内容、原创性四方面计分。\n优点：能探测无意识内容；缺点：计分主观、信效度受质疑。', f:2 },
    { t:'term', k:'场独立性与场依存性', a:'提出者：威特金。\n场独立性：倾向于以内部线索为依据加工信息，不易受外界环境影响；\n场依存性：倾向于以外部线索为依据，易受环境和他人的影响。\n测量：棒框测验、镶嵌图形测验。\n相关：与人际交往方式、职业选择等有关。', f:2 },
    { t:'table', k:'冲动型 vs 沉思型（卡根）', a:'冲动型：反应快、错误多，倾向于快速作答\n沉思型：反应慢、错误少，倾向于仔细思考后再作答\n这一维度反映的是认知风格而非能力高低。', f:1 },
    { t:'term', k:'自我概念（罗杰斯）', a:'定义：个体对自己及其与环境关系的认识与评价。\n罗杰斯观点：自我概念包括现实自我与理想自我，二者一致则心理健康；不一致会产生焦虑，个体用防御机制或否认来应对。\n促进条件：无条件积极关注、真诚一致、共情理解。', f:1 },
    { t:'short', k:'人格的形成与影响因素', a:'1）生物遗传因素：气质、神经类型提供基础；\n2）社会文化因素：文化背景塑造价值观与行为规范；\n3）家庭环境：教养方式（权威型最有利于健全人格）与亲子关系；\n4）学校教育：教师期望（罗森塔尔效应）、同伴关系；\n5）个人主观因素：自我调控、社会实践。\n结论：人格是遗传与环境交互作用的结果。', f:2 }
  ]
},

/* ------------------------------ 第 13 章 ------------------------------ */
{
  name: '第13章 学习',
  cards: [
    { t:'term', k:'学习', a:'定义为由经验引起的行为或行为潜能的相对持久的变化。\n要点：①由经验（练习）引起；②是相对持久的变化；③既包括外显行为，也包括行为潜能；④要排除生理成熟、疲劳、药物等引起的暂时变化。', f:3 },
    { t:'term', k:'经典条件反射', a:'提出者：巴甫洛夫（狗唾液分泌实验）。\n要素：无条件刺激（食物）→ 无条件反应（唾液）；中性刺激（铃声）与无条件刺激多次结合 → 条件刺激 → 条件反应。\n规律：获得、消退、自发恢复、泛化与分化。', f:3, tip:'S—S 联结' },
    { t:'term', k:'操作条件反射', a:'提出者：斯金纳（斯金纳箱）。\n要点：行为的后果决定该行为再次出现的概率，是 R—S 联结（反应—强化）。\n核心概念：正强化、负强化、惩罚、消退、强化程式。', f:3, tip:'S-R vs R-S 要分清' },
    { t:'table', k:'正强化 vs 负强化 vs 惩罚', a:'正强化：给予愉快刺激，使行为增加（如考好给奖励）\n负强化：撤销厌恶刺激，使行为增加（如完成作业免做家务）\n惩罚：正惩罚=给予厌恶刺激，负惩罚=撤销愉快刺激，目的都是使行为减少\n关键：强化都是让行为增加，惩罚都是让行为减少；负强化 ≠ 惩罚', f:3, tip:'最易错的一组，务必分清' },
    { t:'term', k:'桑代克的尝试—错误说', a:'实验：猫的迷箱实验。\n观点：学习是经过盲目尝试、错误逐渐减少、正确反应逐渐增加的过程。\n三条学习律：准备律、练习律、效果律（最重要——满意的结果增强联结，不满意的结果削弱联结）。', f:2 },
    { t:'exp', k:'苛勒的顿悟实验', a:'实验：黑猩猩取远处香蕉，必须把箱子叠起来或把两根竹竿接起来。\n结果：猩猩先长时间观察，然后突然完成动作，学会后能迁移到类似情境。\n结论：学习是通过对情境整体关系的顿悟实现的，而非盲目尝试。属于格式塔学派的观点。', f:2 },
    { t:'term', k:'观察学习（班杜拉）', a:'定义：个体通过观察他人的行为及其结果而习得新行为的过程，不需要亲身经历强化。\n四阶段：注意过程 → 保持过程 → 复现（动作再现）过程 → 动机过程。\n相关概念：替代强化（看到榜样被奖励而增强自身行为）、自我强化。\n经典实验：波波玩偶实验。', f:3 },
    { t:'exp', k:'托尔曼的潜在学习实验', a:'实验：三组白鼠走迷宫，第一组始终有食物奖励，第二组始终无奖励，第三组前 10 天无奖励、第 11 天起给奖励。\n结果：第三组一旦给予奖励，成绩立刻赶上第一组。\n结论：前 10 天已经发生了学习（潜在学习/认知地图），强化只影响行为表现，而不影响学习本身。', f:2 },
    { t:'table', k:'学习迁移的分类', a:'正迁移：先前学习促进后继学习\n负迁移：先前学习干扰后继学习\n水平迁移（横向）：同一难度水平间的迁移\n垂直迁移（纵向）：不同难度水平间的迁移（低→高或高→低）\n顺向迁移：先前→后继；逆向迁移：后继→先前', f:2 },
    { t:'term', k:'奥苏贝尔的有意义接受学习', a:'观点：学习可分为接受学习与发现学习、机械学习与有意义学习两个维度，二者不重合。\n有意义学习的条件：①材料具有逻辑意义；②学习者具有有意义学习的心向；③认知结构中有可同化新知识的适当观念。\n机制：同化——新知识被纳入已有认知结构。', f:2 },
    { t:'term', k:'强化程式', a:'连续强化：每次反应都强化，习得快但消退也快。\n部分强化：\n①固定比率（FR）：每 n 次反应给一次强化，反应率高、停顿明显；\n②可变比率（VR）：强化次数不定，反应率最高、最抗消退（赌博）；\n③固定间隔（FI）：固定时间后强化，呈扇贝形曲线；\n④可变间隔（VI）：不定时间强化，反应稳定。', f:1 },
    { t:'short', k:'经典条件反射与操作条件反射的异同', a:'相同点：都遵循强化、消退、泛化、分化等基本规律，都属于联结学习理论。\n不同点：\n1）联结性质：经典条件反射是 S—S 联结（刺激与刺激之间），操作条件反射是 R—S 联结（反应与结果之间）；\n2）行为性质：前者是被动的、由刺激引发的应答性行为，后者是主动的、由结果塑造的操作性行为；\n3）强化位置：前者的强化伴随无条件刺激出现，后者的强化在反应之后出现。', f:3 }
  ]
},

/* ------------------------------ 第 14 章 ------------------------------ */
{
  name: '第14章 人生全程发展',
  cards: [
    { t:'short', k:'皮亚杰认知发展的四个阶段', a:'1）感知运动阶段（0—2 岁）：靠感觉和动作认识世界，获得客体永久性；\n2）前运算阶段（2—7 岁）：出现符号功能，但思维自我中心、不可逆、不守恒；\n3）具体运算阶段（7—11 岁）：获得守恒、可逆性和去中心化，但需具体事物支持；\n4）形式运算阶段（11 岁以后）：能进行抽象逻辑推理和假设演绎推理。\n核心机制：同化、顺应、平衡化。', f:3, tip:'0-2-7-11 四个节点' },
    { t:'term', k:'客体永久性', a:'定义：当物体从视野中消失时，婴儿仍知道它继续存在。\n获得阶段：感知运动阶段（0—2 岁）后期。\n意义：标志婴儿开始把自我与外部世界区分开，是认知发展的里程碑。', f:3 },
    { t:'term', k:'守恒', a:'定义：物体的量（数量、长度、体积、质量等）在外形或排列改变后仍保持不变的认识。\n获得阶段：具体运算阶段（7—11 岁）。\n经典实验：液体守恒实验（同样多的水倒入不同形状的杯子）。\n前运算阶段儿童不守恒，表现为只看单一维度、不可逆、自我中心。', f:3 },
    { t:'term', k:'自我中心性', a:'皮亚杰用语，指前运算阶段儿童只能从自己的角度看世界，不能采择他人观点。\n经典实验：三山实验。\n注意：与“自私”不是一回事，而是认知发展水平的限制。', f:2 },
    { t:'term', k:'最近发展区', a:'提出者：维果茨基。\n定义：儿童现有的独立解决问题的水平与在成人指导或与能力更强的同伴合作时可能达到的水平之间的差距。\n教学启示：教学应走在发展的前面，创造最近发展区，促进潜在水平向现实水平转化。', f:3 },
    { t:'table', k:'皮亚杰 vs 维果茨基', a:'皮亚杰：认知发展以个体自身成熟和探索为主｜阶段顺序固定｜强调同化顺应平衡｜语言从属于思维\n维果茨基：认知发展受社会文化和教学影响｜提出最近发展区｜强调成人和同伴的支架作用｜语言是思维的工具，思维与语言相互作用', f:2 },
    { t:'term', k:'依恋类型（安斯沃斯）', a:'研究方法：陌生情境技术。\n三种类型：\n1）安全型：母亲在场时能安心探索，分离时焦虑，返回后主动寻求接触并容易平静；\n2）回避型：对母亲离开反应淡漠，返回时也不主动接近；\n3）反抗型（矛盾型）：分离时极度焦虑，母亲返回时既想接近又反抗。\n影响因素：教养方式、母亲敏感性、婴儿气质。', f:3 },
    { t:'short', k:'埃里克森的心理社会发展八阶段', a:'0—1.5 信任对不信任｜1.5—3 自主对羞怯怀疑｜3—6 主动对内疚｜6—12 勤奋对自卑｜12—18 自我同一性对角色混乱｜18—25 亲密对孤独｜25—50 繁殖对停滞｜50+ 自我整合对绝望。\n核心思想：人生全程都有心理社会危机，危机的顺利解决形成相应的积极品质。', f:2 },
    { t:'short', k:'柯尔伯格的道德发展三水平六阶段', a:'前习俗水平：①惩罚与服从定向；②相对功利（朴素利己）定向；\n习俗水平：③寻求认可（好孩子）定向；④遵守法规与秩序定向；\n后习俗水平：⑤社会契约定向；⑥普遍伦理原则定向。\n研究方法：道德两难故事法（海因茨偷药）。\n与皮亚杰的区别：皮亚杰用对偶故事法，分他律道德与自律道德。', f:2 },
    { t:'exp', k:'洛伦兹的印刻实验', a:'现象：小鸭子出生后一段时间内会跟随第一个见到的活动物体（通常是母鸭或洛伦兹本人）。\n结果：印刻只在出生后的一段时间内发生，过后难以形成，且不可逆。\n结论：发展存在关键期，早期经验对后续发展有决定性影响。', f:2 },
    { t:'term', k:'关键期', a:'定义：个体发展中某些行为和能力形成最为迅速、对特定刺激特别敏感的时期，错过这一时期，相应能力的发展会受到严重阻碍。\n经典证据：洛伦兹的印刻实验；人类语言发展的关键期。\n教育启示：抓住关键期进行适时教育。', f:2 },
    { t:'short', k:'发展的基本问题：遗传与环境、连续与阶段', a:'1）遗传与环境：遗传提供发展的可能性，环境决定实现程度，二者交互作用（双生子研究、收养研究支持）；\n2）连续与阶段：连续论认为发展是量的渐进累积（如学习），阶段论认为发展经历质变的阶段（如皮亚杰、埃里克森）；\n3）儿童主动性与被动性：现代观点认为儿童是自身发展的主动建构者。', f:1 }
  ]
}

/* ------------------------------ 第 1 章 ------------------------------ */
{
  name: '第1章 实验心理学概述与研究伦理',
  cards: [
    { t:'exp', k:'费希纳与心理物理学', a:'著作：《心理物理学纲要》，1860 年。\n贡献：创立心理物理学，用实验方法研究感觉阈限，为实验心理学的诞生奠定方法论基础。\n常考：实验心理学的“方法学起点”是费希纳，不是冯特。', f:3, tip:'1860 费希纳 = 方法学奠基' },
    { t:'exp', k:'冯特建立第一个心理学实验室', a:'时间：1879 年\n地点：德国莱比锡大学\n意义：标志科学心理学的诞生，冯特被称为“实验心理学之父”。\n与费希纳的分工记忆：费希纳奠基方法，冯特建立实验室。', f:3 },
    { t:'exp', k:'艾宾浩斯的记忆实验', a:'材料：无意义音节（排除已有知识经验的影响）。\n方法：节省法，用节省率作为保持量指标。\n成果：遗忘曲线（先快后慢）。\n地位：最早用实验方法系统研究记忆，开创了高级心理过程实验研究的先河。', f:2 },
    { t:'exp', k:'唐德斯与反应时法', a:'人物：荷兰生理学家唐德斯。\n贡献：设计 A、B、C 三种反应时，提出减数法（相减法），首次用反应时分析心理加工的阶段。\n意义：使不能直接观察的心理过程可以通过反应时间接测量。', f:3 },
    { t:'term', k:'实验心理学', a:'定义：以实验方法研究心理与行为规律的科学，是心理学中最基本、最重要的方法学分支。\n核心特征：主动操纵自变量、严格控制额外变量。\n研究内容：一是方法学问题（实验设计、变量控制、测量），二是各领域的具体实验成果。', f:2 },
    { t:'short', k:'实验法的三大要素', a:'1）随机化：随机分配被试到各实验条件、随机安排实验顺序；\n2）控制：严格控制额外变量（消除、恒定、平衡、随机、统计控制）；\n3）操纵：主动操纵自变量，使其在不同水平上变化。\n只有同时具备这三点，才能确定变量间的因果关系。', f:3 },
    { t:'short', k:'心理学实验研究的伦理原则', a:'1）知情同意：告知研究目的、程序、风险与收益，获书面同意；\n2）自愿参加且可随时无条件退出；\n3）保护被试免受身心伤害，把风险降到最低；\n4）保密：个人信息与数据严格保密，报告时匿名化；\n5）审慎使用欺骗，事后必须解释（debriefing）；\n6）动物实验遵循 3R 原则。', f:3 },
    { t:'term', k:'事后解释（debriefing）', a:'定义：实验结束后向被试说明研究的真实目的、所用手段及理由，消除不良影响的做法。\n必要性：使用欺骗手段后必须进行；即使未使用欺骗，也应向被试说明结果和意义。\n作用：保障被试权益，也可检查被试是否猜到了实验目的。', f:2 },
    { t:'term', k:'需要特征', a:'提出者：奥尔波特。\n定义：实验情境中暗示被试应如何反应的线索，使被试揣测实验目的并改变行为。\n危害：威胁实验的内部效度。\n控制：双盲设计、隐蔽测量、事后询问被试是否猜到实验目的。', f:2 },
    { t:'term', k:'3R 原则', a:'内容：Replacement（替代，尽量用非动物方法）、Reduction（减少，用最少的动物获得足够数据）、Refinement（优化，改进实验程序减少动物痛苦）。\n适用范围：动物实验伦理。', f:2 }
  ]
},

/* ------------------------------ 第 2 章 ------------------------------ */
{
  name: '第2章 实验研究的基本问题：变量与效度',
  cards: [
    { t:'term', k:'自变量', a:'定义为由主试操纵、被认为是被试行为变化原因的变量。\n水平：自变量的不同取值。\n分类：①刺激特点自变量；②环境特点自变量；③被试特点自变量（年龄、性别等，不能真操纵，只能选择）；④暂时造成的被试差异（指导语、情绪诱发等）。', f:3 },
    { t:'term', k:'因变量', a:'定义为被试的反应或行为变化，是实验中需要观察和测量的变量。\n常用指标：反应的正确性、速度（反应时）、概率、强度、数量、持续时间等。\n要求：指标要灵敏（避免天花板效应和地板效应）、客观、稳定。', f:3 },
    { t:'term', k:'额外变量', a:'又称无关变量、控制变量，指实验中除自变量以外一切可能影响因变量的变量。\n危害：若不控制，会与自变量混淆，干扰因果推断。\n控制方法：消除法、恒定法、随机化法、平衡法、配对法、统计控制法、双盲设计。', f:3 },
    { t:'short', k:'控制额外变量的七种方法', a:'1）消除法：把额外变量从实验中排除（隔音室消除噪声）；\n2）恒定法：使额外变量在所有条件下保持恒定（同一时间、同一主试）；\n3）随机化法：随机分配被试、随机安排顺序，是最有效的方法之一；\n4）平衡法（抵消平衡）：用 ABBA、拉丁方平衡顺序效应；\n5）配对法（等组匹配）：在有关变量上相同或相近的被试配成对再随机分配；\n6）统计控制法：用协方差分析等排除额外变量影响；\n7）双盲设计：同时控制实验者效应和安慰剂效应。', f:3, tip:'消恒随平配统双' },
    { t:'term', k:'内部效度', a:'定义：实验中自变量与因变量之间因果关系的确定程度，即结果能被明确归因于自变量操纵的程度。\n影响因素：历史、成熟、测验、仪器、统计回归、被试选择偏差、被试流失、各种交互作用。\n提高方法：随机分配被试、严格控制额外变量、设置控制组。', f:3 },
    { t:'term', k:'外部效度', a:'定义：实验结果能够推广到其他被试、情境、时间及变量的程度（生态效度是其重要方面）。\n影响因素：①被试样本的代表性不足；②实验情境的人为性；③测量的反作用（前测的敏化）。\n与内部效度的关系：内部效度是外部效度的必要但非充分条件，二者常存在权衡。', f:3 },
    { t:'short', k:'影响内部效度的八类因素', a:'1）历史：实验期间发生的与实验无关的外部事件；\n2）成熟：被试随时间的自然成长或变化；\n3）测验：前测产生的练习或敏化效应；\n4）仪器：测量工具或主试标准的变化；\n5）统计回归：极端分数向平均数回归；\n6）被试选择：分组时存在系统性差异（选择偏差）；\n7）被试流失：不同组流失率不同；\n8）各种交互作用（如选择与成熟）。', f:3 },
    { t:'short', k:'影响外部效度的因素', a:'1）被试样本的代表性不足：多用大学生被试，结论难以推广到总体；\n2）实验情境的人为性：实验室环境与真实情境差异大，生态效度低；\n3）测量的反作用：前测使被试敏感化，影响后续反应；\n4）实验者效应与需求特征；\n5）多重处理的干扰。', f:2 },
    { t:'table', k:'实验者效应 vs 安慰剂效应 vs 霍桑效应', a:'实验者效应（罗森塔尔效应）：由主试的期望无意中影响被试表现\n安慰剂效应：由被试自己的期望引起的效应（即使处理无效也有效果）\n霍桑效应：被试因意识到自己被观察而改变行为\n控制共同手段：双盲设计、单盲设计、设置安慰剂控制组', f:3 },
    { t:'term', k:'双盲实验', a:'定义：主试和被试都不知道被试被分在哪个实验条件下的实验设计。\n作用：同时控制实验者效应和安慰剂效应。\n适用：药物研究、期望效应明显的实验。', f:2 },
    { t:'term', k:'统计回归', a:'现象：极端分数（特别高或特别低）的个体在后续测量中结果会趋向平均值。\n危害：若按前测极端分数分组，后测的变化可能只是回归效应而非处理效应。\n控制：设置控制组、随机分配、用协方差分析。', f:2 },
    { t:'table', k:'中介变量 vs 调节变量', a:'中介变量：解释自变量为什么影响因变量的中间机制（X→M→Y），回答“为什么”\n调节变量：影响自变量与因变量关系强弱或方向的变量，回答“什么时候、对谁”\n例：压力→（免疫下降）→感冒，免疫是中介；压力→感冒的关系在不同人格上不同，人格是调节', f:1 },
    { t:'short', k:'如何确定实验中的自变量与因变量', a:'1）明确研究假设，确定要操纵什么（自变量）；\n2）确定自变量的水平数（两个水平即可做实验，三个以上可检验函数关系）；\n3）选择能灵敏反映自变量效应的因变量指标，兼顾客观性与稳定性；\n4）先在预备实验中检验因变量指标的灵敏度和效度；\n5）列出所有可能影响因变量的额外变量并逐一设计控制方案。', f:2 },
    { t:'term', k:'天花板效应与地板效应', a:'天花板效应：因变量指标过于容易，几乎所有被试都取得最高分，无法区分处理差异。\n地板效应：指标过难，所有被试都得最低分。\n本质：因变量指标的灵敏度不足。\n对策：调整任务难度、延长或缩短时间、改用更灵敏的指标。', f:2 },
    { t:'term', k:'控制变量', a:'指实验中除自变量以外需要保持恒定或加以控制的变量，也称额外变量。\n注：在很多教材中“控制变量”与“额外变量”“无关变量”是同一类概念，答题时说明其含义即可。\n控制好坏直接决定实验的内部效度。', f:2 }
  ]
},

/* ------------------------------ 第 3 章 ------------------------------ */
{
  name: '第3章 实验设计',
  cards: [
    { t:'table', k:'被试间设计 vs 被试内设计', a:'被试间设计（独立组）：每名被试只接受一种处理｜优点：不存在练习、疲劳、顺序效应，适用于不可重复测量的实验｜缺点：需要较多被试，个体差异成为误差，需随机分配或配对控制\n被试内设计（重复测量）：每名被试接受所有处理｜优点：节省被试、消除个体差异、统计检验敏感性高｜缺点：存在练习、疲劳、顺序、延续效应，需用抵消平衡法控制', f:3, tip:'最常考的一对' },
    { t:'short', k:'抵消平衡法（ABBA 与拉丁方）', a:'目的：在被试内设计中平衡顺序效应和练习效应。\n1）ABBA 法：适用于两个条件的实验，采用 ABBA 顺序，使每个条件在各位置出现次数相同，可平衡线性变化；\n2）拉丁方设计：适用于 n 个条件，用 n×n 方阵排列，每个条件在每一位置上出现一次；\n3）随机化：随机安排被试的实验顺序，简单但平衡性不如拉丁方。', f:3, tip:'两条件用 ABBA，多条件用拉丁方' },
    { t:'term', k:'随机区组设计', a:'定义：按被试的某种特征（如年龄、智力）分成若干个区组，使区组内被试尽可能同质，每个区组内随机分配各处理。\n作用：把个体差异从误差变异中分离出来，减少误差、提高实验灵敏度。\n适用：已知有某个强干扰变量时。', f:3 },
    { t:'term', k:'混合设计', a:'定义：在一个实验中至少包含一个被试间自变量和一个被试内自变量的设计。\n例：2（性别：被试间）×3（材料类型：被试内）。\n优点：兼顾两种设计的优势，例如可研究个体差异变量与处理变量的交互作用。', f:2 },
    { t:'term', k:'交互作用', a:'定义：在一个多因素实验中，一个自变量的效应在另一个自变量的不同水平上表现出差异的现象。\n意义：存在交互作用说明自变量并非各自独立地影响因变量，必须做简单效应分析才能准确解释结果。\n分类：序次性交互作用（简单效应方向相同、大小不同）与非序次性交互作用（方向相反）。', f:3 },
    { t:'term', k:'主效应', a:'定义：在因素设计中，某一个自变量的不同水平引起的因变量变化，忽略其他自变量时的平均效应。\n与交互作用的关系：先看交互作用是否显著，再解释主效应，否则主效应可能被掩盖或误读。', f:2 },
    { t:'exp', k:'所罗门四组设计', a:'四组安排：\n组1：前测 → 处理 → 后测；组2：前测 → 无处理 → 后测；组3：无前测 → 处理 → 后测；组4：无前测 → 无处理 → 后测。\n作用：可以同时检验前测效应、实验处理效应及二者的交互作用。\n地位：控制测验效应（前测反作用）最有效的经典设计。', f:3, tip:'2×2 拆前测与处理' },
    { t:'table', k:'前实验 / 准实验 / 真实验设计', a:'前实验设计：不能随机分配被试，也缺乏控制组（单组后测、单组前后测、固定组比较）｜控制最弱\n准实验设计：不能随机分配被试，只能用现成的组（不等组前后测、时间序列、平衡组）｜教育、临床常用\n真实验设计：随机分配被试 + 控制组 + 操纵自变量｜能确定因果关系', f:3 },
    { t:'short', k:'准实验设计的特点与适用', a:'特点：①有自变量的操纵和一定的控制；②不能随机分配被试，只能用现成的群体；③难以排除选择偏差，内部效度低于真实验，但外部效度（生态效度）往往更高。\n常用设计：不等组前后测设计、时间序列设计、平衡组设计、回归间断设计。\n适用：教育、临床、现场研究中无法随机分配的场合。', f:2 },
    { t:'term', k:'小样本设计', a:'适用：难以获得大量被试的临床与特殊教育研究。\n常见形式：\n1）ABA 设计：A 基线期、B 处理期、第二个 A 撤除处理验证效果；\n2）ABAB 设计：重复验证，进一步排除时间因素；\n3）多基线设计：在多个被试或多个行为上依次引入处理，避免撤除处理。', f:3 },
    { t:'term', k:'多基线设计', a:'定义：不撤除处理，而是在多个基线（多个被试、多种行为或多个情境）上依次引入处理，检验处理效应是否随处理的引入而出现。\n优点：适用于不能撤除有效处理的情形（如教学生识字）。\n逻辑：若行为改变只随处理的引入而出现，则说明是处理造成的。', f:1 },
    { t:'short', k:'因素实验设计的基本概念', a:'因素设计：同时操纵两个或多个自变量的实验设计。\n表示：如 2×3 表示两个自变量分别有 2 个、3 个水平，共 6 个实验处理。\n分析：可同时检验各因素的主效应和他们之间的交互作用。\n优点：效率高、能研究交互作用；缺点：需要较多被试和较复杂的统计方法。', f:3 },
    { t:'term', k:'配对法（等组匹配法）', a:'定义：先把在某个或某些关键变量上相同或相近的被试配成对，再把每一对中的被试随机分配到不同实验组。\n作用：使各组的被试在关键变量上尽量相等，减少个体差异带来的误差。\n局限：只能匹配已知且可测的变量。', f:1 },
    { t:'short', k:'实验设计的选择思路', a:'1）先确定自变量和因变量，明确研究假设；\n2）判断自变量能否在个体内重复（能则可用被试内设计，不能则用被试间设计）；\n3）若有强干扰的个体差异变量，采用随机区组或配对法；\n4）若需研究多个变量及交互作用，采用多因素设计；\n5）若无法随机分配被试（学校、病区），采用准实验设计，并尽量设置控制组与多项前测；\n6）被试极少时考虑小样本设计。', f:2 },
    { t:'short', k:'真实验设计的基本条件', a:'1）随机分配被试到各实验条件；\n2）有明确的自变量操纵（至少两个水平）；\n3）设置控制组或对照条件；\n4）严格控制额外变量；\n5）因变量指标灵敏可靠。\n具备这些条件，才能对因果关系做出较可靠的推断。', f:3 }
  ]
},

/* ------------------------------ 第 4 章 ------------------------------ */
{
  name: '第4章 反应时法',
  cards: [
    { t:'term', k:'反应时', a:'定义为从刺激呈现到被试做出反应之间的时间间隔。\n地位：心理学实验中最常用、最客观的因变量之一。\n分类：简单反应时、选择反应时、辨别反应时。', f:3 },
    { t:'short', k:'唐德斯的 A、B、C 反应时', a:'A 反应时（简单反应时）：一个刺激对应一个反应，无需辨别和选择；\nB 反应时（选择反应时）：多个刺激、多个反应，需要辨别刺激并选择相应反应；\nC 反应时（辨别反应时）：多个刺激但只有一个反应，只需辨别不需选择。\n减法结果：C−A = 辨别时间；B−C = 选择时间；B−A = 辨别 + 选择时间。', f:3, tip:'C−A 辨别，B−C 选择' },
    { t:'term', k:'减数法', a:'提出者：唐德斯。\n基本逻辑：如果一种任务比另一种任务多包含一个特定的心理加工阶段，那么两种任务反应时之差就是该阶段所需的时间。\n优点：可以直接测出某加工阶段的绝对时程。\n局限：假设加工是系列、可插入的，且两任务除目标阶段外其他成分相同。', f:3 },
    { t:'exp', k:'斯滕伯格的加因素法实验', a:'问题：短时记忆的提取方式。\n设计：呈现 1—6 个数字，再呈现探测数字，测量判断“是/否”的反应时。\n结果：反应时随识记项目数线性增加，“是”与“否”反应时基本相同。\n结论：短时记忆的提取是完全系列扫描。', f:3 },
    { t:'short', k:'加因素法的逻辑', a:'提出者：斯滕伯格。\n基本逻辑：如果两个因素影响的是同一个加工阶段，它们的效应会存在交互作用；如果影响的是不同加工阶段，它们的效应相互独立、可以相加。\n做法：通过寻找可相加的因素来确定心理加工的各个阶段及其序列结构。\n局限：只能确定加工的序列结构，难以精确估计各阶段的绝对时程。', f:3, tip:'可加=不同阶段，交互=同一阶段' },
    { t:'table', k:'减数法 vs 加因素法', a:'减数法（唐德斯）：用两个任务的反应时之差测定某阶段的绝对时间｜假设加工是系列插入式的｜能给出时程\n加因素法（斯滕伯格）：通过因素间的可加性与交互作用确定加工阶段｜不测绝对时间｜能给出加工结构的序列\n共同点：都以反应时为指标研究内部心理过程', f:3 },
    { t:'short', k:'影响反应时的因素', a:'1）刺激强度：强度越大反应时越短，但存在渐进极限，过强反而不利；\n2）刺激的复杂程度与选择数目：越复杂、可选项越多反应时越长；\n3）感觉通道：听觉简单反应时最短（约 140—160ms），视觉次之（约 180—200ms）；\n4）被试的准备状态与练习程度：准备充分、练习多则更短；\n5）动机与情绪：动机适中最好，过度紧张会延长；\n6）年龄与个体差异。', f:3 },
    { t:'term', k:'侦察试验', a:'定义：在反应时实验中插入的、不要求被试做出反应的试验。\n作用：检测被试是否存在“抢答”（假反应）倾向；若被试在侦察试验中仍做出反应，说明其反应策略不可靠。\n有时也用于保持被试的警觉性。', f:2 },
    { t:'term', k:'速度—正确率权衡', a:'现象：被试在快速反应时正确率下降，在追求准确时反应时变长，二者存在权衡关系。\n实验启示：不能只报告反应时或只报告正确率，应同时报告两者，并采用如“先快且准”的指导语控制。', f:2 },
    { t:'short', k:'反应时实验的误差来源与控制', a:'误差来源：①刺激呈现与计时不同步（仪器误差）；②假反应与漏反应；③被试的练习与疲劳效应；④预期效应；⑤反应方式（按键、口头）差异。\n控制：①用高精度计时设备（如专用反应盒、电脑程序）；②插入侦察试验检测假反应；③先做练习试次；④随机化刺激顺序；⑤固定反应方式。', f:1 },
    { t:'table', k:'序列加工 vs 平行加工', a:'序列加工：一个加工完成后再进行下一个，反应时随加工量线性增加\n平行加工：多个加工同时进行，反应时不随加工量增加而明显增加\n判断依据：反应时函数的斜率——斜率显著大于零倾向序列加工，斜率接近零倾向平行加工（如特征搜索）', f:2 },
    { t:'short', k:'简单反应时的通道差异', a:'听觉的简单反应时最短，约 140—160 毫秒；\n视觉次之，约 180—200 毫秒；\n触觉介于两者之间。\n原因：不同感觉通道的神经传导通路长度和突触数目不同。\n常考：反应时排序“听 < 触 < 视”。', f:2 }
  ]
},

/* ------------------------------ 第 5 章 ------------------------------ */
{
  name: '第5章 心理物理学方法',
  cards: [
    { t:'short', k:'传统心理物理学的三种方法', a:'1）最小变化法（极限法）：刺激按渐增、渐减系列交替呈现，求阈限；\n2）恒定刺激法：选 5—7 个固定刺激，各随机呈现多次，用直线内插法求阈限；\n3）平均差误法（调整法）：由被试自己调整比较刺激，以平均误差作为差别阈限估计。\n三者共同目标：测量绝对阈限和差别阈限。', f:3 },
    { t:'term', k:'最小变化法', a:'程序：按等距的渐增系列和渐减系列交替呈现刺激，记录被试反应由“无”到“有”（或反之）的转折点。\n阈限计算：分别求渐增阈限和渐减阈限，取二者平均数作为绝对阈限。\n主要误差：习惯误差和期望误差。\n控制：渐增渐减交替呈现（ABBA）。', f:3 },
    { t:'table', k:'习惯误差 vs 期望误差', a:'习惯误差：被试因习惯于先前的刺激强度与反应方式而继续作相同判断，使渐增系列的阈限偏高、渐减系列偏低\n期望误差：被试预期刺激会变化而提前改变反应，与习惯误差方向相反\n控制：渐增、渐减系列交替（ABBA），误差方向相反可相互抵消', f:3, tip:'一个继续原趋势，一个提前改' },
    { t:'term', k:'恒定刺激法', a:'程序：选取 5—7 个固定刺激，每个刺激随机呈现多次（一般 50—200 次），记录被试“觉察/未觉察”的比例。\n阈限计算：以正确反应百分数为纵坐标，用直线内插法求出 50% 觉察率对应的刺激强度作为绝对阈限。\n优点：刺激数量少、呈现次数多，测量精确度高，适用面广（绝对阈限、差别阈限、等感受性曲线）。', f:3 },
    { t:'term', k:'平均差误法（调整法）', a:'程序：由被试自己调整比较刺激，使之与标准刺激相等。\n阈限估计：以多次调整结果的平均误差作为差别阈限的估计值。\n优点：操作简便、被试主动参与；\n缺点：可能产生动作误差和空间（位置）误差，需通过变换标准刺激与比较刺激的位置来平衡。', f:2 },
    { t:'term', k:'信号检测论', a:'引入者：坦纳和斯韦茨等。\n核心思想：用统计决策理论解释人在不确定情境下的辨别，把被试的辨别能力与反应偏向分开。\n两个指标：辨别力指数 d′（反映区分信号与噪声的能力）、判断标准 β（反映报告“有信号”的倾向）。\n最大贡献：弥补传统心理物理法把感受性和反应偏向混在一起的不足。', f:3, tip:'d′ 管能力，β 管倾向' },
    { t:'short', k:'信号检测论的四类反应', a:'击中：有信号，报告“有”；\n虚报：无信号，报告“有”；\n漏报：有信号，报告“无”；\n正确拒绝：无信号，报告“无”。\n击中率与虚报率是计算 d′ 和 β 的基础。', f:3 },
    { t:'table', k:'辨别力指数 d′ vs 判断标准 β', a:'d′：辨别力指数，反映被试区分信号与噪声的客观能力｜越大辨别力越强｜不随反应偏向改变\nd′ = Z(击中率) − Z(虚报率)\nβ：判断标准，反映反应偏向｜β 大表示倾向报告“无信号”（标准严格）｜β 小表示倾向报告“有信号”（标准宽松）', f:3 },
    { t:'term', k:'ROC 曲线', a:'定义：以虚报率为横轴、击中率为纵轴绘制的曲线，即接受者操作特征曲线。\n含义：曲线上每一点代表一种判断标准下的成绩。\n性质：d′ 越大曲线越向左上凸；对角线（面积 0.5）表示完全无辨别力；曲线下面积可作为辨别力指标。', f:2 },
    { t:'table', k:'传统心理物理法 vs 信号检测论', a:'传统心理物理法：求阈限，把感受性与反应偏向混在一起｜假设被试没有主观倾向｜得到阈限值\n信号检测论：用 d′ 和 β 分别刻画辨别力与反应偏向｜承认被试的判断标准会影响结果｜更符合实际情况，广泛用于再认记忆、痛觉、医学诊断等研究', f:2 },
    { t:'term', k:'韦伯定律', a:'公式：ΔI / I = K\n含义：差别阈限与原刺激强度的比值是常数 K，即差别阈限与原刺激强度成正比。\n适用条件：中等强度刺激；K 值（韦伯常数）因感觉通道和刺激性质而异，并非普遍相同。', f:3 },
    { t:'term', k:'费希纳定律', a:'公式：S = K·lgR\n含义：感觉强度与刺激强度的对数成正比。\n推导基础：韦伯定律。\n适用范围：只适用于中等强度刺激。', f:3 },
    { t:'term', k:'史蒂文斯幂定律', a:'公式：S = K·Iⁿ\n提出者：史蒂文斯，用数量估计法建立。\n优点：适用刺激范围比费希纳定律更广。\n意义：说明不同感觉通道的幂指数不同，感觉量与刺激量的关系并非统一的对数关系。', f:2 },
    { t:'short', k:'三种传统心理物理法的比较', a:'最小变化法：刺激按渐增渐减系列呈现｜误差为习惯误差和期望误差，用交替呈现控制｜程序严谨但耗时\n恒定刺激法：5—7 个固定刺激各随机呈现多次｜用直线内插法求 50% 阈限｜精确度高、适用面广\n平均差误法：被试自己调整比较刺激｜以平均误差作差别阈限｜操作方便，但有动作误差和空间误差', f:3 }
  ]
},

/* ------------------------------ 第 6 章 ------------------------------ */
{
  name: '第6章 感知觉实验',
  cards: [
    { t:'exp', k:'感觉剥夺实验', a:'研究者：黑伯（Hebb）等。\n方法：让被试戴上半透明护目镜、手套、耳塞，躺在隔离室中，尽量剥夺感觉输入。\n结果：被试出现注意涣散、思维迟钝、情绪不稳，部分人产生幻觉，难以忍受而要求退出。\n结论：正常的感觉输入是维持正常心理活动的必要条件。', f:3 },
    { t:'exp', k:'视觉悬崖实验', a:'研究者：吉布森和沃克。\n装置：中央有视觉落差的透明玻璃平台。\n结果：约 6 个月的婴儿爬向深区边缘时犹豫、回避或心率变化；\n结论：婴儿在会爬之前已具有深度知觉。', f:2 },
    { t:'term', k:'暗适应曲线', a:'定义：以暗适应过程中感受性随时间变化绘制的曲线。\n特点：包含两部分——前一段（约 5—10 分钟）由锥体细胞完成，后一段由棒体细胞完成，曲线出现明显的转折（Kohrausch 折点）。\n意义：证明暗适应中两种感光细胞的作用不同。', f:2 },
    { t:'term', k:'闪光融合频率（CFF）', a:'定义：断续光被知觉为连续光的最低闪烁频率。\n意义：反映视觉系统的时间分辨能力，也反映中枢神经系统的兴奋水平（疲劳、困倦时降低）。\n影响因素：刺激强度、刺激面积、视网膜部位、年龄。', f:2 },
    { t:'term', k:'颜色匹配法', a:'程序：让被试调节三原色（红、绿、蓝）的比例，使之与标准色达到视觉上相同。\n依据：颜色视觉的三色说。\n用途：研究颜色混合规律、验证色觉理论、检测色觉异常。', f:1 },
    { t:'term', k:'听觉空间定位的线索', a:'主要线索：\n1）双耳时间差（ITD）：声音到达两耳的时间不同；\n2）双耳强度差（ILD）：头部遮挡使两耳接收的强度不同；\n3）头部相关传递函数（HRTF）：耳廓等对声音频谱的调制。\n低频声音主要靠时间差，高频声音主要靠强度差。', f:2 },
    { t:'term', k:'布伦斯威克比率与邵勒斯比率', a:'用途：测量大小恒常性。\n布伦斯威克比率 BR = 知觉大小 / 客体实际大小对应的视网膜像大小；\n邵勒斯比率 TR =（lg 知觉大小 − lg 视网膜像大小）/（lg 实际大小 − lg 视网膜像大小）。\n解释：BR = 1 为完全恒常；BR 等于视网膜像比值则无恒常性；一般介于两者之间。', f:2 },
    { t:'short', k:'大小恒常性的实验测量思路', a:'1）在标准距离呈现标准刺激，在另一距离呈现比较刺激；\n2）让被试调整比较刺激的大小，使之看起来与标准刺激相等（或使用恒定刺激法）；\n3）计算恒常性指标（布伦斯威克比率、邵勒斯比率）；\n4）改变距离、视角、环境线索，观察恒常性的变化；\n5）结论：距离线索丰富时恒常性高，线索缺乏时恒常性下降。', f:2 },
    { t:'term', k:'视敏度', a:'定义：视觉辨别物体细节的能力，常用最小可辨视角的倒数表示（如 1 分视角对应 1.0）。\n影响因素：照明强度、背景亮度、视网膜部位、年龄。\n测量方法：视力表法、最小可见度法。', f:1 },
    { t:'term', k:'双眼视差', a:'定义：由于两眼相距约 65 毫米，同一物体在两眼视网膜上的成像存在细微差异。\n作用：深度知觉最主要的双眼线索。\n研究工具：随机点立体图（Julesz 立体图），可排除单眼线索。', f:2 },
    { t:'short', k:'感觉剥夺实验的意义', a:'1）证明感觉输入是维持正常心理活动的必要条件；\n2）说明人的心理活动依赖于与环境的持续信息交换；\n3）解释了长时期感觉剥夺（如单调环境、隔离监禁）会导致认知与情绪问题；\n4）为设计适宜的学习与生活环境提供依据。', f:2 },
    { t:'term', k:'心理物理函数的测定', a:'定义：测定感觉量或反应概率随刺激物理量变化的函数关系。\n常用方法：恒定刺激法、最小变化法。\n结果形式：心理物理函数曲线（如觉察率对刺激强度的曲线）、韦伯分数函数、等感受性曲线。', f:1 }
  ]
},

/* ------------------------------ 第 7 章 ------------------------------ */
{
  name: '第7章 注意实验',
  cards: [
    { t:'exp', k:'双耳分听实验', a:'首创者：彻里；发展者：布罗德本特、特瑞斯曼。\n方法：同时向两耳呈现不同材料，要求被试只复述一只耳（追随耳）的内容。\n结果：被试对非追随耳的内容几乎一无所知，但对其中自己的名字等阈限低的词能觉察。\n结论：支持选择性注意的过滤器模型与衰减模型。', f:3 },
    { t:'term', k:'过滤器模型', a:'提出者：布罗德本特。\n观点：注意是一个“全或无”的过滤器，位于知觉的早期阶段，只让一个通道的信息通过，其余被完全阻断（单通道模型）。\n证据：双耳分听实验中非追随耳信息几乎不被加工。\n局限：无法解释“鸡尾酒会效应”（自己名字能被觉察）。', f:3 },
    { t:'term', k:'衰减模型', a:'提出者：特瑞斯曼。\n观点：非注意通道的信息并非被完全阻断，而是以衰减的方式进行加工；不同材料有不同的激活阈限，阈限较低的词（如自己的名字、高熟悉度词）仍可被识别。\n证据：鸡尾酒会效应。\n地位：对过滤器模型的重要修正。', f:3, tip:'过滤器是全或无，衰减是减弱' },
    { t:'term', k:'后期选择模型（反应选择模型）', a:'提出者：多伊奇，后由诺曼发展。\n观点：所有输入信息都得到充分的知觉加工，选择发生在反应阶段——只有与当前任务有关的信息才被选择做出反应。\n证据：非追随耳中高语义重要性的信息也能影响反应。', f:2 },
    { t:'exp', k:'波斯纳的空间线索范式', a:'方法：先给一个空间线索（提示目标可能出现的位置），再呈现目标，测量反应时。\n结果：线索有效（SOA 短）时反应时更短；线索无效时反应时更长。\n结论：注意可以在空间上定向，注意转移有成本。\n重要发现：SOA 较长（>300ms）时出现返回抑制。', f:3 },
    { t:'term', k:'返回抑制', a:'发现者：波斯纳。\n现象：当线索与目标之间的 SOA 较长（约大于 300 毫秒）时，出现在先前被提示位置上的目标反应反而更慢。\n解释：注意从已搜索过的位置撤离后，该位置被抑制，有助于提高视觉搜索效率。\n与易化效应的区别：SOA 短（<150ms）时是易化，SOA 长时是抑制。', f:3, tip:'SOA 短易化，SOA 长抑制' },
    { t:'term', k:'特征整合理论', a:'提出者：特瑞斯曼和格拉德。\n观点：视觉加工早期是平行的、以特征（颜色、方向、大小）为单位的加工；特征“自由漂浮”，需要通过集中注意捆绑成完整客体。\n关键推论：特征搜索是平行加工（不受项目数影响）；联合搜索需要系列加工（项目越多越慢）。', f:3 },
    { t:'table', k:'特征搜索 vs 联合搜索', a:'特征搜索：目标在某一个维度上与众不同（如红点中找绿点）｜平行加工｜反应时不随干扰项数量增加而显著增加（斜率接近零）\n联合搜索：目标由两个以上特征联合定义（如红圆中找绿圆）｜系列加工｜反应时随项目数线性增加（斜率明显大于零）', f:3 },
    { t:'term', k:'Stroop 任务', a:'范式：呈现用不同颜色书写的颜色词（如用绿色写“红”字），要求被试报告墨色。\n现象：字义与墨色不一致时，颜色命名显著变慢（Stroop 效应）。\n解释：字义加工是自动化的、无法抑制，与颜色命名产生冲突，反映自动化加工与注意控制之间的冲突。\n变式：情绪 Stroop（研究情绪注意偏向）。', f:3 },
    { t:'term', k:'注意瞬脱', a:'发现者：雷蒙德等。\n现象：在快速序列视觉呈现（RSVP）中，正确识别第一个目标（T1）后，约 200—500 毫秒内对第二个目标（T2）的识别正确率显著下降。\n解释：反映注意在时间维度上的容量限制，像是注意“眨眼”了一下。', f:2 },
    { t:'term', k:'负启动', a:'现象：在前一试次中被忽略的干扰项，在随后试次中作为目标出现时，反应反而更慢。\n解释：被忽略的刺激受到了抑制，且这种抑制会延续到下一试次。\n意义：证明选择性注意包含对无关信息的主动抑制。', f:1 },
    { t:'term', k:'持续性操作测验（CPT）', a:'用途：测量持续性注意（警觉）。\n程序：快速、连续地呈现刺激，要求被试对特定目标（如字母 X）作出反应，其余不反应。\n指标：漏报率、虚报率、反应时的变化。\n应用：注意缺陷多动障碍（ADHD）的评估。', f:1 },
    { t:'short', k:'研究注意的常用实验范式', a:'1）双耳分听：研究听觉选择性注意；\n2）空间线索范式（波斯纳）：研究注意的空间定向与返回抑制；\n3）视觉搜索范式：研究特征搜索与联合搜索；\n4）Stroop 任务：研究自动化加工与注意控制；\n5）注意瞬脱范式（RSVP）：研究时间性选择注意；\n6）负启动范式：研究对无关信息的抑制；\n7）持续性操作测验（CPT）：研究持续性注意（警觉）。', f:3 },
    { t:'short', k:'选择性注意的模型比较', a:'1）过滤器模型（布罗德本特）：早期选择，全或无，单通道；\n2）衰减模型（特瑞斯曼）：早期选择，非注意信息被衰减而非完全阻断；\n3）后期选择模型（多伊奇）：所有信息都得到加工，选择在反应阶段；\n4）多阶段选择模型（约翰斯顿和汉斯）：选择可发生在不同阶段，取决于任务要求；\n5）资源限制理论（卡尼曼）：从认知资源的有限分配解释注意。\n共同点：都承认注意的容量有限，分歧在于“选择发生在加工的哪个阶段”。', f:3 }
  ]
},

/* ------------------------------ 第 8 章 ------------------------------ */
{
  name: '第8章 记忆实验',
  cards: [
    { t:'exp', k:'艾宾浩斯的遗忘实验', a:'材料：无意义音节（排除已有知识经验的影响）。\n方法：节省法，用节省率作为保持量的指标。\n结果：遗忘进程先快后慢，呈负加速。\n地位：最早的记忆实验研究，开创了高级心理过程的实验研究。', f:3 },
    { t:'term', k:'节省法', a:'程序：先学习材料并记录达到完全背诵所需次数（或时间），间隔一段时间后再次学习同样材料，记录重新达到完全背诵所需次数。\n计算：节省率 =（初次次数 − 再次次数）/ 初次次数 × 100%。\n意义：可测量保持量，避免单纯的回忆失败造成的偏差。', f:3 },
    { t:'exp', k:'斯柏林的部分报告法', a:'方法：呈现 3×3 字母矩阵，用不同音调提示报告其中一行。\n结果：全部报告法只能回忆 4—5 个；部分报告法可回忆约 9—10 个。\n结论：证明视觉感觉记忆（图像记忆）的存在，容量大但保持时间极短（约 1 秒以内）。', f:3 },
    { t:'exp', k:'短时记忆提取的完全系列扫描', a:'研究者：斯滕伯格，用加因素法（见第 4 章）。\n设计：呈现 1—6 个数字，再呈现探测数字，测量判断“是/否”的反应时。\n结果：反应时随识记项目数线性增加；“是”与“否”的反应时基本相同。\n结论：短时记忆的提取方式是**完全系列扫描**——逐个比较完所有项目才做出反应。', f:3 },
    { t:'exp', k:'皮特森—皮特森分散注意法', a:'设计：呈现三个字母后立即做减数运算（防止复述），间隔不同时间后回忆。\n结果：回忆率随间隔延长迅速下降，18 秒后几乎全部遗忘。\n结论：短时记忆在无复述条件下约 15—30 秒后迅速遗忘。', f:3 },
    { t:'exp', k:'康拉德的听觉编码实验', a:'设计：要求被试回忆字母序列，分析错误类型。\n结果：错误多为发音相似的字母混淆（B 记成 P、V），而非形状相似的字母混淆。\n结论：短时记忆以听觉（言语听觉）编码为主。', f:3 },
    { t:'exp', k:'巴德利和希奇的工作记忆模型', a:'成分：①中央执行系统（核心，注意控制与资源协调）；②语音环路（语音信息的暂时存储与复述）；③视空间模板（视觉空间信息）；④情景缓冲器（后补充，整合多通道信息）。\n研究范式：双任务范式（如边记数字边做视空间任务，两个子系统互相干扰小）。\n意义：强调信息的主动加工与暂时存储，突破被动的短时记忆概念。', f:3 },
    { t:'short', k:'内隐记忆的测量方法', a:'内隐记忆用间接测量（不要求被试有意识回忆）：\n1）词干补笔：呈现词的前几个字母，让被试补成词；\n2）知觉辨认：快速呈现单词，测量辨认阈限；\n3）词汇判断：判断字母串是否为真词；\n4）偏好判断、残词补全等。\n与直接测量的区别：内隐测量反映启动效应，不受加工水平与学习意向的显著影响。', f:3 },
    { t:'exp', k:'DRM 范式（错误记忆）', a:'设计：学习与某个关键诱饵词（如“床”）高度语义关联的词表，然后自由回忆或再认。\n结果：被试以很高比例错误“回忆”出从未呈现过的关键诱饵词。\n结论：记忆具有建构性，不是经验的精确复制。', f:2 },
    { t:'exp', k:'洛夫特斯的误导信息实验', a:'方法：让被试看交通事故影片，事后用不同措辞提问（“猛烈撞击” vs “碰到”）。\n结果：提问措辞影响被试对车速的估计和对破碎玻璃的错误记忆。\n结论：事后误导信息可整合进原有记忆，产生错误记忆，对司法实践有重要启示。', f:2 },
    { t:'table', k:'错误记忆的两种研究范式', a:'DRM 范式：由语义关联引发错误记忆｜错误来源是语义激活与关联\n误导信息范式（洛夫特斯）：由事后错误信息引发错误记忆｜错误来源是信息整合与重构\n共同点：都说明记忆具有建构性，提取时会受已有知识和事后信息的影响', f:2 },
    { t:'term', k:'前瞻记忆', a:'定义：对未来要执行某项行为的记忆，如“记得下午三点吃药”。\n特点：发生在未来、需要在适当时机自发启动，比回溯记忆更容易失败。\n研究范式：双任务范式（进行中任务 + 前瞻任务）。\n影响因素：提示线索、进行中任务的负荷、动机重要性。', f:1 },
    { t:'short', k:'系列位置效应的实验研究', a:'现象：自由回忆中，开头（首因效应）和末尾（近因效应）部分回忆率高，中间部分最低。\n解释：\n1）首因效应源于长时记忆——开头项目有更多复述机会，进入了长时记忆；\n2）近因效应源于短时记忆——末尾项目仍留在短时记忆中；\n3）中间部分同时受前摄抑制和倒摄抑制的双重干扰。\n验证：回忆前增加分心任务，近因效应减弱或消失，首因效应基本不受影响。', f:3 },
    { t:'term', k:'加工水平的实验研究', a:'提出者：克雷克和洛克哈特。\n方法：让被试对不同材料分别进行浅层加工（字形、大小写判断）和深层加工（语义、是否适合某句子），再测记忆成绩。\n结果：深层语义加工的记忆成绩显著好于浅层物理加工。\n结论：记忆效果取决于加工的深度而非复述的次数。', f:2 },
    { t:'short', k:'短时记忆容量与保持时间的研究', a:'容量研究：米勒（1956）用多种材料测得短时记忆容量为 7±2 个组块，提出“神奇的数字 7±2”。\n保持时间研究：皮特森和皮特森用分散注意法证明，无复述条件下短时记忆约 15—30 秒后迅速遗忘。\n编码研究：康拉德发现短时记忆的错误以听觉混淆为主，说明以听觉编码为主。\n提取研究：斯滕伯格用加因素法证明是完全系列扫描。', f:3 }
  ]
},

/* ------------------------------ 第 9 章 ------------------------------ */
{
  name: '第9章 思维与语言实验',
  cards: [
    { t:'exp', k:'卢钦斯的量水实验', a:'设计：先让被试做若干可用固定公式（B−A−2C）解决的水罐问题，再呈现可用更简单方法解决的问题。\n结果：许多被试仍沿用旧公式，未能发现更简洁的解法。\n结论：定势对问题解决既有促进作用（同类问题解决更快），也有阻碍作用（固守旧方法）。', f:3 },
    { t:'exp', k:'邓克尔的蜡烛问题', a:'任务：把蜡烛固定在墙上，材料有一盒图钉和一些火柴，要求蜡烛点燃后不滴到桌上。\n解法：把火柴盒倒空当平台钉在墙上。\n结果：多数被试想不到把盒子当作平台。\n结论：功能固着——只看到物体的通常功能而难以发现其他用途，妨碍问题解决。', f:3 },
    { t:'exp', k:'沃森的四卡片选择任务', a:'任务：四张卡片分别显示 D、3、红色、白色，规则是“若卡片一面是 D，则另一面是红色”，问需翻哪两张验证。\n正确：翻 D（验证箭头方向）和白色（验证否证）。\n结果：多数被试只翻 D 及其对应卡，忽略了否证的方向。\n结论：推理中存在证实偏差（倾向于证实而忽略证伪）。', f:3 },
    { t:'exp', k:'布鲁纳的人工概念形成实验', a:'材料：由维度（颜色、形状、数量、边框）组成的人工概念卡片。\n方法：被试每次选一张卡片，主试反馈“是/不是”该概念的正例，直到掌握概念。\n结论：概念形成是主动提出假设并检验的过程，被试使用聚焦策略、扫描策略等。\n理论：假设检验说。', f:2 },
    { t:'term', k:'河内塔问题', a:'任务：把若干大小不同的圆盘从起始柱移到目标柱，每次只能移动一个盘，大盘不能压在小盘上。\n考察：问题解决中的计划与策略（手段—目的分析、子目标分解）。\n常用指标：移动步数、错误次数、解决问题所需时间。\n特点：结构清晰、有明确的最优解，是经典的问题解决研究任务。', f:2 },
    { t:'term', k:'原型启发', a:'定义：从其他事物中获得解决问题的途径或启示，如鲁班从草叶得到启示发明锯子。\n作用：是创造性解决问题的重要途径。\n研究：原型启发实验表明，先接触与目标结构相似的“原型”材料，能提高类比迁移的成功率。', f:2 },
    { t:'term', k:'酝酿效应', a:'现象：暂时搁置问题一段时间后，反而更容易找到解决办法。\n解释：搁置期间思维定势减弱、错误假设消退，潜意识仍在加工相关信息。\n研究设计：比较连续思考组与中途休息组的解题成绩。', f:2 },
    { t:'short', k:'问题解决的实验研究范式', a:'1）定势研究：卢钦斯量水问题；\n2）功能固着研究：邓克尔蜡烛问题；\n3）顿悟研究：苛勒黑猩猩取香蕉实验、河内塔问题；\n4）假设检验与推理研究：沃森四卡片选择任务、布鲁纳人工概念形成实验；\n5）类比迁移研究：原型启发实验。\n共同点：通过控制材料结构、给定假设和反馈，考察思维过程的规律与障碍。', f:2 }
  ]
},

/* ------------------------------ 第 10 章 ------------------------------ */
{
  name: '第10章 情绪实验',
  cards: [
    { t:'exp', k:'沙赫特和辛格的情绪两因素实验', a:'设计：三组被试分别注射肾上腺素、安慰剂和生理盐水，并给予不同的解释；随后与“假被试”在愉快或愤怒的情境中相处。\n结果：生理唤醒相同但认知解释不同的被试产生了不同的情绪体验。\n结论：情绪 = 生理唤醒 + 认知评价，认知因素起决定作用。', f:3 },
    { t:'exp', k:'艾克曼的跨文化表情研究', a:'方法：向不同文化背景的人（含与世隔绝的新几内亚部落）呈现表情照片，让其辨认情绪；也让部落成员做出特定情绪的表情让美国人辨认。\n结果：快乐、悲伤、恐惧、愤怒、惊讶、厌恶六种基本情绪的面部表情具有跨文化一致性。\n结论：基本情绪的面部表情具有先天性和普遍性。', f:3 },
    { t:'short', k:'情绪的三种测量方法', a:'1）自我报告法：用量表（如 PANAS）、访谈让被试报告主观体验。优点：直接、简便；缺点：受社会赞许、内省能力影响。\n2）生理测量法：测量皮肤电、心率、血压、呼吸、肌电、脑电及脑成像。优点：客观、可连续记录；缺点：特异性较差。\n3）行为观察法：对表情、姿态、语调进行观察与编码（如 FACS）。优点：生态效度好；缺点：编码工作量大、主观性较强。\n实际研究通常三类指标结合使用，进行多指标验证。', f:3 },
    { t:'term', k:'情绪 Stroop 任务', a:'范式：呈现不同效价的情绪词（如“死亡”“快乐”），要求被试报告墨色。\n现象：情绪词比中性词引起更大的颜色命名干扰，尤其对焦虑、抑郁个体。\n意义：反映对情绪信息的注意偏向。\n应用：焦虑障碍、抑郁症、成瘾的认知偏向研究。', f:2 },
    { t:'term', k:'情绪诱发', a:'定义：在实验中有意改变被试当前情绪状态的方法。\n常用方法：影片/图片诱发、音乐诱发、自传体回忆、表情反馈（让被试按要求做表情）、情境诱发。\n检验：用情绪自评量表或生理指标确认诱发是否成功。\n注意：需控制个体差异与需求特征。', f:2 },
    { t:'term', k:'面部肌电（EMG）', a:'指标：皱眉肌（corrugator）活动增强与消极情绪相关；颧大肌（zygomaticus）活动增强与积极情绪相关。\n优点：非常敏感，可探测到微弱甚至无意识的表情变化。\n应用：广告偏好、态度测量、情绪调节研究。', f:2 },
    { t:'term', k:'FACS（面部动作编码系统）', a:'提出者：艾克曼和弗里森。\n内容：把面部肌肉运动分解为若干动作单元（AU），用 AU 组合描述面部表情。\n优点：客观、精细、可标准化，被广泛作为表情分析的“金标准”。\n用途：情绪识别、谎言识别、跨文化表情研究。', f:1 },
    { t:'term', k:'情绪的生理测量指标', a:'常用指标：皮肤电反应（GSR/SCR，反映交感神经活动，是情绪唤起最敏感的指标之一）、心率与血压、呼吸频率与幅度、末梢血管容积、面部肌电、脑电（EEG）与事件相关电位、功能磁共振（fMRI）。\n特点：客观、不易被有意控制，但多数指标对不同情绪的区分度有限，需多指标结合。', f:2 }
  ]
},

/* ------------------------------ 第 11 章 ------------------------------ */
{
  name: '第11章 心理学研究的方法学体系',
  cards: [

{

    { t:'term', k:'II 类错误', a:'定义：接受了本来错误的原假设，即“取伪”，漏掉了真实存在的效应。\n概率：记为 β。\n影响因素：样本量越小、效应量越小、α 越小，β 越大。', f:3 },

    { t:'short', k:'常用统计检验的适用条件', a:'1）t 检验：比较两个平均数差异——独立样本 t 检验（两组独立被试）、配对样本 t 检验（同一被试前后测）；\n2）方差分析（ANOVA）：比较三个及以上组平均数差异，可分析多因素的主效应与交互作用；重复测量方差分析用于被试内设计；\n3）协方差分析（ANCOVA）：控制协变量后比较组间差异；\n4）卡方检验：分类变量（计数资料）的独立性检验与拟合度检验；\n5）相关与回归：考察变量间的关联与预测。', f:3 },
    { t:'term', k:'方差分析', a:'用途：同时比较三个及以上组平均数差异，并分析多因素的主效应和交互作用。\n基本原理：把总变异分解为组间变异和组内变异，用 F 检验判断组间差异是否显著。\n类型：单因素、多因素、重复测量方差分析、混合设计方差分析。\n优点：避免多次 t 检验造成的 I 类错误膨胀。', f:3 },
    { t:'term', k:'卡方检验', a:'用途：处理分类变量（计数资料）。\n两种主要形式：\n1）拟合度检验：检验实际次数分布是否符合理论分布；\n2）独立性检验：检验两个分类变量是否有关联。\n要求：期望次数一般不小于 5。\n应用：问卷选项分布、行为编码结果的统计。', f:2 },
    { t:'short', k:'实验报告的基本结构（IMRAD）', a:'1）题目与摘要：概括研究问题、方法、主要结果与结论，附关键词；\n2）引言：研究背景与问题、已有研究综述、研究不足、研究目的与假设；\n3）方法：被试、仪器与材料、实验设计（自变量、因变量、控制变量、设计类型）、实验程序；\n4）结果：描述统计与推论统计，配图表；\n5）讨论：解释结果、与已有研究比较、理论意义与实际意义、研究局限与未来方向；\n6）参考文献与附录。', f:3, tip:'引言—方法—结果—讨论' },
    { t:'short', k:'结果部分的报告规范', a:'1）先报告描述统计：各组的平均数 M 和标准差 SD；\n2）再报告推论统计：检验方法、检验统计量、自由度、p 值，如 t(38) = 2.35, p < .05；\n3）报告效应量：如 Cohen’s d = 0.75；\n4）图表要能独立看懂：有标题、坐标轴标签、单位、误差棒；\n5）报告所有事先设定的分析，包括不显著的结果，不隐瞒数据。', f:3 },

const $  = (s, r = document) => r.querySelector(s);
const $ = (s, r = document) => Array.prototype.slice.call(r.querySelectorAll(s));

/** 轻量 DOM 构造器：h('div', {class:'x', onClick:fn}, '文本', childEl) */
const SVG_TAGS = new Set(['svg', 'circle', 'path', 'g', 'rect', 'line', 'polyline',
  'polygon', 'ellipse', 'defs', 'linearGradient', 'radialGradient', 'stop',
  'text', 'tspan', 'use', 'clipPath', 'mask', 'pattern', 'filter']);

/** 创建元素：SVG 标签必须用 SVG 命名空间，否则浏览器不会当图形渲染 */
function createEl(tag) {
  if (SVG_TAGS.has(tag)) {
    try { return document.createElementNS('http://www.w3.org/2000/svg', tag); } catch (e) {}
  }
  return document.createElement(tag);
}

function h(tag, props, ...kids) {
  const el = createEl(tag);
  if (props) {
    for (const k in props) {
      const v = props[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k === 'dataset') Object.assign(el.dataset, v);
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') {
        el.addEventListener(k.slice(2).toLowerCase(), v);
      } else el.setAttribute(k, v === true ? '' : v);
    }
  }
  append(el, kids);
  return el;
}
function append(parent, kids) {
  for (const k of kids) {
    if (k === null || k === undefined || k === false || k === true) continue;
    if (Array.isArray(k)) { append(parent, k); continue; }
    parent.appendChild(k instanceof Node ? k : document.createTextNode(String(k)));
  }
}

/** 字符串稳定哈希（用于生成题目的持久 id，插入新题不会打乱旧记录） */
function hash(str) {
  let h1 = 5381, h2 = 52711;
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    h1 = (h1 * 33) ^ c;
    h2 = (h2 * 31) ^ c;
  }
  return ((h1 >>> 0) * 4096 + (h2 >>> 0) % 4096).toString(36);
}

function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function todayKey(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function dayOffset(n) {
  const d = new Date();
  d.setHours(12, 0, 0, 0);
  d.setDate(d.getDate() + n);
  return d;
}
function pct(a, b) { return b > 0 ? Math.round((a / b) * 100) : 0; }
function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function haptic(ms) {
  if (!SET.haptic) return;
  try { navigator.vibrate && navigator.vibrate(ms || 8); } catch (e) {}
}
function fmtTime(sec) {
  if (sec < 60) return sec + ' 秒';
  const m = Math.floor(sec / 60), s = sec % 60;
  if (m < 60) return m + ' 分' + (s ? s + ' 秒' : '');
  return Math.floor(m / 60) + ' 小时 ' + (m % 60) + ' 分';
}
const LETTER = 'ABCDEFGH';
const TYPE_NAME = {
  single:   '单选',
  multiple: '多选',
  judge:    '判断',
  term:     '名词解释',
  short:    '简答',
  essay:    '论述'
};

  single: 'gray', multiple: 'gray', judge: 'gray',
  term: '', short: '', essay: ''
};

/* ==========================================================================
   2. 本地存储

const LS = {
  get(k, dft) {
    try {
      const v = localStorage.getItem(k);
      if (v === null || v === undefined) return dft;
      const p = JSON.parse(v);
      return p === null || p === undefined ? dft : p;
    } catch (e) { return dft; }
  },
  set(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch (e) { toast('存储空间不足，请到「我的」清理数据'); return false; }
  },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

const K = {
  prog:   'psy.prog.v1',    // 每题作答记录
  fav:    'psy.fav.v1',     // 收藏 id 数组
  set:    'psy.set.v1',     // 设置
  sess:   'psy.sess.v1',    // 上次未完成的练习（用于「继续上次」）

  meta:   'psy.meta.v1'     // 首次使用等
};

  fs: 16,               // 正文字号
  instant: true,        // 选完立刻判对错
  shuffleOpt: false,    // 选项乱序
  autoNext: false,      // 答对后自动跳下一题
  autoRemoveWrong: true,// 答对后自动移出错题本
  haptic: true,         // 触感反馈
  daily: 15,            // 每日一练题量
  cardDaily: 20,        // 每天新背多少张卡片
  reciteAll: false      // 背题模式：直接显示答案
};

let SET = Object.assign({}, DEFAULT_SET, LS.get(K.set, {}));
let PROG = LS.get(K.prog, {});
let FAV = LS.get(K.fav, []);
let DAYS = LS.get(K.days, {});
let FAVSET = null;

function saveSet()  { LS.set(K.set, SET); }
function saveProg() { LS.set(K.prog, PROG); }
function saveFav()  { LS.set(K.fav, FAV); }
function saveDays() { LS.set(K.days, DAYS); }

/* ==========================================================================
   3. 题库装载与规范化
   ========================================================================== */

const QUESTIONS = [];      // 所有题目（顺序即默认顺序）
const BY_ID = new Map();   // id -> question
const SUBJECTS = [];       // [{name, icon, desc, count, chapters:[{name, ids:[], count}]}]

function normType(t) {
  const s = String(t || 'single').trim().toLowerCase();
  if (s === 's' || s === 'single' || s === '单选' || s === '单选题' || s === '单项选择') return 'single';
  if (s === 'm' || s === 'multiple' || s === 'multi' || s === '多选' || s === '多选题' || s === '多项选择') return 'multiple';
  if (s === 'j' || s === 'judge' || s === 'tf' || s === '判断' || s === '判断题') return 'judge';
  if (s === 't' || s === 'term' || s === '名词解释') return 'term';
  if (s === 'q' || s === 'short' || s === '简答' || s === '简答题') return 'short';
  if (s === 'e' || s === 'essay' || s === '论述' || s === '论述题') return 'essay';
  return 'single';
}

/** 把原始答案统一成：单选->数字，多选->升序数组，判断->布尔，主观题->字符串 */
function normAnswer(type, a, options) {
  if (type === 'judge') {
    if (typeof a === 'boolean') return a;
    const s = String(a == null ? '' : a).trim();
    if (/^(对|正确|是|true|t|√|✓|yes|y|1)$/i.test(s)) return true;
    if (/^(错|错误|否|false|f|×|x|no|n|0)$/i.test(s)) return false;
    return true;
  }
  if (type === 'multiple') {
    if (Array.isArray(a)) {
      const idx = a.map(x => typeof x === 'number' ? x : LETTER.indexOf(String(x).trim().toUpperCase()))
                   .filter(x => x >= 0);
      return idx.sort((x, y) => x - y);
    }
    const s = String(a == null ? '' : a);
    const idx = [];
    for (const ch of s.toUpperCase()) {
      const i = LETTER.indexOf(ch);
      if (i >= 0 && idx.indexOf(i) < 0) idx.push(i);
    }
    return idx.sort((x, y) => x - y);
  }
  if (type === 'single') {
    if (typeof a === 'number') return a;
    const s = String(a == null ? '' : a).trim().toUpperCase();
    const m = s.match(/[A-H]/);
    if (m) return LETTER.indexOf(m[0]);
    const n = parseInt(s, 10);
    return isNaN(n) ? 0 : n - 1;
  }
  return String(a == null ? '' : a);
}

function makeQuestion(raw, subjectName, chapterName) {
  const stem = String(raw.q || raw.stem || raw.question || '').trim();
  if (!stem) return null;
  let type = normType(raw.t || raw.type);
  let options = raw.o || raw.options || raw.opts || [];
  if (typeof options === 'string') options = options.split(/\s*[|｜]\s*/);
  options = (options || []).map(x => String(x).trim()).filter(x => x !== '');

  // 自动纠偏：没有选项的单选/多选 -> 判断或主观题
  if (!options.length) {
    if (type === 'single' || type === 'multiple') {
      const s = String(raw.a === undefined ? '' : raw.a);
      type = /^(对|错|正确|错误|√|×|true|false|t|f)$/i.test(s.trim()) ? 'judge' : 'short';
    }
  } else if (type === 'single' && Array.isArray(raw.a) && raw.a.length > 1) {
    type = 'multiple';
  }

  const id = (raw.id ? String(raw.id) : '') || hash(subjectName + '|' + chapterName + '|' + stem);
  const item = {
    id,
    subject: subjectName,
    chapter: chapterName,
    type,
    stem,
    options,
    answer: normAnswer(type, raw.a !== undefined ? raw.a : raw.answer, options),
    expl: String(raw.e || raw.expl || raw.analysis || raw.exp || '').trim(),
    tags: [].concat(raw.tag || raw.tags || []).map(x => String(x)).filter(Boolean),
    custom: !!raw.custom
  };
  if (type === 'single' && (item.answer < 0 || item.answer >= options.length)) item.answer = 0;
  if (type === 'multiple' && (!item.answer.length)) item.answer = [0];
  return item;
}

function loadBank(bank) {
  if (!bank || !bank.subject || !Array.isArray(bank.chapters)) return;
  // 同名科目合并（方便把自建题目挂到内置科目下面）
  let subj = SUBJECTS.find(s => s.name === bank.subject);
  if (!subj) {
    subj = { name: bank.subject, icon: bank.icon || '📘', desc: bank.desc || '',
             chapters: [], count: 0, questionIds: [] };
    SUBJECTS.push(subj);
  } else if (subj.chapters.some(c => c.name === (bank.chapters[0] || {}).name)) {
    // 同一章节重复导入时加后缀，避免两个同名章节
    const stamp = new Date();
    bank = Object.assign({}, bank, {
      chapters: bank.chapters.map(c => Object.assign({}, c, {
        name: c.name + '（' + pad2(stamp.getMonth() + 1) + pad2(stamp.getDate()) + '导入）'
      }))
    });
  }
  for (const ch of bank.chapters) {
    const chap = { name: ch.name || '未分类', ids: [], count: 0 };
    for (const raw of (ch.items || [])) {
      const q = makeQuestion(raw, bank.subject, chap.name);
      if (!q) continue;
      QUESTIONS.push(q);
      BY_ID.set(q.id, q);
      chap.ids.push(q.id);
      subj.questionIds.push(q.id);
    }
    chap.count = chap.ids.length;
    subj.count += chap.count;
    if (chap.count) subj.chapters.push(chap);
  }
}

function loadCustom() {
  const raw = LS.get(K.custom, []);
  for (const b of raw) loadBank(Object.assign({}, b, { custom: true }));

/* ==========================================================================
   4. 作答记录
   ========================================================================== */

function rec(id) {
  let r = PROG[id];
  if (!r) r = PROG[id] = { n: 0, ok: 0, last: null, ts: 0, streak: 0 };
  return r;
}
/** 记录一次作答。correct: 是否正确 */
function recordAnswer(id, correct) {
  const r = rec(id);
  r.n++;
  if (correct) { r.ok++; r.streak = (r.streak || 0) + 1; }
  else r.streak = 0;
  r.last = !!correct;
  r.ts = Date.now();
  const dk = todayKey();
  DAYS[dk] = (DAYS[dk] || 0) + 1;
  saveProg(); saveDays();
  touchStreak();
}
function isDone(id)  { const r = PROG[id]; return !!(r && r.n > 0); }
function isRight(id) { const r = PROG[id]; return !!(r && r.last === true); }
function isWrong(id) { const r = PROG[id]; return !!(r && r.last === false); }
function wrongIds()  { return QUESTIONS.filter(q => isWrong(q.id)).map(q => q.id); }
function favIds()    { return FAV.filter(id => BY_ID.has(id)); }
function doneCount(ids) { return ids.filter(isDone).length; }
function rightCount(ids) { return ids.filter(isRight).length; }

/* 连续打卡 */
function touchStreak() { /* 由 calcStreak 实时计算，无需存 */
}
function calcStreak() {
  let n = 0;
  for (let i = 0; i < 400; i++) {
    const k = todayKey(dayOffset(-i));
    if ((DAYS[k] || 0) > 0) n++;
    else if (i === 0) continue;   // 今天还没刷不算断
    else break;
  }
  return n;
}

/** 智能抽题：优先未做过的和做错的，兼顾各章节均衡 */
function pickSmart(n) {
  const byChapter = new Map();
  for (const q of QUESTIONS) {
    if (!byChapter.has(q.chapter)) byChapter.set(q.chapter, []);
    byChapter.get(q.chapter).push(q.id);
  }
  const score = id => {
    const r = PROG[id];
    if (!r || r.n === 0) return 3;          // 没做过
    if (r.last === false) return 2;         // 上次做错
    if (r.streak >= 2) return 0;            // 已掌握
    return 1;                               // 做过但不稳
  };
  const buckets = [[], [], [], []];
  for (const q of QUESTIONS) buckets[score(q.id)].push(q.id);
  const out = [];
  const groups = [shuffle(buckets[3]), shuffle(buckets[2]), shuffle(buckets[1]), shuffle(buckets[0])];
  const chapterSeen = new Map();
  while (out.length < n) {
    let added = false;
    for (const g of groups) {
      // 在每个优先级桶里，尽量先取本章节出现次数少的
      let best = -1, bestC = 1e9;
      for (let i = 0; i < g.length; i++) {
        const c = chapterSeen.get(BY_ID.get(g[i]).chapter) || 0;
        if (c < bestC) { bestC = c; best = i; }
        if (bestC === 0) break;
      }
      if (best >= 0) {
        const id = g.splice(best, 1)[0];
        const ch = BY_ID.get(id).chapter;
        chapterSeen.set(ch, (chapterSeen.get(ch) || 0) + 1);
        out.push(id);
        added = true;
        break;
      }
    }
    if (!added) break;
  }
  // 不够就整体随机补
  if (out.length < n) {
    for (const id of shuffle(allIds())) {
      if (out.length >= n) break;
      if (out.indexOf(id) < 0) out.push(id);
    }
  }
  return shuffle(out);
}

function optionList(q, judged, entries) {
  const pick = S.picks[q.id];
  const correct = q.answer;
  const multi = q.type === 'multiple';
  const order = displayOrder(q, entries);

  return h('div', { class: 'opts' }, order.map((en, di) => {
    let cls = 'opt';
    let isPicked;
    if (multi) isPicked = Array.isArray(pick) && pick.indexOf(en.value) >= 0;
    else isPicked = pick === en.value;

    const isAns = multi ? (Array.isArray(correct) && correct.indexOf(en.value) >= 0) : correct === en.value;
    if (judged) {
      if (isAns) cls += ' right';
      else if (isPicked) cls += ' wrong';
    } else if (isPicked) cls += ' picked';

    return h('button', {
      class: cls, disabled: judged,
      onClick: () => onPick(q, en.value, judged)
    },
      h('span', { class: 'key' }, multi ? en.key : LETTER[di]),
      h('span', { class: 'txt' }, en.label)
    );
  }));
}

/** 选项展示顺序。开启「选项乱序」时对单选题做稳定乱序（同一题每次顺序一致） */
function displayOrder(q, entries) {
  if (!(SET.shuffleOpt && q.type === 'single') || entries.length < 2) return entries;
  if (!S.order) S.order = {};
  if (!S.order[q.id] || S.order[q.id].length !== entries.length) {
    const idx = entries.map((_, i) => i);
    S.order[q.id] = idx.sort((a, b) =>
      (hash(q.id + '#' + a) % 9973) - (hash(q.id + '#' + b) % 9973) || a - b);
  }
  return S.order[q.id].map(i => entries[i]);
}

/** 某个原始选项索引在当前展示顺序里的字母 */
function displayLetter(q, value) {
  if (q.type !== 'single') return '';
  const order = displayOrder(q, q.options.map((t, i) => ({ label: t, key: LETTER[i], value: i })));
  const pos = order.findIndex(e => e.value === value);
  return LETTER[pos >= 0 ? pos : value];
}

function reciteBlock(q, judged) {
  const show = judged || S.recite || SET.reciteAll;
  const res = S.results[q.id];
  return h('div', null,

function selfEval(q, ok) {
  S.results[q.id] = ok;
  S.judged[q.id] = true;
  recordAnswer(q.id, ok);
  haptic(ok ? 10 : 20);
  saveSession();
  refreshBody();
  if (ok && SET.autoNext) setTimeout(nextQuestion, 320);
}

function onPick(q, value, judged) {
  if (judged) return;
  if (q.type === 'multiple') {
    let arr = Array.isArray(S.picks[q.id]) ? S.picks[q.id].slice() : [];
    const i = arr.indexOf(value);
    if (i >= 0) arr.splice(i, 1); else arr.push(value);
    arr.sort((a, b) => a - b);
    S.picks[q.id] = arr;
    refreshBody();
    refreshActions();
    return;
  }
  S.picks[q.id] = value;
  if (S.instant) judge(q);
  else { refreshBody(); refreshActions(); }
}

function sameSet(a, b) {
  if (!Array.isArray(a) || !Array.isArray(b)) return false;
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}

function judge(q) {
  const pick = S.picks[q.id];
  let ok;
  if (q.type === 'multiple') ok = sameSet(pick, q.answer);
  else ok = pick === q.answer;
  S.judged[q.id] = true;
  S.results[q.id] = ok;
  recordAnswer(q.id, ok);
  haptic(ok ? 10 : [12, 40, 12]);
  saveSession();
  refreshBody();
  refreshActions();
  if (ok && SET.autoNext) setTimeout(nextQuestion, 520);
}

function refreshActions() {
  const acts = $('#qactions');
  if (!acts) return;
  acts.textContent = '';
  append(acts, [questionActions()]);
}

function answerBox(q) {
  const ok = S.results[q.id];
  if (S.recite && ok === undefined) {
    return h('div', { class: 'answer-box' },
      h('div', { class: 'ans-line' },
        '正确答案：', h('b', null, answerText(q))),
      q.expl ? h('div', { class: 'expl' },
        h('span', { class: 'lbl' }, '知识点'),
        q.expl) : null
    );
  }
  return h('div', { class: 'answer-box' },
    h('div', { class: 'verdict ' + (ok ? 'ok' : 'bad') },
      ok ? '✓ 答对了' : '✕ 答错了'),
    h('div', { class: 'ans-line' },
      '正确答案：', h('b', null, answerText(q))
    ),
    q.expl ? h('div', { class: 'expl' },
      h('span', { class: 'lbl' }, '解析'),
      q.expl) : null
  );
}

function answerText(q) {
  if (q.type === 'judge') return q.answer ? '正确' : '错误';
  if (q.type === 'multiple') return q.answer.map(i => LETTER[i]).join('');
  if (q.type === 'single') return displayLetter(q, q.answer) + '. ' + (q.options[q.answer] || '');
  return '';
}

function questionActions() {
  const q = curQ();
  const judged = !!S.judged[q.id];
  const fav = FAV.indexOf(q.id) >= 0;
  const pick = S.picks[q.id];
  const hasPick = Array.isArray(pick) ? pick.length > 0 : pick !== undefined;
  const needSubmit = !judged && !S.recite && (
    q.type === 'multiple'
      ? hasPick
      : ((q.type === 'single' || q.type === 'judge') && hasPick && !S.instant)
  );
  const isRecite = q.type === 'term' || q.type === 'short' || q.type === 'essay';

  return h('div', { class: 'q-actions', id: 'qactions' },
    h('button', {
      class: 'icon-btn' + (fav ? ' on' : ''),
      onClick: () => {
        const i = FAV.indexOf(q.id);
        if (i >= 0) { FAV.splice(i, 1); toast('已取消收藏'); }
        else { FAV.push(q.id); toast('已收藏 ⭐'); }
        saveFav(); refreshBody();
        refreshActions();
      }
    }, fav ? '⭐' : '☆'),
    h('button', { class: 'icon-btn', onClick: openNavigatorSheet, title: '题目导航' }, iconGrid()),
    S.idx > 0 ? h('button', { class: 'btn ghost sm', style: { flex: '0 0 auto', padding: '13px 15px' },
      onClick: prevQuestion }, '上一题') : null,

      ? h('button', { class: 'btn primary', onClick: () => judge(q) }, '提交答案')
      : (isRecite && !judged && !S.recite
          ? h('button', { class: 'btn primary',
              onClick: () => { S.judged[q.id] = true; saveSession(); refreshBody(); refreshActions(); } }, '看答案')
          : h('button', {
              class: 'btn ' + (judged || S.recite || isRecite ? 'primary' : 'ghost'),
              onClick: nextQuestion
            }, S.idx >= S.ids.length - 1 ? '完成练习'

  );
}

function refreshBody() {
  const body = $('#qbody');
  if (!body) return;
  body.textContent = '';
  body.appendChild(questionBody());
  const prog = $('.qprog i');
  if (prog) prog.style.width = pct(S.idx + 1, S.ids.length) + '%';
  const cnt = $('.q-count');
  if (cnt) cnt.textContent = (S.idx + 1) + ' / ' + S.ids.length +
    (Object.keys(S.judged).length ? ' · 已答' + Object.keys(S.judged).length : '');
}
function rerenderPractice() {
  const v = $('#view');
  v.textContent = '';
  append(v, [VIEWS.practice({ name: 'practice' })]);
}
function nextQuestion() {
  if (S.idx >= S.ids.length - 1) { finishSession(); return; }
  S.idx++;
  saveSession();
  rerenderPractice();
  const v = $('#view'); v.scrollTop = 0;
}
function prevQuestion() {
  if (S.idx <= 0) return;
  S.idx--;
  saveSession();
  rerenderPractice();
  const v = $('#view'); v.scrollTop = 0;
}
function gotoQuestion(i) {
  S.idx = clamp(i, 0, S.ids.length - 1);
  saveSession();
  rerenderPractice();
  const v = $('#view'); v.scrollTop = 0;
}

/* ---------------- 结算 ---------------- */

function finishSession() {
  S.finished = true;
  LS.del(K.sess);
  const ids = S.ids;
  const answered = ids.filter(id => S.judged[id]);
  const right = answered.filter(id => S.results[id] === true);
  const wrong = answered.filter(id => S.results[id] === false);
  const skipped = ids.filter(id => !S.judged[id]);
  const secs = Math.max(1, Math.round((Date.now() - S.startedAt) / 1000));
  S.summary = { ids, answered: answered.length, right: right.length,
                wrong: wrong.length, skipped: skipped.length, secs };
  reset({ name: 'result' });
}

VIEWS.result = function () {
  const s = (S && S.summary) || { ids: [], answered: 0, right: 0, wrong: 0, skipped: 0, secs: 0 };
  const acc = pct(s.right, s.answered);
  const total = s.ids.length;
  const wrongIdList = S ? s.ids.filter(id => S.results[id] === false) : [];
  const C = 2 * Math.PI * 56;
  const ringColor = acc >= 80 ? 'var(--ok)' : acc >= 60 ? 'var(--warn)' : 'var(--bad)';
  const ring = h('div', { class: 'ring' },
    h('svg', { viewBox: '0 0 132 132', style: { position: 'absolute', inset: '0', width: '100%', height: '100%', transform: 'rotate(-90deg)' } },

        style: { fill: 'none', stroke: 'var(--line)', strokeWidth: '10' } }),
      h('circle', { cx: '66', cy: '66', r: '56',
        style: { fill: 'none', stroke: ringColor, strokeWidth: '10', strokeLinecap: 'round',
                 strokeDasharray: String(C), strokeDashoffset: String(C * (1 - acc / 100)),
                 transition: 'stroke-dashoffset .7s ease' } })
    ),
    h('div', { class: 'inner' },
      h('b', null, acc + '%'),
      h('span', null, '正确率')
    )
  );

  const praise = acc >= 90 ? '太强了！这套题基本拿下 🎉'
    : acc >= 75 ? '不错，再把错题过一遍就更稳了'
    : acc >= 50 ? '有基础，错题需要重点复习'
    : '这块还比较薄弱，建议先看一遍书再来';

  return h('div', null,
    h('div', { class: 'result' },
      ring,
      h('h2', null, praise),
      h('p', { class: 'muted tiny' }, (S && S.title ? S.title + ' · ' : '') + '用时 ' + fmtTime(s.secs)),
      h('div', { class: 'res-grid' },
        h('div', null, h('b', { style: { color: 'var(--ok)' } }, s.right), h('span', null, '答对')),
        h('div', null, h('b', { style: { color: 'var(--bad)' } }, s.wrong), h('span', null, '答错')),
        h('div', null, h('b', null, s.skipped), h('span', null, '未答'))
      )
    ),
    h('div', { class: 'sec' },
      h('div', { class: 'list' },
        liRow('🔁', '再做一遍这套题', total + ' 题', () => {
          startSession({ title: S.title, ids: S.ids, shuffle: true });
        }),
        wrongIdList.length
          ? liRow('❌', '只重做错题', wrongIdList.length + ' 题', () => {
              startSession({ title: '错题重做', ids: wrongIdList, shuffle: true });
            })

    h('button', { class: 'btn primary', style: { marginTop: '6px' },

  );
};

function statCard(label, big, sub) {
  return h('div', { class: 'stat-card' },
    h('span', null, label),
    h('b', null, big),
    h('span', { class: 'tiny' }, sub)
  );
}
function sumDays(n) {
  let s = 0;
  for (let i = 0; i < n; i++) s += DAYS[todayKey(dayOffset(-i))] || 0;
  return s;
}
function heatmap() {
  const now = new Date();
  now.setHours(12, 0, 0, 0);
  const dow = (now.getDay() + 6) % 7;           // 周一 = 0
  const start = new Date(now);
  start.setDate(start.getDate() - dow - 12 * 7);  // 12 周前的周一
  const cells = [];
  const vals = [];
  for (let r = 0; r < 7; r++) {
    for (let c = 0; c < 13; c++) {
      const d = new Date(start);
      d.setDate(d.getDate() + c * 7 + r);
      const future = d > now;
      const v = future ? 0 : (DAYS[todayKey(d)] || 0);
      vals.push(v);
      cells.push({ d, v, future });
    }
  }
  const max = Math.max(SET.daily, ...vals) || 1;
  return h('div', null,
    h('div', { class: 'heat' }, cells.map(c => {
      if (c.future) return h('i', { style: { opacity: '.35' } });
      if (!c.v) return h('i');
      const lvl = clamp(Math.ceil((c.v / max) * 4), 1, 4);
      return h('i', { class: 'l' + lvl });
    })),
    h('div', { class: 'row tiny muted', style: { marginTop: '9px', justifyContent: 'space-between' } },
      h('span', null, '13 周前'),
      h('span', null, '今天'),
      h('span', { class: 'row', style: { gap: '3px' } },
        h('span', null, '少'),
        h('i', { style: { width: '11px', height: '11px', borderRadius: '3px', background: 'var(--heat0)', display: 'block' } }),
        h('i', { style: { width: '11px', height: '11px', borderRadius: '3px', background: '#a99bf7', display: 'block' } }),
        h('i', { style: { width: '11px', height: '11px', borderRadius: '3px', background: '#6c5ce7', display: 'block' } }),
        h('span', null, '多')
      )
    )
  );
}

/** 题目导航（答题卡）：一屏看到这一套题的全部题号，点哪去哪 */
function openNavigatorSheet() {
  if (!S || !S.ids.length) return;
  const n = S.ids.length;
  let right = 0, wrong = 0, answered = 0;
  for (const id of S.ids) {
    if (!S.judged[id]) continue;
    answered++;
    if (S.results[id] === true) right++;
    else if (S.results[id] === false) wrong++;
  }

  const cells = S.ids.map((id, i) => {
    const q = BY_ID.get(id) || {};
    const cls = ['qn'];
    if (S.judged[id]) cls.push(S.results[id] === true ? 'ok' : (S.results[id] === false ? 'bad' : 'done'));
    if (i === S.idx) cls.push('cur');
    if (FAV.indexOf(id) >= 0) cls.push('faved');
    return h('button', {
      class: cls.join(' '),
      title: (i + 1) + '. ' + (q.chapter || '') + (q.stem ? '\n' + q.stem.slice(0, 40) : ''),
      onClick: () => { closeSheet(); gotoQuestion(i); }
    }, String(i + 1));
  });
  const curChapter = curQ().chapter || '';

  openSheet('题目导航', [
    h('p', { class: 'muted tiny', style: { marginBottom: '12px' } },
      S.title + ' · 当前第 ' + (S.idx + 1) + ' 题' +

      h('span', { class: 'pill gray' }, '共 ' + n + ' 题'),
      h('span', { class: 'pill ok' }, '答对 ' + right),
      h('span', { class: 'pill bad' }, '答错 ' + wrong),
      h('span', { class: 'pill' }, '未答 ' + (n - answered))
    ),
    h('div', { class: 'row', style: { gap: '9px', marginBottom: '14px' } },
      h('button', { class: 'btn sm', style: { flex: '1' },
        onClick: () => { closeSheet(); gotoQuestion(0); } }, '回到第 1 题'),
      h('button', { class: 'btn sm', style: { flex: '1' },
        onClick: jumpToNextUnanswered }, '跳到未做题'),
      h('button', { class: 'btn sm', style: { flex: '1' },
        onClick: () => { closeSheet(); gotoQuestion(n - 1); } }, '最后一题')
    ),
    h('div', { class: 'qgrid' }, cells),
    h('div', { class: 'qlegend' },
      h('span', null, h('i', null), '未做'),
      h('span', null, h('i', { class: 'b' }), '已选未判题'),
      h('span', null, h('i', { class: 'g' }), '答对'),

      h('span', null, h('i', { class: 'b', style: { boxShadow: '0 0 0 2px var(--accent)' } }), '当前题'),
      h('span', null, '右上角小圆点 = 已收藏')
    )
  ]);
}

/** 从当前题往后找第一道没答过的题 */
function jumpToNextUnanswered() {
  const n = S.ids.length;
  for (let k = 1; k <= n; k++) {
    const i = (S.idx + k) % n;
    if (!S.judged[S.ids[i]]) { closeSheet(); gotoQuestion(i); return; }
  }
  toast('这一套题全部做过了 🎉');
}

  const text = ($('#importText').value || '').trim();

  } catch (e) {

    return;
  }
  const count = banks.reduce((n, b) => n + b.chapters.reduce((m, c) => m + c.items.length, 0), 0);
  if (!count) { toast('没有解析到题目，检查一下格式'); return; }

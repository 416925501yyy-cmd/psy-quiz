/* ==========================================================================
   心理学刷题 · 样式
   移动优先 / 单栏 / 安全区域适配 / 深色模式
   ========================================================================== */

:root{
  --bg:#f4f5f9;
  --bg2:#ffffff;
  --card:#ffffff;
  --card2:#f7f8fc;
  --line:#e8eaf1;
  --text:#1b1d24;
  --sub:#878d9d;
  --accent:#6c5ce7;
  --accent-2:#8b7cf6;
  --accent-soft:#eeebfd;
  --ok:#11b888;
  --ok-soft:#e2f7f0;
  --bad:#f4586a;
  --bad-soft:#fdeaed;
  --warn:#f2a33c;
  --warn-soft:#fdf2e2;
  --heat0:#eaecf3;
  --shadow:0 2px 10px rgba(28,30,55,.06);
  --shadow-lg:0 12px 40px rgba(28,30,55,.16);
  --r:16px;
  --r-sm:10px;
  --topH:52px;
  --tabH:56px;
  --fs:16px;
}

html[data-theme="dark"]{
  --bg:#0f1017;
  --bg2:#161822;
  --card:#1a1c26;
  --card2:#212330;
  --line:#2b2e3d;
  --text:#e9ebf3;
  --sub:#868ca0;
  --accent:#8b7cf6;
  --accent-2:#a394ff;
  --accent-soft:#262045;
  --ok:#2ed3a0;
  --ok-soft:#123027;
  --bad:#ff6f80;
  --bad-soft:#3a1b22;
  --warn:#f5b055;
  --warn-soft:#3a2c17;
  --heat0:#272a3a;
  --shadow:0 2px 10px rgba(0,0,0,.3);
  --shadow-lg:0 16px 44px rgba(0,0,0,.5);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-size:var(--fs);
  font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  line-height:1.6;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
ul{margin:0;padding:0;list-style:none}

#app{
  display:flex;flex-direction:column;
  height:100dvh;height:100vh;
  max-width:640px;margin:0 auto;
  background:var(--bg);
  position:relative;
}

/* ---------- 顶栏 ---------- */
.topbar{
  flex:0 0 auto;height:calc(var(--topH) + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;gap:4px;
  padding-left:6px;padding-right:6px;
  background:color-mix(in srgb,var(--bg2) 88%,transparent);
  backdrop-filter:saturate(160%) blur(14px);
  -webkit-backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid var(--line);
  position:relative;z-index:20;
}
.tb-title{flex:1;text-align:center;font-size:17px;font-weight:650;letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-btn{
  width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;
  font-size:22px;line-height:1;color:var(--text);
  flex:0 0 auto;
}
.tb-btn:active{background:var(--card2)}
.tb-btn[hidden]{display:none}

/* ---------- 视图容器 ---------- */
.view{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:14px 14px calc(var(--tabH) + env(safe-area-inset-bottom) + 18px);
  scroll-behavior:smooth;
}
.view.no-tab{padding-bottom:calc(env(safe-area-inset-bottom) + 16px)}

/* ---------- 底部导航 ---------- */
.tabbar{
  flex:0 0 auto;
  display:flex;
  height:calc(var(--tabH) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--bg2) 92%,transparent);
  backdrop-filter:saturate(160%) blur(16px);
  -webkit-backdrop-filter:saturate(160%) blur(16px);
  border-top:1px solid var(--line);
  position:relative;z-index:20;
}
.tabbar[hidden]{display:none}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--sub);font-size:11px;font-weight:550;
  transition:color .15s;
}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.tab.is-on{color:var(--accent)}
.tab.is-on svg{stroke-width:2}

/* ---------- 通用块 ---------- */
.sec{margin-bottom:14px}
.sec-hd{display:flex;align-items:baseline;justify-content:space-between;
  padding:0 4px 8px;gap:8px}
.sec-hd h2{font-size:15px;font-weight:650}
.sec-hd .more{font-size:13px;color:var(--accent);font-weight:550}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  border:1px solid transparent}
html[data-theme="dark"] .card{border-color:var(--line)}
.muted{color:var(--sub)}
.tiny{font-size:12.5px}
.p0{padding:0!important}
.mt10{margin-top:10px}
.mt16{margin-top:16px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.center{text-align:center}

/* ---------- 首页头部 ---------- */
.hero{
  border-radius:20px;padding:18px;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 55%,#a78bfa 100%);
  color:#fff;box-shadow:0 10px 26px -10px rgba(108,92,231,.7);
  position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-40px;top:-50px;width:160px;height:160px;
  border-radius:50%;background:rgba(255,255,255,.14);
}
.hero::before{
  content:"";position:absolute;right:30px;bottom:-70px;width:120px;height:120px;
  border-radius:50%;background:rgba(255,255,255,.10);
}
.hero h1{font-size:20px;font-weight:700;letter-spacing:.3px;position:relative}
.hero p{font-size:13px;opacity:.9;margin-top:4px;position:relative}
.hero-stats{display:flex;gap:18px;margin-top:14px;position:relative}
.hero-stats div{text-align:left}
.hero-stats b{display:block;font-size:20px;font-weight:700;line-height:1.2}
.hero-stats span{font-size:11.5px;opacity:.85}

/* ---------- 科目卡 ---------- */
.subj{
  display:block;width:100%;text-align:left;
  background:var(--card);border-radius:var(--r);
  padding:15px;box-shadow:var(--shadow);
  border:1px solid transparent;
}
html[data-theme="dark"] .subj{border-color:var(--line)}
.subj:active{transform:scale(.985)}
.subj-top{display:flex;align-items:center;gap:11px}
.subj-icon{
  width:42px;height:42px;border-radius:13px;flex:0 0 auto;
  display:grid;place-items:center;font-size:20px;
  background:var(--accent-soft);color:var(--accent);
}
.subj b{font-size:16px;font-weight:650;display:block}
.subj .meta{font-size:12.5px;color:var(--sub);margin-top:1px}
.subj-ring{margin-left:auto;text-align:right;flex:0 0 auto}
.subj-ring em{font-style:normal;font-size:17px;font-weight:700;color:var(--accent)}
.subj-ring span{display:block;font-size:11px;color:var(--sub)}

.bar{height:6px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:12px}
html[data-theme="dark"] .bar{background:#2a2d3c}
.bar i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s}

/* ---------- 快捷宫格 ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid.g4{grid-template-columns:repeat(4,1fr);gap:8px}
.tile{
  background:var(--card);border-radius:var(--r-sm);padding:13px 12px;
  box-shadow:var(--shadow);text-align:left;
  border:1px solid transparent;
  display:flex;flex-direction:column;gap:2px;
}
html[data-theme="dark"] .tile{border-color:var(--line)}
.tile:active{transform:scale(.97)}
.tile b{font-size:14.5px;font-weight:600;display:block}
.tile span{font-size:11.5px;color:var(--sub)}
.tile .ic{font-size:19px;margin-bottom:5px}
.tile.g4{padding:12px 6px;align-items:center;text-align:center}
.tile.g4 b{font-size:11.5px;font-weight:550}

/* ---------- 列表行 ---------- */
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  overflow:hidden;border:1px solid transparent}
html[data-theme="dark"] .list{border-color:var(--line)}
.li{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 15px;position:relative;background:transparent;
}
.li + .li::before{
  content:"";position:absolute;left:15px;right:0;top:0;height:1px;background:var(--line);
}
.li:active{background:var(--card2)}
.li .ic{width:24px;text-align:center;font-size:17px;flex:0 0 auto}
.li .grow b{font-weight:550;font-size:15px;display:block}
.li .grow span{font-size:12.5px;color:var(--sub);display:block}
.li .val{color:var(--sub);font-size:13.5px;flex:0 0 auto}
.li .chev{color:#c6cad6;font-size:18px;flex:0 0 auto;line-height:1}
.li[disabled]{opacity:.5}

/* ---------- 章节选择 ---------- */
.chap-hd{
  position:sticky;top:0;z-index:5;margin:0 -14px 8px;padding:8px 18px 7px;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-size:12.5px;font-weight:650;color:var(--sub);
  display:flex;justify-content:space-between;align-items:baseline;
}
.chap-hd em{font-style:normal;font-weight:500;color:var(--sub);opacity:.8}
.chap-dot{width:6px;height:6px;border-radius:99px;background:var(--line);flex:0 0 auto}
.chap-dot.done{background:var(--ok)}
.chap-dot.mid{background:var(--warn)}

/* ---------- 答题界面 ---------- */
.q-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pill{
  font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;
  background:var(--accent-soft);color:var(--accent);white-space:nowrap;
}
.pill.gray{background:var(--card2);color:var(--sub)}
html[data-theme="dark"] .pill.gray{background:#262938}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.q-count{margin-left:auto;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.q-count{padding:5px 9px;border-radius:9px;display:flex;align-items:center;gap:4px}
.q-count:active{background:var(--card2)}

/* 题目导航（答题卡） */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.qn{
  position:relative;aspect-ratio:1;border-radius:11px;
  display:grid;place-items:center;
  font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;
  background:var(--card);color:var(--sub);
  border:1.5px solid var(--line);
  transition:transform .12s;
}
.qn:active{transform:scale(.93)}
.qn.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.qn.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.qn.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.qn.cur{border-color:var(--accent);color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft);font-weight:750}
.qn.faved::after{
  content:"";position:absolute;top:-2px;right:-2px;width:9px;height:9px;
  border-radius:50%;background:var(--warn);border:1.5px solid var(--bg2);
}
.qlegend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--sub);margin-top:14px}
.qlegend span{display:flex;align-items:center;gap:5px}
.qlegend i{width:12px;height:12px;border-radius:4px;display:block;
  background:var(--card);border:1.5px solid var(--line)}
.qlegend i.b{background:var(--accent-soft);border-color:transparent}
.qlegend i.g{background:var(--ok-soft);border-color:transparent}
.qlegend i.r{background:var(--bad-soft);border-color:transparent}

.q-stem{
  background:var(--card);border-radius:var(--r);padding:16px 15px;
  box-shadow:var(--shadow);font-size:16.5px;line-height:1.72;font-weight:500;
  border:1px solid transparent;
}
html[data-theme="dark"] .q-stem{border-color:var(--line)}
.q-stem .idx{color:var(--accent);font-weight:700;margin-right:2px}

.opts{margin-top:12px;display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  background:var(--card);border-radius:13px;padding:13px 14px;
  box-shadow:var(--shadow);border:1.5px solid transparent;
  transition:border-color .15s,background .15s;
  font-size:15.5px;line-height:1.55;
}
html[data-theme="dark"] .opt{border-color:var(--line)}
.opt .key{
  width:23px;height:23px;border-radius:50%;flex:0 0 auto;margin-top:1px;
  display:grid;place-items:center;font-size:12.5px;font-weight:700;
  background:var(--card2);color:var(--sub);
}
html[data-theme="dark"] .opt .key{background:#2a2d3c}
.opt .txt{flex:1}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.picked .key{background:var(--accent);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .key{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);color:#fff}
.opt[disabled]{opacity:1}

.answer-box{
  margin-top:12px;border-radius:var(--r);padding:14px;
  background:var(--card);box-shadow:var(--shadow);border:1px solid transparent;
  animation:fadeUp .22s ease;
}
html[data-theme="dark"] .answer-box{border-color:var(--line)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.answer-box .verdict{
  display:flex;align-items:center;gap:7px;font-weight:650;font-size:15px;margin-bottom:8px;
}
.answer-box .verdict.ok{color:var(--ok)}
.answer-box .verdict.bad{color:var(--bad)}
.ans-line{font-size:14.5px;font-weight:600;margin-bottom:8px}
.ans-line b{color:var(--accent)}
.expl{
  font-size:14.5px;line-height:1.75;color:var(--text);opacity:.92;
  padding-top:10px;border-top:1px dashed var(--line);
}
.expl .lbl{color:var(--sub);font-size:12.5px;font-weight:650;display:block;margin-bottom:2px}
.ref-ans{
  font-size:15px;line-height:1.85;white-space:pre-wrap;
  background:var(--card2);border-radius:var(--r-sm);padding:12px;
  margin-top:8px;
}
html[data-theme="dark"] .ref-ans{background:#212433}

/* 答题底部操作条 */
.q-actions{
  position:sticky;bottom:0;z-index:6;margin:16px -14px 0;
  padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);
  display:flex;gap:9px;align-items:center;
  background:linear-gradient(to top,var(--bg) 62%,transparent);
}
.btn{
  border-radius:13px;padding:13px 16px;font-size:15.5px;font-weight:600;
  text-align:center;flex:1;
  background:var(--card);box-shadow:var(--shadow);
  border:1px solid transparent;
}
html[data-theme="dark"] .btn{border-color:var(--line)}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  box-shadow:0 8px 20px -8px rgba(108,92,231,.8)}
.btn.ghost{background:transparent;box-shadow:none;border:1.5px solid var(--line);color:var(--sub)}
.btn.sm{padding:10px 14px;font-size:14px}
.btn:disabled{opacity:.45;pointer-events:none}
.icon-btn{
  width:46px;height:46px;border-radius:13px;flex:0 0 auto;
  display:grid;place-items:center;font-size:19px;
  background:var(--card);box-shadow:var(--shadow);border:1px solid transparent;
}
html[data-theme="dark"] .icon-btn{border-color:var(--line)}
.icon-btn.on{color:var(--warn);background:var(--warn-soft)}
.icon-btn:active{transform:scale(.95)}

/* 进度条（答题页顶部） */
.qprog{height:3px;border-radius:99px;background:var(--line);overflow:hidden;margin:0 0 12px}
.qprog i{display:block;height:100%;background:var(--accent);transition:width .25s}

/* ---------- 结果页 ---------- */
.btn.big{padding:15px 18px;font-size:16px;border-radius:14px}

/* ---------- 背诵手册 ---------- */
.rcard{
  margin-top:14px;background:var(--card);border-radius:20px;
  padding:18px 16px;box-shadow:var(--shadow);border:1px solid transparent;
  min-height:44vh;display:flex;flex-direction:column;
  transition:box-shadow .2s;
}
html[data-theme="dark"] .rcard{border-color:var(--line)}
.rcard.flipped{box-shadow:var(--shadow-lg)}
.rcard-ch{font-size:12.5px;color:var(--sub);margin-bottom:10px}
.rcard-title{
  font-size:20px;font-weight:700;line-height:1.5;letter-spacing:.2px;
  text-align:center;margin:auto 0;
}
.rcard.flipped .rcard-title{
  font-size:16.5px;font-weight:650;text-align:left;margin:0 0 12px;
  padding-bottom:12px;border-bottom:1px dashed var(--line);
}
.rcard-hint{margin:auto 0;text-align:center;color:var(--sub);font-size:14px;line-height:1.9}
.rcard-hint-ic{font-size:30px;margin-bottom:8px;opacity:.55}
.rcard-body{flex:1}
.rcard-answer{font-size:15.5px;line-height:1.9;white-space:pre-wrap;word-break:break-word}
.rcard-tip{
  margin-top:14px;padding:10px 12px;border-radius:12px;
  background:var(--warn-soft);font-size:13.5px;line-height:1.7;
}
.rcard-state{margin-top:12px;font-size:12.5px;font-weight:600}
.rcard-state.no{color:var(--bad)}
.rcard-state.vague{color:var(--warn)}

.btn.rc-no{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.btn.rc-vague{background:var(--warn-soft);color:var(--warn);box-shadow:none}
.btn.rc-ok{background:var(--ok-soft);color:var(--ok);box-shadow:none}
.btn.rc-no,.btn.rc-vague,.btn.rc-ok{padding:13px 6px;font-size:14.5px;white-space:nowrap}
.btn.rc-no:active,.btn.rc-vague:active,.btn.rc-ok:active{transform:scale(.97)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 14px;border-radius:99px;font-size:13px;font-weight:550;
  background:var(--card);color:var(--sub);border:1.5px solid var(--line);
}
.chip.on{background:var(--accent);color:#fff;border-color:transparent}
.rc-item + .rc-item{border-top:1px solid var(--line)}
.rc-item-body{padding:0 15px 15px;animation:fadeUp .2s ease}

.undo-bar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;margin-top:12px;padding:11px 14px;border-radius:13px;
  background:var(--card);border:1px solid var(--line);
  font-size:13.5px;color:var(--sub);text-align:left;
}
.undo-bar b{color:var(--accent);font-weight:650;flex:0 0 auto}
.undo-bar:active{background:var(--card2)}

.result{text-align:center;padding:26px 18px}
.result .ring{
  width:132px;height:132px;margin:0 auto 16px;border-radius:50%;
  display:grid;place-items:center;position:relative;
}
.result .ring .inner{
  position:absolute;inset:17px;border-radius:50%;background:var(--card);
  display:grid;place-items:center;flex-direction:column;
  box-shadow:var(--shadow);
}
.result .ring b{font-size:30px;font-weight:750;line-height:1.1}
.result .ring span{font-size:11.5px;color:var(--sub)}
.result h2{font-size:19px;font-weight:700;margin-bottom:4px}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}
.res-grid div{background:var(--card2);border-radius:var(--r-sm);padding:11px 6px}
.res-grid b{display:block;font-size:18px;font-weight:700}
.res-grid span{font-size:11.5px;color:var(--sub)}

/* ---------- 统计 ---------- */
.stat-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat-card{background:var(--card);border-radius:var(--r);padding:14px;
  box-shadow:var(--shadow);border:1px solid transparent}
html[data-theme="dark"] .stat-card{border-color:var(--line)}
.stat-card b{font-size:23px;font-weight:750;display:block;line-height:1.25}
.stat-card span{font-size:12px;color:var(--sub)}
.chapbar{margin-bottom:11px}
.chapbar .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:8px}
.chapbar .t em{font-style:normal;color:var(--sub);font-size:12px;white-space:nowrap}
.chapbar .bar{margin-top:0}
.chapbar .bar i.low{background:linear-gradient(90deg,var(--bad),#ff9aa6)}
.chapbar .bar i.mid{background:linear-gradient(90deg,var(--warn),#ffcd8a)}
.chapbar .bar i.high{background:linear-gradient(90deg,var(--ok),#5ee0b8)}

/* 打卡热力图 */
.heat{display:grid;grid-template-columns:repeat(13,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:3.5px;background:var(--heat0);display:block}
.heat i.l1{background:#cfc7fb}
.heat i.l2{background:#a99bf7}
.heat i.l3{background:#8b7cf6}
.heat i.l4{background:#6c5ce7}

/* ---------- 弹层 ---------- */
.sheet-mask{
  position:fixed;inset:0;z-index:100;background:rgba(15,16,23,.45);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadeIn .18s;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet-mask[hidden]{display:none}
.sheet{
  width:100%;max-width:640px;max-height:88dvh;max-height:88vh;
  background:var(--bg2);border-radius:22px 22px 0 0;
  display:flex;flex-direction:column;
  animation:slideUp .26s cubic-bezier(.2,.9,.3,1);
  padding-bottom:env(safe-area-inset-bottom);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.sheet-hd{
  display:flex;align-items:center;gap:8px;padding:14px 12px 10px 18px;
  border-bottom:1px solid var(--line);flex:0 0 auto;
}
.sheet-hd h2{flex:1;font-size:16.5px;font-weight:650}
.sheet-bd{overflow-y:auto;padding:14px 16px 22px;-webkit-overflow-scrolling:touch}

/* ---------- 表单控件 ---------- */
.field{margin-bottom:14px}
.field > label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px;font-weight:550}
.field textarea,.field input[type=text],.field input[type=number]{
  width:100%;background:var(--card);border:1.5px solid var(--line);
  border-radius:var(--r-sm);padding:11px 12px;font:inherit;font-size:16px;
  color:var(--text);resize:vertical;outline:none;
}
.field textarea{min-height:150px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:16px;line-height:1.65}
.field textarea:focus,.field input:focus{border-color:var(--accent)}
.sw{
  display:flex;align-items:center;gap:12px;padding:13px 15px;position:relative;
}
.sw + .sw::before{content:"";position:absolute;left:15px;right:0;top:0;height:1px;background:var(--line)}
.sw .grow b{font-weight:550;font-size:15px;display:block}
.sw .grow span{font-size:12.5px;color:var(--sub);display:block}
.toggle{
  width:50px;height:30px;border-radius:99px;background:var(--line);flex:0 0 auto;
  position:relative;transition:background .18s;
}
.toggle::after{
  content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.28);transition:transform .18s;
}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(20px)}

.seg{display:flex;background:var(--card2);border-radius:11px;padding:3px;gap:2px}
html[data-theme="dark"] .seg{background:#252838}
.seg button{
  flex:1;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:550;color:var(--sub);
}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

.empty{text-align:center;padding:52px 20px;color:var(--sub)}
.empty .ic{font-size:42px;margin-bottom:12px;opacity:.55}
.empty b{display:block;font-size:16px;color:var(--text);font-weight:600;margin-bottom:5px}
.empty p{font-size:13.5px;line-height:1.7}

.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--sub);
  white-space:nowrap}
html[data-theme="dark"] .tag{background:#262938}
.tag.hot{background:var(--bad-soft);color:var(--bad)}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 76px);
  transform:translateX(-50%);z-index:200;
  background:rgba(28,30,40,.94);color:#fff;
  padding:10px 18px;border-radius:99px;font-size:14px;font-weight:500;
  box-shadow:var(--shadow-lg);max-width:84vw;text-align:center;
  animation:fadeUp .2s;
}
.toast[hidden]{display:none}

/* 背诵卡（名词解释 / 简答） */
.recite-hint{
  margin-top:12px;border-radius:var(--r);padding:22px 14px;text-align:center;
  border:1.5px dashed var(--line);color:var(--sub);font-size:14px;
}
.self-eval{display:flex;gap:9px;margin-top:12px}

/* 选项乱序/题号小徽标 */
.q-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

@media (min-width:641px){
  #app{border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:0 0 60px rgba(0,0,0,.07)}
}

</style>
</head>
<body>

<div id="app">

  <!-- ============ 顶栏 ============ -->
  <header class="topbar" id="topbar">
    <button class="tb-btn" id="tbBack" hidden aria-label="返回">‹</button>
    <h1 class="tb-title" id="tbTitle">心理学刷题</h1>
    <button class="tb-btn" id="tbMore" aria-label="更多">⋯</button>
  </header>

  <!-- ============ 主内容 ============ -->
  <main id="view" class="view"></main>

  <!-- ============ 底部导航 ============ -->
  <nav class="tabbar" id="tabbar">
    <button class="tab is-on" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10v16H5.5A1.5 1.5 0 0 1 4 18.5v-13Zm10-1.5h4.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H14V4Z"/></svg>
      <span>刷题</span>
    </button>
    <button class="tab" data-tab="recite">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="7" width="13" height="13.5" rx="3"/><path d="M7.5 4.5h10a3 3 0 0 1 3 3v10"/></svg>
      <span>背诵</span>
    </button>
    <button class="tab" data-tab="wrong">
      <svg viewBox="0 0 24 24"><path d="M12 3.2 2.6 19.4a1 1 0 0 0 .87 1.5h17.06a1 1 0 0 0 .87-1.5L12 3.2Zm0 5.3v5.2m0 2.6v.1"/></svg>
      <span>错题本</span>
    </button>
    <button class="tab" data-tab="stats">
      <svg viewBox="0 0 24 24"><path d="M4 20h16M7 20V11m5 9V5m5 15v-6"/></svg>

    { t:'multiple', q:'关于感觉后像，下列说法正确的有（　）。', o:['后像分为正后像和负后像','正后像与原刺激性质相同','负后像与原刺激性质相反','后像是感觉适应的一种形式'], a:[0,1,2], e:'后像是刺激停止作用后暂时保留的感觉印象，分正后像与负后像；它与感觉适应不同。' },
    { t:'judge', q:'感觉阈限越低，说明感受性越高。', a:true, e:'感受性与感觉阈限成反比。' },
    { t:'term', q:'感觉适应', a:'感觉适应是指刺激物持续作用于感受器而使感受性发生变化的现象。它既可使感受性提高（如暗适应），也可使感受性降低（如明适应、嗅觉适应）。适应现象在嗅觉、味觉、肤觉中表现明显，痛觉几乎不发生适应。' },
    { t:'short', q:'简述视觉的几种主要理论。', a:'1）三色说（杨—赫尔姆霍兹）：视网膜上有红、绿、蓝三种感受器，不同比例兴奋产生不同颜色，能解释颜色混合和色盲，但不能解释负后像与互补色现象；\n2）对立过程理论（黑林四色说）：视觉系统存在黑白、红绿、黄蓝三对对立机制，能解释负后像、互补色和色盲成对出现的现象；\n3）现代观点：视网膜水平上为三色机制，视觉通路和中枢水平上为对立机制，二者结合更完整。' }
  ]
},

    { t:'single', q:'“仁者见仁，智者见智”体现了知觉的（　）。', o:['整体性','理解性','恒常性','选择性'], a:1, e:'知觉的理解性指人以过去的知识经验为依据解释当前知觉对象，不同经验导致不同理解。' },

    { t:'short', q:'简述深度知觉的线索。', a:'深度知觉的线索分为两类：\n1）单眼线索（肌肉线索与物理线索）：调节（晶状体曲度变化）、线条透视、空气透视、遮挡（对象重叠）、纹理梯度、运动视差、相对高度、明暗阴影、熟悉大小；\n2）双眼线索：双眼视差（最主要的深度线索）、双眼辐合（辐辏）。\n其中双眼视差是深度知觉最重要的线索。' },
    { t:'short', q:'简述错觉产生的主要理论解释。', a:'1）眼动理论：认为错觉与眼球运动有关，如缪勒—莱耶错觉由视线沿箭头方向扫描幅度不同造成；\n2）神经抑制作用理论：认为轮廓的相互抑制作用使神经兴奋中心位移，导致方向或长度知觉歪曲；\n3）深度加工和恒常性误用理论：认为错觉是把二维图形当作三维物体进行深度加工、错误运用大小恒常性的结果；\n4）常性误用说还强调过去经验在错觉中的作用。' }

    { t:'single', q:'快速眼动睡眠（REM）阶段最典型的特点是（　）。', o:['脑电呈现高幅慢波','眼动活跃，梦境多发生于此阶段','肌肉紧张度最高','呼吸心率最平稳'], a:1, e:'REM 睡眠时眼球快速运动、脑电接近清醒状态，梦境大多发生在该阶段。' },

    { t:'term', q:'随意后注意', a:'随意后注意又称有意后注意，是指有自觉目的但不需要意志努力的注意。它通常是在随意注意的基础上，随着对活动的兴趣和熟练程度的提高而转化形成的。随意后注意是注意的一种高级状态，既能保持高度集中，又能减少疲劳，对高效学习和创造性活动具有重要意义。' },
    { t:'short', q:'简述注意的分配及其实现条件。', a:'注意分配是指在同一时间内把注意指向不同的对象或活动。其实现条件有：\n1）同时进行的活动中，至少有一种是个体已经相当熟练或自动化了的；\n2）同时进行的几种活动之间应有一定的内在联系，形成活动系统；\n3）注意的分配能力可以通过训练提高，其水平因人而异；\n4）注意分配是相对的、有条件的，不能无限制进行。' }

    { t:'single', q:'艾宾浩斯研究遗忘所用的记忆材料是（　）。', o:['无意义音节','单词表','故事','图形'], a:0, e:'艾宾浩斯使用无意义音节（如 ZOF），目的是排除已有知识经验的影响；测量指标是节省率。' },
    { t:'single', q:'先学习的内容对后学习内容的干扰称为（　）。', o:['前摄抑制','倒摄抑制','消退抑制','超限抑制'], a:0, e:'前摄抑制是前面学习材料对后继学习的干扰；倒摄抑制是后面学习材料对先前学习的干扰。', tag:['高频','易错'] },
    { t:'single', q:'系列位置效应中，中间部分材料记忆效果最差，主要原因是（　）。', o:['只受前摄抑制影响','只受倒摄抑制影响','同时受前摄抑制和倒摄抑制影响','材料本身难度大'], a:2, e:'中间部分同时受前后材料的双重干扰，因而回忆率最低。首因效应源于长时记忆，近因效应源于短时记忆。', tag:['高频'] },
    { t:'single', q:'过度学习到（　）时记忆效果最好。', o:['100%','150%','200%','300%'], a:1, e:'研究表明学习程度达到 150%（即过度学习 50%）时保持效果最佳，超过则效率下降。', tag:['高频'] },
    { t:'single', q:'“舌尖现象”支持遗忘的（　）。', o:['衰退说','干扰说','提取失败说','压抑说'], a:2, e:'舌尖现象说明信息仍存储在长时记忆中，只是暂时提取不出来，支持提取失败说。', tag:['易错'] },
    { t:'single', q:'图尔文把长时记忆分为（　）。', o:['情景记忆和语义记忆','外显记忆和内隐记忆','陈述性记忆和程序性记忆','形象记忆和逻辑记忆'], a:0, e:'图尔文按记忆内容分为情景记忆（个人经历的事件）和语义记忆（一般知识与规律）。' },
    { t:'single', q:'测量内隐记忆常用的方法是（　）。', o:['自由回忆','再认测验','启动效应（如词干补笔）','线索回忆'], a:2, e:'内隐记忆多用间接测量，如词干补笔、知觉辨认、词汇判断等启动效应任务。', tag:['高频','易错'] },
    { t:'single', q:'提出记忆的加工水平说的心理学家是（　）。', o:['克雷克和洛克哈特','阿特金森和希夫林','图尔文','巴德利'], a:0, e:'加工水平说认为记忆效果取决于加工的深度，语义（深层）加工比物理（浅层）加工的记忆效果更好。', tag:['高频'] },
    { t:'multiple', q:'关于遗忘的理论，下列说法正确的有（　）。', o:['衰退说认为遗忘是记忆痕迹随时间自然消退','干扰说认为遗忘是学习和回忆之间相互干扰的结果','压抑说认为遗忘是由动机性压抑造成的','提取失败说认为遗忘是因为缺乏适当的提取线索','压抑说认为遗忘是记忆痕迹在大脑中永久消失'], a:[0,1,2,3], e:'压抑说强调动机和情绪的作用，并不认为痕迹永久消失；认为痕迹随时间自然消退的是衰退说。' },
    { t:'multiple', q:'下列属于内隐记忆测量任务的有（　）。', o:['词干补笔','知觉辨认','自由回忆','再认'], a:[0,1], e:'词干补笔和知觉辨认属于间接测量（内隐记忆）；自由回忆和再认属于直接测量（外显记忆）。' },
    { t:'judge', q:'复述是使信息从短时记忆进入长时记忆的重要条件。', a:true, e:'复述分机械复述（保持性复述）和精细复述（整合性复述），后者更有利于长时记忆的保持。' },
    { t:'term', q:'组块', a:'组块是指把若干小单位的信息联合成较大单位的信息加工过程或结果。组块能有效扩大短时记忆的容量。米勒提出短时记忆的容量为 7±2 个组块，通过组块化，人可以在有限的容量内记住更多的信息。组块的大小依赖个体的知识经验。' },
    { t:'short', q:'简述艾宾浩斯遗忘曲线及其对复习的启示。', a:'1）艾宾浩斯以无意义音节为材料，用节省法测量保持量，绘制出遗忘曲线；\n2）规律：遗忘进程先快后慢，呈负加速，20 分钟遗忘约 42%，一天后遗忘约 66%，之后趋于平缓；\n3）启示：①及时复习，趁热打铁；②合理分配复习时间，采用分散复习优于集中复习；③适当过度学习（150% 最佳）；④材料意义化、采用多种编码方式；⑤注意前后摄抑制的影响，合理安排复习顺序。' },
    { t:'short', q:'简述影响遗忘进程的因素。', a:'1）学习材料的性质：有意义材料遗忘慢于无意义材料，形象材料慢于抽象材料；\n2）材料的数量与难度：数量越多、难度越大，遗忘越快；\n3）学习程度：过度学习 150% 时保持效果最好；\n4）学习的序列位置：中间部分受双重抑制，遗忘最快；\n5）学习方式：分布学习优于集中学习，主动回忆优于单纯重复；\n6）个体的动机、情绪与需要：动机过强或情绪紧张都会影响记忆保持。' }
  ]
},

/* ------------------------------ 第 7 章 ------------------------------ */
{
  name: '第7章 思维',
  items: [
    { t:'single', q:'思维是人脑对客观事物（　）的反映。', o:['直接的和个别的','间接的和概括的','整体的和具体的','表面的和片面的'], a:1, e:'思维的两个基本特征是间接性和概括性。', tag:['高频','必考'] },
    { t:'single', q:'思维的概括性表现在（　）。', o:['通过已知推断未知','反映一类事物的共同本质特征和事物间的内在联系','思维活动的速度快','思维内容的形象性'], a:1, e:'概括性指反映同类事物的共同本质特征与事物之间的规律性联系；间接性指借助已有知识经验推知事物。', tag:['易错'] },
    { t:'single', q:'根据问题解决的不同方向，思维可分为（　）。', o:['聚合思维和发散思维','动作思维和形象思维','直觉思维和分析思维','常规思维和创造思维'], a:0, e:'吉尔福特按思维方向分为聚合思维（辐合思维）和发散思维（辐射思维）。' },
    { t:'single', q:'提出概念形成的假设检验说的心理学家是（　）。', o:['布鲁纳','罗斯','维果茨基','皮亚杰'], a:0, e:'布鲁纳等人提出假设检验说，认为概念形成是个体主动提出假设并加以验证的过程。' },
    { t:'single', q:'认为概念主要以“最典型的样例”来表征的理论是（　）。', o:['特征表说','原型说','层次网络模型','激活扩散模型'], a:1, e:'罗斯提出原型说，认为概念由原型（最具代表性的样例）及范畴成员的相似性程度来表征。' },
    { t:'single', q:'“所有的 A 都是 B，所有的 B 都是 C，所以所有的 A 都是 C”，这属于（　）。', o:['归纳推理','演绎推理','类比推理','直觉推理'], a:1, e:'从一般前提推出特殊结论的推理是演绎推理；三段论推理是最典型的演绎推理。' },
    { t:'single', q:'在问题解决中，能够保证问题得到解决但效率较低的策略是（　）。', o:['算法策略','启发式策略','手段—目的分析','逆向搜索'], a:0, e:'算法策略是逐一尝试所有可能方案，能保证找到答案但费时费力；启发式策略效率高但不保证成功。' },
    { t:'single', q:'“手段—目的分析”这一启发式策略的提出者是（　）。', o:['纽厄尔和西蒙','邓克尔','迈尔','苛勒'], a:0, e:'纽厄尔和西蒙在问题空间理论基础上提出手段—目的分析，即不断缩小当前状态与目标状态的差异。' },
    { t:'single', q:'“把一个大问题分解为若干子目标，逐个解决”体现的策略是（　）。', o:['算法策略','手段—目的分析','爬山法','逆向搜索'], a:1, e:'手段—目的分析通过设置子目标、逐步缩小差距来解决问题；爬山法则是逐步向目标靠近。' },
    { t:'single', q:'“功能固着”这一概念来自（　）的实验。', o:['邓克尔的蜡烛问题','苛勒的黑猩猩实验','卢钦斯的量水实验','华生的白鼠实验'], a:0, e:'邓克尔用蜡烛问题说明功能固着：个体只看到物体的通常用途，难以发现新用途，妨碍问题解决。', tag:['高频','易错'] },
    { t:'single', q:'卢钦斯的量水实验主要说明（　）对问题解决的影响。', o:['定势','功能固着','动机强度','原型启发'], a:0, e:'卢钦斯用三个水罐问题证明定势（思维惯性）既可能促进也可能妨碍问题解决。', tag:['高频'] },
    { t:'single', q:'耶克斯—多德森定律表明，解决中等难度问题时效率最高的动机水平是（　）。', o:['越高越好','中等强度','越低越好','与动机无关'], a:1, e:'中等强度的动机最有利于问题解决；问题越难，最佳动机水平越低。', tag:['高频'] },
    { t:'single', q:'创造性思维的核心成分是（　）。', o:['聚合思维','发散思维','直觉思维','动作思维'], a:1, e:'吉尔福特认为发散思维是创造性思维的核心，其指标为流畅性、变通性（灵活性）和独特性。', tag:['高频'] },
    { t:'multiple', q:'发散思维的三个基本指标是（　）。', o:['流畅性','变通性','独特性','准确性'], a:[0,1,2], e:'流畅性（数量多）、变通性（类别广）、独特性（新颖程度）是发散思维的三个指标。' },
    { t:'multiple', q:'影响问题解决的心理因素有（　）。', o:['知识经验','定势','功能固着','动机与情绪状态','实验场所的装潢风格'], a:[0,1,2,3], e:'还包括原型启发、酝酿效应、个性特征等。原型启发指从其他事物中获得解决问题的途径。' },
    { t:'judge', q:'思维是人脑对客观事物的间接的、概括的反映。', a:true, e:'这是思维的定义，间接性和概括性是思维的两个基本特征。' },
    { t:'term', q:'问题空间', a:'问题空间是纽厄尔和西蒙在信息加工观点下提出的概念，指问题解决者对所要解决的问题的一切可能的认识状态，包括初始状态、目标状态和中间状态（算子）。问题解决的过程就是在问题空间中进行搜索，从初始状态经过一系列算子达到目标状态的过程。' },
    { t:'short', q:'简述影响问题解决的主要因素。', a:'1）知识经验：专家图式丰富，能更快抓住问题实质；\n2）定势：由先前活动形成的心理准备状态，既可促进也可妨碍问题解决（卢钦斯量水实验）；\n3）功能固着：只看到物体的通常功能，妨碍发现新用途（邓克尔蜡烛问题）；\n4）动机强度：中等强度动机最有利，问题越难最佳动机水平越低（耶克斯—多德森定律）；\n5）情绪状态：紧张焦虑会干扰思路；\n6）原型启发与酝酿效应：从其他事物获得启示、暂时搁置后突然想到办法；\n7）个性特征：独立、自信、灵活的人更容易解决问题。' }
  ]
},

/* ------------------------------ 第 8 章 ------------------------------ */
{
  name: '第8章 语言',
  items: [
    { t:'single', q:'语言的层次结构中，最小的语音单位是（　）。', o:['音位','语素','词','句子'], a:0, e:'语言结构层次由小到大为：音位→语素→词→句子。音位是最小的语音单位，语素是最小的音义结合单位。' },
    { t:'single', q:'语言最小的音义结合单位是（　）。', o:['音位','语素','音节','词'], a:1, e:'语素是语言中最小的音义结合单位，如“书”“们”。', tag:['易错'] },
    { t:'single', q:'提出“语言获得装置”（LAD）和转换生成语法的语言学家是（　）。', o:['斯金纳','乔姆斯基','皮亚杰','沃尔夫'], a:1, e:'乔姆斯基提出先天语言能力说，认为儿童具有先天的语言获得装置和普遍语法。', tag:['高频'] },
    { t:'single', q:'认为语言是通过强化和模仿习得的心理学家是（　）。', o:['斯金纳','乔姆斯基','班杜拉','皮亚杰'], a:0, e:'斯金纳用强化原理解释语言习得，属于后天学习理论；乔姆斯基属于先天论。' },
    { t:'single', q:'提出语言相对假说（语言影响思维）的语言学家是（　）。', o:['乔姆斯基','沃尔夫','布鲁纳','维果茨基'], a:1, e:'沃尔夫假说（萨丕尔—沃尔夫假说）认为语言结构影响甚至决定人的思维方式和认知。' },
    { t:'single', q:'“花园路径句”研究主要涉及（　）。', o:['语音知觉','词汇识别','句子理解','语言产生'], a:2, e:'花园路径句指读者最初按一种句法结构理解、后发现被“引人歧途”的句子，用于研究句子理解中的句法分析。' },
    { t:'multiple', q:'语言的基本特征包括（　）。', o:['创造性','结构性','意义性','指代性','完全的生物遗传性'], a:[0,1,2,3], e:'语言的特征包括创造性、结构性、意义性、指代性、社会性与个体性；语言是社会文化现象，不是纯粹的生物遗传产物。' },
    { t:'judge', q:'语言和言语是同一概念。', a:false, e:'语言是社会现象，是音义结合的词汇和语法系统；言语是个体运用语言进行交际的过程，二者有区别又密切联系。', tag:['易错'] },
    { t:'term', q:'语言获得装置', a:'语言获得装置是乔姆斯基在转换生成语法理论中提出的概念，指儿童天生具有的一种语言习得机制。它使儿童能够在有限的语言输入下迅速掌握本族语的语法规则，生成无限的句子。该概念支持语言获得的先天论观点。' }
  ]
},

/* ------------------------------ 第 9 章 ------------------------------ */
{
  name: '第9章 动机',

    { t:'single', q:'动机是引起和维持个体活动，并使活动朝向某一目标的（　）。', o:['外部刺激','内部心理过程或内部动力','生理反应','行为结果'], a:1, e:'动机是一种内部心理过程（内部动力），由需要与诱因共同作用产生。', tag:['高频'] },
    { t:'single', q:'动机产生的基础是（　）。', o:['需要','情绪','能力','意志'], a:0, e:'需要是有机体内部不平衡状态，是动机产生的基础；诱因是引起动机的外部条件。' },
    { t:'single', q:'马斯洛需要层次理论中最高层次的需要是（　）。', o:['安全需要','归属与爱的需要','尊重需要','自我实现需要'], a:3, e:'马斯洛把需要由低到高分为生理、安全、归属与爱、尊重、自我实现五个层次（早期还包括认知和审美需要）。', tag:['高频','必考'] },
    { t:'single', q:'马斯洛认为低级需要满足后，高级需要才会出现，这体现了需要层次的（　）。', o:['层次性和递进性','整体性','动力性','社会性'], a:0, e:'马斯洛认为需要按层次由低到高发展，低层次需要基本满足后高层次需要才会占主导，但这种递进并非绝对的。' },
    { t:'single', q:'耶克斯—多德森定律表明（　）。', o:['动机越强效率越高','动机强度与工作效率呈倒 U 形曲线','动机越弱效率越高','动机与效率无关'], a:1, e:'中等强度动机工作效率最高；任务越容易，最佳动机水平越高；任务越难，最佳动机水平越低。', tag:['高频','必考'] },
    { t:'single', q:'提出成就动机理论并区分“追求成功”与“避免失败”两种倾向的心理学家是（　）。', o:['马斯洛','阿特金森','韦纳','班杜拉'], a:1, e:'阿特金森提出成就动机模型，认为个体在成就情境中同时存在追求成功和避免失败两种动机倾向，二者强度差决定行为。' },
    { t:'single', q:'韦纳的归因理论中，能力属于（　）因素。', o:['内部的、稳定的、不可控的','内部的、不稳定的、可控的','外部的、稳定的、不可控的','外部的、不稳定的、不可控的'], a:0, e:'韦纳从内外、稳定性、可控性三个维度分析，能力=内部稳定不可控，努力=内部不稳定可控，任务难度=外部稳定不可控，运气=外部不稳定不可控。', tag:['高频','必考'] },
    { t:'single', q:'把失败归因于（　）最不利于后续努力。', o:['努力不够','能力不足','运气不好','题目太难'], a:1, e:'把失败归因于内部、稳定、不可控的能力，容易产生习得性无助，降低后续努力。' },
    { t:'single', q:'“习得性无助”最早由（　）在动物实验中提出。', o:['塞利格曼','班杜拉','罗特','韦纳'], a:0, e:'塞利格曼在狗的逃避电击实验中提出习得性无助，指反复失败后形成的无能为力、放弃努力的状态。', tag:['高频'] },

    { t:'single', q:'在实验中对自变量之外的变量采用“抵消平衡”处理，主要是为了（　）。', o:['消除练习效应和顺序效应','增加被试的数量','提高实验的外部效度','简化统计方法'], a:0, e:'抵消平衡（如 ABBA、拉丁方）用来平衡顺序效应和练习效应，尤其在被试内设计中广泛使用。' },
    { t:'single', q:'实验内部效度的含义是（　）。', o:['实验结果能推广到其他情境的程度','实验中自变量与因变量之间因果关系的确定程度','测量工具的准确程度','统计检验的功效'], a:1, e:'内部效度指实验所证实的自变量与因变量之间因果关系的明确程度。', tag:['高频','必考'] },
    { t:'single', q:'实验外部效度的含义是（　）。', o:['实验结果能够推广到其他被试、情境和时间的程度','实验设计是否严谨','自变量操纵是否有效','统计结论是否可靠'], a:0, e:'外部效度即实验结果的可推广性（生态效度是其重要方面）。' },
    { t:'single', q:'“被试在实验期间因时间推移而自然发生的变化”威胁内部效度的因素是（　）。', o:['历史因素','成熟因素','测验因素','统计回归'], a:1, e:'成熟指被试随时间的自然成长或变化；历史指实验期间发生的与实验无关的外部事件。', tag:['高频','易错'] },
    { t:'single', q:'“前测对被试产生了练习或敏感化作用，从而影响后测成绩”属于（　）的威胁。', o:['历史因素','成熟因素','测验因素','仪器因素'], a:2, e:'测验效应（练习效应）是前后测设计中常见的威胁，可用所罗门四组设计检验。' },
    { t:'single', q:'“极端分数的被试在后续测量中自然向平均数回归”属于（　）威胁。', o:['统计回归','成熟因素','被试流失','选择偏差'], a:0, e:'统计回归指极端分数个体的测量结果在后续测量中趋向平均值的现象。', tag:['高频'] },
    { t:'single', q:'在有前后测的设计中，控制测验效应最有效的设计是（　）。', o:['单组前后测设计','所罗门四组设计','时间序列设计','拉丁方设计'], a:1, e:'所罗门四组设计通过加入无前测的组，可以分离前测与实验处理的交互作用。', tag:['高频','必考'] },
    { t:'single', q:'主试因知道被试的分组而对结果产生期望，这属于（　）。', o:['安慰剂效应','实验者效应（罗森塔尔效应）','霍桑效应','顺序效应'], a:1, e:'实验者效应由主试的期望引起；安慰剂效应由被试的期望引起；霍桑效应由被观察（受关注）引起。', tag:['高频','易错'] },
    { t:'single', q:'控制实验者效应最常用的方法是（　）。', o:['双盲实验','增加被试量','采用拉丁方设计','使用问卷法'], a:0, e:'双盲实验中主试和被试都不知道分组情况，可同时控制实验者效应和安慰剂效应。' },
    { t:'single', q:'“被试因为知道自己正在被研究而改变行为”的现象称为（　）。', o:['安慰剂效应','霍桑效应','实验者效应','要求特征'], a:1, e:'霍桑效应源于梅奥的霍桑实验，指被试因意识到被观察而改变行为表现的倾向。' },
    { t:'multiple', q:'影响内部效度的主要因素包括（　）。', o:['历史与成熟','测验与仪器','统计回归','被试选择与流失','实验者发表论文的数量'], a:[0,1,2,3], e:'坎贝尔和斯坦利总结的影响内部效度的因素还包括选择与成熟等因素的交互作用。' },
    { t:'multiple', q:'影响外部效度的因素主要有（　）。', o:['被试样本的代表性不足','实验情境的人为性','测量的反作用（测验效应）','统计方法的复杂性'], a:[0,1,2], e:'外部效度受样本代表性、实验情境的人为性（生态效度）以及测量的反作用影响。' },
    { t:'multiple', q:'控制额外变量的常用方法有（　）。', o:['随机化法','恒定法与消除法','平衡法（抵消平衡）','统计控制法与双盲设计','尽量增加被试的性别比例'], a:[0,1,2,3], e:'还有配对法（等组匹配法）等。' },
    { t:'judge', q:'内部效度高就一定能保证外部效度高。', a:false, e:'内部效度是外部效度的必要但非充分条件，二者之间常存在紧张关系，需要权衡。', tag:['易错'] },
    { t:'term', q:'内部效度', a:'内部效度是指实验中自变量与因变量之间因果关系的确定程度，即实验结果能被明确归因于自变量操纵的程度。影响内部效度的因素主要有历史、成熟、测验、仪器、统计回归、被试选择偏差、被试流失以及各种交互作用。提高内部效度的关键是随机分配被试、严格控制额外变量。' },
    { t:'term', q:'额外变量', a:'额外变量又称无关变量或控制变量，是指实验中除自变量以外一切可能影响因变量的变量。如果不对其加以控制，就可能与自变量混淆，干扰对因果关系的推断。控制额外变量的方法主要有消除法、恒定法、随机化法、平衡法（抵消平衡）、配对法和统计控制法等。' },
    { t:'short', q:'简述控制额外变量的主要方法。', a:'1）消除法：把额外变量从实验中排除，如用隔音室消除噪声；\n2）恒定法：使额外变量在实验过程中保持恒定不变，如同一时间、同一实验室、同一主试；\n3）随机化法：随机分配被试到各实验条件、随机安排实验顺序，是控制额外变量的最有效方法之一；\n4）平衡法（抵消平衡法）：在被试内设计中用 ABBA 或拉丁方平衡顺序效应和练习效应；\n5）配对法（等组匹配）：把在有关变量上相同或相近的被试配成对，再随机分配到不同组；\n6）统计控制法：用协方差分析等统计手段排除额外变量的影响；\n7）双盲设计：同时控制实验者效应和安慰剂效应。' }
  ]
},

  name: '第3章 实验设计',

    { t:'single', q:'被试间设计的主要优点是（　）。', o:['避免了练习效应和顺序效应','节省被试','个体差异小','设计简单易行'], a:0, e:'被试间设计中每名被试只接受一种处理，避免了练习和疲劳效应；缺点是存在个体差异带来的组间不等。', tag:['高频','易错'] },
    { t:'single', q:'被试内设计的主要缺点是（　）。', o:['需要大量被试','个体差异混淆结果','容易产生练习效应和顺序效应','不能使用统计检验'], a:2, e:'被试内设计每名被试接受所有处理，需用抵消平衡法控制顺序效应。', tag:['高频','必考'] },
    { t:'single', q:'在被试内设计中，用“ABBA”安排实验顺序是为了平衡（　）。', o:['个体差异','顺序效应和练习效应','统计回归','被试流失'], a:1, e:'ABBA 法属于抵消平衡，可平衡线性变化的练习效应和顺序效应。' },
    { t:'single', q:'当实验条件超过两个时，平衡顺序效应最常用的方法是（　）。', o:['ABBA 法','拉丁方设计','随机化设计','双盲设计'], a:1, e:'拉丁方设计用 n×n 方阵安排 n 个条件的顺序，使每个条件在每一位置上出现一次。', tag:['高频','必考'] },
    { t:'single', q:'“随机区组设计”中，区组的作用是（　）。', o:['增加被试量','把个体差异从误差中分离出来，提高实验灵敏度','消除练习效应','提高外部效度'], a:1, e:'随机区组设计按被试的某种特征分成区组，使区组内的被试尽可能同质，从而减少误差变异。', tag:['高频'] },
    { t:'single', q:'同时操纵两个或两个以上自变量的实验设计称为（　）。', o:['单因素设计','多因素实验设计','准实验设计','小样本设计'], a:1, e:'多因素设计可以考察各个自变量的主效应以及它们之间的交互作用。' },
    { t:'single', q:'在 2×2 因素设计中，若一个自变量的效应在另一个自变量的不同水平上不同，则说明存在（　）。', o:['主效应','交互作用','简单效应','顺序效应'], a:1, e:'交互作用指一个自变量的效应依赖于另一个自变量的水平。', tag:['高频','必考'] },
    { t:'single', q:'2×3 因素设计中共有（　）个实验处理。', o:['5','6','8','9'], a:1, e:'因素设计的处理数等于各水平数的乘积，2×3=6。' },
    { t:'single', q:'混合设计是指（　）。', o:['在一个实验中既包含被试间变量又包含被试内变量','同时使用两种统计方法','被试随机分组','结合了实验法和观察法'], a:0, e:'混合设计中至少有一个自变量是被试间变量，另一个是被试内变量。', tag:['高频'] },
    { t:'single', q:'前实验设计的共同特点是（　）。', o:['能随机分配被试','缺乏控制组或不能随机分配被试，难以做出因果推论','外部效度最高','必须使用拉丁方'], a:1, e:'前实验设计包括单组后测、单组前后测和固定组比较设计，控制不严。' },
    { t:'single', q:'准实验设计与真实验设计的关键区别是（　）。', o:['是否使用统计方法','是否能够随机分配被试','是否设置对照组','是否操纵自变量'], a:1, e:'准实验设计不能随机分配被试，只能使用现成的组，因此难以排除选择偏差。', tag:['高频','易错'] },
    { t:'single', q:'下列属于准实验设计的是（　）。', o:['不等组前后测设计','所罗门四组设计','随机区组设计','拉丁方设计'], a:0, e:'不等组前后测设计、时间序列设计、平衡组设计等属于准实验设计。' },
    { t:'single', q:'所罗门四组设计的四个组分别是（　）。', o:['两个有前测的实验组和控制组、两个无前测的实验组和控制组','四个不同年龄组','四个不同的实验条件','三个实验组和一个控制组'], a:0, e:'所罗门四组设计可以同时检验前测效应、实验处理效应及其交互作用。', tag:['高频','必考'] },
    { t:'single', q:'小样本设计（如 ABA 设计）最常应用于（　）。', o:['临床心理学和特殊教育研究','大规模的问卷调查','因素分析研究','流行病学研究'], a:0, e:'ABA、ABAB、多基线设计等小样本设计适用于难以获得大量被试的临床和特殊教育研究。', tag:['高频'] },
    { t:'single', q:'在 ABA 设计中，第二个 A 阶段的作用是（　）。', o:['检验处理效应是否可以逆转（撤除处理后的基线）','提高外部效度','增加被试','消除个体差异'], a:0, e:'ABA 设计中 A 为基线期，B 为处理期，第二个 A 是撤除处理后的基线，用于验证处理效果。' },
    { t:'single', q:'“天花板效应”是指（　）。', o:['因变量指标过于容易，几乎所有被试都取得高分，无法区分处理差异','因变量指标过难，所有被试都得零分','被试中途退出实验','仪器出现故障'], a:0, e:'天花板效应和地板效应都会导致因变量无法敏感反映自变量变化，属于测量指标的灵敏性问题。', tag:['高频','易错'] },
    { t:'single', q:'练习效应属于（　）。', o:['自变量','因变量','额外变量','中介变量'], a:2, e:'练习效应（顺序效应）是需要控制的额外变量，在被试内设计中使用抵消平衡法控制。' },
    { t:'multiple', q:'真实验设计的基本条件包括（　）。', o:['随机分配被试到各实验条件','有明确的自变量操纵','设置控制组或对照条件','控制额外变量','被试人数必须超过 100 人'], a:[0,1,2,3], e:'随机化、控制、操纵是实验法的三大要素；被试人数取决于效应量和统计效力要求，并非固定标准。' },
    { t:'multiple', q:'下列属于被试内设计优点的有（　）。', o:['节省被试数量','消除了个体差异的影响','统计检验的敏感性更高','不存在任何误差'], a:[0,1,2], e:'被试内设计仍需注意顺序效应、练习效应和延续效应（迁移效应）。' },
    { t:'multiple', q:'控制顺序效应的常用方法有（　）。', o:['ABBA 抵消平衡','拉丁方设计','随机化顺序','把所有被试都按同一顺序施测'], a:[0,1,2], e:'固定顺序会混淆顺序效应与处理效应，不能用于控制。' },
    { t:'judge', q:'因素实验中若两个自变量没有交互作用，说明它们各自独立地影响因变量。', a:true, e:'主效应可以相加即为无交互作用，此时各因素对因变量的影响是独立的。' },
    { t:'judge', q:'准实验设计也可以做出明确的因果推论。', a:false, e:'准实验设计不能随机分配被试，难以排除选择等额外变量的影响，因果推论需谨慎。' },
    { t:'term', q:'被试内设计', a:'被试内设计又称重复测量设计、组内设计，是指每名被试接受全部实验处理的实验设计。其优点是节省被试、消除个体差异、统计检验敏感性高；缺点是容易产生练习效应、疲劳效应、顺序效应和延续效应，需要用抵消平衡法（ABBA、拉丁方设计）加以控制。适用于练习效果较小或可通过平衡控制的实验。' },
    { t:'term', q:'交互作用', a:'交互作用是指在一个多因素实验中，一个自变量的效应在另一个自变量的不同水平上表现出差异的现象。当存在交互作用时，说明自变量并非各自独立地影响因变量，必须结合简单效应分析才能准确解释结果。交互作用可分为序次性交互作用和非序次性交互作用。' },
    { t:'short', q:'简述比较被试间设计和被试内设计的优缺点。', a:'被试间设计（独立组设计）：每名被试只接受一种处理。优点：被试只接受一种处理，不存在练习效应、疲劳效应和顺序效应；适用于不可重复测量的实验（如学习某技能）。缺点：需要较多被试；个体差异会成为误差来源，可能造成组间不等，需要用随机分配或配对法控制。\n被试内设计（重复测量设计）：每名被试接受所有处理。优点：节省被试；消除个体差异；统计检验敏感性更高。缺点：存在练习效应、疲劳效应、顺序效应、延续效应，需用 ABBA、拉丁方、随机化等抵消平衡法控制。' }
  ]
},

/* ------------------------------ 第 4 章 ------------------------------ */
{
  name: '第4章 反应时法',
  items: [
    { t:'single', q:'反应时是指（　）。', o:['从刺激呈现到被试做出反应之间的时间间隔','被试完成实验的总时间','刺激呈现的持续时间','实验者记录数据的时间'], a:0, e:'反应时是刺激—反应之间的时间间隔，是心理学实验中最常用的因变量之一。', tag:['高频','必考'] },
    { t:'single', q:'唐德斯的 A 反应时是指（　）。', o:['简单反应时','选择反应时','辨别反应时','基线反应时'], a:0, e:'A 反应时即简单反应时，一个刺激对应一个反应，无需辨别和选择。', tag:['高频','必考'] },
    { t:'single', q:'唐德斯的 B 反应时是指（　）。', o:['简单反应时','选择反应时','辨别反应时','复杂反应时'], a:1, e:'B 反应时（选择反应时）有多个刺激、多个反应，被试需辨别刺激并选择相应反应。' },
    { t:'single', q:'唐德斯的 C 反应时是指（　）。', o:['简单反应时','选择反应时','辨别反应时','分辨反应时'], a:2, e:'C 反应时（辨别反应时）有多个刺激但只有一个反应，只需辨别不需要选择。' },
    { t:'single', q:'用减数法分离“辨别所需时间”，其计算方式是（　）。', o:['B 反应时 − C 反应时','C 反应时 − A 反应时','B 反应时 − A 反应时','A 反应时 + C 反应时'], a:1, e:'C−A = 辨别时间；B−C = 选择时间；B−A = 辨别+选择时间。', tag:['高频','必考'] },
    { t:'single', q:'用减数法分离“选择所需时间”，其计算方式是（　）。', o:['C 反应时 − A 反应时','B 反应时 − C 反应时','B 反应时 − A 反应时','A 反应时 − C 反应时'], a:1, e:'B−C 得到反应选择所需的时间。' },
    { t:'single', q:'提出加因素法（加法反应时）的心理学家是（　）。', o:['唐德斯','斯滕伯格','波斯纳','汉密尔顿'], a:1, e:'斯滕伯格提出加因素法，通过寻找有交互作用还是相互独立的加工阶段，确定心理加工的序列结构。', tag:['高频','必考'] },
    { t:'single', q:'加因素法的基本逻辑是：如果两个因素的效应相互独立（可以相加），则它们影响（　）。', o:['同一个加工阶段','不同的加工阶段','同一反应的输出','无关变量'], a:1, e:'效应可相加说明作用于不同阶段；若存在交互作用则说明作用于同一阶段。这是加因素法的核心逻辑。', tag:['高频','必考'] },
    { t:'single', q:'斯滕伯格用加因素法研究短时记忆的提取，提出的提取方式是（　）。', o:['平行扫描','完全系列扫描','自动停止系列扫描','随机扫描'], a:1, e:'实验发现反应时随识记项目数线性增加，且“是”反应与“否”反应时间相同，说明是完全系列扫描。', tag:['高频','必考'] },
    { t:'single', q:'一般来说，简单反应时最快的感觉通道是（　）。', o:['视觉','听觉','触觉','痛觉'], a:1, e:'听觉的简单反应时最短（约 140—160ms），视觉次之（约 180—200ms）。', tag:['易错'] },
    { t:'single', q:'反应时实验中为避免被试“抢答”（假反应），常采用的方法是（　）。', o:['增加刺激强度','插入侦察试验（catch trial）','延长实验时间','减少被试数量'], a:1, e:'插入不要求反应的侦察试验，若被试在侦察试验中仍做出反应则说明存在假反应倾向。', tag:['高频'] },
    { t:'single', q:'随着刺激强度的增加，反应时的变化规律一般是（　）。', o:['逐渐缩短，但缩短的速度越来越慢','逐渐延长','保持不变','先延长后缩短'], a:0, e:'刺激强度越大反应时越短，但存在渐进极限；强度过高时反而可能因不适而延长。' },
    { t:'single', q:'下列因素中，会使反应时延长的是（　）。', o:['刺激强度增加','被试准备充分','刺激的复杂程度增加','练习次数增加'], a:2, e:'刺激越复杂、可选择的反应越多，反应时越长。练习和准备会缩短反应时。' },
    { t:'multiple', q:'影响反应时的因素有（　）。', o:['刺激强度与复杂程度','刺激呈现方式与感觉通道','被试的准备状态和练习程度','被试的动机、年龄和个体差异','实验者记录数据的书写速度'], a:[0,1,2,3], e:'此外还有实验环境的干扰、反应方式（按键、口头）等；主试记录速度由仪器和程序自动完成，不影响被试的反应时。' },
    { t:'multiple', q:'关于加因素法的特点，下列说法正确的有（　）。', o:['以反应时为指标','通过考察因素间的交互作用来确定加工阶段','由斯滕伯格提出','适用于确定心理加工的序列结构','可以直接测定每个加工阶段的绝对时间'], a:[0,1,2,3], e:'加因素法的局限在于只能确定加工的序列结构，难以精确估计每个阶段的绝对时程，能测出阶段绝对时程的是减数法。' },
    { t:'judge', q:'减数法可以直接测量出某个心理加工阶段的绝对时间。', a:true, e:'减数法通过两个任务反应时的差值，得到特定加工阶段（如辨别、选择）的持续时间。' },
    { t:'term', q:'减数法', a:'减数法又称相减法，由荷兰生理学家唐德斯提出，是最早用反应时分析心理过程的方法之一。其基本逻辑是：如果一种任务比另一种任务多包含一个特定的心理加工阶段，那么两种任务的反应时之差就是该阶段所需的时间。唐德斯设计了 A、B、C 三种反应时，通过 C−A 得到辨别时间，B−C 得到选择时间。' },
    { t:'term', q:'加因素法', a:'加因素法又称加法反应时，由斯滕伯格提出。其基本逻辑是：如果两个实验因素影响的是同一个加工阶段，那么它们的效应存在交互作用；如果影响的是不同的加工阶段，那么它们的效应相互独立、可以相加。通过寻找可相加的因素，可以确定心理加工过程中的各个阶段及其序列结构。' },
    { t:'short', q:'简述唐德斯 ABC 反应时及其应用。', a:'唐德斯设计了三种反应时：\nA 反应时（简单反应时）：只有一个刺激、一个反应，无需辨别和选择，是最基础的反应时间；\nB 反应时（选择反应时）：有多个刺激、多个反应，被试需要辨别刺激并选择相应的反应；\nC 反应时（辨别反应时）：有多个刺激但只有一个反应，被试只需辨别刺激，不需选择反应。\n应用（减数法）：C−A = 辨别所需时间；B−C = 选择所需时间；B−A = 辨别与选择共需时间。这样就把复杂的反应分解为不同心理加工阶段的时程。' }
  ]
},

    { t:'single', q:'用信号检测论处理实验结果时绘制的 ROC 曲线，其纵轴和横轴分别是（　）。', o:['击中率和虚报率','d′ 和 β','平均值和标准差','正确率和反应时'], a:0, e:'ROC 曲线的纵轴是击中率，横轴是虚报率，曲线下的面积可作为辨别力的指标。' },

    { t:'multiple', q:'关于韦伯定律，下列说法正确的有（　）。', o:['公式为 ΔI/I = K','K 值称为韦伯常数（分数）','只适用于中等强度的刺激','表明差别阈限与原刺激强度成正比','K 值在所有感觉通道中完全相同'], a:[0,1,2,3], e:'当刺激强度过弱或过强时韦伯定律不成立；韦伯常数因感觉通道和刺激性质而异，并非普遍相同的常数。' },
    { t:'judge', q:'信号检测论认为阈限不是一个固定的值，而是一个受被试判断标准影响的统计决策过程。', a:true, e:'信号检测论用统计决策的观点解释阈限，认为观察者根据信号与噪声的概率分布和判断标准做出决策。' },
    { t:'term', q:'信号检测论', a:'信号检测论由坦纳和斯韦茨等人引入心理学，用统计决策的理论研究人在不确定情境下的辨别过程。它把被试的判断分解为两个方面：一是辨别力指数 d′，反映被试区分信号与噪声的客观能力；二是判断标准 β（或反应偏向），反映被试在报告“有信号”或“无信号”时的倾向。信号检测论的最大贡献在于把感受性和反应偏向分离开来，弥补了传统心理物理法把二者混在一起的不足。' },
    { t:'short', q:'简述最小变化法、恒定刺激法和平均差误法的主要区别。', a:'1）最小变化法：刺激按等距的渐增序列和渐减序列交替呈现，记录被试反应由“无”到“有”的转折点；主要误差是习惯误差和期望误差，用交替呈现控制；适用于绝对阈限和差别阈限的测定。\n2）恒定刺激法：选取 5—7 个固定刺激，每个刺激随机呈现多次（一般 50—200 次），用直线内插法求出 50% 觉察率的刺激强度作为阈限；测量精确度较高，适用面广。\n3）平均差误法（调整法）：被试自己调整比较刺激使之与标准刺激相等，以调整结果的平均误差作为差别阈限的估计；操作方便，但可能产生动作误差和空间误差。' }
  ]
},

    { t:'term', q:'视觉悬崖', a:'视觉悬崖是吉布森和沃克设计的一种研究婴儿深度知觉的装置。装置上覆盖玻璃，中间有一道视觉上的“悬崖”（一侧为浅区，一侧有落差形成深区）。实验发现 6 个月左右的婴儿在爬到深区边缘时表现出犹豫、回避或心率变化，说明婴儿在会爬之前就已经具有深度知觉。该实验是深度知觉发展研究的经典实验。' },
    { t:'short', q:'简述用心理物理学方法测量大小恒常性的基本思路。', a:'1）在标准距离呈现标准刺激，在另一距离呈现比较刺激，让被试调整比较刺激的大小，使之与标准刺激看起来相等；\n2）计算恒常性指标：布伦斯威克比率 BR = 知觉大小 / 客体实际大小对应的视网膜像大小，邵勒斯比率 TR = (lg 知觉大小 − lg 视网膜像大小) / (lg 实际大小 − lg 视网膜像大小)；\n3）结果解释：若 BR = 1，表示完全恒常；若 BR 等于视网膜像大小的比值，表示无恒常性；一般介于两者之间，说明存在部分恒常性。' }

  items: [
    { t:'single', q:'彻里（Cherry）用双耳分听任务研究的是（　）。', o:['选择性注意','记忆容量','问题解决','情绪唤醒'], a:0, e:'双耳分听是研究选择性注意的经典范式，要求被试只听一个通道（追随耳）的内容。', tag:['高频','必考'] },
    { t:'single', q:'布罗德本特基于双耳分听实验提出的注意模型是（　）。', o:['过滤器模型','衰减模型','后期选择模型','资源分配模型'], a:0, e:'布罗德本特的过滤器模型认为注意是一个“全或无”的过滤器，位于知觉的早期阶段。', tag:['高频','必考'] },
    { t:'single', q:'特瑞斯曼提出的注意模型是（　）。', o:['过滤器模型','衰减模型','后期选择模型','多资源模型'], a:1, e:'特瑞斯曼的衰减模型认为非注意通道的信息并非完全被阻断，而是被衰减，阈值低的词仍可被识别（如“鸡尾酒会效应”）。' },
    { t:'single', q:'“鸡尾酒会效应”最能说明（　）。', o:['未注意的信息也能得到一定程度的加工','注意是完全全或无的过滤器','人不能同时加工多个通道','注意与记忆无关'], a:0, e:'在嘈杂的鸡尾酒会上能听到别人提到自己的名字，支持特瑞斯曼的衰减模型。', tag:['高频'] },
    { t:'single', q:'波斯纳（Posner）的线索范式主要用于研究（　）。', o:['注意的空间定向','短时记忆容量','概念形成','道德判断'], a:0, e:'波斯纳用空间线索提示被试目标可能出现的位置，通过有效线索与无效线索的反应时差异研究注意的空间定向。', tag:['高频','必考'] },
    { t:'single', q:'在波斯纳线索范式中，当线索与目标位置不一致时，被试的反应时（　）。', o:['比线索有效时更短','比线索有效时更长','与线索有效时相同','无法预测'], a:1, e:'无效线索条件下需要重新定向注意，反应时更长，其差值反映注意转移的成本。' },
    { t:'single', q:'返回抑制（IOR）通常出现在线索与目标之间的时间间隔（SOA）为（　）时。', o:['小于 150 毫秒','大于 300 毫秒','恰好 0 毫秒','不存在条件限制'], a:1, e:'SOA 较短（约小于 150ms）时出现易化效应，SOA 较长（大于约 300ms）时出现返回抑制。', tag:['高频','易错'] },
    { t:'single', q:'返回抑制是指（　）。', o:['对先前注意过的位置的加工变慢','对新颖刺激的加工变快','注意不能转移','对熟悉刺激的反应变快'], a:0, e:'返回抑制是波斯纳发现的现象，被认为有助于提高视觉搜索效率，避免注意反复回到已搜索过的位置。' },
    { t:'single', q:'特瑞斯曼和格拉德提出的解释视觉搜索的模型是（　）。', o:['特征整合理论','过滤器模型','衰减模型','双加工理论'], a:0, e:'特征整合理论认为特征搜索是平行加工（快速、不受项目数影响），联合搜索需要集中注意进行系列加工（项目越多越慢）。', tag:['高频','必考'] },
    { t:'single', q:'在视觉搜索实验中，搜索效率不受项目数量影响的搜索类型是（　）。', o:['特征搜索','联合搜索','系列搜索','自由搜索'], a:0, e:'特征搜索的搜索函数斜率接近零；联合搜索的斜率显著大于零。' },
    { t:'single', q:'Stroop 任务主要研究（　）。', o:['自动化加工与注意控制','短时记忆容量','深度知觉','概念形成'], a:0, e:'Stroop 效应指对颜色命名时，字义与颜色不一致会造成干扰，反映了自动化加工与注意控制之间的冲突。', tag:['高频','必考'] },
    { t:'single', q:'注意瞬脱（attentional blink）是指（　）。', o:['在快速序列呈现中，被试在识别第一个目标后短时间内难以识别第二个目标','注意持续时间过短','注意范围过小','注意易于分散'], a:0, e:'注意瞬脱反映了注意在时间维度上的有限性，是研究时间选择性注意的重要现象。', tag:['高频'] },
    { t:'multiple', q:'关于选择性注意的理论模型，下列匹配正确的有（　）。', o:['布罗德本特——过滤器模型','特瑞斯曼——衰减模型','多伊奇——后期选择模型','卡尼曼——资源限制理论','特瑞斯曼——特征整合理论'], a:[0,1,2,3], e:'特征整合理论虽然也由特瑞斯曼提出，但它解释的是视觉搜索中的特征捆绑，属于注意的知觉整合理论，不属于通道选择模型。' },
    { t:'multiple', q:'研究注意的常用实验范式有（　）。', o:['双耳分听','空间线索范式','视觉搜索范式','Stroop 任务','延迟满足范式'], a:[0,1,2,3], e:'延迟满足范式研究的是自我控制与延迟满足能力，不属于注意研究范式。此外还有注意瞬脱、负启动、持续性操作测验等。' },
    { t:'judge', q:'特征整合理论认为联合搜索需要集中注意的参与。', a:true, e:'特征整合理论认为注意的作用是把分散的特征“捆绑”成完整的客体，因此联合搜索需要注意参与。' },
    { t:'term', q:'返回抑制', a:'返回抑制是波斯纳在空间线索范式中发现的现象：当线索与目标之间的时间间隔（SOA）较长（约大于 300 毫秒）时，出现在先前被线索提示过的位置上的目标，其反应时反而比未被提示位置上的目标更长，即对已注意过的位置出现加工抑制。返回抑制被认为有助于提高视觉搜索的效率，使注意不再反复回到已搜索过的位置。' },
    { t:'term', q:'注意瞬脱', a:'注意瞬脱是雷蒙德等人发现的现象：在快速序列视觉呈现（RSVP）任务中，被试正确识别第一个目标（T1）之后，在大约 200—500 毫秒的时间窗口内，对第二个目标（T2）的识别正确率显著下降，就像注意“眨眼”了一样。它反映了注意在时间维度上的容量限制，是研究时间性选择性注意的重要范式。' },
    { t:'short', q:'简述特征整合理论的基本观点及其实验证据。', a:'1）基本观点（特瑞斯曼和格拉德）：视觉加工早期是平行的、以特征为单位（颜色、方向、大小等）的加工；特征处于“自由漂浮”状态，需要通过集中注意把它们捆绑成完整的客体。因此特征搜索是平行加工，联合搜索是系列加工。\n2）实验证据：视觉搜索实验表明，特征搜索的反应时不随干扰项数量增加而显著增加（斜率接近零）；而联合搜索的反应时随项目数线性增加（斜率明显大于零）。\n3）意义：该理论较好地解释了视觉搜索的两种模式，也说明了注意在知觉整合中的“捆绑”作用。' }
  ]
},

/* ------------------------------ 第 8 章 ------------------------------ */
{
  name: '第8章 记忆实验',
  items: [
    { t:'single', q:'艾宾浩斯研究遗忘时使用的测量方法是（　）。', o:['节省法','部分报告法','再认法','自由回忆法'], a:0, e:'节省法通过比较再次学习所需时间（或次数）与初次学习所需时间，计算节省率作为保持量的指标。', tag:['高频','必考'] },
    { t:'single', q:'斯柏林用（　）证明了视觉感觉记忆的存在。', o:['部分报告法','全部报告法','节省法','加因素法'], a:0, e:'全部报告法报告约 4—5 个项目，部分报告法按声音提示报告某一行，可回忆约 9—10 个项目，说明感觉记忆容量远大于报告出来的数量。', tag:['高频','必考'] },
    { t:'single', q:'斯滕伯格研究短时记忆提取所用的方法是（　）。', o:['加因素法','减数法','节省法','部分报告法'], a:0, e:'斯滕伯格用加因素法研究短时记忆的提取方式，得出完全系列扫描的结论。', tag:['高频'] },
    { t:'single', q:'皮特森和皮特森用分散注意法证明（　）。', o:['短时记忆在无复述条件下约 15—30 秒后迅速遗忘','长时记忆可以永久保持','感觉记忆容量有限','内隐记忆的存在'], a:0, e:'被试在识记后立即做减数运算以防止复述，结果回忆率随间隔延长而迅速下降。', tag:['高频','必考'] },
    { t:'single', q:'用“部分报告法”测得的图像记忆保持时间大约是（　）。', o:['1 秒以内','5 秒','30 秒','1 分钟'], a:0, e:'图像记忆保持极短（约 0.25—1 秒），声像记忆稍长（约 2—4 秒）。' },
    { t:'single', q:'康拉德（Conrad）的实验要求被试回忆字母序列，结果发现错误多为（　）。', o:['形状相似的字母混淆','发音相似的字母混淆','语义相近的词混淆','随机错误'], a:1, e:'如把 B 记成 P、V，说明短时记忆以听觉（言语听觉）编码为主。', tag:['高频','易错'] },
    { t:'single', q:'巴德利和希奇提出的工作记忆模型中，负责语音信息暂时存储与复述的成分是（　）。', o:['语音环路','视空间模板','中央执行系统','情景缓冲器'], a:0, e:'工作记忆包括中央执行系统、语音环路、视空间模板和情景缓冲器（后补）。', tag:['高频','必考'] },
    { t:'single', q:'工作记忆中负责注意控制和资源协调的核心成分是（　）。', o:['语音环路','视空间模板','中央执行系统','语义编码器'], a:2, e:'中央执行系统是工作记忆的核心，负责注意资源的分配、策略选择和各子系统间的协调。' },
    { t:'single', q:'测量词语内隐记忆常用的实验任务是（　）。', o:['词干补笔','自由回忆','再认判断','系列回忆'], a:0, e:'词干补笔、知觉辨认等间接测量任务的成绩反映内隐记忆，且不受外显记忆损伤的显著影响。', tag:['高频','必考'] },
    { t:'single', q:'DRM 范式主要用于研究（　）。', o:['错误记忆','内隐记忆','前瞻记忆','程序记忆'], a:0, e:'DRM 范式（Deese-Roediger-McDermott）让被试学习与某个关键词高度关联的词表，结果被试会错误地“回忆”出未呈现过的关键诱饵词。', tag:['高频'] },
    { t:'single', q:'洛夫特斯的目击者记忆研究主要说明了（　）。', o:['事后误导信息可以改变或歪曲记忆','目击者记忆非常准确','记忆不会受外界影响','儿童的记忆优于成人'], a:0, e:'洛夫特斯的研究表明，事后提供的误导信息会整合到原有记忆中，产生错误记忆，对司法实践有重要启示。', tag:['高频'] },
    { t:'single', q:'“前瞻记忆”是指（　）。', o:['对未来要执行某项行为的记忆','对过去事件的记忆','对技能的记忆','对知识的记忆'], a:0, e:'前瞻记忆指记住在未来某个时间或情境下完成预定动作，如“记得下午三点吃药”。' },
    { t:'single', q:'加工水平说认为，决定记忆效果的关键因素是（　）。', o:['加工深度（语义加工优于物理加工）','复述次数','呈现时间','被试数量'], a:0, e:'克雷克和洛克哈特认为记忆效果取决于信息加工的深度，语义加工的记忆效果最好。', tag:['高频'] },
    { t:'single', q:'在系列位置效应的实验中，若在回忆前增加一段分心任务，则（　）。', o:['近因效应减弱或消失，首因效应基本不受影响','首因效应消失，近因效应增强','两者都消失','两者都不变'], a:0, e:'近因效应依赖短时记忆，分心任务清空了短时记忆，所以近因效应减弱；首因效应源于长时记忆，不受影响。', tag:['高频','易错'] },
    { t:'multiple', q:'内隐记忆的测量任务主要有（　）。', o:['词干补笔','知觉辨认','词汇判断','自由回忆'], a:[0,1,2], e:'自由回忆、线索回忆、再认属于外显记忆的直接测量。' },
    { t:'multiple', q:'关于工作记忆模型，下列说法正确的有（　）。', o:['由巴德利和希奇提出','包括中央执行系统','包括语音环路和视空间模板','后来补充了情景缓冲器','工作记忆与短时记忆是同一概念，没有区别'], a:[0,1,2,3], e:'工作记忆强调信息的主动加工与暂时存储，是被动短时记忆概念的扩展，二者并不等同。' },
    { t:'judge', q:'内隐记忆通常不能用传统的自由回忆和再认任务直接测量。', a:true, e:'内隐记忆是无意识的，需要通过词干补笔等间接测量任务的启动效应来反映。' },
    { t:'term', q:'节省法', a:'节省法是艾宾浩斯研究记忆与遗忘时使用的测量方法。具体做法是：先学习材料并记录达到完全背诵所需的次数（或时间），间隔一段时间后再次学习同样的材料，记录重新达到完全背诵所需的次数（或时间）。两次所需次数之差与初次所需次数的比值即为节省率（节省百分数），用它作为保持量的指标。节省率越高，说明保持得越好。' },
    { t:'term', q:'DRM 范式', a:'DRM 范式是研究错误记忆的经典实验范式，由迪斯、罗迪格和麦克德莫特提出。实验中向被试呈现若干组词表，每个词表由与某个未呈现的关键诱饵词（如“床”）高度语义关联的词（如“枕头、睡觉、做梦”）组成。学习后进行自由回忆或再认测验，结果发现被试会以很高的比例错误地“回忆”或“再认”从未呈现过的关键诱饵词。该范式说明记忆并非对经验的精确复制，而具有建构性。' },
    { t:'short', q:'简述内隐记忆与外显记忆的区别及其测量方法。', a:'区别：\n1）意识性：外显记忆是有意识的、需要有意提取的记忆；内隐记忆是无意识的，个体并未意识到自己在使用过去的经验；\n2）测量方式：外显记忆用直接测量（自由回忆、线索回忆、再认）；内隐记忆用间接测量（词干补笔、知觉辨认、词汇判断等启动效应任务）；\n3）影响因素：外显记忆受加工水平、学习意向影响较大，内隐记忆受这些因素影响较小；\n4）发展：外显记忆随年龄发展较慢，内隐记忆出现较早；\n5）神经基础：外显记忆依赖海马和内侧颞叶，内隐记忆更多依赖皮层相关区域和基底节等。' }
  ]
},

/* ------------------------------ 第 9 章 ------------------------------ */
{
  name: '第9章 思维与语言实验',
  items: [
    { t:'single', q:'卢钦斯的量水实验（水罐问题）主要说明（　）对问题解决的影响。', o:['定势','功能固着','原型启发','动机强度'], a:0, e:'实验中先做可以套用固定公式的问题，再做更简单的问题，许多被试仍沿用旧方法，说明定势的作用。', tag:['高频','必考'] },
    { t:'single', q:'邓克尔的蜡烛问题是研究（　）的经典实验。', o:['功能固着','定势','顿悟','迁移'], a:0, e:'被试必须把火柴盒当作平台来使用，只看到盒子的“装火柴”功能就难以解决问题，说明功能固着。', tag:['高频','必考'] },
    { t:'single', q:'沃森的四卡片选择任务（选择任务）用于研究（　）。', o:['假设检验中的证实倾向','短时记忆容量','注意分配','情绪唤醒'], a:0, e:'多数被试倾向于选择证实规则的卡片而忽略证伪的卡片，说明推理中的证实偏差。', tag:['高频'] },
    { t:'single', q:'布鲁纳等人用人工概念形成实验研究的核心问题是（　）。', o:['概念形成的策略与假设检验过程','记忆的容量','知觉的恒常性','情绪的维度'], a:0, e:'布鲁纳提出假设检验说，发现被试在概念形成中会运用聚焦策略、扫描策略等。' },
    { t:'single', q:'河内塔问题主要考察（　）。', o:['问题解决中的计划与策略','词汇识别','面部表情识别','感觉阈限'], a:0, e:'河内塔是经典的问题解决任务，考察被试如何通过手段—目的分析等策略在问题空间中搜索解决方案。' },
    { t:'single', q:'“原型启发”在问题解决中是指（　）。', o:['从其他事物中得到启示找到解决办法','把问题分成子目标','逐一尝试所有方案','把问题搁置一段时间'], a:0, e:'原型启发如鲁班从草叶得到启示发明锯子，是创造性解决问题的重要途径。' },
    { t:'single', q:'“酝酿效应”是指（　）。', o:['暂时搁置问题后反而容易找到解决办法','长时间思考一定能解决问题','问题越难解决越快','合作比独立解决问题更有效'], a:0, e:'酝酿效应说明思维定势的暂时解除有助于问题的解决。' },

/* ==========================================================================
   心理学刷题 · 样式
   移动优先 / 单栏 / 安全区域适配 / 深色模式
   ========================================================================== */

:root{
  --bg:#f4f5f9;
  --bg2:#ffffff;
  --card:#ffffff;
  --card2:#f7f8fc;
  --line:#e8eaf1;
  --text:#1b1d24;
  --sub:#878d9d;
  --accent:#6c5ce7;
  --accent-2:#8b7cf6;
  --accent-soft:#eeebfd;
  --ok:#11b888;
  --ok-soft:#e2f7f0;
  --bad:#f4586a;
  --bad-soft:#fdeaed;
  --warn:#f2a33c;
  --warn-soft:#fdf2e2;
  --heat0:#eaecf3;
  --shadow:0 2px 10px rgba(28,30,55,.06);
  --shadow-lg:0 12px 40px rgba(28,30,55,.16);
  --r:16px;
  --r-sm:10px;
  --topH:52px;
  --tabH:56px;
  --fs:16px;
}

html[data-theme="dark"]{
  --bg:#0f1017;
  --bg2:#161822;
  --card:#1a1c26;
  --card2:#212330;
  --line:#2b2e3d;
  --text:#e9ebf3;
  --sub:#868ca0;
  --accent:#8b7cf6;
  --accent-2:#a394ff;
  --accent-soft:#262045;
  --ok:#2ed3a0;
  --ok-soft:#123027;
  --bad:#ff6f80;
  --bad-soft:#3a1b22;
  --warn:#f5b055;
  --warn-soft:#3a2c17;
  --heat0:#272a3a;
  --shadow:0 2px 10px rgba(0,0,0,.3);
  --shadow-lg:0 16px 44px rgba(0,0,0,.5);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-size:var(--fs);
  font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  line-height:1.6;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
ul{margin:0;padding:0;list-style:none}

#app{
  display:flex;flex-direction:column;
  height:100dvh;height:100vh;
  max-width:640px;margin:0 auto;
  background:var(--bg);
  position:relative;
}

/* ---------- 顶栏 ---------- */
.topbar{
  flex:0 0 auto;height:calc(var(--topH) + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;gap:4px;
  padding-left:6px;padding-right:6px;
  background:color-mix(in srgb,var(--bg2) 88%,transparent);
  backdrop-filter:saturate(160%) blur(14px);
  -webkit-backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid var(--line);
  position:relative;z-index:20;
}
.tb-title{flex:1;text-align:center;font-size:17px;font-weight:650;letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-btn{
  width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;
  font-size:22px;line-height:1;color:var(--text);
  flex:0 0 auto;
}
.tb-btn:active{background:var(--card2)}
.tb-btn[hidden]{display:none}

/* ---------- 视图容器 ---------- */
.view{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:14px 14px calc(var(--tabH) + env(safe-area-inset-bottom) + 18px);
  scroll-behavior:smooth;
}
.view.no-tab{padding-bottom:calc(env(safe-area-inset-bottom) + 16px)}

/* ---------- 底部导航 ---------- */
.tabbar{
  flex:0 0 auto;
  display:flex;
  height:calc(var(--tabH) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--bg2) 92%,transparent);
  backdrop-filter:saturate(160%) blur(16px);
  -webkit-backdrop-filter:saturate(160%) blur(16px);
  border-top:1px solid var(--line);
  position:relative;z-index:20;
}
.tabbar[hidden]{display:none}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--sub);font-size:11px;font-weight:550;
  transition:color .15s;
}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.tab.is-on{color:var(--accent)}
.tab.is-on svg{stroke-width:2}

/* ---------- 通用块 ---------- */
.sec{margin-bottom:14px}
.sec-hd{display:flex;align-items:baseline;justify-content:space-between;
  padding:0 4px 8px;gap:8px}
.sec-hd h2{font-size:15px;font-weight:650}
.sec-hd .more{font-size:13px;color:var(--accent);font-weight:550}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  border:1px solid transparent}
html[data-theme="dark"] .card{border-color:var(--line)}
.muted{color:var(--sub)}
.tiny{font-size:12.5px}
.p0{padding:0!important}
.mt10{margin-top:10px}
.mt16{margin-top:16px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.center{text-align:center}

/* ---------- 首页头部 ---------- */
.hero{
  border-radius:20px;padding:18px;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 55%,#a78bfa 100%);
  color:#fff;box-shadow:0 10px 26px -10px rgba(108,92,231,.7);
  position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-40px;top:-50px;width:160px;height:160px;
  border-radius:50%;background:rgba(255,255,255,.14);
}
.hero::before{
  content:"";position:absolute;right:30px;bottom:-70px;width:120px;height:120px;
  border-radius:50%;background:rgba(255,255,255,.10);
}
.hero h1{font-size:20px;font-weight:700;letter-spacing:.3px;position:relative}
.hero p{font-size:13px;opacity:.9;margin-top:4px;position:relative}
.hero-stats{display:flex;gap:18px;margin-top:14px;position:relative}
.hero-stats div{text-align:left}
.hero-stats b{display:block;font-size:20px;font-weight:700;line-height:1.2}
.hero-stats span{font-size:11.5px;opacity:.85}

/* ---------- 科目卡 ---------- */
.subj{
  display:block;width:100%;text-align:left;
  background:var(--card);border-radius:var(--r);
  padding:15px;box-shadow:var(--shadow);
  border:1px solid transparent;
}
html[data-theme="dark"] .subj{border-color:var(--line)}
.subj:active{transform:scale(.985)}
.subj-top{display:flex;align-items:center;gap:11px}
.subj-icon{
  width:42px;height:42px;border-radius:13px;flex:0 0 auto;
  display:grid;place-items:center;font-size:20px;
  background:var(--accent-soft);color:var(--accent);
}
.subj b{font-size:16px;font-weight:650;display:block}
.subj .meta{font-size:12.5px;color:var(--sub);margin-top:1px}
.subj-ring{margin-left:auto;text-align:right;flex:0 0 auto}
.subj-ring em{font-style:normal;font-size:17px;font-weight:700;color:var(--accent)}
.subj-ring span{display:block;font-size:11px;color:var(--sub)}

.bar{height:6px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:12px}
html[data-theme="dark"] .bar{background:#2a2d3c}
.bar i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s}

/* ---------- 快捷宫格 ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid.g4{grid-template-columns:repeat(4,1fr);gap:8px}
.tile{
  background:var(--card);border-radius:var(--r-sm);padding:13px 12px;
  box-shadow:var(--shadow);text-align:left;
  border:1px solid transparent;
  display:flex;flex-direction:column;gap:2px;
}
html[data-theme="dark"] .tile{border-color:var(--line)}
.tile:active{transform:scale(.97)}
.tile b{font-size:14.5px;font-weight:600;display:block}
.tile span{font-size:11.5px;color:var(--sub)}
.tile .ic{font-size:19px;margin-bottom:5px}
.tile.g4{padding:12px 6px;align-items:center;text-align:center}
.tile.g4 b{font-size:11.5px;font-weight:550}

/* ---------- 列表行 ---------- */
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  overflow:hidden;border:1px solid transparent}
html[data-theme="dark"] .list{border-color:var(--line)}
.li{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 15px;position:relative;background:transparent;
}
.li + .li::before{
  content:"";position:absolute;left:15px;right:0;top:0;height:1px;background:var(--line);
}
.li:active{background:var(--card2)}
.li .ic{width:24px;text-align:center;font-size:17px;flex:0 0 auto}
.li .grow b{font-weight:550;font-size:15px;display:block}
.li .grow span{font-size:12.5px;color:var(--sub);display:block}
.li .val{color:var(--sub);font-size:13.5px;flex:0 0 auto}
.li .chev{color:#c6cad6;font-size:18px;flex:0 0 auto;line-height:1}
.li[disabled]{opacity:.5}

/* ---------- 章节选择 ---------- */
.chap-hd{
  position:sticky;top:0;z-index:5;margin:0 -14px 8px;padding:8px 18px 7px;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-size:12.5px;font-weight:650;color:var(--sub);
  display:flex;justify-content:space-between;align-items:baseline;
}
.chap-hd em{font-style:normal;font-weight:500;color:var(--sub);opacity:.8}
.chap-dot{width:6px;height:6px;border-radius:99px;background:var(--line);flex:0 0 auto}
.chap-dot.done{background:var(--ok)}
.chap-dot.mid{background:var(--warn)}

/* ---------- 答题界面 ---------- */
.q-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pill{
  font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;
  background:var(--accent-soft);color:var(--accent);white-space:nowrap;
}
.pill.gray{background:var(--card2);color:var(--sub)}
html[data-theme="dark"] .pill.gray{background:#262938}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.q-count{margin-left:auto;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}

.q-stem{
  background:var(--card);border-radius:var(--r);padding:16px 15px;
  box-shadow:var(--shadow);font-size:16.5px;line-height:1.72;font-weight:500;
  border:1px solid transparent;
}
html[data-theme="dark"] .q-stem{border-color:var(--line)}
.q-stem .idx{color:var(--accent);font-weight:700;margin-right:2px}

.opts{margin-top:12px;display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  background:var(--card);border-radius:13px;padding:13px 14px;
  box-shadow:var(--shadow);border:1.5px solid transparent;
  transition:border-color .15s,background .15s;
  font-size:15.5px;line-height:1.55;
}
html[data-theme="dark"] .opt{border-color:var(--line)}
.opt .key{
  width:23px;height:23px;border-radius:50%;flex:0 0 auto;margin-top:1px;
  display:grid;place-items:center;font-size:12.5px;font-weight:700;
  background:var(--card2);color:var(--sub);
}
html[data-theme="dark"] .opt .key{background:#2a2d3c}
.opt .txt{flex:1}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.picked .key{background:var(--accent);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .key{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);color:#fff}
.opt[disabled]{opacity:1}

.answer-box{
  margin-top:12px;border-radius:var(--r);padding:14px;
  background:var(--card);box-shadow:var(--shadow);border:1px solid transparent;
  animation:fadeUp .22s ease;
}
html[data-theme="dark"] .answer-box{border-color:var(--line)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.answer-box .verdict{
  display:flex;align-items:center;gap:7px;font-weight:650;font-size:15px;margin-bottom:8px;
}
.answer-box .verdict.ok{color:var(--ok)}
.answer-box .verdict.bad{color:var(--bad)}
.ans-line{font-size:14.5px;font-weight:600;margin-bottom:8px}
.ans-line b{color:var(--accent)}
.expl{
  font-size:14.5px;line-height:1.75;color:var(--text);opacity:.92;
  padding-top:10px;border-top:1px dashed var(--line);
}
.expl .lbl{color:var(--sub);font-size:12.5px;font-weight:650;display:block;margin-bottom:2px}
.ref-ans{
  font-size:15px;line-height:1.85;white-space:pre-wrap;
  background:var(--card2);border-radius:var(--r-sm);padding:12px;
  margin-top:8px;
}
html[data-theme="dark"] .ref-ans{background:#212433}

/* 答题底部操作条 */
.q-actions{
  position:sticky;bottom:0;z-index:6;margin:16px -14px 0;
  padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);
  display:flex;gap:9px;align-items:center;
  background:linear-gradient(to top,var(--bg) 62%,transparent);
}
.btn{
  border-radius:13px;padding:13px 16px;font-size:15.5px;font-weight:600;
  text-align:center;flex:1;
  background:var(--card);box-shadow:var(--shadow);
  border:1px solid transparent;
}
html[data-theme="dark"] .btn{border-color:var(--line)}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  box-shadow:0 8px 20px -8px rgba(108,92,231,.8)}
.btn.ghost{background:transparent;box-shadow:none;border:1.5px solid var(--line);color:var(--sub)}
.btn.sm{padding:10px 14px;font-size:14px}
.btn:disabled{opacity:.45;pointer-events:none}
.icon-btn{
  width:46px;height:46px;border-radius:13px;flex:0 0 auto;
  display:grid;place-items:center;font-size:19px;
  background:var(--card);box-shadow:var(--shadow);border:1px solid transparent;
}
html[data-theme="dark"] .icon-btn{border-color:var(--line)}
.icon-btn.on{color:var(--warn);background:var(--warn-soft)}
.icon-btn:active{transform:scale(.95)}

/* 进度条（答题页顶部） */
.qprog{height:3px;border-radius:99px;background:var(--line);overflow:hidden;margin:0 0 12px}
.qprog i{display:block;height:100%;background:var(--accent);transition:width .25s}

/* ---------- 结果页 ---------- */
.result{text-align:center;padding:26px 18px}
.result .ring{
  width:132px;height:132px;margin:0 auto 16px;border-radius:50%;
  display:grid;place-items:center;position:relative;
}
.result .ring .inner{
  position:absolute;inset:17px;border-radius:50%;background:var(--card);
  display:grid;place-items:center;flex-direction:column;
  box-shadow:var(--shadow);
}
.result .ring b{font-size:30px;font-weight:750;line-height:1.1}
.result .ring span{font-size:11.5px;color:var(--sub)}
.result h2{font-size:19px;font-weight:700;margin-bottom:4px}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}
.res-grid div{background:var(--card2);border-radius:var(--r-sm);padding:11px 6px}
.res-grid b{display:block;font-size:18px;font-weight:700}
.res-grid span{font-size:11.5px;color:var(--sub)}

/* ---------- 统计 ---------- */
.stat-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat-card{background:var(--card);border-radius:var(--r);padding:14px;
  box-shadow:var(--shadow);border:1px solid transparent}
html[data-theme="dark"] .stat-card{border-color:var(--line)}
.stat-card b{font-size:23px;font-weight:750;display:block;line-height:1.25}
.stat-card span{font-size:12px;color:var(--sub)}
.chapbar{margin-bottom:11px}
.chapbar .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:8px}
.chapbar .t em{font-style:normal;color:var(--sub);font-size:12px;white-space:nowrap}
.chapbar .bar{margin-top:0}
.chapbar .bar i.low{background:linear-gradient(90deg,var(--bad),#ff9aa6)}
.chapbar .bar i.mid{background:linear-gradient(90deg,var(--warn),#ffcd8a)}
.chapbar .bar i.high{background:linear-gradient(90deg,var(--ok),#5ee0b8)}

/* 打卡热力图 */
.heat{display:grid;grid-template-columns:repeat(13,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:3.5px;background:var(--heat0);display:block}
.heat i.l1{background:#cfc7fb}
.heat i.l2{background:#a99bf7}
.heat i.l3{background:#8b7cf6}
.heat i.l4{background:#6c5ce7}

/* ---------- 弹层 ---------- */
.sheet-mask{
  position:fixed;inset:0;z-index:100;background:rgba(15,16,23,.45);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadeIn .18s;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet-mask[hidden]{display:none}
.sheet{
  width:100%;max-width:640px;max-height:88dvh;max-height:88vh;
  background:var(--bg2);border-radius:22px 22px 0 0;
  display:flex;flex-direction:column;
  animation:slideUp .26s cubic-bezier(.2,.9,.3,1);
  padding-bottom:env(safe-area-inset-bottom);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.sheet-hd{
  display:flex;align-items:center;gap:8px;padding:14px 12px 10px 18px;
  border-bottom:1px solid var(--line);flex:0 0 auto;
}
.sheet-hd h2{flex:1;font-size:16.5px;font-weight:650}
.sheet-bd{overflow-y:auto;padding:14px 16px 22px;-webkit-overflow-scrolling:touch}

/* ---------- 表单控件 ---------- */
.field{margin-bottom:14px}
.field > label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px;font-weight:550}
.field textarea,.field input[type=text],.field input[type=number]{
  width:100%;background:var(--card);border:1.5px solid var(--line);
  border-radius:var(--r-sm);padding:11px 12px;font:inherit;font-size:16px;
  color:var(--text);resize:vertical;outline:none;
}
.field textarea{min-height:150px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:16px;line-height:1.65}
.field textarea:focus,.field input:focus{border-color:var(--accent)}
.sw{
  display:flex;align-items:center;gap:12px;padding:13px 15px;position:relative;
}
.sw + .sw::before{content:"";position:absolute;left:15px;right:0;top:0;height:1px;background:var(--line)}
.sw .grow b{font-weight:550;font-size:15px;display:block}
.sw .grow span{font-size:12.5px;color:var(--sub);display:block}
.toggle{
  width:50px;height:30px;border-radius:99px;background:var(--line);flex:0 0 auto;
  position:relative;transition:background .18s;
}
.toggle::after{
  content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.28);transition:transform .18s;
}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(20px)}

.seg{display:flex;background:var(--card2);border-radius:11px;padding:3px;gap:2px}
html[data-theme="dark"] .seg{background:#252838}
.seg button{
  flex:1;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:550;color:var(--sub);
}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

.empty{text-align:center;padding:52px 20px;color:var(--sub)}
.empty .ic{font-size:42px;margin-bottom:12px;opacity:.55}
.empty b{display:block;font-size:16px;color:var(--text);font-weight:600;margin-bottom:5px}
.empty p{font-size:13.5px;line-height:1.7}

.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--sub);
  white-space:nowrap}
html[data-theme="dark"] .tag{background:#262938}
.tag.hot{background:var(--bad-soft);color:var(--bad)}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 76px);
  transform:translateX(-50%);z-index:200;
  background:rgba(28,30,40,.94);color:#fff;
  padding:10px 18px;border-radius:99px;font-size:14px;font-weight:500;
  box-shadow:var(--shadow-lg);max-width:84vw;text-align:center;
  animation:fadeUp .2s;
}
.toast[hidden]{display:none}

/* 背诵卡（名词解释 / 简答） */
.recite-hint{
  margin-top:12px;border-radius:var(--r);padding:22px 14px;text-align:center;
  border:1.5px dashed var(--line);color:var(--sub);font-size:14px;
}
.self-eval{display:flex;gap:9px;margin-top:12px}

/* 选项乱序/题号小徽标 */
.q-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

@media (min-width:641px){
  #app{border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:0 0 60px rgba(0,0,0,.07)}
}

</style>

  <header class="topbar" id="topbar">

<script>
/* ---------- 题库：普通心理学 ---------- */
/* ==========================================================================
   题库 · 普通心理学
   依据彭聃龄《普通心理学》体系编排，适用于广东外语外贸大学心理学硕士备考
   格式说明：
     t  题型 single 单选 / multiple 多选 / judge 判断 / term 名词解释 / short 简答 / essay 论述
     q  题干    o  选项数组    a  答案（单选填序号，从 0 开始；多选填数组；判断填 true/false；主观题填文本）
     e  解析    tag 标签（可选）
   ========================================================================== */
window.__BANKS = window.__BANKS || [];
window.__BANKS.push({
  subject: '普通心理学',
  icon: '🧠',
  desc: '彭聃龄《普通心理学》体系 · 14 章',
  chapters: [

/* ------------------------------ 第 1 章 ------------------------------ */
{
  name: '第1章 心理学研究什么和如何进行研究',
  items: [
    { t:'single', q:'科学心理学诞生的标志是（　）。', o:['1879年冯特在德国莱比锡大学建立第一个心理学实验室','1900年弗洛伊德发表《梦的解析》','1913年华生发表《行为主义者眼中的心理学》','1956年米勒发表《神奇的数字7±2》'], a:0, e:'1879年冯特在莱比锡大学建立世界上第一个心理学实验室，标志心理学从哲学中独立出来，成为一门科学。', tag:['高频','必考'] },
    { t:'single', q:'被称为“心理学之父”的心理学家是（　）。', o:['冯特','铁钦纳','华生','詹姆斯'], a:0, e:'冯特被誉为“心理学之父”，代表作《生理心理学原理》。铁钦纳是构造主义的代表人物。' },
    { t:'single', q:'主张用内省法分析意识经验的基本构成要素的心理学流派是（　）。', o:['构造主义','机能主义','行为主义','格式塔心理学'], a:0, e:'构造主义由冯特创立、铁钦纳发展，主张研究意识的构成要素，采用实验内省法。', tag:['高频'] },
    { t:'single', q:'强调意识的作用与功能、重视心理的适应性的心理学流派是（　）。', o:['构造主义','机能主义','行为主义','精神分析'], a:1, e:'机能主义由詹姆斯、杜威等创立，受达尔文进化论影响，主张研究意识的机能和适应作用。' },
    { t:'single', q:'1913年发表《行为主义者眼中的心理学》，宣告行为主义诞生的心理学家是（　）。', o:['斯金纳','华生','托尔曼','赫尔'], a:1, e:'华生 1913 年的宣言标志行为主义诞生，主张心理学只研究可观察的行为，提出 S-R 公式。', tag:['高频'] },
    { t:'single', q:'主张“整体大于部分之和”，反对元素分析的心理学流派是（　）。', o:['构造主义','行为主义','格式塔心理学','精神分析'], a:2, e:'格式塔心理学（完形心理学）由韦特海默、考夫卡、苛勒创立于德国，强调心理现象的整体性。' },

    { t:'single', q:'在暗室中注视一个静止的光点，会觉得光点在游动，这是（　）。', o:['动景运动','诱导运动','自主运动','运动后效'], a:2, e:'自主运动（游动效应）是似动现象的一种，由缺乏参照框架引起。' },
    { t:'single', q:'缪勒—莱耶错觉属于（　）。', o:['长度错觉','方向错觉','大小错觉','形状错觉'], a:0, e:'缪勒—莱耶错觉是典型的长度错觉，等长线段因两端箭头方向不同而显得不等长。' },
    { t:'single', q:'关于错觉，下列说法正确的是（　）。', o:['错觉是知觉的歪曲，只有病人会有','错觉是在特定条件下对客观事物必然产生的某种有固定倾向的歪曲知觉','错觉可以通过意志努力消除','错觉是感觉的歪曲'], a:1, e:'错觉具有必然性、固定倾向性，是正常人在特定条件下都会产生的歪曲知觉，不能靠意志消除。', tag:['易错'] },
    { t:'single', q:'提出图形组织原则（邻近性、相似性、连续性、封闭性等）的学派是（　）。', o:['构造主义','格式塔心理学','行为主义','精神分析'], a:1, e:'格式塔心理学系统研究了知觉的组织原则，强调知觉的整体性。' },
    { t:'single', q:'“仁者见仁，智者见智”体现了知觉的（　）。', o:['整体性','理解性','恒常性','选择性'], a:1, e:'知觉的理解性指人以过去的知识经验为依据解释当前知觉对象，不同经验导致不同理解。' },
    { t:'multiple', q:'下列属于知觉恒常性的有（　）。', o:['大小恒常性','形状恒常性','明度恒常性','颜色恒常性','知觉的整体性'], a:[0,1,2,3], e:'知觉恒常性包括大小、形状、明度、颜色恒常性等；整体性是知觉的基本特性之一，与恒常性并列，不属于恒常性。' },
    { t:'multiple', q:'影响时间知觉的因素有（　）。', o:['活动的内容与性质','情绪状态','态度和兴趣','感觉通道的性质','被试的身高'], a:[0,1,2,3], e:'时间知觉受活动内容、情绪、动机态度以及不同感觉通道（听觉估计时间最准确）的影响，与身高无关。' },
    { t:'judge', q:'知觉的恒常性是指知觉条件在一定范围内变化时，知觉映象保持相对稳定。', a:true, e:'这是知觉恒常性的定义。' },
    { t:'term', q:'知觉恒常性', a:'知觉恒常性是指当知觉的客观条件在一定范围内变化时，知觉的映象在相当程度上保持相对稳定的特性。常见的恒常性有大小恒常性、形状恒常性、明度恒常性和颜色恒常性。它使人能够在变化的环境中稳定地认识客观世界。' },
    { t:'short', q:'简述深度知觉的线索。', a:'深度知觉的线索分为两类：\n1）单眼线索（肌肉线索与物理线索）：调节（晶状体曲度变化）、线条透视、空气透视、遮挡（对象重叠）、纹理梯度、运动视差、相对高度、明暗阴影、熟悉大小；\n2）双眼线索：双眼视差（最主要的深度线索）、双眼辐合（辐辏）。\n其中双眼视差是深度知觉最重要的线索。' },
    { t:'short', q:'简述错觉产生的主要理论解释。', a:'1）眼动理论：认为错觉与眼球运动有关，如缪勒—莱耶错觉由视线沿箭头方向扫描幅度不同造成；\n2）神经抑制作用理论：认为轮廓的相互抑制作用使神经兴奋中心位移，导致方向或长度知觉歪曲；\n3）深度加工和恒常性误用理论：认为错觉是把二维图形当作三维物体进行深度加工、错误运用大小恒常性的结果；\n4）常性误用说还强调过去经验在错觉中的作用。' }
  ]
},

/* ------------------------------ 第 5 章 ------------------------------ */
{
  name: '第5章 意识和注意',
  items: [
    { t:'single', q:'注意是心理活动或意识对一定对象的（　）。', o:['指向和集中','理解和记忆','选择和加工','反映和保持'], a:0, e:'注意的两个基本特点是指向性和集中性。', tag:['高频'] },
    { t:'single', q:'注意的两个基本特点是（　）。', o:['广度和稳定性','指向性和集中性','分配和转移','选择和保持'], a:1, e:'指向性指心理活动选择了某些对象而离开另一些对象；集中性指心理活动对选择对象的贯注程度。', tag:['高频','必考'] },
    { t:'single', q:'“没有预定目的、不需要意志努力”的注意是（　）。', o:['不随意注意','随意注意','随意后注意','分配性注意'], a:0, e:'不随意注意（无意注意）无预定目的、无需意志努力，由刺激物特点和主体状态引起。', tag:['高频'] },
    { t:'single', q:'既有自觉目的又不需要意志努力的注意是（　）。', o:['不随意注意','随意注意','随意后注意','选择性注意'], a:2, e:'随意后注意（有意后注意）是在随意注意基础上发展起来的，有目的但不需要意志努力，是高水平注意状态。', tag:['易错'] },
    { t:'single', q:'人的注意广度（范围）一般为（　）。', o:['3 个左右','5—9 个','15 个以上','不受限制'], a:1, e:'在 1/10 秒内成人一般能注意到 5—9 个（7±2）黑色圆点，注意广度受对象特点与主体经验影响。' },
    { t:'single', q:'“一边听课一边记笔记”体现了注意的（　）。', o:['稳定性','广度','分配','转移'], a:2, e:'注意分配指在同一时间内把注意指向不同对象，条件是至少有一种活动熟练、活动间有内在联系。', tag:['高频'] },
    { t:'single', q:'注意的稳定性是指（　）。', o:['注意在一定时间内保持在某个对象或活动上','注意从一个对象转移到另一对象','同时把注意指向多个对象','注意的范围大小'], a:0, e:'注意的稳定性（持久性）指注意在一定时间内保持在某个客体或活动上。注意的起伏是注意稳定性的一种表现。' },
    { t:'single', q:'提出选择性注意的“过滤器模型”的心理学家是（　）。', o:['布罗德本特','特瑞斯曼','多伊奇','卡尼曼'], a:0, e:'布罗德本特基于双耳分听实验提出过滤器模型（单通道模型），认为信息在知觉水平上经“全或无”的过滤。', tag:['高频','必考'] },
    { t:'single', q:'特瑞斯曼为修正过滤器模型而提出的注意模型是（　）。', o:['过滤器模型','衰减模型','后期选择模型','多阶段选择模型'], a:1, e:'特瑞斯曼的衰减模型认为未被注意的信息并非完全被滤掉，而是以衰减形式得到加工，且阈限较低的词（如自己的名字）仍可被识别。', tag:['高频'] },
    { t:'single', q:'后期选择模型（反应选择模型）的主要提出者是（　）。', o:['布罗德本特','特瑞斯曼','多伊奇','诺曼'], a:2, e:'多伊奇（Deutsch）提出后期选择模型，认为所有输入信息都得到充分知觉加工，选择发生在反应阶段；诺曼进一步发展了这一模型。' },
    { t:'single', q:'用“认知资源有限”解释注意选择现象的理论是（　）。', o:['过滤器模型','衰减模型','资源限制理论','特征整合理论'], a:2, e:'卡尼曼提出资源限制理论（认知资源理论），认为注意是一种有限的认知资源，任务的资源需求决定加工水平。' },
    { t:'single', q:'快速眼动睡眠（REM）阶段最典型的特点是（　）。', o:['脑电呈现高幅慢波','眼动活跃，梦境多发生于此阶段','肌肉紧张度最高','呼吸心率最平稳'], a:1, e:'REM 睡眠时眼球快速运动、脑电接近清醒状态，梦境大多发生在该阶段。' },
    { t:'multiple', q:'注意的功能包括（　）。', o:['选择功能','维持（保持）功能','调节和监督功能','遗忘功能'], a:[0,1,2], e:'注意的基本功能是选择、维持（保持）和调节监督。' },
    { t:'multiple', q:'影响不随意注意的因素有（　）。', o:['刺激物的强度','刺激物之间的对比关系','刺激物的新异性','主体的需要和情绪状态','被试的视力水平'], a:[0,1,2,3], e:'不随意注意既受刺激物特点（强度、对比、活动变化、新异性）影响，也受人本身的状态（需要、兴趣、情绪、期待）影响。' },
    { t:'judge', q:'注意不是一个独立的心理过程，而是心理活动的一种状态或特性。', a:true, e:'注意本身不反映事物属性，而是伴随其他心理过程的意识状态与特性。' },
    { t:'term', q:'随意后注意', a:'随意后注意又称有意后注意，是指有自觉目的但不需要意志努力的注意。它通常是在随意注意的基础上，随着对活动的兴趣和熟练程度的提高而转化形成的。随意后注意是注意的一种高级状态，既能保持高度集中，又能减少疲劳，对高效学习和创造性活动具有重要意义。' },
    { t:'short', q:'简述注意的分配及其实现条件。', a:'注意分配是指在同一时间内把注意指向不同的对象或活动。其实现条件有：\n1）同时进行的活动中，至少有一种是个体已经相当熟练或自动化了的；\n2）同时进行的几种活动之间应有一定的内在联系，形成活动系统；\n3）注意的分配能力可以通过训练提高，其水平因人而异；\n4）注意分配是相对的、有条件的，不能无限制进行。' }
  ]
},

/* ------------------------------ 第 6 章 ------------------------------ */
{
  name: '第6章 记忆',
  items: [
    { t:'single', q:'记忆过程包括的三个基本环节是（　）。', o:['编码、存储、提取','感觉、知觉、思维','识记、遗忘、回忆','注意、复述、回忆'], a:0, e:'现代认知心理学把记忆过程分为编码（识记）、存储（保持）和提取（再认与回忆）三个环节。', tag:['高频'] },
    { t:'single', q:'阿特金森和希夫林提出的记忆系统模型把记忆分为（　）。', o:['感觉记忆、短时记忆、长时记忆','外显记忆和内隐记忆','情景记忆和语义记忆','陈述性记忆和程序性记忆'], a:0, e:'三级记忆模型（多存储模型）：感觉记忆→短时记忆→长时记忆。', tag:['高频','必考'] },
    { t:'single', q:'斯柏林用部分报告法证明的记忆系统是（　）。', o:['感觉记忆','短时记忆','长时记忆','内隐记忆'], a:0, e:'斯柏林（Sperling，1960）用部分报告法证明视觉感觉记忆（图像记忆）的存在，容量大但保持时间极短。', tag:['高频','必考'] },
    { t:'single', q:'图像记忆（视觉感觉记忆）的保持时间大约是（　）。', o:['1 秒以内','5 秒左右','30 秒左右','1 分钟以上'], a:0, e:'图像记忆保持约 0.25—1 秒（一般说 1 秒以内），声像记忆约 2—4 秒。' },
    { t:'single', q:'短时记忆的容量约为（　）。', o:['3±1 个组块','5±1 个组块','7±2 个组块','12±3 个组块'], a:2, e:'米勒（Miller，1956）提出短时记忆容量为 7±2 个组块，被称为“神奇的数字 7±2”。', tag:['高频','必考'] },
    { t:'single', q:'康拉德的实验表明短时记忆的编码方式主要是（　）。', o:['视觉编码','听觉编码','语义编码','动作编码'], a:1, e:'康拉德发现短时记忆的错误多为声音混淆（AC 混淆），说明短时记忆以听觉（言语听觉）编码为主。', tag:['高频','易错'] },
    { t:'single', q:'长时记忆的编码方式主要是（　）。', o:['视觉编码','听觉编码','语义编码','位置编码'], a:2, e:'长时记忆主要以语义编码为主，也存在视觉编码（如视觉表象）。' },
    { t:'single', q:'斯滕伯格用加因素法研究短时记忆的提取，结果表明短时记忆提取方式是（　）。', o:['平行扫描','完全系列扫描','自动停止系列扫描','随机扫描'], a:1, e:'斯滕伯格发现反应时随识记项目数线性增加，且“是”与“否”反应时相同，说明是完全系列扫描。', tag:['高频','必考'] },
    { t:'single', q:'皮特森—皮特森法（分散注意法）用来研究（　）。', o:['短时记忆的容量','短时记忆的保持时间','感觉记忆的容量','长时记忆的编码'], a:1, e:'让被试在识记后立即进行分心作业，结果表明短时记忆在无复述条件下约 15—30 秒后迅速遗忘。', tag:['高频'] },
    { t:'single', q:'艾宾浩斯遗忘曲线表明遗忘的进程是（　）。', o:['先快后慢','先慢后快','匀速进行','无规律波动'], a:0, e:'艾宾浩斯以无意义音节为材料，用节省法测得遗忘进程先快后慢，呈负加速。', tag:['高频','必考'] },
    { t:'single', q:'艾宾浩斯研究遗忘所用的记忆材料是（　）。', o:['无意义音节','单词表','故事','图形'], a:0, e:'艾宾浩斯使用无意义音节（如 ZOF），目的是排除已有知识经验的影响；测量指标是节省率。' },
    { t:'single', q:'先学习的内容对后学习内容的干扰称为（　）。', o:['前摄抑制','倒摄抑制','消退抑制','超限抑制'], a:0, e:'前摄抑制是前面学习材料对后继学习的干扰；倒摄抑制是后面学习材料对先前学习的干扰。', tag:['高频','易错'] },
    { t:'single', q:'系列位置效应中，中间部分材料记忆效果最差，主要原因是（　）。', o:['只受前摄抑制影响','只受倒摄抑制影响','同时受前摄抑制和倒摄抑制影响','材料本身难度大'], a:2, e:'中间部分同时受前后材料的双重干扰，因而回忆率最低。首因效应源于长时记忆，近因效应源于短时记忆。', tag:['高频'] },
    { t:'single', q:'过度学习到（　）时记忆效果最好。', o:['100%','150%','200%','300%'], a:1, e:'研究表明学习程度达到 150%（即过度学习 50%）时保持效果最佳，超过则效率下降。', tag:['高频'] },
    { t:'single', q:'“舌尖现象”支持遗忘的（　）。', o:['衰退说','干扰说','提取失败说','压抑说'], a:2, e:'舌尖现象说明信息仍存储在长时记忆中，只是暂时提取不出来，支持提取失败说。', tag:['易错'] },
    { t:'single', q:'图尔文把长时记忆分为（　）。', o:['情景记忆和语义记忆','外显记忆和内隐记忆','陈述性记忆和程序性记忆','形象记忆和逻辑记忆'], a:0, e:'图尔文按记忆内容分为情景记忆（个人经历的事件）和语义记忆（一般知识与规律）。' },
    { t:'single', q:'测量内隐记忆常用的方法是（　）。', o:['自由回忆','再认测验','启动效应（如词干补笔）','线索回忆'], a:2, e:'内隐记忆多用间接测量，如词干补笔、知觉辨认、词汇判断等启动效应任务。', tag:['高频','易错'] },
    { t:'single', q:'提出记忆的加工水平说的心理学家是（　）。', o:['克雷克和洛克哈特','阿特金森和希夫林','图尔文','巴德利'], a:0, e:'加工水平说认为记忆效果取决于加工的深度，语义（深层）加工比物理（浅层）加工的记忆效果更好。', tag:['高频'] },
    { t:'multiple', q:'关于遗忘的理论，下列说法正确的有（　）。', o:['衰退说认为遗忘是记忆痕迹随时间自然消退','干扰说认为遗忘是学习和回忆之间相互干扰的结果','压抑说认为遗忘是由动机性压抑造成的','提取失败说认为遗忘是因为缺乏适当的提取线索','压抑说认为遗忘是记忆痕迹在大脑中永久消失'], a:[0,1,2,3], e:'压抑说强调动机和情绪的作用，并不认为痕迹永久消失；认为痕迹随时间自然消退的是衰退说。' },
    { t:'multiple', q:'下列属于内隐记忆测量任务的有（　）。', o:['词干补笔','知觉辨认','自由回忆','再认'], a:[0,1], e:'词干补笔和知觉辨认属于间接测量（内隐记忆）；自由回忆和再认属于直接测量（外显记忆）。' },
    { t:'judge', q:'复述是使信息从短时记忆进入长时记忆的重要条件。', a:true, e:'复述分机械复述（保持性复述）和精细复述（整合性复述），后者更有利于长时记忆的保持。' },
    { t:'term', q:'组块', a:'组块是指把若干小单位的信息联合成较大单位的信息加工过程或结果。组块能有效扩大短时记忆的容量。米勒提出短时记忆的容量为 7±2 个组块，通过组块化，人可以在有限的容量内记住更多的信息。组块的大小依赖个体的知识经验。' },
    { t:'short', q:'简述艾宾浩斯遗忘曲线及其对复习的启示。', a:'1）艾宾浩斯以无意义音节为材料，用节省法测量保持量，绘制出遗忘曲线；\n2）规律：遗忘进程先快后慢，呈负加速，20 分钟遗忘约 42%，一天后遗忘约 66%，之后趋于平缓；\n3）启示：①及时复习，趁热打铁；②合理分配复习时间，采用分散复习优于集中复习；③适当过度学习（150% 最佳）；④材料意义化、采用多种编码方式；⑤注意前后摄抑制的影响，合理安排复习顺序。' },
    { t:'short', q:'简述影响遗忘进程的因素。', a:'1）学习材料的性质：有意义材料遗忘慢于无意义材料，形象材料慢于抽象材料；\n2）材料的数量与难度：数量越多、难度越大，遗忘越快；\n3）学习程度：过度学习 150% 时保持效果最好；\n4）学习的序列位置：中间部分受双重抑制，遗忘最快；\n5）学习方式：分布学习优于集中学习，主动回忆优于单纯重复；\n6）个体的动机、情绪与需要：动机过强或情绪紧张都会影响记忆保持。' }
  ]
},

    { t:'single', q:'认为概念主要以“最典型的样例”来表征的理论是（　）。', o:['特征表说','原型说','层次网络模型','激活扩散模型'], a:1, e:'罗斯提出原型说，认为概念由原型（最具代表性的样例）及范畴成员的相似性程度来表征。' },

    { t:'judge', q:'思维是人脑对客观事物的间接的、概括的反映。', a:true, e:'这是思维的定义，间接性和概括性是思维的两个基本特征。' },
    { t:'term', q:'问题空间', a:'问题空间是纽厄尔和西蒙在信息加工观点下提出的概念，指问题解决者对所要解决的问题的一切可能的认识状态，包括初始状态、目标状态和中间状态（算子）。问题解决的过程就是在问题空间中进行搜索，从初始状态经过一系列算子达到目标状态的过程。' },
    { t:'short', q:'简述影响问题解决的主要因素。', a:'1）知识经验：专家图式丰富，能更快抓住问题实质；\n2）定势：由先前活动形成的心理准备状态，既可促进也可妨碍问题解决（卢钦斯量水实验）；\n3）功能固着：只看到物体的通常功能，妨碍发现新用途（邓克尔蜡烛问题）；\n4）动机强度：中等强度动机最有利，问题越难最佳动机水平越低（耶克斯—多德森定律）；\n5）情绪状态：紧张焦虑会干扰思路；\n6）原型启发与酝酿效应：从其他事物获得启示、暂时搁置后突然想到办法；\n7）个性特征：独立、自信、灵活的人更容易解决问题。' }
  ]

    { t:'multiple', q:'控制额外变量的常用方法有（　）。', o:['随机化法','恒定法与消除法','平衡法（抵消平衡）','统计控制法与双盲设计','尽量增加被试的性别比例'], a:[0,1,2,3], e:'还有配对法（等组匹配法）等。' },
    { t:'judge', q:'内部效度高就一定能保证外部效度高。', a:false, e:'内部效度是外部效度的必要但非充分条件，二者之间常存在紧张关系，需要权衡。', tag:['易错'] },
    { t:'term', q:'内部效度', a:'内部效度是指实验中自变量与因变量之间因果关系的确定程度，即实验结果能被明确归因于自变量操纵的程度。影响内部效度的因素主要有历史、成熟、测验、仪器、统计回归、被试选择偏差、被试流失以及各种交互作用。提高内部效度的关键是随机分配被试、严格控制额外变量。' },
    { t:'term', q:'额外变量', a:'额外变量又称无关变量或控制变量，是指实验中除自变量以外一切可能影响因变量的变量。如果不对其加以控制，就可能与自变量混淆，干扰对因果关系的推断。控制额外变量的方法主要有消除法、恒定法、随机化法、平衡法（抵消平衡）、配对法和统计控制法等。' },
    { t:'short', q:'简述控制额外变量的主要方法。', a:'1）消除法：把额外变量从实验中排除，如用隔音室消除噪声；\n2）恒定法：使额外变量在实验过程中保持恒定不变，如同一时间、同一实验室、同一主试；\n3）随机化法：随机分配被试到各实验条件、随机安排实验顺序，是控制额外变量的最有效方法之一；\n4）平衡法（抵消平衡法）：在被试内设计中用 ABBA 或拉丁方平衡顺序效应和练习效应；\n5）配对法（等组匹配）：把在有关变量上相同或相近的被试配成对，再随机分配到不同组；\n6）统计控制法：用协方差分析等统计手段排除额外变量的影响；\n7）双盲设计：同时控制实验者效应和安慰剂效应。' }
  ]
},

    { t:'single', q:'在 ABA 设计中，第二个 A 阶段的作用是（　）。', o:['检验处理效应是否可以逆转（撤除处理后的基线）','提高外部效度','增加被试','消除个体差异'], a:0, e:'ABA 设计中 A 为基线期，B 为处理期，第二个 A 是撤除处理后的基线，用于验证处理效果。' },
    { t:'single', q:'“天花板效应”是指（　）。', o:['因变量指标过于容易，几乎所有被试都取得高分，无法区分处理差异','因变量指标过难，所有被试都得零分','被试中途退出实验','仪器出现故障'], a:0, e:'天花板效应和地板效应都会导致因变量无法敏感反映自变量变化，属于测量指标的灵敏性问题。', tag:['高频','易错'] },
    { t:'single', q:'练习效应属于（　）。', o:['自变量','因变量','额外变量','中介变量'], a:2, e:'练习效应（顺序效应）是需要控制的额外变量，在被试内设计中使用抵消平衡法控制。' },
    { t:'multiple', q:'真实验设计的基本条件包括（　）。', o:['随机分配被试到各实验条件','有明确的自变量操纵','设置控制组或对照条件','控制额外变量','被试人数必须超过 100 人'], a:[0,1,2,3], e:'随机化、控制、操纵是实验法的三大要素；被试人数取决于效应量和统计效力要求，并非固定标准。' },
    { t:'multiple', q:'下列属于被试内设计优点的有（　）。', o:['节省被试数量','消除了个体差异的影响','统计检验的敏感性更高','不存在任何误差'], a:[0,1,2], e:'被试内设计仍需注意顺序效应、练习效应和延续效应（迁移效应）。' },
    { t:'multiple', q:'控制顺序效应的常用方法有（　）。', o:['ABBA 抵消平衡','拉丁方设计','随机化顺序','把所有被试都按同一顺序施测'], a:[0,1,2], e:'固定顺序会混淆顺序效应与处理效应，不能用于控制。' },
    { t:'judge', q:'因素实验中若两个自变量没有交互作用，说明它们各自独立地影响因变量。', a:true, e:'主效应可以相加即为无交互作用，此时各因素对因变量的影响是独立的。' },
    { t:'judge', q:'准实验设计也可以做出明确的因果推论。', a:false, e:'准实验设计不能随机分配被试，难以排除选择等额外变量的影响，因果推论需谨慎。' },
    { t:'term', q:'被试内设计', a:'被试内设计又称重复测量设计、组内设计，是指每名被试接受全部实验处理的实验设计。其优点是节省被试、消除个体差异、统计检验敏感性高；缺点是容易产生练习效应、疲劳效应、顺序效应和延续效应，需要用抵消平衡法（ABBA、拉丁方设计）加以控制。适用于练习效果较小或可通过平衡控制的实验。' },
    { t:'term', q:'交互作用', a:'交互作用是指在一个多因素实验中，一个自变量的效应在另一个自变量的不同水平上表现出差异的现象。当存在交互作用时，说明自变量并非各自独立地影响因变量，必须结合简单效应分析才能准确解释结果。交互作用可分为序次性交互作用和非序次性交互作用。' },
    { t:'short', q:'简述比较被试间设计和被试内设计的优缺点。', a:'被试间设计（独立组设计）：每名被试只接受一种处理。优点：被试只接受一种处理，不存在练习效应、疲劳效应和顺序效应；适用于不可重复测量的实验（如学习某技能）。缺点：需要较多被试；个体差异会成为误差来源，可能造成组间不等，需要用随机分配或配对法控制。\n被试内设计（重复测量设计）：每名被试接受所有处理。优点：节省被试；消除个体差异；统计检验敏感性更高。缺点：存在练习效应、疲劳效应、顺序效应、延续效应，需用 ABBA、拉丁方、随机化等抵消平衡法控制。' }
  ]
},

  name: '第4章 反应时法',
  items: [
    { t:'single', q:'反应时是指（　）。', o:['从刺激呈现到被试做出反应之间的时间间隔','被试完成实验的总时间','刺激呈现的持续时间','实验者记录数据的时间'], a:0, e:'反应时是刺激—反应之间的时间间隔，是心理学实验中最常用的因变量之一。', tag:['高频','必考'] },
    { t:'single', q:'唐德斯的 A 反应时是指（　）。', o:['简单反应时','选择反应时','辨别反应时','基线反应时'], a:0, e:'A 反应时即简单反应时，一个刺激对应一个反应，无需辨别和选择。', tag:['高频','必考'] },
    { t:'single', q:'唐德斯的 B 反应时是指（　）。', o:['简单反应时','选择反应时','辨别反应时','复杂反应时'], a:1, e:'B 反应时（选择反应时）有多个刺激、多个反应，被试需辨别刺激并选择相应反应。' },
    { t:'single', q:'唐德斯的 C 反应时是指（　）。', o:['简单反应时','选择反应时','辨别反应时','分辨反应时'], a:2, e:'C 反应时（辨别反应时）有多个刺激但只有一个反应，只需辨别不需要选择。' },
    { t:'single', q:'用减数法分离“辨别所需时间”，其计算方式是（　）。', o:['B 反应时 − C 反应时','C 反应时 − A 反应时','B 反应时 − A 反应时','A 反应时 + C 反应时'], a:1, e:'C−A = 辨别时间；B−C = 选择时间；B−A = 辨别+选择时间。', tag:['高频','必考'] },
    { t:'single', q:'用减数法分离“选择所需时间”，其计算方式是（　）。', o:['C 反应时 − A 反应时','B 反应时 − C 反应时','B 反应时 − A 反应时','A 反应时 − C 反应时'], a:1, e:'B−C 得到反应选择所需的时间。' },
    { t:'single', q:'提出加因素法（加法反应时）的心理学家是（　）。', o:['唐德斯','斯滕伯格','波斯纳','汉密尔顿'], a:1, e:'斯滕伯格提出加因素法，通过寻找有交互作用还是相互独立的加工阶段，确定心理加工的序列结构。', tag:['高频','必考'] },
    { t:'single', q:'加因素法的基本逻辑是：如果两个因素的效应相互独立（可以相加），则它们影响（　）。', o:['同一个加工阶段','不同的加工阶段','同一反应的输出','无关变量'], a:1, e:'效应可相加说明作用于不同阶段；若存在交互作用则说明作用于同一阶段。这是加因素法的核心逻辑。', tag:['高频','必考'] },
    { t:'single', q:'斯滕伯格用加因素法研究短时记忆的提取，提出的提取方式是（　）。', o:['平行扫描','完全系列扫描','自动停止系列扫描','随机扫描'], a:1, e:'实验发现反应时随识记项目数线性增加，且“是”反应与“否”反应时间相同，说明是完全系列扫描。', tag:['高频','必考'] },
    { t:'single', q:'一般来说，简单反应时最快的感觉通道是（　）。', o:['视觉','听觉','触觉','痛觉'], a:1, e:'听觉的简单反应时最短（约 140—160ms），视觉次之（约 180—200ms）。', tag:['易错'] },
    { t:'single', q:'反应时实验中为避免被试“抢答”（假反应），常采用的方法是（　）。', o:['增加刺激强度','插入侦察试验（catch trial）','延长实验时间','减少被试数量'], a:1, e:'插入不要求反应的侦察试验，若被试在侦察试验中仍做出反应则说明存在假反应倾向。', tag:['高频'] },
    { t:'single', q:'随着刺激强度的增加，反应时的变化规律一般是（　）。', o:['逐渐缩短，但缩短的速度越来越慢','逐渐延长','保持不变','先延长后缩短'], a:0, e:'刺激强度越大反应时越短，但存在渐进极限；强度过高时反而可能因不适而延长。' },
    { t:'single', q:'下列因素中，会使反应时延长的是（　）。', o:['刺激强度增加','被试准备充分','刺激的复杂程度增加','练习次数增加'], a:2, e:'刺激越复杂、可选择的反应越多，反应时越长。练习和准备会缩短反应时。' },
    { t:'multiple', q:'影响反应时的因素有（　）。', o:['刺激强度与复杂程度','刺激呈现方式与感觉通道','被试的准备状态和练习程度','被试的动机、年龄和个体差异','实验者记录数据的书写速度'], a:[0,1,2,3], e:'此外还有实验环境的干扰、反应方式（按键、口头）等；主试记录速度由仪器和程序自动完成，不影响被试的反应时。' },
    { t:'multiple', q:'关于加因素法的特点，下列说法正确的有（　）。', o:['以反应时为指标','通过考察因素间的交互作用来确定加工阶段','由斯滕伯格提出','适用于确定心理加工的序列结构','可以直接测定每个加工阶段的绝对时间'], a:[0,1,2,3], e:'加因素法的局限在于只能确定加工的序列结构，难以精确估计每个阶段的绝对时程，能测出阶段绝对时程的是减数法。' },
    { t:'judge', q:'减数法可以直接测量出某个心理加工阶段的绝对时间。', a:true, e:'减数法通过两个任务反应时的差值，得到特定加工阶段（如辨别、选择）的持续时间。' },
    { t:'term', q:'减数法', a:'减数法又称相减法，由荷兰生理学家唐德斯提出，是最早用反应时分析心理过程的方法之一。其基本逻辑是：如果一种任务比另一种任务多包含一个特定的心理加工阶段，那么两种任务的反应时之差就是该阶段所需的时间。唐德斯设计了 A、B、C 三种反应时，通过 C−A 得到辨别时间，B−C 得到选择时间。' },
    { t:'term', q:'加因素法', a:'加因素法又称加法反应时，由斯滕伯格提出。其基本逻辑是：如果两个实验因素影响的是同一个加工阶段，那么它们的效应存在交互作用；如果影响的是不同的加工阶段，那么它们的效应相互独立、可以相加。通过寻找可相加的因素，可以确定心理加工过程中的各个阶段及其序列结构。' },
    { t:'short', q:'简述唐德斯 ABC 反应时及其应用。', a:'唐德斯设计了三种反应时：\nA 反应时（简单反应时）：只有一个刺激、一个反应，无需辨别和选择，是最基础的反应时间；\nB 反应时（选择反应时）：有多个刺激、多个反应，被试需要辨别刺激并选择相应的反应；\nC 反应时（辨别反应时）：有多个刺激但只有一个反应，被试只需辨别刺激，不需选择反应。\n应用（减数法）：C−A = 辨别所需时间；B−C = 选择所需时间；B−A = 辨别与选择共需时间。这样就把复杂的反应分解为不同心理加工阶段的时程。' }
  ]
},

  name: '第5章 心理物理学方法',
  items: [
    { t:'single', q:'测量感觉阈限的传统方法不包括（　）。', o:['最小变化法','恒定刺激法','平均差误法','信号检测论'], a:3, e:'传统心理物理法包括最小变化法（极限法）、恒定刺激法和平均差误法（调整法）；信号检测论是现代心理物理学方法。', tag:['高频','必考'] },
    { t:'single', q:'最小变化法的刺激呈现方式是（　）。', o:['用少数几个固定刺激随机呈现','按等距递增或递减的系列呈现刺激','由被试自己调整刺激','只呈现一个刺激'], a:1, e:'最小变化法用渐增系列和渐减系列交替呈现，每次变化一个很小的量，求阈限。' },
    { t:'single', q:'最小变化法中最常见的误差是（　）。', o:['习惯误差和期望误差','动作误差和空间误差','统计回归','被试流失'], a:0, e:'习惯误差（继续原趋势反应）和期望误差（提前改变反应）是主要误差，用渐增渐减交替（ABBA）控制。', tag:['高频','必考'] },
    { t:'single', q:'平均差误法测量差别阈限时，常以（　）作为阈限的估计值。', o:['平均误差','最小误差','最大误差','中数'], a:0, e:'平均差误法（调整法）中，被试调整比较刺激使之与标准刺激相等，以平均误差作为差别阈限的估计。' },
    { t:'single', q:'恒定刺激法确定阈限时，常用的求阈限方法是（　）。', o:['直线内插法','最小二乘法','因素分析法','协方差分析'], a:0, e:'恒定刺激法用少数几个固定刺激呈现多次，以正确反应百分数为纵坐标，用直线内插法求出 50% 次数被觉察的刺激强度作为绝对阈限。', tag:['高频'] },
    { t:'single', q:'恒定刺激法的特点是（　）。', o:['刺激按递增递减系列呈现','选择 5—7 个固定刺激，每个刺激随机呈现多次','由被试自己调整刺激','只测一个刺激'], a:1, e:'恒定刺激法刺激数目少、每个刺激呈现次数多（一般 50—200 次），能测量绝对阈限和差别阈限。' },
    { t:'single', q:'信号检测论中，被试报告“有信号”而实际无信号，这属于（　）。', o:['击中','虚报','漏报','正确拒绝'], a:1, e:'击中=有信号报有；虚报=无信号报有；漏报=有信号报无；正确拒绝=无信号报无。', tag:['高频','必考'] },
    { t:'single', q:'信号检测论中，衡量被试辨别力的指标是（　）。', o:['β','d′','α','r'], a:1, e:'d′ 是辨别力指数，反映被试对信号与噪声的区分能力，不受反应偏向影响；β 反映判断标准（反应偏向）。', tag:['高频','必考'] },
    { t:'single', q:'信号检测论中，β 值表示（　）。', o:['被试的辨别力','被试的判断标准（反应偏向）','信号的强度','噪声的强度'], a:1, e:'β 越大表示被试越倾向于报告“无信号”（判断标准严格）；β 越小越倾向于报告“有信号”。' },
    { t:'single', q:'信号检测论优于传统心理物理法的重要之处在于（　）。', o:['能把被试的辨别力与反应倾向（判断标准）分开','实验程序更简单','不需要大量被试','可以不用统计'], a:0, e:'传统方法求得的阈限同时混入了感受性和反应偏向两个因素，信号检测论的 d′ 和 β 能把二者分离。', tag:['高频','必考'] },
    { t:'single', q:'用信号检测论处理实验结果时绘制的 ROC 曲线，其纵轴和横轴分别是（　）。', o:['击中率和虚报率','d′ 和 β','平均值和标准差','正确率和反应时'], a:0, e:'ROC 曲线的纵轴是击中率，横轴是虚报率，曲线下的面积可作为辨别力的指标。' },
    { t:'single', q:'当 d′ 固定时，被试的判断标准越严格，则（　）。', o:['击中率和虚报率都增加','击中率和虚报率都降低','击中率增加、虚报率降低','击中率降低、虚报率增加'], a:1, e:'判断标准严格时被试更倾向于报告“无信号”，因此击中率和虚报率同时降低。', tag:['易错'] },
    { t:'single', q:'最小变化法测得的绝对阈限通常取（　）。', o:['渐增系列和渐减系列阈限值的平均数','最大值','最小值','中数'], a:0, e:'分别求出渐增系列和渐减系列的阈限，取两者平均数作为绝对阈限，可部分抵消习惯误差和期望误差。' },
    { t:'multiple', q:'传统心理物理法包括（　）。', o:['最小变化法','恒定刺激法','平均差误法','信号检测论'], a:[0,1,2], e:'三种传统方法各有适用范围：最小变化法适合测定阈限，恒定刺激法适用面广，平均差误法便于操作。' },
    { t:'multiple', q:'关于韦伯定律，下列说法正确的有（　）。', o:['公式为 ΔI/I = K','K 值称为韦伯常数（分数）','只适用于中等强度的刺激','表明差别阈限与原刺激强度成正比','K 值在所有感觉通道中完全相同'], a:[0,1,2,3], e:'当刺激强度过弱或过强时韦伯定律不成立；韦伯常数因感觉通道和刺激性质而异，并非普遍相同的常数。' },
    { t:'judge', q:'信号检测论认为阈限不是一个固定的值，而是一个受被试判断标准影响的统计决策过程。', a:true, e:'信号检测论用统计决策的观点解释阈限，认为观察者根据信号与噪声的概率分布和判断标准做出决策。' },
    { t:'term', q:'信号检测论', a:'信号检测论由坦纳和斯韦茨等人引入心理学，用统计决策的理论研究人在不确定情境下的辨别过程。它把被试的判断分解为两个方面：一是辨别力指数 d′，反映被试区分信号与噪声的客观能力；二是判断标准 β（或反应偏向），反映被试在报告“有信号”或“无信号”时的倾向。信号检测论的最大贡献在于把感受性和反应偏向分离开来，弥补了传统心理物理法把二者混在一起的不足。' },
    { t:'short', q:'简述最小变化法、恒定刺激法和平均差误法的主要区别。', a:'1）最小变化法：刺激按等距的渐增序列和渐减序列交替呈现，记录被试反应由“无”到“有”的转折点；主要误差是习惯误差和期望误差，用交替呈现控制；适用于绝对阈限和差别阈限的测定。\n2）恒定刺激法：选取 5—7 个固定刺激，每个刺激随机呈现多次（一般 50—200 次），用直线内插法求出 50% 觉察率的刺激强度作为阈限；测量精确度较高，适用面广。\n3）平均差误法（调整法）：被试自己调整比较刺激使之与标准刺激相等，以调整结果的平均误差作为差别阈限的估计；操作方便，但可能产生动作误差和空间误差。' }
  ]
},

/* ------------------------------ 第 6 章 ------------------------------ */
{
  name: '第6章 感知觉实验',
  items: [
    { t:'single', q:'黑伯（Hebb）的感觉剥夺实验表明（　）。', o:['感觉剥夺会严重影响人的认知功能，甚至产生幻觉','感觉剥夺对心理没有影响','感觉剥夺能提高智力','感觉剥夺可以治疗所有心理疾病'], a:0, e:'感觉剥夺实验说明正常的感觉输入是维持正常心理活动的必要条件。', tag:['高频'] },
    { t:'single', q:'吉布森和沃克设计、用于研究婴儿深度知觉的经典实验装置是（　）。', o:['视觉悬崖装置','暗适应箱','旋转小屋','斯金纳箱'], a:0, e:'视觉悬崖（视崖）实验证明婴儿很早就具有深度知觉。', tag:['高频','必考'] },
    { t:'single', q:'在视崖实验中，如果婴儿在“深侧”表现出犹豫、回避或心率变化，说明（　）。', o:['婴儿已能知觉到深度','婴儿没有深度知觉','婴儿视力有问题','婴儿害怕陌生人'], a:0, e:'对“深侧”的回避反应说明婴儿能够知觉深度。' },
    { t:'single', q:'测量视觉明适应和暗适应常用的方法是（　）。', o:['暗适应曲线法','部分报告法','最小变化法','对偶故事法'], a:0, e:'通过测量暗适应过程中感受性随时间的变化曲线（暗适应曲线）来研究暗适应过程。' },
    { t:'single', q:'闪光融合频率（CFF）是指（　）。', o:['断续光被知觉为连续光的最低闪烁频率','光的波长','光的强度','视网膜的敏感度'], a:0, e:'当闪烁频率提高到一定程度，人会把断续光知觉为连续光，这个临界频率即闪光融合频率，可反映视觉系统的时间分辨能力。' },
    { t:'single', q:'色觉实验中常用的“颜色匹配法”主要用于研究（　）。', o:['颜色混合规律和色觉理论','深度知觉','听觉定位','注意分配'], a:0, e:'颜色匹配法通过让被试调节三原色比例匹配标准色，验证颜色视觉的三色说。' },
    { t:'single', q:'听觉定位的主要线索是（　）。', o:['两耳时间差和强度差','音色','频率','波长'], a:0, e:'双耳时间差（ITD）和强度差（ILD）是听觉空间定位的主要线索，此外还有头部相关传递函数。' },
    { t:'single', q:'用恒定刺激法测量大小恒常性时，常采用的指标是（　）。', o:['布伦斯威克比率（BR）和邵勒斯比率（TR）','d′ 和 β','节省率','相关系数'], a:0, e:'布伦斯威克比率=知觉大小/客体实际大小对应的视网膜像大小；邵勒斯比率用对数形式，更接近知觉经验。', tag:['高频'] },
    { t:'single', q:'“形状恒常性”的实验研究通常让被试在不同倾斜角度观察同一物体，结果发现知觉形状（　）。', o:['比视网膜像更接近物体实际形状','完全等同于视网膜像','完全脱离视网膜像','随机变化'], a:0, e:'实验表明知觉形状随倾斜角度变化远小于视网膜像的变化，体现了形状恒常性。' },
    { t:'multiple', q:'关于视觉悬崖实验，下列说法正确的有（　）。', o:['由吉布森和沃克设计','用于研究婴儿的深度知觉','结果表明婴儿很早就具有深度知觉','实验中婴儿在深侧表现出回避反应','实验中的婴儿会真实坠落并受伤'], a:[0,1,2,3], e:'视崖上方覆盖透明玻璃，婴儿不会真的坠落，因此该实验在伦理上是可接受的。' },
    { t:'multiple', q:'感觉剥夺实验的主要发现包括（　）。', o:['被试出现注意涣散、思维迟钝','部分被试产生幻觉','情绪变得不稳定','感觉剥夺可提高学习效率'], a:[0,1,2], e:'感觉剥夺说明环境刺激对维持正常心理功能十分必要。' },
    { t:'judge', q:'暗适应过程主要由锥体细胞完成，明适应过程主要由棒体细胞完成。', a:false, e:'相反：暗适应主要由棒体细胞完成，明适应主要由锥体细胞完成。', tag:['易错'] },
    { t:'term', q:'视觉悬崖', a:'视觉悬崖是吉布森和沃克设计的一种研究婴儿深度知觉的装置。装置上覆盖玻璃，中间有一道视觉上的“悬崖”（一侧为浅区，一侧有落差形成深区）。实验发现 6 个月左右的婴儿在爬到深区边缘时表现出犹豫、回避或心率变化，说明婴儿在会爬之前就已经具有深度知觉。该实验是深度知觉发展研究的经典实验。' },
    { t:'short', q:'简述用心理物理学方法测量大小恒常性的基本思路。', a:'1）在标准距离呈现标准刺激，在另一距离呈现比较刺激，让被试调整比较刺激的大小，使之与标准刺激看起来相等；\n2）计算恒常性指标：布伦斯威克比率 BR = 知觉大小 / 客体实际大小对应的视网膜像大小，邵勒斯比率 TR = (lg 知觉大小 − lg 视网膜像大小) / (lg 实际大小 − lg 视网膜像大小)；\n3）结果解释：若 BR = 1，表示完全恒常；若 BR 等于视网膜像大小的比值，表示无恒常性；一般介于两者之间，说明存在部分恒常性。' }
  ]
},

/* ------------------------------ 第 7 章 ------------------------------ */
{
  name: '第7章 注意实验',
  items: [
    { t:'single', q:'彻里（Cherry）用双耳分听任务研究的是（　）。', o:['选择性注意','记忆容量','问题解决','情绪唤醒'], a:0, e:'双耳分听是研究选择性注意的经典范式，要求被试只听一个通道（追随耳）的内容。', tag:['高频','必考'] },
    { t:'single', q:'布罗德本特基于双耳分听实验提出的注意模型是（　）。', o:['过滤器模型','衰减模型','后期选择模型','资源分配模型'], a:0, e:'布罗德本特的过滤器模型认为注意是一个“全或无”的过滤器，位于知觉的早期阶段。', tag:['高频','必考'] },
    { t:'single', q:'特瑞斯曼提出的注意模型是（　）。', o:['过滤器模型','衰减模型','后期选择模型','多资源模型'], a:1, e:'特瑞斯曼的衰减模型认为非注意通道的信息并非完全被阻断，而是被衰减，阈值低的词仍可被识别（如“鸡尾酒会效应”）。' },
    { t:'single', q:'“鸡尾酒会效应”最能说明（　）。', o:['未注意的信息也能得到一定程度的加工','注意是完全全或无的过滤器','人不能同时加工多个通道','注意与记忆无关'], a:0, e:'在嘈杂的鸡尾酒会上能听到别人提到自己的名字，支持特瑞斯曼的衰减模型。', tag:['高频'] },
    { t:'single', q:'波斯纳（Posner）的线索范式主要用于研究（　）。', o:['注意的空间定向','短时记忆容量','概念形成','道德判断'], a:0, e:'波斯纳用空间线索提示被试目标可能出现的位置，通过有效线索与无效线索的反应时差异研究注意的空间定向。', tag:['高频','必考'] },
    { t:'single', q:'在波斯纳线索范式中，当线索与目标位置不一致时，被试的反应时（　）。', o:['比线索有效时更短','比线索有效时更长','与线索有效时相同','无法预测'], a:1, e:'无效线索条件下需要重新定向注意，反应时更长，其差值反映注意转移的成本。' },
    { t:'single', q:'返回抑制（IOR）通常出现在线索与目标之间的时间间隔（SOA）为（　）时。', o:['小于 150 毫秒','大于 300 毫秒','恰好 0 毫秒','不存在条件限制'], a:1, e:'SOA 较短（约小于 150ms）时出现易化效应，SOA 较长（大于约 300ms）时出现返回抑制。', tag:['高频','易错'] },
    { t:'single', q:'返回抑制是指（　）。', o:['对先前注意过的位置的加工变慢','对新颖刺激的加工变快','注意不能转移','对熟悉刺激的反应变快'], a:0, e:'返回抑制是波斯纳发现的现象，被认为有助于提高视觉搜索效率，避免注意反复回到已搜索过的位置。' },
    { t:'single', q:'特瑞斯曼和格拉德提出的解释视觉搜索的模型是（　）。', o:['特征整合理论','过滤器模型','衰减模型','双加工理论'], a:0, e:'特征整合理论认为特征搜索是平行加工（快速、不受项目数影响），联合搜索需要集中注意进行系列加工（项目越多越慢）。', tag:['高频','必考'] },
    { t:'single', q:'在视觉搜索实验中，搜索效率不受项目数量影响的搜索类型是（　）。', o:['特征搜索','联合搜索','系列搜索','自由搜索'], a:0, e:'特征搜索的搜索函数斜率接近零；联合搜索的斜率显著大于零。' },
    { t:'single', q:'Stroop 任务主要研究（　）。', o:['自动化加工与注意控制','短时记忆容量','深度知觉','概念形成'], a:0, e:'Stroop 效应指对颜色命名时，字义与颜色不一致会造成干扰，反映了自动化加工与注意控制之间的冲突。', tag:['高频','必考'] },
    { t:'single', q:'注意瞬脱（attentional blink）是指（　）。', o:['在快速序列呈现中，被试在识别第一个目标后短时间内难以识别第二个目标','注意持续时间过短','注意范围过小','注意易于分散'], a:0, e:'注意瞬脱反映了注意在时间维度上的有限性，是研究时间选择性注意的重要现象。', tag:['高频'] },
    { t:'multiple', q:'关于选择性注意的理论模型，下列匹配正确的有（　）。', o:['布罗德本特——过滤器模型','特瑞斯曼——衰减模型','多伊奇——后期选择模型','卡尼曼——资源限制理论','特瑞斯曼——特征整合理论'], a:[0,1,2,3], e:'特征整合理论虽然也由特瑞斯曼提出，但它解释的是视觉搜索中的特征捆绑，属于注意的知觉整合理论，不属于通道选择模型。' },
    { t:'multiple', q:'研究注意的常用实验范式有（　）。', o:['双耳分听','空间线索范式','视觉搜索范式','Stroop 任务','延迟满足范式'], a:[0,1,2,3], e:'延迟满足范式研究的是自我控制与延迟满足能力，不属于注意研究范式。此外还有注意瞬脱、负启动、持续性操作测验等。' },
    { t:'judge', q:'特征整合理论认为联合搜索需要集中注意的参与。', a:true, e:'特征整合理论认为注意的作用是把分散的特征“捆绑”成完整的客体，因此联合搜索需要注意参与。' },
    { t:'term', q:'返回抑制', a:'返回抑制是波斯纳在空间线索范式中发现的现象：当线索与目标之间的时间间隔（SOA）较长（约大于 300 毫秒）时，出现在先前被线索提示过的位置上的目标，其反应时反而比未被提示位置上的目标更长，即对已注意过的位置出现加工抑制。返回抑制被认为有助于提高视觉搜索的效率，使注意不再反复回到已搜索过的位置。' },
    { t:'term', q:'注意瞬脱', a:'注意瞬脱是雷蒙德等人发现的现象：在快速序列视觉呈现（RSVP）任务中，被试正确识别第一个目标（T1）之后，在大约 200—500 毫秒的时间窗口内，对第二个目标（T2）的识别正确率显著下降，就像注意“眨眼”了一样。它反映了注意在时间维度上的容量限制，是研究时间性选择性注意的重要范式。' },
    { t:'short', q:'简述特征整合理论的基本观点及其实验证据。', a:'1）基本观点（特瑞斯曼和格拉德）：视觉加工早期是平行的、以特征为单位（颜色、方向、大小等）的加工；特征处于“自由漂浮”状态，需要通过集中注意把它们捆绑成完整的客体。因此特征搜索是平行加工，联合搜索是系列加工。\n2）实验证据：视觉搜索实验表明，特征搜索的反应时不随干扰项数量增加而显著增加（斜率接近零）；而联合搜索的反应时随项目数线性增加（斜率明显大于零）。\n3）意义：该理论较好地解释了视觉搜索的两种模式，也说明了注意在知觉整合中的“捆绑”作用。' }
  ]
},

    { t:'judge', q:'内隐记忆通常不能用传统的自由回忆和再认任务直接测量。', a:true, e:'内隐记忆是无意识的，需要通过词干补笔等间接测量任务的启动效应来反映。' },
    { t:'term', q:'节省法', a:'节省法是艾宾浩斯研究记忆与遗忘时使用的测量方法。具体做法是：先学习材料并记录达到完全背诵所需的次数（或时间），间隔一段时间后再次学习同样的材料，记录重新达到完全背诵所需的次数（或时间）。两次所需次数之差与初次所需次数的比值即为节省率（节省百分数），用它作为保持量的指标。节省率越高，说明保持得越好。' },
    { t:'term', q:'DRM 范式', a:'DRM 范式是研究错误记忆的经典实验范式，由迪斯、罗迪格和麦克德莫特提出。实验中向被试呈现若干组词表，每个词表由与某个未呈现的关键诱饵词（如“床”）高度语义关联的词（如“枕头、睡觉、做梦”）组成。学习后进行自由回忆或再认测验，结果发现被试会以很高的比例错误地“回忆”或“再认”从未呈现过的关键诱饵词。该范式说明记忆并非对经验的精确复制，而具有建构性。' },
    { t:'short', q:'简述内隐记忆与外显记忆的区别及其测量方法。', a:'区别：\n1）意识性：外显记忆是有意识的、需要有意提取的记忆；内隐记忆是无意识的，个体并未意识到自己在使用过去的经验；\n2）测量方式：外显记忆用直接测量（自由回忆、线索回忆、再认）；内隐记忆用间接测量（词干补笔、知觉辨认、词汇判断等启动效应任务）；\n3）影响因素：外显记忆受加工水平、学习意向影响较大，内隐记忆受这些因素影响较小；\n4）发展：外显记忆随年龄发展较慢，内隐记忆出现较早；\n5）神经基础：外显记忆依赖海马和内侧颞叶，内隐记忆更多依赖皮层相关区域和基底节等。' }

  if (type === 'judge') {
    if (typeof a === 'boolean') return a;
    const s = String(a == null ? '' : a).trim();
    if (/^(对|正确|是|true|t|√|✓|yes|y|1)$/i.test(s)) return true;
    if (/^(错|错误|否|false|f|×|x|no|n|0)$/i.test(s)) return false;
    return true;
  }
  if (type === 'multiple') {
    if (Array.isArray(a)) {
      const idx = a.map(x => typeof x === 'number' ? x : LETTER.indexOf(String(x).trim().toUpperCase()))
                   .filter(x => x >= 0);
      return idx.sort((x, y) => x - y);
    }
    const s = String(a == null ? '' : a);
    const idx = [];
    for (const ch of s.toUpperCase()) {
      const i = LETTER.indexOf(ch);
      if (i >= 0 && idx.indexOf(i) < 0) idx.push(i);
    }
    return idx.sort((x, y) => x - y);
  }
  if (type === 'single') {
    if (typeof a === 'number') return a;
    const s = String(a == null ? '' : a).trim().toUpperCase();
    const m = s.match(/[A-H]/);
    if (m) return LETTER.indexOf(m[0]);
    const n = parseInt(s, 10);
    return isNaN(n) ? 0 : n - 1;
  }
  return String(a == null ? '' : a);
}

function makeQuestion(raw, subjectName, chapterName) {
  const stem = String(raw.q || raw.stem || raw.question || '').trim();
  if (!stem) return null;
  let type = normType(raw.t || raw.type);
  let options = raw.o || raw.options || raw.opts || [];
  if (typeof options === 'string') options = options.split(/\s*[|｜]\s*/);
  options = (options || []).map(x => String(x).trim()).filter(x => x !== '');

  // 自动纠偏：没有选项的单选/多选 -> 判断或主观题
  if (!options.length) {
    if (type === 'single' || type === 'multiple') {
      const s = String(raw.a === undefined ? '' : raw.a);
      type = /^(对|错|正确|错误|√|×|true|false|t|f)$/i.test(s.trim()) ? 'judge' : 'short';
    }
  } else if (type === 'single' && Array.isArray(raw.a) && raw.a.length > 1) {
    type = 'multiple';
  }

  const id = (raw.id ? String(raw.id) : '') || hash(subjectName + '|' + chapterName + '|' + stem);
  const item = {
    id,
    subject: subjectName,
    chapter: chapterName,
    type,
    stem,
    options,
    answer: normAnswer(type, raw.a !== undefined ? raw.a : raw.answer, options),
    expl: String(raw.e || raw.expl || raw.analysis || raw.exp || '').trim(),
    tags: [].concat(raw.tag || raw.tags || []).map(x => String(x)).filter(Boolean),
    custom: !!raw.custom
  };
  if (type === 'single' && (item.answer < 0 || item.answer >= options.length)) item.answer = 0;
  if (type === 'multiple' && (!item.answer.length)) item.answer = [0];
  return item;
}

function loadBank(bank) {
  if (!bank || !bank.subject || !Array.isArray(bank.chapters)) return;
  // 同名科目合并（方便把自建题目挂到内置科目下面）
  let subj = SUBJECTS.find(s => s.name === bank.subject);
  if (!subj) {
    subj = { name: bank.subject, icon: bank.icon || '📘', desc: bank.desc || '',
             chapters: [], count: 0, questionIds: [] };
    SUBJECTS.push(subj);
  } else if (subj.chapters.some(c => c.name === (bank.chapters[0] || {}).name)) {
    // 同一章节重复导入时加后缀，避免两个同名章节
    const stamp = new Date();
    bank = Object.assign({}, bank, {
      chapters: bank.chapters.map(c => Object.assign({}, c, {
        name: c.name + '（' + pad2(stamp.getMonth() + 1) + pad2(stamp.getDate()) + '导入）'
      }))
    });
  }
  for (const ch of bank.chapters) {
    const chap = { name: ch.name || '未分类', ids: [], count: 0 };
    for (const raw of (ch.items || [])) {
      const q = makeQuestion(raw, bank.subject, chap.name);
      if (!q) continue;
      QUESTIONS.push(q);
      BY_ID.set(q.id, q);
      chap.ids.push(q.id);
      subj.questionIds.push(q.id);
    }
    chap.count = chap.ids.length;
    subj.count += chap.count;
    if (chap.count) subj.chapters.push(chap);
  }
}

function loadCustom() {
  const raw = LS.get(K.custom, []);
  for (const b of raw) loadBank(Object.assign({}, b, { custom: true }));
}

/* ==========================================================================
   4. 作答记录
   ========================================================================== */

function rec(id) {
  let r = PROG[id];
  if (!r) r = PROG[id] = { n: 0, ok: 0, last: null, ts: 0, streak: 0 };
  return r;
}
/** 记录一次作答。correct: 是否正确 */
function recordAnswer(id, correct) {
  const r = rec(id);
  r.n++;
  if (correct) { r.ok++; r.streak = (r.streak || 0) + 1; }
  else r.streak = 0;
  r.last = !!correct;
  r.ts = Date.now();
  const dk = todayKey();
  DAYS[dk] = (DAYS[dk] || 0) + 1;
  saveProg(); saveDays();
  touchStreak();
}
function isDone(id)  { const r = PROG[id]; return !!(r && r.n > 0); }
function isRight(id) { const r = PROG[id]; return !!(r && r.last === true); }
function isWrong(id) { const r = PROG[id]; return !!(r && r.last === false); }
function wrongIds()  { return QUESTIONS.filter(q => isWrong(q.id)).map(q => q.id); }
function favIds()    { return FAV.filter(id => BY_ID.has(id)); }
function doneCount(ids) { return ids.filter(isDone).length; }
function rightCount(ids) { return ids.filter(isRight).length; }

/* 连续打卡 */
function touchStreak() { /* 由 calcStreak 实时计算，无需存 */
}
function calcStreak() {
  let n = 0;
  for (let i = 0; i < 400; i++) {
    const k = todayKey(dayOffset(-i));
    if ((DAYS[k] || 0) > 0) n++;
    else if (i === 0) continue;   // 今天还没刷不算断
    else break;
  }
  return n;
}

/** 智能抽题：优先未做过的和做错的，兼顾各章节均衡 */
function pickSmart(n) {
  const byChapter = new Map();
  for (const q of QUESTIONS) {
    if (!byChapter.has(q.chapter)) byChapter.set(q.chapter, []);
    byChapter.get(q.chapter).push(q.id);
  }
  const score = id => {
    const r = PROG[id];
    if (!r || r.n === 0) return 3;          // 没做过
    if (r.last === false) return 2;         // 上次做错
    if (r.streak >= 2) return 0;            // 已掌握
    return 1;                               // 做过但不稳
  };
  const buckets = [[], [], [], []];
  for (const q of QUESTIONS) buckets[score(q.id)].push(q.id);
  const out = [];
  const groups = [shuffle(buckets[3]), shuffle(buckets[2]), shuffle(buckets[1]), shuffle(buckets[0])];
  const chapterSeen = new Map();
  while (out.length < n) {
    let added = false;
    for (const g of groups) {
      // 在每个优先级桶里，尽量先取本章节出现次数少的
      let best = -1, bestC = 1e9;
      for (let i = 0; i < g.length; i++) {
        const c = chapterSeen.get(BY_ID.get(g[i]).chapter) || 0;
        if (c < bestC) { bestC = c; best = i; }
        if (bestC === 0) break;
      }
      if (best >= 0) {
        const id = g.splice(best, 1)[0];
        const ch = BY_ID.get(id).chapter;
        chapterSeen.set(ch, (chapterSeen.get(ch) || 0) + 1);
        out.push(id);
        added = true;
        break;
      }
    }
    if (!added) break;
  }
  // 不够就整体随机补
  if (out.length < n) {
    for (const id of shuffle(allIds())) {
      if (out.length >= n) break;
      if (out.indexOf(id) < 0) out.push(id);
    }
  }
  return shuffle(out);
}

      h('span', { class: 'pill ' + (TYPE_COLOR[curQ().type] || '') }, TYPE_NAME[curQ().type]),
      h('span', { class: 'q-count' }, (S.idx + 1) + ' / ' + S.ids.length +
        (answered ? ' · 已答' + answered : ''))
    )
  );
}

function curQ() { return BY_ID.get(S.ids[S.idx]) || QUESTIONS[0]; }

function questionBody() {
  const q = curQ();
  const judged = !!S.judged[q.id];
  const nodes = [];

  nodes.push(h('div', { class: 'q-stem' },
    h('span', { class: 'idx' }, (S.idx + 1) + '.'),
    q.stem,
    q.tags.length ? h('div', { class: 'q-meta' },
      q.tags.map(t => h('span', { class: 'tag' + (/高频|必考|重点/.test(t) ? ' hot' : '') }, t))) : null
  ));

  if (q.type === 'term' || q.type === 'short' || q.type === 'essay') {
    nodes.push(reciteBlock(q, judged));
    return h('div', null, nodes);
  }

  if (q.type === 'judge') {
    nodes.push(optionList(q, judged, [
      { label: '正确', key: '√', value: true },
      { label: '错误', key: '×', value: false }
    ]));
  } else {
    nodes.push(optionList(q, judged, q.options.map((t, i) => ({
      label: t, key: LETTER[i], value: i
    }))));
  }

  if (judged || S.recite) nodes.push(answerBox(q));
  return h('div', null, nodes);
}

function optionList(q, judged, entries) {
  const pick = S.picks[q.id];
  const correct = q.answer;
  const multi = q.type === 'multiple';
  const order = displayOrder(q, entries);

  return h('div', { class: 'opts' }, order.map((en, di) => {
    let cls = 'opt';
    let isPicked;
    if (multi) isPicked = Array.isArray(pick) && pick.indexOf(en.value) >= 0;
    else isPicked = pick === en.value;

    const isAns = multi ? (Array.isArray(correct) && correct.indexOf(en.value) >= 0) : correct === en.value;
    if (judged) {
      if (isAns) cls += ' right';
      else if (isPicked) cls += ' wrong';
    } else if (isPicked) cls += ' picked';

    return h('button', {
      class: cls, disabled: judged,
      onClick: () => onPick(q, en.value, judged)
    },
      h('span', { class: 'key' }, multi ? en.key : LETTER[di]),
      h('span', { class: 'txt' }, en.label)
    );
  }));
}

/** 选项展示顺序。开启「选项乱序」时对单选题做稳定乱序（同一题每次顺序一致） */
function displayOrder(q, entries) {
  if (!(SET.shuffleOpt && q.type === 'single') || entries.length < 2) return entries;
  if (!S.order) S.order = {};
  if (!S.order[q.id] || S.order[q.id].length !== entries.length) {
    const idx = entries.map((_, i) => i);
    S.order[q.id] = idx.sort((a, b) =>
      (hash(q.id + '#' + a) % 9973) - (hash(q.id + '#' + b) % 9973) || a - b);
  }
  return S.order[q.id].map(i => entries[i]);
}

/** 某个原始选项索引在当前展示顺序里的字母 */
function displayLetter(q, value) {
  if (q.type !== 'single') return '';
  const order = displayOrder(q, q.options.map((t, i) => ({ label: t, key: LETTER[i], value: i })));
  const pos = order.findIndex(e => e.value === value);
  return LETTER[pos >= 0 ? pos : value];
}

function reciteBlock(q, judged) {
  const show = judged || S.recite || SET.reciteAll;
  const res = S.results[q.id];
  return h('div', null,
    show
      ? h('div', { class: 'answer-box' },
          h('div', { class: 'expl' },
            h('span', { class: 'lbl' }, '参考答案'),
            h('div', { class: 'ref-ans' }, q.answer || '（暂无参考答案）')
          ),
          q.expl ? h('div', { class: 'expl', style: { marginTop: '12px', borderTop: 'none', paddingTop: '0' } },
            h('span', { class: 'lbl' }, '知识点'),
            q.expl) : null,
          h('div', { class: 'self-eval' },
            h('button', { class: 'btn ' + (res === true ? 'primary' : 'ghost'),
              onClick: () => selfEval(q, true) }, '✓ 背下来了'),
            h('button', { class: 'btn ' + (res === false ? 'primary' : 'ghost'),
              onClick: () => selfEval(q, false) }, '✗ 还没记住')
          )
        )
      : h('div', { class: 'recite-hint' },
          h('div', { style: { fontSize: '26px', marginBottom: '6px' } }, '🧠'),
          '先在心里默背一遍，',
          h('br'),
          '想好了再点下面的「看答案」'
        )
  );
}

function selfEval(q, ok) {
  S.results[q.id] = ok;
  S.judged[q.id] = true;
  recordAnswer(q.id, ok);
  haptic(ok ? 10 : 20);
  saveSession();
  refreshBody();
  if (ok && SET.autoNext) setTimeout(nextQuestion, 320);
}

function onPick(q, value, judged) {
  if (judged) return;
  if (q.type === 'multiple') {
    let arr = Array.isArray(S.picks[q.id]) ? S.picks[q.id].slice() : [];
    const i = arr.indexOf(value);
    if (i >= 0) arr.splice(i, 1); else arr.push(value);
    arr.sort((a, b) => a - b);
    S.picks[q.id] = arr;
    refreshBody();
    refreshActions();
    return;
  }
  S.picks[q.id] = value;
  if (S.instant) judge(q);
  else { refreshBody(); refreshActions(); }
}

function sameSet(a, b) {
  if (!Array.isArray(a) || !Array.isArray(b)) return false;
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}

function judge(q) {
  const pick = S.picks[q.id];
  let ok;
  if (q.type === 'multiple') ok = sameSet(pick, q.answer);
  else ok = pick === q.answer;
  S.judged[q.id] = true;
  S.results[q.id] = ok;
  recordAnswer(q.id, ok);
  haptic(ok ? 10 : [12, 40, 12]);
  saveSession();
  refreshBody();
  refreshActions();
  if (ok && SET.autoNext) setTimeout(nextQuestion, 520);
}

function refreshActions() {
  const acts = $('#qactions');
  if (!acts) return;
  acts.textContent = '';
  append(acts, [questionActions()]);
}

function answerBox(q) {
  const ok = S.results[q.id];
  if (S.recite && ok === undefined) {
    return h('div', { class: 'answer-box' },
      h('div', { class: 'ans-line' },
        '正确答案：', h('b', null, answerText(q))),
      q.expl ? h('div', { class: 'expl' },
        h('span', { class: 'lbl' }, '知识点'),
        q.expl) : null
    );
  }
  return h('div', { class: 'answer-box' },
    h('div', { class: 'verdict ' + (ok ? 'ok' : 'bad') },
      ok ? '✓ 答对了' : '✕ 答错了'),
    h('div', { class: 'ans-line' },
      '正确答案：', h('b', null, answerText(q))
    ),
    q.expl ? h('div', { class: 'expl' },
      h('span', { class: 'lbl' }, '解析'),
      q.expl) : null
  );
}

function answerText(q) {
  if (q.type === 'judge') return q.answer ? '正确' : '错误';
  if (q.type === 'multiple') return q.answer.map(i => LETTER[i]).join('');
  if (q.type === 'single') return displayLetter(q, q.answer) + '. ' + (q.options[q.answer] || '');
  return '';
}

function questionActions() {
  const q = curQ();
  const judged = !!S.judged[q.id];
  const fav = FAV.indexOf(q.id) >= 0;
  const pick = S.picks[q.id];
  const hasPick = Array.isArray(pick) ? pick.length > 0 : pick !== undefined;
  const needSubmit = !judged && !S.recite && (
    q.type === 'multiple'
      ? hasPick
      : ((q.type === 'single' || q.type === 'judge') && hasPick && !S.instant)
  );
  const isRecite = q.type === 'term' || q.type === 'short' || q.type === 'essay';

  return h('div', { class: 'q-actions', id: 'qactions' },
    h('button', {
      class: 'icon-btn' + (fav ? ' on' : ''),
      onClick: () => {
        const i = FAV.indexOf(q.id);
        if (i >= 0) { FAV.splice(i, 1); toast('已取消收藏'); }
        else { FAV.push(q.id); toast('已收藏 ⭐'); }
        saveFav(); refreshBody();
        refreshActions();
      }
    }, fav ? '⭐' : '☆'),
    S.idx > 0 ? h('button', { class: 'btn ghost sm', style: { flex: '0 0 auto', padding: '13px 15px' },
      onClick: prevQuestion }, '上一题') : null,
    needSubmit
      ? h('button', { class: 'btn primary', onClick: () => judge(q) }, '提交答案')
      : (isRecite && !judged && !S.recite
          ? h('button', { class: 'btn primary',
              onClick: () => { S.judged[q.id] = true; saveSession(); refreshBody(); refreshActions(); } }, '看答案')
          : h('button', {
              class: 'btn ' + (judged || S.recite || isRecite ? 'primary' : 'ghost'),
              onClick: nextQuestion
            }, S.idx >= S.ids.length - 1 ? '完成练习'
               : (judged || S.recite || isRecite ? '下一题' : '跳过'))
        )
  );
}

function refreshBody() {
  const body = $('#qbody');
  if (!body) return;
  body.textContent = '';
  body.appendChild(questionBody());
  const prog = $('.qprog i');
  if (prog) prog.style.width = pct(S.idx + 1, S.ids.length) + '%';
  const cnt = $('.q-count');
  if (cnt) cnt.textContent = (S.idx + 1) + ' / ' + S.ids.length +
    (Object.keys(S.judged).length ? ' · 已答' + Object.keys(S.judged).length : '');
}
function rerenderPractice() {
  const v = $('#view');
  v.textContent = '';
  append(v, [VIEWS.practice({ name: 'practice' })]);
}
function nextQuestion() {
  if (S.idx >= S.ids.length - 1) { finishSession(); return; }
  S.idx++;
  saveSession();
  rerenderPractice();
  const v = $('#view'); v.scrollTop = 0;
}
function prevQuestion() {
  if (S.idx <= 0) return;
  S.idx--;
  saveSession();
  rerenderPractice();
  const v = $('#view'); v.scrollTop = 0;
}
function gotoQuestion(i) {
  S.idx = clamp(i, 0, S.ids.length - 1);
  saveSession();
  rerenderPractice();
  const v = $('#view'); v.scrollTop = 0;
}

/* ---------------- 结算 ---------------- */

function finishSession() {
  S.finished = true;
  LS.del(K.sess);
  const ids = S.ids;
  const answered = ids.filter(id => S.judged[id]);
  const right = answered.filter(id => S.results[id] === true);
  const wrong = answered.filter(id => S.results[id] === false);
  const skipped = ids.filter(id => !S.judged[id]);
  const secs = Math.max(1, Math.round((Date.now() - S.startedAt) / 1000));
  S.summary = { ids, answered: answered.length, right: right.length,
                wrong: wrong.length, skipped: skipped.length, secs };
  reset({ name: 'result' });
}

VIEWS.result = function () {
  const s = (S && S.summary) || { ids: [], answered: 0, right: 0, wrong: 0, skipped: 0, secs: 0 };
  const acc = pct(s.right, s.answered);
  const total = s.ids.length;
  const wrongIdList = S ? s.ids.filter(id => S.results[id] === false) : [];
  const C = 2 * Math.PI * 56;
  const ringColor = acc >= 80 ? 'var(--ok)' : acc >= 60 ? 'var(--warn)' : 'var(--bad)';
  const ring = h('div', { class: 'ring' },
    h('svg', { viewBox: '0 0 132 132', style: { position: 'absolute', inset: '0', width: '100%', height: '100%', transform: 'rotate(-90deg)' } },
      h('circle', { cx: '66', cy: '66', r: '56',
        style: { fill: 'none', stroke: 'var(--line)', strokeWidth: '10' } }),
      h('circle', { cx: '66', cy: '66', r: '56',
        style: { fill: 'none', stroke: ringColor, strokeWidth: '10', strokeLinecap: 'round',
                 strokeDasharray: String(C), strokeDashoffset: String(C * (1 - acc / 100)),
                 transition: 'stroke-dashoffset .7s ease' } })
    ),
    h('div', { class: 'inner' },
      h('b', null, acc + '%'),
      h('span', null, '正确率')
    )
  );

  const praise = acc >= 90 ? '太强了！这套题基本拿下 🎉'
    : acc >= 75 ? '不错，再把错题过一遍就更稳了'
    : acc >= 50 ? '有基础，错题需要重点复习'
    : '这块还比较薄弱，建议先看一遍书再来';

  return h('div', null,
    h('div', { class: 'result' },
      ring,
      h('h2', null, praise),
      h('p', { class: 'muted tiny' }, (S && S.title ? S.title + ' · ' : '') + '用时 ' + fmtTime(s.secs)),
      h('div', { class: 'res-grid' },
        h('div', null, h('b', { style: { color: 'var(--ok)' } }, s.right), h('span', null, '答对')),
        h('div', null, h('b', { style: { color: 'var(--bad)' } }, s.wrong), h('span', null, '答错')),
        h('div', null, h('b', null, s.skipped), h('span', null, '未答'))
      )
    ),
    h('div', { class: 'sec' },
      h('div', { class: 'list' },
        liRow('🔁', '再做一遍这套题', total + ' 题', () => {
          startSession({ title: S.title, ids: S.ids, shuffle: true });
        }),
        wrongIdList.length
          ? liRow('❌', '只重做错题', wrongIdList.length + ' 题', () => {
              startSession({ title: '错题重做', ids: wrongIdList, shuffle: true });
            })
          : null,
        liRow('📖', '看错题解析', '进入错题本', () => reset({ name: 'wrong' }))
      )
    ),
    h('button', { class: 'btn primary', style: { marginTop: '6px' },
      onClick: () => { S = null; reset({ name: 'home' }); } }, '回到首页')
  );
};

      h('div', { class: 'list' },
        ...[...chMap.entries()].map(([chName, qs]) =>
          liRow('·', chName.replace(/^第\d+章\s*/, ''),

            () => startSession({ title: '错题 · ' + chName, ids: qs.map(q => q.id), shuffle: true }),
            '重做')
        )
      )
    ));
  }

  return h('div', null,

      h('div', { class: 'row' },

                h('span', { class: 'ellipsis' }, ch.name.replace(/^第(\d+)章\s*/, '第$1章 · ')),

              ),

            );

function statCard(label, big, sub) {
  return h('div', { class: 'stat-card' },
    h('span', null, label),
    h('b', null, big),
    h('span', { class: 'tiny' }, sub)
  );
}
function sumDays(n) {
  let s = 0;
  for (let i = 0; i < n; i++) s += DAYS[todayKey(dayOffset(-i))] || 0;
  return s;
}
function heatmap() {
  const now = new Date();
  now.setHours(12, 0, 0, 0);
  const dow = (now.getDay() + 6) % 7;           // 周一 = 0
  const start = new Date(now);
  start.setDate(start.getDate() - dow - 12 * 7);  // 12 周前的周一
  const cells = [];
  const vals = [];
  for (let r = 0; r < 7; r++) {
    for (let c = 0; c < 13; c++) {
      const d = new Date(start);
      d.setDate(d.getDate() + c * 7 + r);
      const future = d > now;
      const v = future ? 0 : (DAYS[todayKey(d)] || 0);
      vals.push(v);
      cells.push({ d, v, future });
    }
  }
  const max = Math.max(SET.daily, ...vals) || 1;
  return h('div', null,
    h('div', { class: 'heat' }, cells.map(c => {
      if (c.future) return h('i', { style: { opacity: '.35' } });
      if (!c.v) return h('i');
      const lvl = clamp(Math.ceil((c.v / max) * 4), 1, 4);
      return h('i', { class: 'l' + lvl });
    })),
    h('div', { class: 'row tiny muted', style: { marginTop: '9px', justifyContent: 'space-between' } },
      h('span', null, '13 周前'),
      h('span', null, '今天'),
      h('span', { class: 'row', style: { gap: '3px' } },
        h('span', null, '少'),
        h('i', { style: { width: '11px', height: '11px', borderRadius: '3px', background: 'var(--heat0)', display: 'block' } }),
        h('i', { style: { width: '11px', height: '11px', borderRadius: '3px', background: '#a99bf7', display: 'block' } }),
        h('i', { style: { width: '11px', height: '11px', borderRadius: '3px', background: '#6c5ce7', display: 'block' } }),
        h('span', null, '多')
      )
    )
  );
}

function doImport() {
  const text = ($('#importText').value || '').trim();
  if (!text) { toast('先粘贴内容再导入'); return; }
  const subjSel = $('#importSubject');
  let subjName = subjSel.value;
  if (subjName === '__new') {
    subjName = '我的题库';
    SUBJECTS.push({ name: subjName, icon: '📗', desc: '自己导入的题目',
                    chapters: [], count: 0, questionIds: [] });
    const opt = document.createElement('option');
    opt.value = opt.textContent = subjName;
    subjSel.insertBefore(opt, subjSel.lastChild);
    subjSel.value = subjName;
  }
  const chapName = ($('#importChapter').value || '').trim() || '我的补充题';

  let banks;
  try {
    banks = parseImport(text, subjName, chapName);
  } catch (e) {
    toast('解析失败：' + e.message);
    return;
  }
  const count = banks.reduce((n, b) => n + b.chapters.reduce((m, c) => m + c.items.length, 0), 0);
  if (!count) { toast('没有解析到题目，检查一下格式'); return; }

  const custom = LS.get(K.custom, []);
  custom.push(...banks.map(b => Object.assign({}, b, { custom: true })));
  if (!LS.set(K.custom, custom)) return;

  // 立刻加载进当前会话
  for (const b of banks) loadBank(Object.assign({}, b, { custom: true }));

  closeSheet();
  toast('成功导入 ' + count + ' 道题 🎉', 2600);
  render(current && current.name ? current : { name: 'home' });
}

function parseImport(text, defaultSubject, defaultChapter) {
  const t = text.trim();
  if (t[0] === '[' || t[0] === '{') return parseJsonImport(t, defaultSubject, defaultChapter);
  return parseTextImport(t, defaultSubject, defaultChapter);
}

function parseJsonImport(text, defaultSubject, defaultChapter) {
  let data = JSON.parse(text);
  if (Array.isArray(data) && data.length && (data[0].subject || data[0].chapters)) {
    // 已经是 bank 数组
    return data.map(b => normalizeBankShape(b, defaultSubject, defaultChapter));
  }
  if (!Array.isArray(data)) {
    if (data.subject || data.chapters) return [normalizeBankShape(data, defaultSubject, defaultChapter)];
    if (Array.isArray(data.questions)) data = data.questions;
    else throw new Error('JSON 结构不认识');
  }
  // 扁平题目数组
  const chapters = new Map();
  for (const raw of data) {
    const ch = raw.chapter || raw.ch || defaultChapter;
    if (!chapters.has(ch)) chapters.set(ch, []);
    chapters.get(ch).push(raw);
  }
  return [{
    subject: defaultSubject,
    chapters: [...chapters.entries()].map(([name, items]) => ({ name, items }))
  }];
}

function normalizeBankShape(b, defaultSubject, defaultChapter) {
  if (!b.chapters) {
    if (Array.isArray(b.questions)) {
      return { subject: b.subject || defaultSubject,
               chapters: [{ name: b.chapter || defaultChapter, items: b.questions }] };
    }
    throw new Error('缺少 chapters 字段');
  }
  return {
    subject: b.subject || defaultSubject,
    icon: b.icon,
    desc: b.desc,
    chapters: b.chapters.map(c => ({
      name: c.name || defaultChapter,
      items: c.items || c.questions || []
    }))
  };
}

/** 文本题库解析：兼容从 Word / PDF 复制出来的常见排版 */
function parseTextImport(text, defaultSubject, defaultChapter) {
  const lines = text.replace(/\r/g, '').split('\n');
  let subject = defaultSubject, chapter = defaultChapter;
  const chaptersMap = new Map();
  let cur = null;

  const push = () => {
    if (!cur) return;
    const stem = (cur.q || '').trim();
    if (stem && (cur.a !== undefined || cur.o.length)) {
      let chName = cur.chapter || chapter;
      if (!chaptersMap.has(chName)) chaptersMap.set(chName, []);
      chaptersMap.get(chName).push({
        t: cur.t, q: stem, o: cur.o, a: cur.a, e: cur.e, tag: cur.tag
      });
    }
    cur = null;
  };
  const start = (stem, type) => {
    cur = { q: stem, o: [], a: undefined, e: '', t: type, chapter: chapter, tag: [] };
  };

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;

    // # 科目 / # 章节
    let m = line.match(/^#+\s*(?:科目|学科|subject)\s*[:：]\s*(.+)$/i);
    if (m) { push(); subject = m[1].trim(); continue; }
    m = line.match(/^#+\s*(?:章节|章节名|chapter)\s*[:：]\s*(.+)$/i);
    if (m) { push(); chapter = m[1].trim(); continue; }
    if (line[0] === '#') {
      m = line.match(/^#+\s*(.+)$/);
      if (m) { push(); chapter = m[1].trim(); }
      continue;
    }

    // 选项：A. xxx / A、xxx / A）xxx
    m = line.match(/^([A-Ha-h])\s*[.、)．）:：]\s*(.+)$/);
    if (m && cur) {
      const k = m[1].toUpperCase();
      const idx = LETTER.indexOf(k);
      while (cur.o.length < idx) cur.o.push('');
      cur.o[idx] = m[2].trim();
      continue;
    }

    // 答案
    m = line.match(/^(?:正确|参考)?(?:答案|answer)\s*[:：]?\s*(.*)$/i);
    if (m && cur) {
      const val = m[1].trim();
      if (val) cur.a = (cur.a === undefined || cur.a === '' ? '' : cur.a) + val;
      else {
        // 答案在下一行
        const nxt = (lines[i + 1] || '').trim();
        if (nxt && !/^(解析|分析|考点|知识点)/.test(nxt)) { cur.a = nxt; i++; }
      }
      continue;
    }

    // 解析
    m = line.match(/^(?:解析|分析|考点|知识点)\s*[:：]\s*(.*)$/);
    if (m && cur) {
      cur.e = (cur.e ? cur.e + '\n' : '') + m[1].trim();
      continue;
    }

    // 章节小标题（一、二、 / 第X章）
    m = line.match(/^第\s*[一二三四五六七八九十百零\d]+\s*章[\s:：·、]*(.+)$/);
    if (m && !cur) { chapter = line; continue; }

    // 题型前缀
    m = line.match(/^(名词解释|简答|简述|论述|判断题|判断|多选|单选)\s*[:：、.]?\s*(.+)$/);
    if (m) {
      push();
      const kw = m[1];
      const type = /名词解释/.test(kw) ? 'term'
        : /论述/.test(kw) ? 'essay'
        : /简答|简述/.test(kw) ? 'short'
        : /判断/.test(kw) ? 'judge'
        : /多选/.test(kw) ? 'multiple' : 'single';
      start(m[2].trim(), type);
      continue;
    }

    // 题号起始：1. xxx / 1、xxx / (1) xxx
    m = line.match(/^[（(]?(\d{1,3})\s*[.、)．）]\s*(.*)$/);
    if (m) {
      push();
      start(m[2].trim(), undefined);
      continue;
    }

    // 其他行
    if (!cur) { start(line, undefined); continue; }
    if (cur.a !== undefined || cur.o.length) { push(); start(line, undefined); }
    else cur.q = (cur.q ? cur.q + ' ' : '') + line;
  }
  push();

  if (!chaptersMap.size) throw new Error('没有解析到题目');
  return [{
    subject: subject,
    chapters: [...chaptersMap.entries()].map(([name, items]) => ({ name, items }))
  }];
}

    ...SUBJECTS.map(subj => h('div', { class: 'sec' },
      h('div', { class: 'sec-hd' }, h('h2', null, subj.icon + ' ' + subj.name),
        h('span', { class: 'more' }, subj.count + ' 题')),
      h('div', { class: 'list' },
        subj.chapters.map(ch => h('div', { class: 'li' },
          h('div', { class: 'grow' },
            h('b', { class: 'ellipsis', style: { fontSize: '14px' } }, ch.name),
            h('span', null, ch.count + ' 题'))
        ))
      )
    )),
    custom.length ? h('div', { class: 'sec' },
      h('div', { class: 'sec-hd' }, h('h2', null, '我导入的题库')),
      h('div', { class: 'list' },
        custom.map((b, i) => h('div', { class: 'li' },
          h('div', { class: 'ic' }, '📗'),
          h('div', { class: 'grow' },
            h('b', null, b.subject || '未命名'),
            h('span', null, (b.chapters || []).map(c => c.name).join('、').slice(0, 30) +
              ' · ' + (b.chapters || []).reduce((n, c) => n + (c.items || []).length, 0) + ' 题')
          ),
          h('button', { class: 'chev', style: { padding: '6px 8px' },
            onClick: () => confirmSheet('删除导入的题库',
              '会删除这批导入的题目，它的做题记录会一起失效。确定吗？', '删除', () => {
                const arr = LS.get(K.custom, []);
                arr.splice(i, 1);
                LS.set(K.custom, arr);
                toast('已删除，正在重新加载…');
                setTimeout(() => location.reload(), 700);
              }) }, '🗑')
        ))
      )
    ) : null
  ]);
}

/* ==========================================================================
   15. 交互：手势 / 键盘 / 事件绑定
   ========================================================================== */

function bindSwipe() {
  const view = $('#view');
  let x0 = 0, y0 = 0, t0 = 0, tracking = false;
  view.addEventListener('touchstart', (e) => {
    if (!current || current.name !== 'practice') return;
    if (e.touches.length !== 1) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    t0 = Date.now(); tracking = true;
  }, { passive: true });
  view.addEventListener('touchend', (e) => {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0, dt = Date.now() - t0;
    if (dt > 700) return;
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.8) return;
    if (dx < 0) nextQuestion(); else prevQuestion();
  }, { passive: true });
}

function bindKeys() {
  document.addEventListener('keydown', (e) => {
    if (!current) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (current.name === 'practice' && S && S.ids.length) {
      const q = curQ();
      if (e.key === 'ArrowRight') { nextQuestion(); e.preventDefault(); return; }
      if (e.key === 'ArrowLeft') { prevQuestion(); e.preventDefault(); return; }
      if (/^[1-8]$/.test(e.key) && !S.judged[q.id]) {
        const i = +e.key - 1;
        if (q.type === 'judge') { if (i === 0) onPick(q, true, false); else if (i === 1) onPick(q, false, false); }
        else if (q.options[i] !== undefined) onPick(q, i, false);
        e.preventDefault(); return;
      }
      if (e.key === 'Enter') {
        if (!S.judged[q.id] && (q.type === 'single' || q.type === 'multiple' || q.type === 'judge') && S.picks[q.id] !== undefined) {
          if (!S.instant) judge(q);
        } else nextQuestion();
        e.preventDefault();
      }
    }
  });
}

/* ==========================================================================
   16. 启动
   ========================================================================== */

function init() {
  applyTheme();
  applyFont();

  const banks = window.__BANKS || [];
  for (const b of banks) loadBank(b);
  loadCustom();

  if (!QUESTIONS.length) {
    $('#view').appendChild(h('div', { class: 'empty' },
      h('div', { class: 'ic' }, '📭'),
      h('b', null, '题库没有加载出来'),
      h('p', null, '请确认 data/ 文件夹里的题库文件和 index.html 在一起。')));
    return;
  }

  $('#tbBack').addEventListener('click', back);
  $('#tbMore').addEventListener('click', () => {
    if (current && current.name === 'practice') openPracticeSheet();
    else if (current && current.name === 'result') openPracticeSheet();
  });
  $('#sheetClose').addEventListener('click', closeSheet);
  $('#sheetMask').addEventListener('click', (e) => {
    if (e.target === $('#sheetMask')) closeSheet();
  });
  $('.tab').forEach(b => b.addEventListener('click', () => reset({ name: b.dataset.tab })));

  bindSwipe();
  bindKeys();

  // 支持返回键（部分浏览器 / 安卓）
  window.addEventListener('popstate', () => {
    if (!$('#sheetMask').hidden) { closeSheet(); keepHistory(); return; }
    if (nav.length) { back(); keepHistory(); }
  });
  keepHistory();

  reset({ name: 'home' });

  // 离线缓存（仅在通过网址访问、且不是单文件版时生效）
  if (!window.__NO_SW && 'serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

function keepHistory() {
  try { history.pushState(null, ''); } catch (e) {}
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();

function parseImport(text, defaultSubject, defaultChapter) {
  const t = text.trim();
  if (t[0] === '[' || t[0] === '{') return parseJsonImport(t, defaultSubject, defaultChapter);
  return parseTextImport(t, defaultSubject, defaultChapter);
}

function parseJsonImport(text, defaultSubject, defaultChapter) {
  let data = JSON.parse(text);
  if (Array.isArray(data) && data.length && (data[0].subject || data[0].chapters)) {
    // 已经是 bank 数组
    return data.map(b => normalizeBankShape(b, defaultSubject, defaultChapter));
  }
  if (!Array.isArray(data)) {
    if (data.subject || data.chapters) return [normalizeBankShape(data, defaultSubject, defaultChapter)];
    if (Array.isArray(data.questions)) data = data.questions;
    else throw new Error('JSON 结构不认识');
  }
  // 扁平题目数组
  const chapters = new Map();
  for (const raw of data) {
    const ch = raw.chapter || raw.ch || defaultChapter;
    if (!chapters.has(ch)) chapters.set(ch, []);
    chapters.get(ch).push(raw);
  }
  return [{
    subject: defaultSubject,
    chapters: [...chapters.entries()].map(([name, items]) => ({ name, items }))
  }];
}

function normalizeBankShape(b, defaultSubject, defaultChapter) {
  if (!b.chapters) {
    if (Array.isArray(b.questions)) {
      return { subject: b.subject || defaultSubject,
               chapters: [{ name: b.chapter || defaultChapter, items: b.questions }] };
    }
    throw new Error('缺少 chapters 字段');
  }
  return {
    subject: b.subject || defaultSubject,
    icon: b.icon,
    desc: b.desc,
    chapters: b.chapters.map(c => ({
      name: c.name || defaultChapter,
      items: c.items || c.questions || []
    }))
  };
}

/** 文本题库解析：兼容从 Word / PDF 复制出来的常见排版 */
function parseTextImport(text, defaultSubject, defaultChapter) {
  const lines = text.replace(/\r/g, '').split('\n');
  let subject = defaultSubject, chapter = defaultChapter;
  const chaptersMap = new Map();
  let cur = null;

  const push = () => {
    if (!cur) return;
    const stem = (cur.q || '').trim();
    if (stem && (cur.a !== undefined || cur.o.length)) {
      let chName = cur.chapter || chapter;
      if (!chaptersMap.has(chName)) chaptersMap.set(chName, []);
      chaptersMap.get(chName).push({
        t: cur.t, q: stem, o: cur.o, a: cur.a, e: cur.e, tag: cur.tag
      });
    }
    cur = null;
  };
  const start = (stem, type) => {
    cur = { q: stem, o: [], a: undefined, e: '', t: type, chapter: chapter, tag: [] };
  };

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;

    // # 科目 / # 章节
    let m = line.match(/^#+\s*(?:科目|学科|subject)\s*[:：]\s*(.+)$/i);
    if (m) { push(); subject = m[1].trim(); continue; }
    m = line.match(/^#+\s*(?:章节|章节名|chapter)\s*[:：]\s*(.+)$/i);
    if (m) { push(); chapter = m[1].trim(); continue; }
    if (line[0] === '#') {
      m = line.match(/^#+\s*(.+)$/);
      if (m) { push(); chapter = m[1].trim(); }
      continue;
    }

    // 选项：A. xxx / A、xxx / A）xxx
    m = line.match(/^([A-Ha-h])\s*[.、)．）:：]\s*(.+)$/);
    if (m && cur) {
      const k = m[1].toUpperCase();
      const idx = LETTER.indexOf(k);
      while (cur.o.length < idx) cur.o.push('');
      cur.o[idx] = m[2].trim();
      continue;
    }

    // 答案
    m = line.match(/^(?:正确|参考)?(?:答案|answer)\s*[:：]?\s*(.*)$/i);
    if (m && cur) {
      const val = m[1].trim();
      if (val) cur.a = (cur.a === undefined || cur.a === '' ? '' : cur.a) + val;
      else {
        // 答案在下一行
        const nxt = (lines[i + 1] || '').trim();
        if (nxt && !/^(解析|分析|考点|知识点)/.test(nxt)) { cur.a = nxt; i++; }
      }
      continue;
    }

    // 解析
    m = line.match(/^(?:解析|分析|考点|知识点)\s*[:：]\s*(.*)$/);
    if (m && cur) {
      cur.e = (cur.e ? cur.e + '\n' : '') + m[1].trim();
      continue;
    }

    // 章节小标题（一、二、 / 第X章）
    m = line.match(/^第\s*[一二三四五六七八九十百零\d]+\s*章[\s:：·、]*(.+)$/);
    if (m && !cur) { chapter = line; continue; }

    // 题型前缀
    m = line.match(/^(名词解释|简答|简述|论述|判断题|判断|多选|单选)\s*[:：、.]?\s*(.+)$/);
    if (m) {
      push();
      const kw = m[1];
      const type = /名词解释/.test(kw) ? 'term'
        : /论述/.test(kw) ? 'essay'
        : /简答|简述/.test(kw) ? 'short'
        : /判断/.test(kw) ? 'judge'
        : /多选/.test(kw) ? 'multiple' : 'single';
      start(m[2].trim(), type);
      continue;
    }

    // 题号起始：1. xxx / 1、xxx / (1) xxx
    m = line.match(/^[（(]?(\d{1,3})\s*[.、)．）]\s*(.*)$/);
    if (m) {
      push();
      start(m[2].trim(), undefined);
      continue;
    }

    // 其他行
    if (!cur) { start(line, undefined); continue; }
    if (cur.a !== undefined || cur.o.length) { push(); start(line, undefined); }
    else cur.q = (cur.q ? cur.q + ' ' : '') + line;
  }
  push();

  if (!chaptersMap.size) throw new Error('没有解析到题目');
  return [{
    subject: subject,
    chapters: [...chaptersMap.entries()].map(([name, items]) => ({ name, items }))
  }];
}

/* ==========================================================================
   15. 背诵手册
   ========================================================================== */

const CARDS = [];              // 全部考点卡片
const CARD_BY_ID = new Map();
const CARD_SUBJECTS = [];      // [{name, icon, desc, count, ids, chapters:[{name, ids}]}]
let RECITE = LS.get(K.recite, {});

const CARD_TYPE_NAME = {
  term:  '名词解释',
  short: '简答要点',
  essay: '论述框架',
  table: '易混对比',
  exp:   '经典实验'
};
const CARD_TYPE_ORDER = ['term', 'short', 'essay', 'table', 'exp'];

/* 艾宾浩斯复习间隔（天），下标 = 掌握档位 */
const SRS_DAYS = [0, 1, 2, 4, 7, 15, 30];

function loadReciteBank(bank) {
  if (!bank || !bank.subject || !Array.isArray(bank.chapters)) return;
  let subj = CARD_SUBJECTS.find(s => s.name === bank.subject);
  if (!subj) {
    subj = { name: bank.subject, icon: bank.icon || '📖', desc: bank.desc || '',
             chapters: [], count: 0, ids: [] };
    CARD_SUBJECTS.push(subj);
  }
  for (const ch of bank.chapters) {
    const chap = { name: ch.name || '未分类', ids: [], count: 0 };
    for (const raw of (ch.cards || [])) {
      const title = String(raw.k || raw.title || '').trim();
      const body = String(raw.a || raw.body || '').trim();
      if (!title || !body) continue;
      const id = (raw.id ? String(raw.id) : '') ||
        hash(bank.subject + '|' + chap.name + '|' + title);
      const card = {
        id, subject: bank.subject, chapter: chap.name,
        type: (CARD_TYPE_NAME[raw.t] ? raw.t : 'term'),
        title, body,
        tip: String(raw.tip || '').trim(),
        freq: clamp(parseInt(raw.f, 10) || 1, 1, 3)
      };
      CARDS.push(card);
      CARD_BY_ID.set(id, card);
      chap.ids.push(id);
      subj.ids.push(id);
    }
    chap.count = chap.ids.length;
    subj.count += chap.count;
    if (chap.count) subj.chapters.push(chap);
  }
}

/* ---------------- 掌握度与复习排程 ---------------- */

function cardRec(id) {
  let r = RECITE[id];
  if (!r) r = RECITE[id] = { box: 0, due: 0, seen: 0, state: '', ts: 0 };
  return r;
}
function cardState(id) {          // new | no | vague | ok
  const r = RECITE[id];
  if (!r || !r.seen) return 'new';
  return r.state || 'ok';
}
function dayStart(offset) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  if (offset) d.setDate(d.getDate() + offset);
  return d.getTime();
}
/** 给卡片打分：0 没记住 / 1 有点模糊 / 2 记住了 */
function cardGrade(id, g) {
  const before = RECITE[id] ? JSON.parse(JSON.stringify(RECITE[id])) : null;
  const r = cardRec(id);
  r.seen++;
  r.ts = Date.now();
  if (g === 2) { r.box = Math.min(r.box + 1, SRS_DAYS.length - 1); r.state = 'ok'; }
  else if (g === 1) { r.box = Math.min(Math.max(r.box, 1), 2); r.state = 'vague'; }
  else { r.box = 0; r.state = 'no'; }
  r.due = dayStart(g === 2 ? SRS_DAYS[r.box] : (g === 1 ? 1 : 0));
  LS.set(K.recite, RECITE);
  return before;          // 交给撤销用
}

function cardStats(ids) {
  let learned = 0, solid = 0, weak = 0;
  for (const id of ids) {
    const s = cardState(id);
    if (s !== 'new') learned++;
    if (s === 'ok') solid++;
    if (s === 'no' || s === 'vague') weak++;
  }
  return { total: ids.length, learned, solid, weak, fresh: ids.length - learned };
}
function dueCardIds(ids) {
  const t0 = dayStart();
  return ids.filter(id => {
    const r = RECITE[id];
    return r && r.seen > 0 && r.due <= t0;
  });
}
function newCardIds(ids) {
  return ids.filter(id => cardState(id) === 'new');
}
function weakCardIds(ids) {
  return ids.filter(id => cardState(id) === 'no' || cardState(id) === 'vague');
}
function allCardIds() { return CARDS.map(c => c.id); }

/** 今日队列：先复习到期的，再用新卡补足每日额度 */
function todayQueue() {
  const all = allCardIds();
  const due = shuffle(dueCardIds(all));
  const n = Math.max(5, SET.cardDaily);
  const picked = due.slice(0, n);
  if (picked.length < n) {
    picked.push(...shuffle(newCardIds(all)).slice(0, n - picked.length));
  }
  return picked;
}

/* ---------------- 背诵会话 ---------------- */

let RC = null;

function startRecite(ids, title, opts) {
  const list = ids.filter(id => CARD_BY_ID.has(id));
  if (!list.length) { toast('这里还没有卡片'); return; }
  RC = {
    ids: (opts && opts.shuffle) ? shuffle(list) : list,
    idx: 0, flip: false, title: title || '背诵',
    title0: title || '背诵',
    right: 0, vague: 0, wrong: 0,
    last: null,             // 上一次打分，用于撤销
    finished: false,
    startedAt: Date.now()
  };
  go({ name: 'reciteCards', title: RC.title });
}

    h('div', { class: 'rcard' + (RC.flip ? ' flipped' : ''), onClick: toggleFlip },
      h('div', { class: 'rcard-ch ellipsis' },
        c.chapter.replace(/^第(\d+)章\s*/, '第$1章 · ') || c.subject),
      h('div', { class: 'rcard-title' }, c.title),
      RC.flip
        ? h('div', { class: 'rcard-body' },
            h('div', { class: 'rcard-answer' }, c.body),
            c.tip ? h('div', { class: 'rcard-tip' }, '💡 ' + c.tip) : null
          )
        : h('div', { class: 'rcard-hint' },
            h('div', { class: 'rcard-hint-ic' }, '🧠'),
            '先在心里默背一遍',
            h('br'),
            '想好了点这张卡看要点'
          ),
      st === 'no' || st === 'vague'
        ? h('div', { class: 'rcard-state ' + st },
            st === 'no' ? '上次：没记住' : '上次：有点模糊')
        : null
    ),

    undoBar(),

    RC.flip ? reciteGradeBar(c) : h('div', { class: 'q-actions' },
      RC.idx > 0 ? h('button', { class: 'btn ghost sm',
        style: { flex: '0 0 auto', padding: '13px 15px' }, onClick: recitePrev }, '上一张') : null,
      h('button', { class: 'btn primary', onClick: toggleFlip }, '看要点'),
      h('button', { class: 'btn ghost sm',
        style: { flex: '0 0 auto', padding: '13px 15px' }, onClick: reciteNext }, '跳过')
    )
  );
};

/** 上一张打错了？给一条撤销带，点一下就回到那张卡重新评价 */
function undoBar() {
  if (!RC || !RC.last) return null;
  const g = RC.last.grade;
  const label = g === 2 ? '记住了' : (g === 1 ? '有点模糊' : '没记住');
  return h('button', { class: 'undo-bar', onClick: reciteUndo },
    h('span', { class: 'ellipsis' }, '上一张标了「' + label + '」'),
    h('b', null, '↩ 撤销')
  );
}

function reciteUndo() {
  if (!RC || !RC.last) return;
  const { id, grade, prev } = RC.last;
  if (prev) RECITE[id] = prev; else delete RECITE[id];
  LS.set(K.recite, RECITE);
  if (grade === 2) RC.right = Math.max(0, RC.right - 1);
  else if (grade === 1) RC.vague = Math.max(0, RC.vague - 1);
  else RC.wrong = Math.max(0, RC.wrong - 1);
  RC.finished = false;
  RC.idx = RC.last.idx;
  RC.flip = true;           // 回到那张卡并保持翻面，方便重新打分
  RC.last = null;
  haptic(10);
  recountRefresh();
}

function reciteGradeBar(c) {
  const grade = (g) => {
    const prev = cardGrade(c.id, g);
    haptic(g === 2 ? 10 : 18);
    if (g === 2) RC.right++; else if (g === 1) RC.vague++; else RC.wrong++;
    RC.last = { id: c.id, grade: g, prev, idx: RC.idx };
    RC.flip = false;
    reciteNext();
  };
  return h('div', { class: 'q-actions' },
    h('button', { class: 'btn ghost sm',
      style: { flex: '0 0 auto', padding: '13px 13px' }, onClick: recitePrev }, '‹'),
    h('button', { class: 'btn rc-no', onClick: () => grade(0) }, '没记住'),
    h('button', { class: 'btn rc-vague', onClick: () => grade(1) }, '有点模糊'),
    h('button', { class: 'btn rc-ok', onClick: () => grade(2) }, '记住了')
  );
}

function toggleFlip() {
  RC.flip = !RC.flip;
  rerenderRecite();
}
function recountRefresh() {
  const v = $('#view');
  v.textContent = '';
  append(v, [VIEWS.reciteCards({ name: 'reciteCards' })]);
  v.scrollTop = 0;
  // 本轮已结束时就没必要再显示 ⋯ 菜单了
  $('#tbMore').hidden = !(RC && !RC.finished);
}
function rerenderRecite() { recountRefresh(); }
function reciteNext() {
  if (RC.idx >= RC.ids.length - 1) { RC.finished = true; recountRefresh(); return; }
  RC.idx++;
  recountRefresh();
}
function recitePrev() {
  if (RC.idx <= 0) return;
  RC.idx--;
  RC.flip = false;
  recountRefresh();
}

function reciteSummary() {
  const total = RC.right + RC.vague + RC.wrong;
  const rate = pct(RC.right, total);
  return h('div', { class: 'result' },
    h('div', { class: 'ring' },
      h('svg', { viewBox: '0 0 132 132',
        style: { position: 'absolute', inset: '0', width: '100%', height: '100%', transform: 'rotate(-90deg)' } },
        h('circle', { cx: '66', cy: '66', r: '56',
          style: { fill: 'none', stroke: 'var(--line)', strokeWidth: '10' } }),
        h('circle', { cx: '66', cy: '66', r: '56',
          style: { fill: 'none', stroke: 'var(--accent)', strokeWidth: '10',
                   strokeLinecap: 'round',
                   strokeDasharray: String(2 * Math.PI * 56),
                   strokeDashoffset: String(2 * Math.PI * 56 * (1 - rate / 100)) } })
      ),
      h('div', { class: 'inner' }, h('b', null, total), h('span', null, '张卡片'))
    ),
    h('h2', null, rate >= 70 ? '这一轮记得不错 👏' : '别急，明天再滚一遍就熟了'),
    h('p', { class: 'muted tiny' }, RC.title0 + ' · 用时 ' + fmtTime(Math.round((Date.now() - RC.startedAt) / 1000))),
    h('div', { class: 'res-grid' },
      h('div', null, h('b', { style: { color: 'var(--ok)' } }, RC.right), h('span', null, '记住了')),
      h('div', null, h('b', { style: { color: 'var(--warn)' } }, RC.vague), h('span', null, '模糊')),
      h('div', null, h('b', { style: { color: 'var(--bad)' } }, RC.wrong), h('span', null, '没记住'))
    ),
    undoBar(),
    h('div', { class: 'sec', style: { textAlign: 'left', marginTop: '20px' } },
      h('div', { class: 'list' },
        RC.wrong + RC.vague > 0
          ? liRow('🔁', '马上再过一遍没记住的', (RC.wrong + RC.vague) + ' 张',
              () => startRecite(weakCardIds(RC.ids), '待巩固', { shuffle: true }))
          : null,
        liRow('📚', '这一科再滚一轮', RC.ids.length + ' 张',
          () => startRecite(RC.ids, RC.title0, { shuffle: true })),
        liRow('📖', '去考点速查', '像翻手册一样浏览', () => go({ name: 'reciteList', filter: 'all' }))
      )
    ),
    h('button', { class: 'btn primary', style: { marginTop: '16px' },
      onClick: () => { RC = null; reset({ name: 'recite' }); } }, '回到背诵首页')
  );
}

/* ---------------- 考点速查（像翻手册） ---------------- */

VIEWS.reciteList = function (route) {
  const filter = route.filter || 'all';
  const subjFilter = route.subject || 'all';

  const chips = h('div', { class: 'chips' },
    [['all', '全部'], ...CARD_TYPE_ORDER.map(t => [t, CARD_TYPE_NAME[t]])]
      .map(([v, label]) => h('button', {
        class: 'chip' + (filter === v ? ' on' : ''),
        onClick: () => go({ name: 'reciteList', filter: v, subject: subjFilter })
      }, label))
  );

  let list = CARDS;
  if (filter !== 'all') list = list.filter(c => c.type === filter);
  if (subjFilter !== 'all') list = list.filter(c => c.subject === subjFilter);

  // 按科目 + 章节分组
  const groups = [];
  for (const c of list) {
    const key = c.subject + ' / ' + c.chapter;
    let g = groups[groups.length - 1];
    if (!g || g.key !== key) { g = { key, subject: c.subject, chapter: c.chapter, items: [] }; groups.push(g); }
    g.items.push(c);
  }

  return h('div', null,
    chips,
    h('p', { class: 'tiny muted', style: { margin: '10px 4px 14px' } },
      '共 ' + list.length + ' 个考点 · 点标题展开要点'),
    ...groups.map(g => h('div', { class: 'sec' },
      h('div', { class: 'sec-hd' },
        h('h2', { class: 'ellipsis' }, g.subject + ' · ' + g.chapter.replace(/^第(\d+)章\s*/, '第$1章 · ')),
        h('span', { class: 'more' }, g.items.length + ' 个')
      ),
      h('div', { class: 'list' }, g.items.map(listRow))
    ))
  );
};

function listRow(c) {
  const open = !!RECITE['open:' + c.id];
  const st = cardState(c.id);
  const dot = st === 'ok' ? 'done' : (st === 'new' ? '' : 'mid');
  const chev = h('div', { class: 'chev' }, open ? '⌄' : '›');
  const body = h('div', { class: 'rc-item-body' },
    h('div', { class: 'rcard-answer' }, c.body),
    c.tip ? h('div', { class: 'rcard-tip' }, '💡 ' + c.tip) : null
  );
  body.hidden = !open;
  return h('div', { class: 'rc-item' },
    h('button', { class: 'li', onClick: () => {
        const now = !RECITE['open:' + c.id];
        RECITE['open:' + c.id] = now;
        body.hidden = !now;
        chev.textContent = now ? '⌄' : '›';
        LS.set(K.recite, RECITE);
      } },
      h('div', { class: 'chap-dot ' + dot }),
      h('div', { class: 'grow' },
        h('b', null, c.title),
        h('span', null, CARD_TYPE_NAME[c.type] + ' · ' + '★'.repeat(c.freq))
      ),
      chev
    ),
    body
  );
}

/* ==========================================================================
   16. 交互：手势 / 键盘 / 事件绑定
   ========================================================================== */

function bindSwipe() {
  const view = $('#view');
  let x0 = 0, y0 = 0, t0 = 0, tracking = false;
  view.addEventListener('touchstart', (e) => {
    if (!current || current.name !== 'practice') return;
    if (e.touches.length !== 1) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    t0 = Date.now(); tracking = true;
  }, { passive: true });
  view.addEventListener('touchend', (e) => {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0, dt = Date.now() - t0;
    if (dt > 700) return;
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.8) return;
    if (dx < 0) nextQuestion(); else prevQuestion();
  }, { passive: true });
}

function bindKeys() {
  document.addEventListener('keydown', (e) => {
    if (!current) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (current.name === 'practice' && S && S.ids.length) {
      const q = curQ();
      if (e.key === 'ArrowRight') { nextQuestion(); e.preventDefault(); return; }
      if (e.key === 'ArrowLeft') { prevQuestion(); e.preventDefault(); return; }
      if (/^[1-8]$/.test(e.key) && !S.judged[q.id]) {
        const i = +e.key - 1;
        if (q.type === 'judge') { if (i === 0) onPick(q, true, false); else if (i === 1) onPick(q, false, false); }
        else if (q.options[i] !== undefined) onPick(q, i, false);
        e.preventDefault(); return;
      }
      if (e.key === 'Enter') {
        if (!S.judged[q.id] && (q.type === 'single' || q.type === 'multiple' || q.type === 'judge') && S.picks[q.id] !== undefined) {
          if (!S.instant) judge(q);
        } else nextQuestion();
        e.preventDefault();
      }
    }
  });
}

/* ==========================================================================
   16. 启动
   ========================================================================== */

function init() {
  applyTheme();
  applyFont();

  const banks = window.__BANKS || [];
  for (const b of banks) loadBank(b);
  loadCustom();

  for (const b of (window.__RECITE || [])) loadReciteBank(b);

  if (!QUESTIONS.length) {
    $('#view').appendChild(h('div', { class: 'empty' },
      h('div', { class: 'ic' }, '📭'),
      h('b', null, '题库没有加载出来'),
      h('p', null, '请确认 data/ 文件夹里的题库文件和 index.html 在一起。')));
    return;
  }

  $('#tbBack').addEventListener('click', back);
  $('#tbMore').addEventListener('click', () => {
    if (current && current.name === 'practice') openPracticeSheet();
    else if (current && current.name === 'reciteCards') openReciteSheet();
  });
  $('#sheetClose').addEventListener('click', closeSheet);
  $('#sheetMask').addEventListener('click', (e) => {
    if (e.target === $('#sheetMask')) closeSheet();
  });
  $('.tab').forEach(b => b.addEventListener('click', () => reset({ name: b.dataset.tab })));

  bindSwipe();
  bindKeys();

  // 支持返回键（部分浏览器 / 安卓）
  window.addEventListener('popstate', () => {
    if (!$('#sheetMask').hidden) { closeSheet(); keepHistory(); return; }
    if (nav.length) { back(); keepHistory(); }
  });
  keepHistory();

  reset({ name: 'home' });

  // 离线缓存（仅在通过网址访问、且不是单文件版时生效）
  if (!window.__NO_SW && 'serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    const hadController = !!navigator.serviceWorker.controller;
    let reloading = false;
    // 检测到新版本接管（sw.js 里的 VERSION 变了）时自动刷新一次，
    // 否则离线缓存会让人一直看到旧版本
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloading) return;
      reloading = true;
      location.reload();
    });
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

function keepHistory() {
  try { history.pushState(null, ''); } catch (e) {}
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();

</script>

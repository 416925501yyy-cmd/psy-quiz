/* ==========================================================================
   心理学刷题 · 样式
   移动优先 / 单栏 / 安全区域适配 / 深色模式
   ========================================================================== */

:root{
  --bg:#f4f5f9;
  --bg2:#ffffff;
  --card:#ffffff;
  --card2:#f7f8fc;
  --line:#e8eaf1;
  --text:#1b1d24;
  --sub:#878d9d;
  --accent:#6c5ce7;
  --accent-2:#8b7cf6;
  --accent-soft:#eeebfd;
  --ok:#11b888;
  --ok-soft:#e2f7f0;
  --bad:#f4586a;
  --bad-soft:#fdeaed;
  --warn:#f2a33c;
  --warn-soft:#fdf2e2;
  --heat0:#eaecf3;
  --shadow:0 2px 10px rgba(28,30,55,.06);
  --shadow-lg:0 12px 40px rgba(28,30,55,.16);
  --r:16px;
  --r-sm:10px;
  --topH:52px;
  --tabH:56px;
  --fs:16px;
}

html[data-theme="dark"]{
  --bg:#0f1017;
  --bg2:#161822;
  --card:#1a1c26;
  --card2:#212330;
  --line:#2b2e3d;
  --text:#e9ebf3;
  --sub:#868ca0;
  --accent:#8b7cf6;
  --accent-2:#a394ff;
  --accent-soft:#262045;
  --ok:#2ed3a0;
  --ok-soft:#123027;
  --bad:#ff6f80;
  --bad-soft:#3a1b22;
  --warn:#f5b055;
  --warn-soft:#3a2c17;
  --heat0:#272a3a;
  --shadow:0 2px 10px rgba(0,0,0,.3);
  --shadow-lg:0 16px 44px rgba(0,0,0,.5);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-size:var(--fs);
  font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  line-height:1.6;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
ul{margin:0;padding:0;list-style:none}

#app{
  display:flex;flex-direction:column;
  height:100dvh;height:100vh;
  max-width:640px;margin:0 auto;
  background:var(--bg);
  position:relative;
}

/* ---------- 顶栏 ---------- */
.topbar{
  flex:0 0 auto;height:calc(var(--topH) + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;gap:4px;
  padding-left:6px;padding-right:6px;
  background:color-mix(in srgb,var(--bg2) 88%,transparent);
  backdrop-filter:saturate(160%) blur(14px);
  -webkit-backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid var(--line);
  position:relative;z-index:20;
}
.tb-title{flex:1;text-align:center;font-size:17px;font-weight:650;letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-btn{
  width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;
  font-size:22px;line-height:1;color:var(--text);
  flex:0 0 auto;
}
.tb-btn:active{background:var(--card2)}
.tb-btn[hidden]{display:none}

/* ---------- 视图容器 ---------- */
.view{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:14px 14px calc(var(--tabH) + env(safe-area-inset-bottom) + 18px);
  scroll-behavior:smooth;
}
.view.no-tab{padding-bottom:calc(env(safe-area-inset-bottom) + 16px)}

/* ---------- 底部导航 ---------- */
.tabbar{
  flex:0 0 auto;
  display:flex;
  height:calc(var(--tabH) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--bg2) 92%,transparent);
  backdrop-filter:saturate(160%) blur(16px);
  -webkit-backdrop-filter:saturate(160%) blur(16px);
  border-top:1px solid var(--line);
  position:relative;z-index:20;
}
.tabbar[hidden]{display:none}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--sub);font-size:11px;font-weight:550;
  transition:color .15s;
}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.tab.is-on{color:var(--accent)}
.tab.is-on svg{stroke-width:2}

/* ---------- 通用块 ---------- */
.sec{margin-bottom:14px}
.sec-hd{display:flex;align-items:baseline;justify-content:space-between;
  padding:0 4px 8px;gap:8px}
.sec-hd h2{font-size:15px;font-weight:650}
.sec-hd .more{font-size:13px;color:var(--accent);font-weight:550}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  border:1px solid transparent}
html[data-theme="dark"] .card{border-color:var(--line)}
.muted{color:var(--sub)}
.tiny{font-size:12.5px}
.p0{padding:0!important}
.mt10{margin-top:10px}
.mt16{margin-top:16px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.center{text-align:center}

/* ---------- 首页头部 ---------- */
.hero{
  border-radius:20px;padding:18px;
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 55%,#a78bfa 100%);
  color:#fff;box-shadow:0 10px 26px -10px rgba(108,92,231,.7);
  position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-40px;top:-50px;width:160px;height:160px;
  border-radius:50%;background:rgba(255,255,255,.14);
}
.hero::before{
  content:"";position:absolute;right:30px;bottom:-70px;width:120px;height:120px;
  border-radius:50%;background:rgba(255,255,255,.10);
}
.hero h1{font-size:20px;font-weight:700;letter-spacing:.3px;position:relative}
.hero p{font-size:13px;opacity:.9;margin-top:4px;position:relative}
.hero-stats{display:flex;gap:18px;margin-top:14px;position:relative}
.hero-stats div{text-align:left}
.hero-stats b{display:block;font-size:20px;font-weight:700;line-height:1.2}
.hero-stats span{font-size:11.5px;opacity:.85}

/* ---------- 科目卡 ---------- */
.subj{
  display:block;width:100%;text-align:left;
  background:var(--card);border-radius:var(--r);
  padding:15px;box-shadow:var(--shadow);
  border:1px solid transparent;
}
html[data-theme="dark"] .subj{border-color:var(--line)}
.subj:active{transform:scale(.985)}
.subj-top{display:flex;align-items:center;gap:11px}
.subj-icon{
  width:42px;height:42px;border-radius:13px;flex:0 0 auto;
  display:grid;place-items:center;font-size:20px;
  background:var(--accent-soft);color:var(--accent);
}
.subj b{font-size:16px;font-weight:650;display:block}
.subj .meta{font-size:12.5px;color:var(--sub);margin-top:1px}
.subj-ring{margin-left:auto;text-align:right;flex:0 0 auto}
.subj-ring em{font-style:normal;font-size:17px;font-weight:700;color:var(--accent)}
.subj-ring span{display:block;font-size:11px;color:var(--sub)}

.bar{height:6px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:12px}
html[data-theme="dark"] .bar{background:#2a2d3c}
.bar i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s}

/* ---------- 快捷宫格 ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid.g4{grid-template-columns:repeat(4,1fr);gap:8px}
.tile{
  background:var(--card);border-radius:var(--r-sm);padding:13px 12px;
  box-shadow:var(--shadow);text-align:left;
  border:1px solid transparent;
  display:flex;flex-direction:column;gap:2px;
}
html[data-theme="dark"] .tile{border-color:var(--line)}
.tile:active{transform:scale(.97)}
.tile b{font-size:14.5px;font-weight:600;display:block}
.tile span{font-size:11.5px;color:var(--sub)}
.tile .ic{font-size:19px;margin-bottom:5px}
.tile.g4{padding:12px 6px;align-items:center;text-align:center}
.tile.g4 b{font-size:11.5px;font-weight:550}

/* ---------- 列表行 ---------- */
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  overflow:hidden;border:1px solid transparent}
html[data-theme="dark"] .list{border-color:var(--line)}
.li{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 15px;position:relative;background:transparent;
}
.li + .li::before{
  content:"";position:absolute;left:15px;right:0;top:0;height:1px;background:var(--line);
}
.li:active{background:var(--card2)}
.li .ic{width:24px;text-align:center;font-size:17px;flex:0 0 auto}
.li .grow b{font-weight:550;font-size:15px;display:block}
.li .grow span{font-size:12.5px;color:var(--sub);display:block}
.li .val{color:var(--sub);font-size:13.5px;flex:0 0 auto}
.li .chev{color:#c6cad6;font-size:18px;flex:0 0 auto;line-height:1}
.li[disabled]{opacity:.5}

/* ---------- 章节选择 ---------- */
.chap-hd{
  position:sticky;top:0;z-index:5;margin:0 -14px 8px;padding:8px 18px 7px;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-size:12.5px;font-weight:650;color:var(--sub);
  display:flex;justify-content:space-between;align-items:baseline;
}
.chap-hd em{font-style:normal;font-weight:500;color:var(--sub);opacity:.8}
.chap-dot{width:6px;height:6px;border-radius:99px;background:var(--line);flex:0 0 auto}
.chap-dot.done{background:var(--ok)}
.chap-dot.mid{background:var(--warn)}

/* ---------- 答题界面 ---------- */
.q-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pill{
  font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;
  background:var(--accent-soft);color:var(--accent);white-space:nowrap;
}
.pill.gray{background:var(--card2);color:var(--sub)}
html[data-theme="dark"] .pill.gray{background:#262938}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.q-count{margin-left:auto;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.q-count{padding:5px 9px;border-radius:9px;display:flex;align-items:center;gap:4px}
.q-count:active{background:var(--card2)}

/* 题目导航（答题卡） */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.qn{
  position:relative;aspect-ratio:1;border-radius:11px;
  display:grid;place-items:center;
  font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;
  background:var(--card);color:var(--sub);
  border:1.5px solid var(--line);
  transition:transform .12s;
}
.qn:active{transform:scale(.93)}
.qn.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.qn.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.qn.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.qn.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.qn.cur{border-color:var(--accent);color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft);font-weight:750}
.qn.faved::after{
  content:"";position:absolute;top:-2px;right:-2px;width:9px;height:9px;
  border-radius:50%;background:var(--warn);border:1.5px solid var(--bg2);
}
.qlegend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--sub);margin-top:14px}
.qlegend span{display:flex;align-items:center;gap:5px}
.qlegend i{width:12px;height:12px;border-radius:4px;display:block;
  background:var(--card);border:1.5px solid var(--line)}
.qlegend i.b{background:var(--accent-soft);border-color:transparent}
.qlegend i.g{background:var(--ok-soft);border-color:transparent}
.qlegend i.w{background:var(--warn-soft);border-color:transparent}
.qlegend i.r{background:var(--bad-soft);border-color:transparent}

.q-stem{
  background:var(--card);border-radius:var(--r);padding:16px 15px;
  box-shadow:var(--shadow);font-size:16.5px;line-height:1.72;font-weight:500;
  border:1px solid transparent;
}
html[data-theme="dark"] .q-stem{border-color:var(--line)}
.q-stem .idx{color:var(--accent);font-weight:700;margin-right:2px}

.opts{margin-top:12px;display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  background:var(--card);border-radius:13px;padding:13px 14px;
  box-shadow:var(--shadow);border:1.5px solid transparent;
  transition:border-color .15s,background .15s;
  font-size:15.5px;line-height:1.55;
}
html[data-theme="dark"] .opt{border-color:var(--line)}
.opt .key{
  width:23px;height:23px;border-radius:50%;flex:0 0 auto;margin-top:1px;
  display:grid;place-items:center;font-size:12.5px;font-weight:700;
  background:var(--card2);color:var(--sub);
}
html[data-theme="dark"] .opt .key{background:#2a2d3c}
.opt .txt{flex:1}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.picked .key{background:var(--accent);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .key{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);color:#fff}
.opt[disabled]{opacity:1}

.answer-box{
  margin-top:12px;border-radius:var(--r);padding:14px;
  background:var(--card);box-shadow:var(--shadow);border:1px solid transparent;
  animation:fadeUp .22s ease;
}
html[data-theme="dark"] .answer-box{border-color:var(--line)}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.answer-box .verdict{
  display:flex;align-items:center;gap:7px;font-weight:650;font-size:15px;margin-bottom:8px;
}
.answer-box .verdict.ok{color:var(--ok)}
.answer-box .verdict.bad{color:var(--bad)}
.ans-line{font-size:14.5px;font-weight:600;margin-bottom:8px}
.ans-line b{color:var(--accent)}
.expl{
  font-size:14.5px;line-height:1.75;color:var(--text);opacity:.92;
  padding-top:10px;border-top:1px dashed var(--line);
}
.expl .lbl{color:var(--sub);font-size:12.5px;font-weight:650;display:block;margin-bottom:2px}
.ref-ans{
  font-size:15px;line-height:1.85;white-space:pre-wrap;
  background:var(--card2);border-radius:var(--r-sm);padding:12px;
  margin-top:8px;
}
html[data-theme="dark"] .ref-ans{background:#212433}

/* 答题底部操作条 */
.q-actions{
  position:sticky;bottom:0;z-index:6;margin:16px -14px 0;
  padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);
  display:flex;gap:9px;align-items:center;
  background:linear-gradient(to top,var(--bg) 62%,transparent);
}
.btn{
  border-radius:13px;padding:13px 16px;font-size:15.5px;font-weight:600;
  text-align:center;flex:1;
  background:var(--card);box-shadow:var(--shadow);
  border:1px solid transparent;
}
html[data-theme="dark"] .btn{border-color:var(--line)}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  box-shadow:0 8px 20px -8px rgba(108,92,231,.8)}
.btn.ghost{background:transparent;box-shadow:none;border:1.5px solid var(--line);color:var(--sub)}
.btn.sm{padding:10px 14px;font-size:14px}
.btn:disabled{opacity:.45;pointer-events:none}
.icon-btn{
  width:46px;height:46px;border-radius:13px;flex:0 0 auto;
  display:grid;place-items:center;font-size:19px;
  background:var(--card);box-shadow:var(--shadow);border:1px solid transparent;
}
html[data-theme="dark"] .icon-btn{border-color:var(--line)}
.icon-btn.on{color:var(--warn);background:var(--warn-soft)}
.icon-btn:active{transform:scale(.95)}

/* 进度条（答题页顶部） */
.qprog{height:3px;border-radius:99px;background:var(--line);overflow:hidden;margin:0 0 12px}
.qprog i{display:block;height:100%;background:var(--accent);transition:width .25s}

/* ---------- 结果页 ---------- */
.btn.big{padding:15px 18px;font-size:16px;border-radius:14px}

/* ---------- 背诵手册 ---------- */

/* 列表式背诵条目 */
.item{
  background:var(--card);border-radius:var(--r);margin-bottom:10px;
  box-shadow:var(--shadow);border:1px solid transparent;overflow:hidden;
}
html[data-theme="dark"] .item{border-color:var(--line)}
.item.st-no{border-left:3px solid var(--bad)}
.item.st-vague{border-left:3px solid var(--warn)}
.item.st-ok{border-left:3px solid var(--ok)}
.item-q{
  display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
  padding:14px 15px;font-size:15.5px;line-height:1.55;font-weight:550;
}
.item-q:active{background:var(--card2)}
.item-dot{
  width:7px;height:7px;border-radius:99px;background:var(--line);
  flex:0 0 auto;margin-top:8px;
}
.item.st-no .item-dot{background:var(--bad)}
.item.st-vague .item-dot{background:var(--warn)}
.item.st-ok .item-dot{background:var(--ok)}
.item-txt{flex:1;min-width:0}
.item .chev{flex:0 0 auto;color:#c6cad6;font-size:16px;line-height:1.4}
.ans{
  padding:0 15px 14px;font-size:15px;line-height:1.9;
  white-space:pre-wrap;word-break:break-word;color:var(--text);opacity:.94;
}
.mark-row{
  display:flex;gap:8px;padding:0 15px 14px;
  animation:fadeUp .18s ease;
}
.mark{
  flex:1;padding:9px 4px;border-radius:10px;font-size:13.5px;font-weight:550;
  background:var(--card2);color:var(--sub);text-align:center;
  border:1.5px solid transparent;
}
html[data-theme="dark"] .mark{background:#252838}
.mark:active{transform:scale(.97)}
.mark.on.no{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.mark.on.vague{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.mark.on.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}

.rcard{
  margin-top:14px;background:var(--card);border-radius:20px;
  padding:18px 16px;box-shadow:var(--shadow);border:1px solid transparent;
  min-height:44vh;display:flex;flex-direction:column;
  transition:box-shadow .2s;
}
html[data-theme="dark"] .rcard{border-color:var(--line)}
.rcard.flipped{box-shadow:var(--shadow-lg)}
.rcard-ch{font-size:12.5px;color:var(--sub);margin-bottom:10px}
.rcard-title{
  font-size:20px;font-weight:700;line-height:1.5;letter-spacing:.2px;
  text-align:center;margin:auto 0;
}
.rcard.flipped .rcard-title{
  font-size:16.5px;font-weight:650;text-align:left;margin:0 0 12px;
  padding-bottom:12px;border-bottom:1px dashed var(--line);
}
.rcard-hint{margin:auto 0;text-align:center;color:var(--sub);font-size:14px;line-height:1.9}
.rcard-hint-ic{font-size:30px;margin-bottom:8px;opacity:.55}
.rcard-body{flex:1}
.rcard-answer{font-size:15.5px;line-height:1.9;white-space:pre-wrap;word-break:break-word}
.rcard-tip{
  margin-top:14px;padding:10px 12px;border-radius:12px;
  background:var(--warn-soft);font-size:13.5px;line-height:1.7;
}
.rcard-state{margin-top:12px;font-size:12.5px;font-weight:600}
.rcard-state.no{color:var(--bad)}
.rcard-state.vague{color:var(--warn)}

.btn.rc-no{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.btn.rc-vague{background:var(--warn-soft);color:var(--warn);box-shadow:none}
.btn.rc-ok{background:var(--ok-soft);color:var(--ok);box-shadow:none}
.btn.rc-no,.btn.rc-vague,.btn.rc-ok{padding:13px 6px;font-size:14.5px;white-space:nowrap}
.btn.rc-no:active,.btn.rc-vague:active,.btn.rc-ok:active{transform:scale(.97)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 14px;border-radius:99px;font-size:13px;font-weight:550;
  background:var(--card);color:var(--sub);border:1.5px solid var(--line);
}
.chip.on{background:var(--accent);color:#fff;border-color:transparent}
.rc-item + .rc-item{border-top:1px solid var(--line)}
.rc-item-body{padding:0 15px 15px;animation:fadeUp .2s ease}

.undo-bar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;margin-top:12px;padding:11px 14px;border-radius:13px;
  background:var(--card);border:1px solid var(--line);
  font-size:13.5px;color:var(--sub);text-align:left;
}
.undo-bar b{color:var(--accent);font-weight:650;flex:0 0 auto}
.undo-bar:active{background:var(--card2)}

.result{text-align:center;padding:26px 18px}
.result .ring{
  width:132px;height:132px;margin:0 auto 16px;border-radius:50%;
  display:grid;place-items:center;position:relative;
}
.result .ring .inner{
  position:absolute;inset:17px;border-radius:50%;background:var(--card);
  display:grid;place-items:center;flex-direction:column;
  box-shadow:var(--shadow);
}
.result .ring b{font-size:30px;font-weight:750;line-height:1.1}
.result .ring span{font-size:11.5px;color:var(--sub)}
.result h2{font-size:19px;font-weight:700;margin-bottom:4px}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}
.res-grid div{background:var(--card2);border-radius:var(--r-sm);padding:11px 6px}
.res-grid b{display:block;font-size:18px;font-weight:700}
.res-grid span{font-size:11.5px;color:var(--sub)}

/* ---------- 统计 ---------- */
.stat-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat-card{background:var(--card);border-radius:var(--r);padding:14px;
  box-shadow:var(--shadow);border:1px solid transparent}
html[data-theme="dark"] .stat-card{border-color:var(--line)}
.stat-card b{font-size:23px;font-weight:750;display:block;line-height:1.25}
.stat-card span{font-size:12px;color:var(--sub)}
.chapbar{margin-bottom:11px}
.chapbar .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:8px}
.chapbar .t em{font-style:normal;color:var(--sub);font-size:12px;white-space:nowrap}
.chapbar .bar{margin-top:0}
.chapbar .bar i.low{background:linear-gradient(90deg,var(--bad),#ff9aa6)}
.chapbar .bar i.mid{background:linear-gradient(90deg,var(--warn),#ffcd8a)}
.chapbar .bar i.high{background:linear-gradient(90deg,var(--ok),#5ee0b8)}

/* 打卡热力图 */
.heat{display:grid;grid-template-columns:repeat(13,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:3.5px;background:var(--heat0);display:block}
.heat i.l1{background:#cfc7fb}
.heat i.l2{background:#a99bf7}
.heat i.l3{background:#8b7cf6}
.heat i.l4{background:#6c5ce7}

/* ---------- 弹层 ---------- */
.sheet-mask{
  position:fixed;inset:0;z-index:100;background:rgba(15,16,23,.45);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadeIn .18s;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet-mask[hidden]{display:none}
.sheet{
  width:100%;max-width:640px;max-height:88dvh;max-height:88vh;
  background:var(--bg2);border-radius:22px 22px 0 0;
  display:flex;flex-direction:column;
  animation:slideUp .26s cubic-bezier(.2,.9,.3,1);
  padding-bottom:env(safe-area-inset-bottom);
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.sheet-hd{
  display:flex;align-items:center;gap:8px;padding:14px 12px 10px 18px;
  border-bottom:1px solid var(--line);flex:0 0 auto;
}
.sheet-hd h2{flex:1;font-size:16.5px;font-weight:650}
.sheet-bd{overflow-y:auto;padding:14px 16px 22px;-webkit-overflow-scrolling:touch}

/* ---------- 表单控件 ---------- */
.field{margin-bottom:14px}
.field > label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px;font-weight:550}
.field textarea,.field input[type=text],.field input[type=number]{
  width:100%;background:var(--card);border:1.5px solid var(--line);
  border-radius:var(--r-sm);padding:11px 12px;font:inherit;font-size:16px;
  color:var(--text);resize:vertical;outline:none;
}
.field textarea{min-height:150px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:16px;line-height:1.65}
.field textarea:focus,.field input:focus{border-color:var(--accent)}
.sw{
  display:flex;align-items:center;gap:12px;padding:13px 15px;position:relative;
}
.sw + .sw::before{content:"";position:absolute;left:15px;right:0;top:0;height:1px;background:var(--line)}
.sw .grow b{font-weight:550;font-size:15px;display:block}
.sw .grow span{font-size:12.5px;color:var(--sub);display:block}
.toggle{
  width:50px;height:30px;border-radius:99px;background:var(--line);flex:0 0 auto;
  position:relative;transition:background .18s;
}
.toggle::after{
  content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.28);transition:transform .18s;
}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(20px)}

.seg{display:flex;background:var(--card2);border-radius:11px;padding:3px;gap:2px}
html[data-theme="dark"] .seg{background:#252838}
.seg button{
  flex:1;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:550;color:var(--sub);
}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

.empty{text-align:center;padding:52px 20px;color:var(--sub)}
.empty .ic{font-size:42px;margin-bottom:12px;opacity:.55}
.empty b{display:block;font-size:16px;color:var(--text);font-weight:600;margin-bottom:5px}
.empty p{font-size:13.5px;line-height:1.7}

.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--sub);
  white-space:nowrap}
html[data-theme="dark"] .tag{background:#262938}
.tag.hot{background:var(--bad-soft);color:var(--bad)}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 76px);
  transform:translateX(-50%);z-index:200;
  background:rgba(28,30,40,.94);color:#fff;
  padding:10px 18px;border-radius:99px;font-size:14px;font-weight:500;
  box-shadow:var(--shadow-lg);max-width:84vw;text-align:center;
  animation:fadeUp .2s;
}
.toast[hidden]{display:none}

/* 背诵卡（名词解释 / 简答） */
.recite-hint{

window.__MODULES.push({"module":"short","subject":"普通心理学","icon":"🧠","desc":"彭聃龄《普通心理学》· 精选高频简答","chapters":[{"name":"第一章 心理学的研究对象和方法","items":[{"q":"研究心理学的意义","a":"心理学作为一门科学，具有重要的意义。1．理论意义：科学地解释心理现象，对破除迷信、形成科学的世界观和人生观有重要意义。2．实践意义：科学的重要作用在于预测和控制。人们掌握了心理现象的规律，就能根据社会实践的需要去预测和控制心理现象。心理学的研究有助于促进人的毕生发展，维护心理健康，减轻职业压力，增进人际交流，进而提高人的生活质量。"},{"q":"个体意识与无意识","a":"人的意识是由人的认知、情绪、情感、欲望等构成的一种丰富而稳定的内在世界，是人们能动地认识世界和改造世界的内部资源，这是人的意识的第一个特点；人的活动具有明确的目的，能够预先计划达到目的的方法和手段，这是人类意识的另一个特点；意识有时也叫觉察，表现在人能够觉察到外部事物的存在和自己的心理活动，能够把“自我”与“非我”、“主体”与“客体”区别开来；注意与意识密切相关，注意是意识对事物和活动的指向和集中。无意识是指人们在正常情况下觉察不到，也不能自觉调节和控制的心理现象。"},{"q":"格式塔心理学","a":"1．代表人物：韦特海默、苛勒、考夫卡、勒温等 2．研究对象：意识、认知现象（知觉、学习、思维等） 3．主要观点格式塔心理学反对把意识分析为元素，而强调心理作为一个整体、一种组织的意义。整体不能还原为各个部分、各种元素的总和；部分相加不等于全体；整体先于部分而存在，并且制约着部分的性质和意义。4．研究方法：实验法 5．历史评价尽管格式塔心理学的理论基础是主观唯心论，但基本观点是正确的；其对于知觉、学习及思维等的研究成果至今具有积极意义。"},{"q":"精神分析学派","a":"1．代表人物：弗洛伊德、荣格、阿德勒等 2．研究对象：无意识（潜意识） 10（务必结合校区强化课使用） 3．主要观点 精神分析学派重视异常行为的分析，强调心理学应该研究无意识现象。精神分析学说认为，人类的一切个体和社会的行为，都根源于心灵深处的某种欲望或动机，特别是性欲的冲动。欲望以无意识的形式支配人，并且表现在人的正常和异常的行为中。精神分析是一种临床技术，它通过释梦和自由联想等手段，发现病人潜在的动机，使精神宜泄，从而达到治疗疾病的目的。4．研究方法：自由联想、梦的解析、催眠疗法 5．历史评价（1）贡献性：重视动机和无意识现象的研究。（2）局限性：过分强调无意识的作用，并且把它与意识的作用对立起来。早期理论具有泛性欲主义的特点，把性欲夸大为支配人类一切行为的动机。这些都是错误的。从广义的角度来说，除了以上五个学派之外，具有代表性的心理学流派还包括“认知心理学”和“人本主义心理学”。"},{"q":"生理心理学的研究取向","a":"1．研究对象：高级心理功能（如知觉、记忆、注意、语言等）的生物学基础，特别是脑的功能 2．主要观点生理心理学研究取向的心理学家关心心理与行为的生物学基础，把生理学看成是描述和解释心理功能的基本手段。随着神经生理学、影像学和计算机技术的迅猛发展，各种无创伤的脑成像技术被广泛应用于认知领域的研究，产生了认知神经科学，主要研究认知功能的脑机制等。科学家们相信，只有揭示人的心理活动的脑机制，特别是认知功能的神经生物学机制，才能真正揭示脑的秘密，了解人的心理功能（如认知、情绪、意识和无意识等）的特点。在21世纪，认知神经科学的研究有望成为心理学发展的主流。3．研究方法：临床法、局部切除法、电刺激法、生物化学法和脑成像法等"},{"q":"行为主义的研究取向","a":"1．代表人物：斯金纳、托尔曼等 2．研究对象：行为 3．主要观点 20世纪三四十年代出现的新行为主义，在传统的刺激一反应模式的基础上，提出了“中介变量”的概念，认为在刺激和反应之间存在某些内在的心理过程，如认知地图、目标等。20世纪50年代以后，行为主义作为一种研究取向，仍活跃在心理学的某些应用研究领域中，如程序学习、行为治疗或行为改善、生物反馈技术等。"},{"q":"人本主义心理学的研究取向","a":"．代表人物：马斯洛、罗杰斯等 1．代表人物：马斯洛、罗杰斯等 20世纪30年代以后，出现的后弗洛伊德主义者更关注儿童和青少年人格的正常发展，而不是主要以精神异常的成年人为研究对象；他们强调意识和自我的重要性，而不是只重视无意识的研究；他们把青年期看成是力比多活动的高潮时期，而不是过分强调力比多在儿童时期的作用。"},{"q":"进化心理学的研究取向","a":"1．研究对象：人类心理的起源和本质 2．主要观点进化心理学认为，人类的心理机制也是自然选择的结果，如果某一种行为倾向有助于个体的生存，那么这种行为倾向就会被自然选择，并且通过基因遗传保留下来。12（务必结合校区强化课使用）第二章心理与行为的脑神经基础"},{"q":"周围神经系统","a":"1．躯体神经系统（1）脑神经：由脑部发出，共12对。（2）脊神经：发自脊髓，由脊髓前根和后根的神经纤维混合组成，共31对。脊神经具有四种不同的机能成分，即一般躯体感觉纤维、一般内脏感觉纤维、一般躯体运动纤维和一般内脏运动纤维。2．自主神经系统（植物性神经系统）自主神经系统分为交感神经系统和副交感神经系统两个部分，其机能上具有拮抗性质。交感神经是机体应付紧急情况的机构；副交感神经则相反，起着平衡作用，抑制体内各器官的过度兴奋，使它们获得必要的休息。"},{"q":"机能系统说（21J）","a":"鲁利亚认为脑是一个复杂的动态机能系统，可以分为以下三个部分。1．第一机能系统：也叫动力系统，即调节激活与维持觉醒状态的机能系统。包括脑干网状结构和边缘系统等，基本功能是保持大脑皮层的一般觉醒状态，提高其兴奋性和感受性，并实现对行为的自我调节。2．第二机能系统：是信息接收、加工和存储的系统。位于大脑皮层的后部，包括皮层的枕叶、颞叶和顶叶以及相应的皮层下组织，其基本作用是接收来自机体内、外的各种刺激，实现对信息的空间和时间整合，并把它们保存下来。3．第三机能系统：也叫行为调节系统，是编制行为程序、调节和控制行为的系统。主要包括额叶的广大脑区，其基本作用是产生活动意图，形成行为程序，实现对复杂行为形式的调节与控制。鲁利亚认为，人的各种行为和心理活动是三个机能系统相互作用、协同活动的结果。其中每个机能系统又起各自不同的作用。"}]},{"name":"第三章 感觉","items":[{"q":"三大定律","a":"1．韦伯定律：K=ΔI/I(19M) I为标准刺激的强度或原刺激量；△I为引起差别感觉的刺激增量；K为一个常数，随着被测量的感觉系统的不同而变化。根据韦伯分数的大小，可以判断某种感觉的敏锐度。韦伯分数越小，感觉越敏锐。但是，韦伯定律只适用于中等强度的刺激。2．费希纳对数定律：P=KlgI(24M) P为感觉量，即感觉强度；K是一个常数，与某种感觉的韦伯分数有关；I为刺激量。公式表明当刺激强度按几何级数增加时，感觉强度只按算术级数上升。当刺激量迅速上升时，感觉量是逐步变化的。费希纳的对数定律是在韦伯定律的基础上研究的，所以该定律只有在中等强度的刺激时才适用。3．斯蒂文斯乘方定律：P=KIn P指知觉到的大小或感觉的大小；I是指刺激的物理量；K和n是某种感觉通过评定得到的常数。公式表明感觉的大小是与刺激量的乘方成正比，因此该定律又叫幂定律。"},{"q":"色觉理论","a":"1．三色说托马斯·杨假定，人的视网膜有三种不同的感受器，分别负责感知红、绿、蓝三原色。每种感受器只对光谱的一种特殊成分敏感。当它们分别受到不同波长的光刺激时，就会产生不同的颜色经验。赫尔姆霍茨认为每种感受器都对各种波长的光有反应，但红色感受器对长波更敏感，绿色感受器对中波更敏感，蓝色感受器对短波更敏感。因此，当光刺激作用于眼睛时，将在三种感受器中引起不同程度的兴奋。各种颜色经验是由不同感受器按相应的比例活动而产生的。三色说的缺陷在于该理论无法解释红绿色盲。2．对立过程理论（拮抗加工理论）(20J）黑林假定，存在红、绿、黄、蓝四种原色，并且视网膜存在着三对视素：黑一白视素、红一绿视素、黄一蓝视素。它们在光刺激的作用下表现为对抗的过程，即同化作用和异化作用。对立过程理论还认为，视觉系统对一种颜色产生疲劳反应后，与之对立的颜色过程就会被激活，这解释了为什么颜色的后像是负后像。（第六版P98） 3．两阶段理论（第六版P98）视觉机制的两阶段理论将三色理论和对立过程理论统一起来，认为颜色视觉加工是分阶段的，在光感受阶段，颜色加工符合三色理论；在信息传导阶段，颜色加工符合对立过程理论。三种颜色信息由视锥细胞处理后，分别被编码成两种对立的神经信号，再通过对立过程传输给更高层次的视觉中枢。（1）人，（1）人，"},{"q":"听觉理论","a":"1．频率理论（电话理论） （1）提出者：拉瑟福德（罗·费尔德） （2）理论观点：内耳的基底膜是和镫骨按相同频率运动的，基底膜上的毛细胞产生等频率的神经冲动。如果声音的频率低，镫骨的振动次数较少，基底膜的振动次数也少，毛细胞神经冲动的频率也就低。如果声音的频率高，镫骨和基底膜都将发生较快的振动，毛细胞神经冲动的频率也就高。毛细胞神经冲动的频率实现了对声音频率的分析。（3）缺陷：频率理论可以解释1000Hz以下声音音高的辨别，但难以解释1000Hz以上声音音高的辨别，因为单个神经元不可能产生每秒1000次以上的神经冲动。2．位置理论（1）共鸣理论 ①提出者：赫尔姆霍茨 ②理论观点：由于基底膜的横纤维长短不同，靠近蜗底较窄，靠近蜗顶较宽，这些长度不同的神经纤维能对不同频率的声音产生共鸣。声音的频率高，短纤维发生共鸣；声音的频率低，长纤维发生共鸣。基底膜的振动引起毛细胞的兴奋，因而产生高低不同的音高。共鸣理论强调了基底膜的振动部位对辨别音高的作用。 （2）行波理论 ①提出者：冯·贝克西 ②理论观点：声波传入人耳，将引起整个基底膜像行波一样的振动。振动从耳蜗底部开始，逐渐向蜗顶推进，振动的幅度也随着逐渐增高。振动运动到基底膜某一部位，振幅达到最大值，然后停止前进而消失。声波频率不同，行波最大振幅所在的部位也不同。声音频率低，最大振幅接近蜗顶；频率高，最大振幅接近蜗底（即镫骨处），从而实现了对不同频率的分析。（3）评价（第六版P108）位置理论认为，基底膜的位置实现了对声音频率的分析，使人们知觉到不同的音高。它正确解释了1000Hz 以上的声音音高的辨别，但难以解释1000Hz以下的声音音高的辨别。3．神经齐射理论（1）提出者：韦弗尔（2）理论观点：当声音频率较低时，单个毛细胞神经冲动的频率能够编码声音频率的高低；当声音频率较高时，多个毛细胞将按照联合活动或者齐射原则发生作用。（3）缺陷：齐射理论只能对5000Hz以下的声音进行频率分析，超过5000Hz时，位置理论（行波理论）是对频率进行编码的基础。"},{"q":"近刺激与远刺激","a":"（务必结合校区强化课使用）17 考夫卡把刺激分成近刺激和远刺激两种。近刺激是指直接作用于感觉器官的刺激，如物体在视网膜上的投影等。而远刺激是指来自物体本身的刺激，如一定波长的光线、一定频率的空气振动等。"},{"q":"感觉的编码（21M）","a":"编码是指将一种能量转化为另一种能量，或者将一种符号系统转化为另一种符号系统。感觉编码是指外界输入的物理能量或化学能量经过感官的换能作用，转化为神经系统能够接受的神经能或神经冲动的过程。缪勒在研究感觉编码问题时，提出了神经特殊能量学说。在他看来，感觉是由感觉器官自身的神经特殊能量决定的，而与客观世界无关。这种只强调感觉的主观性而忽视客观性的观点是该学说的局限性。通过近年来的研究，在神经系统的不同层面上，形成了两种颇具代表性的感觉编码理论：1．特异化理论该理论主张，不同性质的感觉是由不同的神经元来传递信息的。2．模式理论（模块理论）该理论认为，编码是由整组神经元的激活模式引起的。"},{"q":"信号检测论（SDT)","a":"信号检测论是一种数学方法，用来评价个体的感受性和反应标准对信号检测做出的不同贡献。根据信号有无和观察者的反应，信号检测论将被试的反应分为四种：报告有报告没有有信号击中漏报无信号虚报正确拒绝如果虚报率高，说明被试采用了较低的反应标准，容易将非信号报告成信号；如果漏报率高，说明被试采用了较高的反应标准，容易漏掉真正的信号。反应标准会受到期待、动机、注意水平等因素的影响。"},{"q":"听觉的生理机制","a":"听觉器官是由外耳、中耳和内耳组成。1．外耳包括耳郭和外耳道，主要用于收集声音。2．中耳由鼓膜、三块听小骨、卵圆窗和正圆窗组成。3．内耳由前庭器官和耳蜗组成。耳蜗基底膜上的柯蒂氏器包含大量支持细胞和毛细胞，后者是听觉的感受器，也是声音刺激的能量转换器。声音的传导途径包括生理性传导、空气传导和骨传导。"}]},{"name":"第四章 知觉","items":[{"q":"知觉与感觉的关系（补充）","a":"1．感觉和知觉的相同点（1）两者都是人脑对客观事物的主观反映，没有客观事物，感觉与知觉不可能凭空产生。（2）两者都是人脑对当前直接作用于感觉器官的客观事物的反映，如果客观事物或现象在人的感觉器官所及范围内消失，那么感觉和知觉活动就会随之停止。（3）两者的形成与发展高不开人脑的活动，没有人脑对刺激信息的接受、加工与处理，仅凭感觉器官是不会产 24（务必结合校区强化课使用）生感觉的，更不可能产生知觉。 2．感觉和知觉的区别（1）反映的内容不同。感觉是人脑对事物的个别属性的认识，而知觉是客观事物直接作用于感官而在头脑中产生的对事物的整体的认识。两者反映的内容在层次上存在差异。（2）产生的性质不同。感觉是介于生理和心理之间的活动过程，它的产生主要来自于感觉器官的生理机制和刺激信息的物理特性，不需要或很少需要人的知识经验，相同的刺激信息会引起相似的感觉。知觉则是纯粹的心理活动，它的产生来自感觉基础上对客观事物各种属性的整合和解释以获得意义的心理活动，需要人的知识经验等主观因素的参与，不同的人对同一刺激信息可能会产生不同的知觉。（3）生理机制不同。感觉是单一分析器活动的结果，知觉是多种分析器协同活动的结果。3．感觉与知觉的联系感觉是知觉过程的重要组成部分，是知觉的前提和基础，知觉则是感觉的深入和发展，人对客观事物个别属性的反映越丰富、越精确，由此形成的知觉就越完整、越正确，两者联系紧密。"},{"q":"知觉的信息加工（20M）","a":"1．自下而上的加工自下而上的加工又称数据驱动加工，是指对感觉输入的信息，即直接作用于感官的刺激物特性的加工。2．自上而下的加工自上而下的加工又称概念驱动加工，是指对头脑中已经存储的信息（非感觉信息）的加工。知觉依赖这两种加工。一般来说，在人的知觉活动中，非感觉的信息越多，所需要的感觉信息就越少，因而自上而下的加工占优势；相反，非感觉的信息越少，就需要越多的感觉信息，因而自下而上的加工占优势。"},{"q":"方位定向（知觉定位）","a":"方位定向是指对物体的空间关系、位置和对机体自身所在空间位置的知觉。方位定向是各种感觉协同活动的结果。1．视觉定位（第六版P146）人的视觉定向必须借助于各种主客观的参照物。人们根据周围环境的参照物，例如太阳、建筑物的位置，根据天空和地面、人和外界的物体的关系来判断方位。在视觉定位中，视觉、触觉、动觉、前庭觉的联合作用有重要意义。2．听觉定位（第六版P147） （1）单耳线索：是指由单耳提供的距离信息。研究发现，在判断声源的远近时，声波到达耳朵的强度和距离是重要线索。（2）双耳线索：同一声源到达两耳的距离不同，产生了两耳刺激的时间差和强度差。这是人耳进行声音定位的主要线索。P166（第六版P148） （3）听觉优势效应：是指人们听到的第一个声音将决定自己对声音的定位，而其他声音将不同程度地受到抑制的现象。（4）人类回声定位：研究证明，人类能够有效使用回声信息。"},{"q":"错觉产生的原因","a":"1．眼动说当人们知觉某些几何图形时，眼睛运动的方向和范围会发生变化，因而引起知觉的错误。2．移情说观察者把自己认同于图形的某部分，并将自己的情感投射到图形上面，因而引起视觉变形。3．完形倾向说人的知觉系统具有某种完形的倾向，这种倾向夸大了似乎能分开的事物各特征间的距离，因而引起错觉。4．透视说由于图形通过透视暗示着深度，因而导致图形大小知觉的变化。5．常性误用说这种理论认为，错觉是知觉恒常性的颠倒。在日常生活中，当知觉条件变化，物体在视网膜上的视像也相应改变时，由于环境提供了深度和距离的线索，因而保持了大小知觉的恒常性。但是在某些特定的场合，当深度知觉的线索改变，而视网膜上的投影大小保持恒定时，就会引起物体大小的错觉。6．神经抑制作用说（补充）在看两个接近的图形时，它们所引起的视网膜内相邻的神经细胞的活动会发生侧抑制的作用，从而导致看到的图形发生了位置的移动，造成错觉。"},{"q":"知觉学习","a":"知觉学习是指由训练引起的知觉成绩的改变或知觉阈限的变化。关于经验对知觉的影响，主要有以下发现：1．知觉定势：是指前面的知觉经验对后来知觉的影响。P149（第六版P137） 2．知觉习惯：是指人们日常的知觉经验影响到对事物细节的知觉。3．种族效应：是指我们很容易分辨本民族的人脸，而不容易分辨异民族的人脸。【知觉适应】是指当刺激输入发生变化时，知觉系统能够适应这种变化，使之恢复到正常状态的现象。P151（六）知觉的组织原则P154（第六版P135） 1．邻近性：在其他条件相同时，空间和时间上彼此接近的事物容易知觉为一个整体。2．相似性：相似的事物容易知觉为一个整体。3．对称性：对称的事物容易知觉为一个整体。4．良好连续：连续的事物容易知觉成为一个整体。5．共同命运：当视野中的某些成分按照共同方向运动或变化时，人们容易把它们知觉为一个整体。6．封闭：视野中封闭的线段容易被知觉为一个整体。7．线条朝向：视野中同朝向的线条容易组成一个整体。8．简单性：视野中具有简单结构的部分，容易组成一个整体。9．均质连接性：两个相连的点子更容易被看成一组。（第六版P136）"}]},{"name":"第五章 意识和注意","items":[{"q":"注意分配的认知理论","a":"1．认知资源理论（中枢能量分配理论） （1）提出者：卡尼曼（2）主要观点该理论把注意看成一组对刺激进行归类和识别的认知资源或中枢能量，不同的认知任务或认知活动对认知资源或中枢能量的需求不同，刺激越复杂或加工任务越复杂，占用的认知资源就越多。认知资源是有限的，当认知资源完全被占用时，新的刺激将得不到加工（未被注意）。该理论还假设，在认知系统内有一个机制负责资源的分配，这一机制可以受我们的控制，把认知资源分配到重要的刺激上。（3）中枢能量分配模型（第六版P181）在这个模型中，可用的认知资源的总量受到个体唤醒水平的调节。影响个体唤醒水平的因素包括当前的刺激、情境和个体的动机等。注意的功能是通过一定的分配策略把可用的认知资源分配到不同的任务或活动中。影响或决定分配策略的因素包括：①可用的中枢能量；②对能量需求的评估；③个人的长期倾向，即个体自身的特质或倾向，包括个性特点、兴趣爱好等；④当前的意愿。认知资源的分配受到个体的控制，可以优先被分配到重要的刺激或任务中。2．双加工理论（21J） （1）提出者：谢夫林等人（2）主要观点在认知资源理论的基础上，谢夫林等人进一步提出了双加工理论。该理论认为，人类的认知加工有自动化加工和受意识控制的加工两类。①自动化加工不受认知资源的限制，不需要注意的参与，是自动进行的。这些加工过程由适当的刺激引发，发生比较快，不影响其他的加工过程。在习得或形成之后，其加工过程比较难改变。②意识控制的加工受认知资源的限制，需要注意的参与，可随环境的变化而不断进行调整。意识控制的加工在经过大量的练习后，有可能转变为自动化加工。"},{"q":"意识的功能（补充）","a":"1．意识的觉知功能意识的觉知功能是指人对周围环境刺激信息和自身内部心理状态的了解，表现为人不仅能意识到客观事物的存在，也能够意识到自身的存在、自己心理活动与行为表现和谐与否，以及自身与客观事物之间的内在关系等。2．意识的计划功能意识的计划功能表明，人的心理与行为是有目的性和计划性的，人不会盲目地从事社会实践活动，而是总是具有某种目的和动机，这种目的和动机以观念的形式存在于人脑之中。3．意识的选择与监控功能意识具有选择与监控的功能。意识的选择功能使人能够在环境中接受最适宜和最有效的刺激信息，限制并过滤与目标和目的无关的信息，能够有选择地存储与自己需要有关的信息。意识的监控功能包括两个方面，一是可以监视自己内部心理活动和外部环境的刺激信息；二是可以调节和控制自身状态与周围环境之间的相互关系。"},{"q":"注意的含义和特点","a":"注意是心理活动或意识对一定对象的指向和集中。1．注意的特点（1）指向性：是指心理活动或意识在某个方向上进行活动。指向性不同，人们从外界接收到的信息也不同。（2）集中性：是指心理活动或意识在一定方向上活动的强度或紧张度。心理活动或意识的强度越大，紧张度越高，注意也就越集中。人在高度集中自己注意的时候，注意指向的范围就会缩小。2．注意和意识的关系（1）注意不等同于意识。注意决定什么东西可以或不可以成为意识的内容。与意识相比，注意更为主动和易于控制。（2）注意和意识密不可分。当人们处于注意状态时，意识内容比较清晰。"},{"q":"注意选择的认知理论","a":"（2）主要观点神经系统在加工信息的容量方面是有限的，不可能对所有的感觉刺激同时进行加工。当信息通过各种感觉道进入神经系统时，要先经过一个过滤机制。只有部分信息可以通过这个机制，并接受进一步的加工，而其他的信息被完全阻断在它的外面。观点总结：过滤器的工作方式是“全或无”的。（3）实验来源该理论是根据彻里的双耳分听实验的结果提出来的。该实验给被试的双耳同时呈现两种材料，让被试大声地重复呈现给他的一只耳朵（追随耳）的材料，但检查的却是呈现到另一耳朵（非追随耳）的材料。结果，被试从非追随耳得到的信息很少。布罗德本特因而提出，进入追随耳的信息因受到注意而被接受，进入非追随耳的信息因没有受到注意而未被接受。2．衰减理论（1）提出者：特瑞斯曼（2）主要观点当信息通过过滤装置时，不被注意或非追随的信息只是在强度上减弱了，而不是完全消失。不同刺激的激活阈限是不同的。有些刺激对人有重要意义，它们的激活阈限低，容易激活。当它们出现在非追随的通道时，容易被人们所接受。观点总结：承认过滤器的存在，但认为过滤器并不是按照“全或无”的方式工作的。（3）实验来源双耳分听实验中发现，来自非追随耳的信息也受到了加工。3．后期选择理论（完善加工理论、反应选择理论、晚期选择模型或记忆选择理论） （1）提出者：多伊奇（2）主要观点所有输入的信息在进入过滤或衰减装置之前已受到充分的分析，然后才进入过滤或衰减装置，因而对信息的选择发生在加工后期的反应阶段。观点总结：认为过滤器不在于选择知觉刺激，而在于选择对刺激的反应。前三种理论都假设注意的选择过程发生在信息加工的某个特定的阶段上。4．多阶段选择理论（1）提出者：约翰斯顿（2）主要观点选择过程在不同的加工阶段都有可能发生。这一理论的两个主要假设是：在进行选择之前的加工阶段越多，所需要的认知加工资源就越多；选择发生的阶段依赖于当前的任务要求。信息处理者可以主动控制在早期还是晚期进行信息选择，以更好地满足当前任务或情境的需要。"},{"q":"注意的功能","a":"注意作为整个心理活动的引导者和组织者，其功能有以下四个部分。1．选择功能：注意选择重要的信息，排除无关刺激的干扰，使人正常地生活与工作。这是注意的基本功能。2．保持功能：当注意指向并集中在一定的对象以后，会保持一定的时间，维持心理活动的持续进行。3．调节和监督功能：注意可以提高人们的意识觉醒水平，使人们有效地监控自己的动作和行为，并使心理活动根据当前的需要做出适当的分配和及时的转移，以适应环境的变化。（补充） 4．整合功能：在注意状态下，人才能对个别特征的信息进行精细加工并将其整合为一个完整的物体。"},{"q":"注意的种类","a":"1．根据注意在信息加工中的功能进行分类（1）选择性注意：是个体在同时呈现的两种或两种以上的刺激中选择一种进行注意，而忽略另外的刺激。选择性注意通常用双耳分听实验来测量。【负启动】指当探测刺激与先前被忽略的启动刺激相同或相关时，对探测刺激的反应变慢或准确度下降。负启动现象揭示了注意在认知活动中的复杂作用。（22M） 【返回抑制现象】指对原先注意过的物体或位置进行反应时表现出的对目标刺激反应时变慢或正确率降低的现象。【注意瞬脱】是指在识别一系列刺激时，对某个刺激的准确识别会影响到其后对特定时间间隔（一般为500毫秒以内）的刺激识别的现象。（2）持续性注意：是指注意在一定时间内保持在某个客体或活动上，也叫注意的稳定性。持续性注意通常用警戒作业来测量。（3）分配性注意：是个体在同一时间对两种或两种以上的刺激进行注意，或将注意分配到不同的活动中。分配性注意通常用双作业操作来测量。2．根据引起注意的线索来源进行分类（第六版P174） （1）外源性注意：又称不随意注意、无意注意，是指由外部刺激或信息引起的注意。外源性注意与知觉的自下而上的加工相联系。（2）内源性注意：又称随意注意、有意注意，是指由个体的行为目标或意图引起的注意。内源性注意与自上而下的加工相联系。3．根据意志努力的程度进行分类（补充） （1）不随意注意：是指事先没有预定目的、也不需要意志努力的注意，是一种消极被动的注意。在这种注意动中，人的积极性的水平较低。影响不随意注意的因素有：①刺激物自身的特点：包括刺激物的新异性、相对强度、运动变化等，是引起不随意注意的主要原因。新异性刺激物异乎寻常的特性，如没见过雪的南方人；相对强度是刺激物与周围物体强度的对比；运动的物体比静止物体更容易引起人们的不随意注意。②人本身的状态：包括需要、期待、情感、兴趣、过去经验等。凡是符合人的需要的事物，都容易吸引人们的意。（2）随意注意：是指有预定目的、需要一定意志努力的注意，是一种积极主动的注意。影响随意注意的因素有①对注意的目的与任务的依从性：目的越明确、越具体，越容易引起和维持随意注意。②对兴趣的依从性：有趣的事物容易引起随意注意。对活动结果的兴趣，即间接兴趣，能够维持人们稳定而集的注意。③对活动组织的依从性：能否正确地组织活动，关系到随意注意的引起和维持。有良好的生活习惯、工作习惯饮食起居规律，有利于维持注意。例如：阅读做笔记有助于集中注意在读物上。④对过去经验的依从性：人们会更容易维持注意集中在与过去知识经验有关的活动上。⑤对人格的依从性：具有顽强、坚毅性格的人，易于使自己的注意服从于当前的目的和任务，相反，意志薄弱、害怕困难的人，不可能有良好的随意注意。（3）随意后注意：是指有预定目的、不需要意志努力的注意，是在随意注意的基础上发展起来的。同时具有不随意注意和随意注意的某些特征。随意后注意既服从于当前的活动目的与任务，又能节省意志的努力，因而对完成长期、持续的任务特别有利。培养随意后注意关键在于发展对活动本身的直接兴趣。"},{"q":"意识的理论","a":"1．剧院模型意识的剧院模型又称全局工作空间理论，由美国心理学家巴尔斯提出。该理论强调意识是一个容量有限的全局（公共）工作空间，在这里可以对各种平行的认知过程（通常是无意识进行的）进行信息交换和协调控制。巴尔斯把意识的产生比喻成剧院中的一场演出：在容量有限的舞台上，有一些表演者（信息或心理内容），它们有多种来源，有的来自感官输入，有的来自记忆、想象和思考，其中聚光灯照亮的表演者就是进入意识的内容。舞台上无法容纳全部的表演者，只有那些在竞争中胜出的才能成功登上舞台。舞台上被聚光灯照亮的部分就是意识或注意的中心，聚光灯亮区周围的部分则是意识的边缘。自我相当于导演，可以对舞台上的各部分心理活动进行主动控制，并能控制接下来让什么进入意识。当紧急的事情发生时，还可以中断和改变进入意识的内容，按照剧院模型，意识的产生包含多种认知成分之间的相互合作和相互影响，其中感知觉和记忆提供信息的来源，舞台相当于工作记忆，聚光灯相当于注意，聚光灯照亮的演员是可以意识到的信息或心理过程。巴尔斯特别强调意识工作机制的全局性，即意识可以统合和连接其他各种认知过程。2．整合信息理论整合信息理论由美国神经科学家托诺尼提出，该理论认为意识经验的形成源自人脑在进行信息处理时产生的一种特殊的信息结构，即整合信息。意识经验同时具有高度整合性和高度分化性的特征。高度整合性是指意识体验或意识状态在任何时候都是作为一个整体而存在的，无法被分割为部分；高度分化性是指意识经验有着极为丰富的存在状态和变化形式，在某种程度上，可以说人们在每时每刻的意识体验都是独一无二的，过后就不会再有完全相同的意识体验。整合信息的形成依赖各部分神经结构的共同参与，如果拿掉其中一部分神经结构，所产生的整合信息就会彻底改变。因此，整合信息是不能被分解成各个部分的。同时，整合信息的存在状态和形式又是极为丰富多样的，刺激输入和神经系统状态的细微变化都会产生不同形式的整合信息。整合信息的不可分解性和丰富多样性可以解释意识经验的高度整合性与高度分化性。按照整合信息理论，意识产生的神经基础是人脑的整个神经结构或神经网络。"}]},{"name":"第六章 记忆","items":[{"q":"记忆的三阶段模型","a":"阿特金森和谢夫林提出的记忆的三阶段模型，很好地说明了三个记忆系统的关系。该模型认为，记忆由感觉记忆、短时记忆和长时记忆三个阶段组成，它们之间有着十分密切的联系。信息首先进入感觉记忆，其中那些引起个体注意的感觉信息才会进入短时记忆，短时记忆一方面作为信息寄存器，另一方面作为加工器，通过复述把信息转入长时记忆中，而保存在长时记忆中的信息在需要时又会被提取出来，进入短时记忆中。近年来，心理学家修订了记忆的三阶段模型。修订的模型增加了自动化加工和工作记忆的概念。根据修订的记忆模型，一些信息可以经过自动化的、非注意的加王进入长时记忆。这解释子外部事件进入感觉记忆后可以不通过短时记忆的复述直接转变成长时记忆的现象。该模型还主张用工作记忆的概念代替短时记忆。"},{"q":"遗忘的原因／理论","a":"1．衰退说衰退说认为，遗忘是记忆痕迹得不到强化而逐渐减弱，以致最后消退的结果。2．干扰说干扰说认为，遗忘是因为在学习和回忆之间受到其他刺激的干扰所致。一旦干扰被排除，记忆就能恢复，而记忆痕迹并未发生任何变化。干扰说可以用前摄抑制和倒摄抑制来说明。【前摄抑制】是先学习的材料或者从事的活动对识记和回忆后学习的材料的干扰作用。【倒摄抑制】是后学习的材料或者从事的活动对识记和回忆先学习的材料的干扰作用。3．压抑说压抑说认为，遗忘是由情绪或动机的压抑作用引起的，如果这种压抑被解除，记忆就能恢复。压抑说考虑了个体的需要、欲望、动机、情绪等在记忆中的作用。4．提取失败说提取失败说认为，存储在长时记忆中的信息是永远不会丢失的，我们之所以对一些事情想不起来，是因为我们在提取有关信息的时候没有找到适当的提取线索。【由提取诱发的遗忘】是指回忆部分记忆材料时，往往会导致对其他相关记忆材料回忆率的降低。基于抑制的理论认为，在提取练习阶段，与线索相关的非目标项目也被激活了，这些非目标项目的激活与目标项目产生了竞争，因此，为了提取目标项目，需要对非目标项目进行抑制，抑制导致了遗忘；基于竞争的理论认为，提取练习导致了一些项目的可提取性增强，这些项目干扰了其他未经过提取练习的项目，因此妨碍了这些项目在回忆阶段的成功提取，抑制不是必需的。（第六版P232）"},{"q":"短时记忆的特征","a":"1．信息保持时间短，一般不超过1分钟；2．容量有限，一般为7±2个组块；46（务必结合校区强化课使用） 3．短时记忆中的信息是有意识的，可操作的； 4．复述是短时记忆中的信息进入长时记忆的途径；5．编码形式以听觉编码为主，也存在视觉和语义编码；6．提取方式是完全系列扫描；7．遗忘原因主要是信息的干扰作用。"},{"q":"遗忘的影响因素","a":"1．时间因素遗忘在学习之后立即开始，遗忘的过程最初进展得很快，以后逐渐缓慢。2．识记材料的性质和数量对形象的材料比对抽象的材料遗忘得慢；对有意义的材料比对无意义的材料遗忘要慢得多；记忆有韵律的权料比记忆无韵律的材料效果好；在学习程度相同的情况下，识记材料越多，遗忘得越快，识记材料少，则遗忘慢。3．学习的程度对材料的识记没有一次能达到无误背诵的标准，称为低度学习；达到恰能背诵之后还继续学习一段时间，将 50（务必结合校区强化课使用）为过度学习。过度学习的材料比恰能背诵的材料记忆效果要好一些。 4．识记材料的系列位置在回忆系列材料时，最后呈现的材料遗忘得最少，其次是最先呈现的材料，遗忘最多的是中间部分，这种在回忆系列材料时发生的现象叫系列位置效应。最后呈现的材料最易回忆，遗忘最少，叫近因效应。最先呈现的材料较易回忆，遗忘较少，叫首因效应。5．识记者的态度识记者是否想记住以及识记材料的重要性、趣味性等，对遗忘的快慢也有一定的影响。在人们的生活中不占重要地位的、不引起人们兴趣的、不符合个人需要的事情容易被遗忘。"},{"q":"记忆的脑学说（补充）","a":"1．整合论美国心理学家拉什利最早提出整合论，他认为记忆是整个脑皮层活动的结果，和脑的各个部分都有关系，而不是皮层上某个特殊部位的机能，也叫非定位论或脑均势说。2．定位说定位说认为，记忆是由脑的特定部位负责的。法国医生布洛卡很早就提出了定位说思想，潘菲尔德在做开颅手术时用微电极刺激患者大脑皮层的颞叶，引起了病人对往事鲜明的回忆，鲁利亚也发现皮下组织与记忆有密切的关系，不少研究都支持脑的定位说。3.SPI理论记忆的SPI理论由图尔文提出，用来解释多重记忆系统之间的关系。SPI理论假定存在五种主要的记忆或记忆系统：程序记忆系统、知觉表征系统、语义记忆系统、初级记忆统和情境记忆系统。这五种记忆系统在种系发生和个体发展中都存在一定的顺序，在加工过程中也存在一定的系。SPI理论假设：（1）这些系统的编码是串行的（Serial,S)，信息以串行的方式在系统中得到编码，一个系统的输出提供了5一个系统的输入，信息在前一个系统中得到了成功的加工，才能在下一个系统中得到编码，这个过程就是系列工的形成。（2）存储是并行的（Parallel,P)，即一次编码的事件会在多个记忆系统中产生效应，并保存在不同的脑区内（3）提取是独立的（Independent,I)，即从一个记忆系统中提取信息时可以不受其他记忆系统的影响，各个于系统之间是相互独立的。SPI理论提出了对记忆系统和记忆过程的整合方式，这对推进记忆的研究具有重要理论意义，对解释许多或验结果也有重要的作用，但这个理论还只是一个抽象模型，没有说明不同记忆系统的神经解剖和神经生理基础. 例如，对于你见到的一个有意义的陌生句子，并呈现在一定情境中，那么这个事件的不同信息就登记在各个相应的子系统中，并依次进行编码。语义系统的产物就会到达语义记忆系统，句子的情境会进入情境记忆系统，由于呈现时间有限，可能会将信息储存在初级记忆系统，但当你再次见到这个句子时，就可能记得它的含义，去想不起来在什么情况下见过它，这说明存储过程是并行的，而提取过程则是独立的。"},{"q":"感觉记忆的信息加工（感觉记忆的编码）","a":"1．图像记忆视觉的感觉记忆叫图像记忆或映像记忆，是指视觉器官能识别刺激的形象特征，并保持一个生动的视觉图像，它是感觉记忆的一种主要编码形式。由斯伯林首创的局部报告法证实了感觉记忆的存在，该实验还证明了感觉记忆具有相当大的容量，大约9个，但是保持的时间十分短暂。44（务必结合校区强化课使用） 2．声像记忆 听觉的感觉记忆编码形式被称为声像记忆或回声存储，是听觉系统对刺激信息的瞬间保持。声像记忆的存在是由莫瑞等人模仿斯伯林的局部报告法实验确定的，后来达尔文等人对其性质进行研究，发现其保持时间可以达到4秒，但容量约5个，小于图像记忆。3．触觉的感觉记忆（第六版P210）格兰斯对触觉的感觉记忆进行了研究，证明了触觉感觉记忆的存在以及触觉感觉记忆可能的容量，还发现触觉感觉记忆保持的时间与刺激呈现的数量有关，为1~5秒的时间。"},{"q":"长时记忆的信息加工","a":"长时记忆的信息编码就是把新的信息纳入已有的知识框架内，或把一些分散的信息单元组合成一个新的知识框架。1．编码形式（1）按语义类别编码：长时记忆主要采用的是语义编码，即按刺激物的意义进行编码储存。（2）以语言特点为中介进行编码：借助语言的某些特点，如发音字形等，对当前输入的某些信息进行编码，使其成为可以储存的东西，利用语言的音韵和节律等特点也能对记忆材料进行编码。（3）运用组织策略进行编码：学习无关联的材料时，如果不能分类也没有联想意义上的联系，则个体会倾向采取一定的组织策略进行编码，其中主观组织就是一种策略。2．编码的影响因素（1）编码时的意识状态通常有意编码效果优于自动编码，自动编码与无意识过程相关；有组织活动的参与，自动编码也能取得较的效果。（2）加工深度众学简快对材料的加工越深，记忆效果越好。（3）觉醒状态（第六版P221）觉醒状态即大脑皮层的兴奋水平，直接影响记忆编码的效果。"},{"q":"长时记忆信息提取的线索","a":"1．情境依存性记忆：又称编码特异性原则，是指提取信息时的情境和编码时的情境越相似，越有助于记忆的现象。（务必结合校区强化课使用）49 2．状态依存性记忆：是指提取信息时的生理或心理状态和编码时的状态越相似，越有助于记忆的现象。"}]},{"name":"第七章 思维","items":[{"q":"与表象有关的双重编码理论","a":"加拿大心理学家佩维奥提出的双重编码理论认为，人脑中同时存在言语和非言语符号的双重编码系统。言语符号系统负责处理语言的信息；非言语符号系统，即表象系统，负责处理非语言的或者形象的信息。两个系统的功能是相互独立的，但也存在一定的联系、功能独立表现为一个系统的激活不以另一个系统的激活为前提，或者两个系统可以平行被激活。联系表现为一个系统的激活能够引起另一个系统的激活，两个系统存在相互作用。由于两个系统既相互独立，又相互作用，因此，如果对于某个刺激能够采用两种方式编码，那么就会比采用一种方式编码具有认知加工上的优势。"},{"q":"概念形成的理论／人工概念形成的途径","a":"1．假设检验说布鲁纳等人的假设检验说认为，概念形成的过程是不断提出假设、验证假设的过程。被试根据对实验材料的分析、综合与主试提供的反馈，提出种种假设，当某种假设被证明是正确的时候，概念就形成了。2．样例学习说（原型理论）茹什提出的样例学习说认为，自然概念的形成以样例学习为主，即在掌握自然概念时，不是掌握它的一个或者几个本质特征，而是对概念样例进行记忆。记忆中有代表性的一个或者几个样例就是概念原型，即最能代表该范畴的典型成员。"},{"q":"纽威尔和西蒙的“通用问题解决者模型”","a":"纽威尔和西蒙用问题空间的概念说明问题解决的过程。问题空间是指问题解决者对所要解决的问题的一切可能的认识状态，包括对问题的初始状态和目标状态的认识，以及如何由初始状态转化为目标状态的认识等。他们认为，问题解决就是对问题空间进行搜索，以找到一条从问题的初始状态到达目标状态的通路。"},{"q":"概念的种类","a":"1．根据反映事物属性的数量及其相互关系分类 54（务必结合校区强化课使用） （1）合取概念：是指两个或者两个以上的特征必须同时具备的概念。 （2）析取概念：根据不同的标准，结合单个或多个属性所形成的概念。（3）关系概念：根据事物之间的相互关系形成的概念。2．根据概念形成的自然性分类（1）自然概念：是指在日常生活中自然而然形成的概念，其内涵和外延都比较模糊，很难用一套规则或者定义性特征来限定，而是更多使用典型性特征或特有特征来说明。（2）人工概念：又称正式的概念，是指根据一套规则或者定义性特征来定义的概念，其内涵和外延都比较清晰。【定义性特征】是指定义一个概念必要且充分的特征。（第六版P254） 【典型性特征】是指一个概念表现出的典型特点，但并非概念的所有成员都具备这一特征。（第六版P255） 3．根据概念所包含的属性的抽象与概括程度分类（补充） （1）具体概念：指按事物的指认属性形成的概念。（2）抽象概念：指按事物的内在、本质属性形成的概念。"},{"q":"问题的种类","a":"1．根据问题的明确程度分类（1）定义良好的问题（界定清晰的问题）：是指初始状态、目标状态以及由初始状态如何达到目标状态的一系列过程都很清楚的问题。（2）定义不良的问题（界定模糊的问题）：是指问题的初始状态或目标状态不清楚，或者对两者都没有明确说明。2．根据问题解决者是否有对手分类（1）对抗性问题：在解决对抗性问题时，人们不仅要考虑自己的想法，而且要考虑对手的想法。（2）非对抗性问题：在解决非对抗性问题时，没有对手参与。 3．根据问题解决者具有的相关知识的多少分类（1）语义丰富的问题：是指解题者对所要解决的问题具有很多相关的知识的问题。（2）语义贫乏的问题：是指解题者对要解决的问题没有相关的经验的问题。"},{"q":"表象的特征(23J）","a":"1．直观性：表象是以生动具体的形象在头脑中出现的。人头脑中产生某种事物的表象，就好像直接看到或者听到这种事物的某些特征一样。2．概括性：表象是人们多次知觉的结果，它不表征事物的个别特征，而是表征事物的大体轮廓和主要特征，因此表象具有概括性。3．可操作性：由于表象是知觉的类似物，因此人们可以在头脑中对表象进行操作，这种操作就像人们通过外部动作控制和操作客观事物一样。表象的可操作性可以用心理旋转实验来说明。"},{"q":"表象在思维中的作用(23J）学筒天","a":"1．表象为概念的形成提供了感性基础表象离开了具体的事物，摆脱了感知觉的局限性，为概念的形成奠定了感性的基础。2．表象促进问题的解决和推理表象是思维的基本单位，形象思维主要是借助表象进行的，表象也有助于抽象思维。在进行问题解决和推理时，表象也起着重要的作用。例如，在利用概念进行抽象思维时，需要表象的帮助和支持。"},{"q":"推理的分类（补充）","a":"推理一般分为演绎推理和归纳推理。演绎推理是指从一般性知识的前提到特殊性知识的结论的推理。归纳推理是指从特殊性知识的前提到一般性知识的结论的推理。演绎推理和归纳推理既有区别又有联系。1．区别（1）演绎推理是从一般性知识的前提推出一个特殊性知识的结论，即从一般到特殊的过程，而归纳推理是从一些特殊知识的前提出发，推出一个一般性结论，即从特殊到一般的过程。56（务必结合校区强化课使用） （2）演绎推理的结论一般不超过前提所断定的范围，其前提与结论之间的联系是必然的，而归纳推理的结论一般超出前提所确定的范围，其前提和结论之间的联系具有或然性。 2．联系演绎推理和归纳推理是密切联系、相互依赖、互为补充的。演绎推理的一般性知识的大前提必须借助于归纳推理从具体的经验中概括出来，从这个意义上来说，没有归纳推理也就没有演绎推理。同时，归纳推理也离不开演绎推理。因为在归纳推理的过程中，人们常常需要运用演绎推理对某些归纳的前提或结论加以论证，从这个意义上说，没有演绎推理也就不可能进行正确的归纳。"},{"q":"演绎推理的类型","a":"1．三段论推理三段论推理是由两个假定真实的前提和一个可能符合，也可能不符合这两个前提的结论所组成。关于三段论推理出现不正确的结论的解释有以下3种。（1）气氛效应：武德沃斯等人认为，前提所使用的逻辑量词产生了一种“气氛”，使人们容易接受包含有同一逻辑量词的结论。（2）换位理论：查普曼等人认为，人们错误地解释了前提才造成推理错误。（3）心理模型理论：约翰逊一莱尔德等人认为，推理中的错误是由于人们对前提的信息加工不充分，或者说受工作记忆容量的限制，只根据前提创建了一个心理模型，而没有考虑建立更多的心理模型。2．线性推理线性推理又称关系推理、线性三段论，认为所给予的两个前提说明了三个逻辑项之间的可传递关系。3．条件推理条件推理是指人们利用条件性命题进行的推理。人们在条件推理中，倾向于证实某种假设或规则，而很少去证伪它们，这就是证实倾向。有一种观点认为证实倾向是材料的抽象性、人工性导致的。"}]},{"name":"第八章 语言","items":[{"q":"转换生成语法理论","a":"根据乔姆斯基提出的转换生成语法理论，他认为任何一个语句都包含两个层次的结构：表层结构和深层结构。表层结构是指我们实际上所听到或看到的语句形式，或说话时所发出的声音以及书写时所采用的书面形式；而深层结构是指说话者试图表达的句子的意思。表层结构决定句子的形式，深层结构决定句子的意义。同一个深层结构可以用不同的表层结构来体现，即在表达同一意义时，可以采用不同的表达方式。一个表层结构也可包含两个或更多的深层结构，在这种情况下，语句就出现歧义。歧义是语言的一种普遍现象。从深层结构到表层结构的转换，要通过转换规则来实现。转换规则是说明句子的深层结构与表层结构转换关系的规则，通过转换，相同的深层结构就可以用不同的表层结构表达出来。"},{"q":"语言与其他认知能力的关系","a":"萨丕尔一沃尔夫假设又称语言相对论假设，该假设认为语言决定了人们的思维和知觉世界的方式。后来，经过修订的语言相对论假设认为，语言会影响而非决定人们的思维和知觉世界的方式，这种观点得到了诸多研究的支持，例如，研究发现语言可能影响了被试的颜色知觉和记忆。"},{"q":"双语加工与其他认知加工的关系","a":"1．学习两种语言会提升双语者的执行功能，如认知灵活性、抑制能力和工作记忆，这就是双语认知优势效应。2．双语经验对认知老化有延缓作用。3．双语经验还有一些不利影响，例如双语者在给物体命名时需要更长的时间，语言流畅性较差，舌尖现象较多。"},{"q":"语言运动中枢（布洛卡区）","a":"1．位置：位于第三额回后部、靠近大脑外侧裂处的一个小区。2．功能：产生详细而协调的发音程序；提供语言的语法结构信息；产生语言的动机和愿望。3．受损后症状：布洛卡区受到损伤会产生发音运动障碍或运动性失语症。病人阅读、理解和书写不受影响，发音器官完整无损，功能正常，但发音困难，不能正常说话。"},{"q":"语言听觉中枢（威尔尼克区）","a":"1．位置：位于左半球颞叶颞上回的后部，赫氏回的尾端。2．功能：分辨语音，形成语义，与语言的理解（或印入性语言）有密切联系。3．受损后症状：这个区域受到损伤会产生接收性失语症，这是一种语言失认症。病人能听到别人说话的声音但不能理解语言的意义；或者能重复别人说的话，但却错误地估计了词义；或者谈吐自由，语速很快，但话语却没有意义。切断或损伤将威尔尼克区与布洛卡区联系起来的神经纤维束-弓形束，也将产生同样的结果。"},{"q":"语言视觉中枢（角回）","a":"1．位置：位于角回，顶叶、枕叶和颞叶的交界处，在威尔尼克区的上方。2．功能：实现视觉与听觉的跨通道的联合，能将书面语与口语互相转换。3．受损后症状：该中枢受到损伤会产生听一视失语症，病人看到文字却不能认得，并使口头语言与书面语言失去了相互转换的功能，病人能说话，能理解口语，但不能理解书面语言，引起阅读障碍。此外，还可能会出现语义性失语症，表现为患者对比较简单的语法结构的句子尚能理解，对于语法结构比较复杂的句子，丧失了理解其意义的能力，且不能理解词与词的关系。"},{"q":"语言的定位观","a":"1．主要观点语言的定位观认为，语言功能可能定位在某些特定的脑区。该观点主要有两部分的内容，一部分是语言与特定脑区之间的关系问题，另一部分是语言与左右两个半球之间的关系问题。64（务必结合校区强化课使用） （1）威尔尼克一格施温德模型 威尔尼克和格施温德通过总结相关研究，提出了主要包括布洛卡区、威尔尼克区以及把它们联系起来的弓形束的经典语言加工神经环路，称为威尔尼克一格施温德模型。这一语言加工神经环路对语言的产生和理解都有重要的意义。（2）语言的半球优势假说左半球是语言功能的优势半球，其可能与脑结构的偏侧化有关，也会受到利手和性别的影响。2．局限语言的定位观可能并不能很好地解释语言与脑的关系。（1）语言的加工不只局限于左半球的布洛卡区和威尔尼克区等脑区，而是分布在更广泛的脑区中，包括右半球的部分脑区。（2）即便是在左半球，也不只有布洛卡区和威尔尼克区与语言有关，其他脑区在语言加工中也发挥着重要作用。（3）单个脑区的损伤不一定会导致语言功能的完全丧失。经典的语言区对语言功能来说可能并不是不可或缺的，其功能也不是那么明确和绝对的。"}]},{"name":"第九章 动机","items":[{"q":"需要的种类","a":"1．按需要的起源分类（1）自然需要：也称生物学需要，是由机体内部生理的不平衡状态引起的，对机体维持生命、延续后代有重要意义，包括饮食、运动、休息、睡眠、性的需要等。（2）社会需要：反映了人类社会的要求，对维系人类社会生活、推动社会进步有重要意义，包括劳动、交往、成就、社会赞许、求知的需要等。2．按需要指向的对象分类（1）物质需要：指向物质产品，并以占有这些产品而获得满足，如对日常生活必需品的需要等。（2）精神需要：指向各种精神产品，如对文艺作品、报刊、电视、电影等的需要。"},{"q":"逆转理论","a":"阿普特尔等人提出逆转理论，他们认为人们的心理需要是对立的，概括起来有四对相反的元状态，即目的一超越目的、顺从一逆反、控制一同情、自我中心一他人取向，进而有不同的动机模式。每对动机状态都是按相反方向对应排列的，在当前任务中每对动机的两种状态中只有一种能够被激活。"},{"q":"马斯洛需要层次理论","a":"1．需要的等级马斯洛认为，人的需要是由以下五个等级构成。（1）生理的需要：维持人的正常生活条件的需要，包括人对食物、水分、空气、睡眠、性的需要等。是人的所有需要中最重要、最有力量的。（2）安全的需要：它表现为人们要求稳定、安全、受到保护、有秩序、能免除恐惧和焦虑等。（3）归属和爱的需要：它表现为一个人要求与其他人建立联系，如结交朋友、追求爱情、参加团体并在其中获得某种地位的需要。（4）尊重的需要：它包括自尊和希望受到别人的尊重的需要。（5）自我实现的需要：它表现为人们追求实现自己的能力或潜能，并使之完善化。2．需要等级之间的关系（1）这五种需要都是天生的、与生俱来的。（2）需要的层次越低，它的力量越强，潜力越大。随着需要层次的上升，需要的力量相应减弱。（3）在高级需要得到满足之前，必须先满足低级需要。只有在低级需要得到满足或部分得到满足以后，高级需要才会出现。人类的进化以及个体的发展中，低级需要出现较早，而高级需要出现较晚。（4）低级需要为前四种需要，他们直接关系到个体的生存，因而也叫缺失需要。当这些需要得不到满足时，个体将出现直接的生命危机。（5）高级需要不是维持个体生存所绝对必需的，但是高级需要与人的健康成长紧密联系，高级需要的满足可以使人健康、长寿、精力旺盛，能扩展人的经验，充实人的生命。因此，高级需要也叫生长需要。3．局限（第六版P328） （1）马斯洛认为人的需要源于先天的本能，这模糊了人的生物需要与社会需要之间的差异；（2）马斯洛根据需要出现的早晚来划分需要发展的层次，这种划分有一定的依据和研究价值，但他没有充分说明各种需要之间的内在联系。4．应用（第六版P328） （1）教育领域教师在教学中不仅要关心学生的学习态度和学习成绩，而且要关心学生的身体状况是否健康、生活是否安定、（务必结合校区强化课使用）69 家庭是否和谐、父母是否离异、同学关系怎样等。只有了解这些情况，帮助学生满足需要，才能更好地调动他们学习的积极性。 （2）员工管理管理者在管理工作中不仅要关心员工的工作绩效，而且要在工作绩效之外的其他方面支持他们，如提供灵活的工作时间、让员工有时间关注他们的家庭、确保他们得到公平的报酬以获得经济上的稳定等。"},{"q":"动机的早期理论","a":"1．本能论（1）理论观点该理论认为人的大部分行为是由本能控制的。①詹姆斯：人的行为依赖于本能的指引，人除了具有与动物一样的生物本能外，还具有社会本能，如爱、社交、同情、诚实等。②麦独孤：他系统地提出了动机的本能理论，认为人类的所有行为都是以本能为基础的；本能是人类一切思想和行为的基本源泉和动力；本能具有能量、行为和目标指向三个成分。个人和民族的性格和意志也是由本能逐渐发展形成的。他认为人类有18种基本本能。 ③洛伦茨：本能是由遗传决定的、受特异能量驱动的物种特有的固定动作模式：个体的经验可以转化为本能行为，行为是本能与学习交互作用的结果。④弗洛伊德：人的心理活动的原动力是由人类生来固有的本能驱力决定的，这种本能驱力使人类产生一种紧张状态，驱使人采取行动，并通过消除紧张来获得满足。精神分析理论还认为，人类最基本的本能是生的本能与死的本能，它们是人类行为的两种基本动力。⑤马斯洛：他的需要层次理论认为，人类的需要都是先天的，行为是由生来固有的自我实现的潜能决定的。（2）理论评价不能确切解释行为的原因，对人类行为的解释是一种循环论证的过程，本能论过分强调固定的先天的行为机制，而人类的许多行为可以更好地由学习解释。跨文化的研究也表明，许多曾被认为是普遍代表“人类天性”的行为模式实际上是可变的，它们反映着独特的文化与价值观的差异。2．驱力理论（1）理论观点 ①武德沃斯武德沃斯提出了行为因果机制的驱力概念，以代替本能概念。所谓驱力是指个体由生理需要所引起的一种紧张状态，它能激发或驱动个体行为以满足需要，消除紧张，从而恢复机体的平衡状态。②赫尔赫尔提出了驱力减少理论。他假定个体要生存就有需要，需要产生驱力。驱力是一种动机结构，它供给机体的力量或能量，从而推动个体从事某种行为满足需要，进而减少驱力。之后他又提出，人的行为主要是由习惯来支配的，而不是由生物驱力支配的。他强调经验和学习在驱力形成中的作用，认为学习对机体适应环境有重要意义。赫尔认为，有些驱力来自内部刺激，不需要习得，称为原始驱力，它维持着人类的生存；有些驱力来自外部刺激，是通过学习得到的，称为获得性驱力或二级驱力。赫尔认为，驱力（D）、习惯强度（H）共同决定了个体的有效行为潜能（P)，它们的关系可以表示为：P=D×H。其中，习惯强度是指刺激和反应之间的联结的力量，制约着行为的方向。在习惯强度一定的情况下，行为反应的潜能与驱力的强度成正比。（2）理论评价行为是从刺激反应之间的联系中习得的观点得到了行为主义的赞同，但忽视了外在情境的作用，不能解释一些复杂的社会行为，如通宵达旦地工作、绝食行为、急中生智等，在这些行为中，人的驱力不是减少而是增加了。另外，该理论也不能解释为什么有时个体的行为恰恰是为了唤起紧张，如看恐怖电影、蹦极等。3．唤醒理论P353（第六版P344）赫布和柏林等人提出的唤醒理论认为，人们总是处在唤醒状态，并维持着生理激活的一种最佳水平，不是太高，也不是太低。对唤醒水平的偏好是决定个体行为的一个因素。一般来讲，个体偏好中等强度的刺激水平，因为它能引起最佳的唤醒水平，而对于过低或过高的刺激，个体是不喜欢的。唤醒理论提出了三个原理：（1）人们偏好最佳的唤醒水平：刺激水平和偏好之间的关系是一条倒“U”形曲线。（2）简化原理：重复进行刺激能使唤醒水平降低。72（务必结合校区强化课使用） （3）个人经验对于偏好的影响：研究表明，富有经验的个体偏好于复杂的刺激。经验能够帮助个体更好地组织刺激。 4．诱因理论诱因指能满足个体需要，驱使个体产生一定行为的外在因素，它具有激发或诱使个体朝向目标的作用。诱因有积极和消极之分，有吸引力的刺激物称为积极诱因：个体回避的刺激物（如痛苦、贫困、失败等）称为消极诱因。赫尔在驱力理论的基础上，接受了诱因这一变量，修改了自己的公式，在其中增加了诱因（K）这一因素：P=D×H×K。"},{"q":"动机的认知理论","a":"1．期待价值理论托尔曼的期待价值理论将个体对达到目标的期待作为行为的决定因素，他将期待定义为刺激与刺激的联系（S1-S2）或反应和刺激的联系（S1-R-S2）。该理论的基本思想是，个体完成任务的动机是由他对任务成功可能性的期待及对任务所赋予的价值决定的。2．动机的归因理论（19L）归因是指用因果关系推论的方法，从人们行为的结果寻求行为原因的过程。（1）海德的归因理论海德认为行为的结果可以归因于个人（或内部原因）和环境（或外部原因）因素，或者同时归因于这两种因素。内部原因是指存在于个体本身的因素，如能力、努力、兴趣、态度等。外部原因是指环境因素，如任务难度、外部的奖励与惩罚、运气等。（2）罗特的归因理论（第六版P346）罗特的控制点理论认为，控制点是关于影响自己行为和结果的力量位置的看法。依据控制点把人分为内控型和外控型两类。内控型的人认为成败是由自身的原因造成的，内控型的人具有较高的成就动机；外控型的人则认为成败是由于外部因素造成的。（3）韦纳的归因理论韦纳系统地提出了动机的归因理论，证明了成功和失败的因果归因是成就活动过程的中心要素。个体对自己行为及结果有寻找原因的倾向，个体解释自己行为结果时的归因是复杂而多维度的，不同的归因方式会影响个体今后的学习动机。归因的维度有三种：控制点（内外因）、稳定性、可控性。其中，归因的内外因维度影响个体对成败的情绪体验，稳定性维度影响个体对未来成败的预期，可控性影响个体今后努力的行为。内部的外部的稳定性能力（不可控）任务难度（不可控）不稳定性努力（可控）运气（不可控） ①可控性维度即该原因是否能为个人所掌控，如努力是个人可以掌控的，而能力、工作难度、运气、身心状况和他人的反应等是个人不可控的。②除内外源维度外，韦纳把稳定性作为一个新的维度，把行为原因分为稳定和不稳定的，能力、任务难度是稳定因素，努力、环境、运气等是不稳定因素。若将成就行为归于不稳定因素，人们会预期结果与上一次不一致；反之则预期与上一次一致。③将失败归于内部、稳定、不可控的因素会产生习得性无助。3．自我决定理论自我决定理论由德西和瑞安提出，强调自我决定在行为选择和个人发展中的作用，认为人们拥有内在的自我（务必结合校区强化课使用）73 决定的倾向性。这种倾向性引导人们从事感兴趣的、有利于能力发展的活动，灵活地控制自我和社会环境的相互作用，自由选择行动的目标，并通过一系列活动完成目标。自我决定是行为的决定因素，它是外部环境和内部心理资源相互作用的结果。 自我决定理论把动机划分为内部动机、外部动机和无动机三种。由无动机到外部动机再到内部动机是一个连续体。无动机行为缺乏目的性、自主性；外部动机源自外在环境的要求；只有自我决定的动机才是内部动机。由无动机到内部动机经历了复杂的内化过程。（第六版P347） 4．自我效能理论班杜拉的自我效能理论认为，人对行为的决策是主动的，人的认知变量，如期待、注意和评价等，在行为决策中起着重要的作用。其中，期待是决定行为的先行因素，强化的效果存在于期待奖赏或惩罚之中，是一种期待强化。班杜拉把期待分为结果期待和效果期待两种。结果期待是指个体对自己行为结果的估计（或强化）；效果期待是指个体对自己实施某一行为的能力的主观判断。人的行为既受结果期待的影响，也受效能期待的影响。班杜拉提出了自我效能感的概念，即个体对自己在特定情境中是否有能力得到满意结果的预期。其作用主要是调节和控制行为，表现在对行为的选择和坚持性、努力程度和对困难的态度、思维方式和行为效率上。自我效能感的四种来源：个体的成败经验（直接经验）、替代性经验、言语劝说和情绪状态。培养学生或员工自我效能感的方法：首先，帮助他们制定切实可行的目标，积累成功的经验；其次，引导他们观察他人，通过榜样作用获得替代性经验；再次，寻求积极的肯定，听取别人的积极反馈；最后，寻找减轻压力和消极情绪的方法，帮助他们树立自信心。（第六版P348） 5．成就目标理论（20J）尼科尔斯和德韦克等人将成就目标概念引入成就动机领域。成就目标是指个体对从事成就活动的目的或者意义的知觉，表明个体从事成就活动的目的和理由。成就目标理论把成就目标分为两种类型：一种是掌握目标，个体的目标定位在掌握知识和提高能力上，认为达到了上述目标就是成功。另一种是成绩目标，个体的目标定位在取得好名次和好成绩上，认为只有赢了才算成功。研究发现，不同的成就目标对应着不同的动机和行为模式。具有掌握目标的个体，往往会采取主动、积极的行为，如选择适当的具有挑战性的任务，并使用深层的加工策略等；而具有成绩目标的个体，往往有较高的焦虑水平，有时不敢接受挑战性的任务，遇到困难有时容易退缩。一般认为，掌握目标更能激发人们的内在动机，产生持久的推动力，促进人们取得更大的成就。培养掌握目标的方法有：（第六版P350） （1）有意识地创造掌握目标的课堂气氛或工作情境，减少竞争气氛，努力构建有利于发展学生或员工的自尊及创造性的环境；（2）在避免与他人比较、竞争的前提下，对个体的肯定或奖赏最好是个别进行，引导他们对能力形成自我参照的知觉；（3）对个体的进步给予奖励，注意让所有人有均等接受奖励的机会；（4）最好进行个别学习任务或工作任务，当不适合采用个人任务时，也可采用小组合作任务。"},{"q":"成就动机理论","a":"1．麦克兰德等人有关成就动机的研究（1）麦克兰德指出父母的教养方式会影响儿童成就动机的形成，而且成就动机水平的高低决定了经济的发展，养育者对孩子独立性的训练与成就动机呈正相关。（2）麦克兰德认为成就动机水平的高低会影响人们对职业的选择。成就动机低的人愿意选择风险较小、独立决策较少的职业；而成就动机高的人喜欢毛遂自荐，喜欢具有一定风险的、富有开创性的工作，并在工作中敢于做出决策。（3）后人的研究表明，个体的成就动机水平与父母的教养方式有关。民主型的教养方式对大学生的成就动机有积极影响，能提高学生追求成功的动机，降低避免失败的动机。（4）我国研究表明，父母的训练方式对儿童成就动机的形成有影响，而且父亲的训练和母亲的训练的影响又有差异。2．阿特金森的成就动机理论（1）理论观点阿特金森的成就动机理论认为，成就动机是由成就需要（M）、成功的可能性（P）、成功的诱因值（I）三个因素决定的。用公式表示为：T=M×P×I，其中，T代表成就动机的倾向。成就需要是个体追求成功的相对稳定的特质，是成就中体验到自豪的能力；成功的可能性来自个体对情境或任务的认知；成功的诱因值即成功给个体带来的价值感和满足感，与成功率呈相反的关系。阿特金森把成就动机分为两种：力求成功的动机和避免失败的动机。根据它们在个体动机体系中所占的强度，个体可以分为力求成功者和避免失败者。力求成功者倾向于追求成功，较少害怕失败，行为的目标定位于获得成功，他们倾向于选择中等难度的任务，因为这样不仅可能取得成功，还能体会到成功后的自豪感；避免失败者害怕失败，较少追求成功，行为目标定位于避免失败，他们倾向于选择容易或者很难的任务，因为容易的任务易于成功，而很难的任务即使失败了，也可以把失败归因于任务难度，减弱失败感。（2）理论评价该理论综合考虑了影响成就动机的诸多因素，对动机理论的建立和发展有着深远意义。但它也有不完善之处，如没有关注外部社会生活条件对人的成就动机的作用，对情感如何影响成就活动的认知缺乏清晰、具体的阐述等。"},{"q":"动机的功能","a":"1．激活功能（能量）：动机是个体能动性的一个主要方面，它具有发动行为的作用，能推动个体产生某种活动，使个体由静止状态转向活动状态。一般认为，中等强度的动机有利于任务的完成。2．指向功能（目标）：动机不仅能激发行为，而且能将行为指向一定的对象或目标。动机不同，个体活动的方向和所追求的目标也不一样。3．维持和调整功能（行为）：动机具有维持功能，它表现为行为的坚持性。当动机激发个体的某种活动后，这种活动能否坚持下去，同样要受动机的调节和支配。动机的维持功能是由个体的活动与他所预期的目标的一致程度来决定的。当活动指向个体所预期的目标时，这种活动就会在相应动机的维持下继续下去；相反，当活动背离了个体所预期的目标时，进行这种活动的积极性就会降低，或者完全消失。"}]},{"name":"第十章 情绪","items":[{"q":"情绪维度的理论","a":"1．三维理论 （1）冯特提出了情绪的三维理论，认为情绪是由三个维度组成的，即愉快一不愉快；激动一平静；紧张一松弛。每一种具体情绪分布在三个维度的两极之间的不同位置上。（2）施洛伯格根据面部表情的研究提出，情绪的维度有愉快一不愉快、注意一拒绝和激活水平三个维度。（3）普拉切克提出，情绪具有强度、相似性和两极性三个维度，并用一个倒锥体来说明三个维度之间的关系。锥体截面划分为八种原始情绪，相邻的情绪是相似的，对角位置的情绪是对立的，锥体自下而上表明情绪由弱到强的变化。2．四维理论伊扎德提出了情绪的四维理论，认为情绪有愉快度、紧张度、激动度和确信度四个维度。3．二维理论（第六版P357）罗素提出了情绪的二维理论，认为情绪是由愉悦度（或效价）和唤醒度两个维度构成的。愉悦度维度在愉悦（积极）与非愉悦（消极）之间变化；唤醒度维度是指与情绪状态相联系的机体能量激活的程度，在平静与兴奋之间变化。该理论是目前占主导地位的一种情绪维度理论。"},{"q":"情绪的早期理论","a":"1．詹姆斯一兰格理论（外周情绪理论） （1）理论观点詹姆斯认为情绪是对身体变化的知觉。兰格认为情绪是内脏活动的结果，特别强调情绪与血管变化的关系。他们在情绪产生的具体描述上虽有不同，但他们的基本观点是相同的，都强调情绪是自主神经系统活动的产物。即情绪刺激引起生理反应，而生理反应进一步导致情绪体验的产生。（2）贡献：詹姆斯一兰格理论看到了情绪与机体变化的直接关系，强调了自主神经系统在情绪产生中的作用。（3）局限：片面强调自主神经系统的作用，忽视了中枢神经系统的调节、控制作用。2．坎农-巴德学说（丘脑情绪理论）坎农认为情绪的中心不在外周神经系统，而在中枢神经系统的丘脑。坎农进一步描述了这一神经系统活动的过程，由外界刺激引起感觉器官的神经冲动，通过传入神经，传至丘脑；再由丘脑同时向上、向下发出神经冲动，向上传至大脑，产生情绪的主观体验，向下传至交感神经，引起机体的生理变化，使个体的生理进入应激状态。因此情绪体验和生理变化是同时产生的。"},{"q":"情绪的动机一分化理论","a":"这种理论以伊扎德为代表。该理论的主要内容有：1．情绪是分化的：存在着具有不同体验的独立情绪，每种情绪都有其发生的渊源和特定的适应功能，在组织、动机和体验上都有其独特性，并对认知与行为产生不同的影响。情绪的分化是进化过程的产物。2．情绪在人格系统中的地位和作用：情绪是人格系统的组成部分，也是人格系统的核心动力。情绪的主观成分-体验是起动机作用的心理机制，是驱动有机体采取行动的力量。3．情绪自身也是一个复杂系统：情绪包含神经生理、神经肌肉／表情行为、情感体验三个子系统，它们相互作用和联结，并与认知、动作等人格子系统建立联系，实现情绪与其它系统的相互作用。"},{"q":"情绪调节过程模型","a":"格罗斯认为情绪调节是在情绪发生过程中展开的，在情绪发生的不同阶段，会产生不同的情绪调节，据此他提出情绪调节过程模型。依据该模型，情绪调节发生在两个阶段。1．原因调节原因调节又称为关注前行环节的情绪调节，是在情绪发生前。原因调节包括四个环节。（1）情境选择：指以个体趋近或避开某些人、事件与场合来调整情绪的过程。情境选择是人们经常或首先使用的一种情绪调节策略，个体经常使用这种策略来避免或减少消极情绪的发生。（2）情境修正：指根据问题的特点控制情境，并努力改变情境，使个体的情绪得到调节的过程。（3）注意转换：指关注情境中的某个或某些方面，包括将注意努力集中于一个特定的话题或任务，离开原来的话题或任务的过程。82（务必结合校区强化课使用） （4）认知改变：指选择对事件意义的可能解释的过程，这种解释对特定情境中情绪发生的心理体验、表情和生理反应具有很强的影响，认知改变经常被用来降低或增大情绪反应，或者改变情绪的性质。 2．反应调节反应调节又称为关注反应的情绪调节或反应调整，是在情绪发生后，情绪被引发后，对各种情绪反应趋势（如心理体验、表情、生理反应）施加影响，主要表现为抑制表情。"},{"q":"情绪状态及其分类","a":"情绪状态是指在某种事件或情境的影响下，在一定时间内所产生的某种情绪，其中较典型的情绪状态有心境、激情和应激三种。1．心境：是指人比较平静而持久的情绪状态。心境具有弥漫性，它不是关于某一事物的特定体验，而是以同样的态度体验对待一切事物。持续时间从几个小时到几个月甚至更长。2．激情：是一种强烈的、爆发性的、为时短促的情绪状态。这种情绪状态通常是由对个人有重大意义的事件引起的。从积极方面来看，激情可以激发动机，增强幸福感，提高实践活动的效率；从消极方面来看，激情状态下人往往会出现“意识狭窄”现象，即认识活动的范围缩小，理智分析能力受到抑制，自我控制能力下降。78（务必结合校区强化课使用） 3．应激：是指人对某种意外的环境刺激所做出的适应性反应，是一种紧张而带有不愉快色调的情绪状态，应激的产生与人面临的情境及对自己能力的估计有关。应激的适应性综合征包括警觉、抵抗和衰竭三个阶段。"},{"q":"情绪调节的类型","a":"1．根据情绪调节过程的来源分类：内部调节和外部调节；（务必结合校区强化课使用）81 2．根据情绪不同特点分类：修正调节、维持调节和增强调节； 3．根据参照点分类：原因调节和反应调节；4．根据调节的效果分类：良好调节和不良调节。"},{"q":"情绪调节的策略(25综合）","a":"1．回避和接近策略回避和接近策略也叫情境选择策略，它是通过选择有利情境、回避不利情境来实现的，这是情绪调节的一种常用策略。2．控制和修正策略控制和修正策略是通过改变情境中各种不利的情绪事件来实现的，情绪调节者试图通过控制情境来控制情绪的过程或结果，这是一种更为积极的策略。3．注意转换策略注意转换策略包括分心和专注两种策略。分心是将注意集中于与情绪无关的方面，或者将注意从当前的情境中转移开；专注是对情境中的某一方面长时间地集中注意，这时个体可以进入一种自我维持的状态。4．认知重评策略认知重评策略即认知改变，个体通过改变对情绪事件的理解和评价，而进行情绪调节。5．表达抑制策略表达抑制策略是指调动自我控制能力，抑制将要发生或正在发生的表情，启动自我控制过程以抑制自己的情绪行为。6．合理宜泄策略（第六版P383）合理宣泄策略即承认不良情绪并把它适当地表达出来。宜泄有直接表达和间接表达两种，前者是指面对激发情绪的事物或人直接表达自己情绪的一种调节方式，后者是通过一些替代物使情绪得到释放的一种调节方式。"}]},{"name":"第十一章 能力","items":[{"q":"能力的层次结构理论（补充）","a":"弗农继承和发展了斯皮尔曼的二因素说，提出了能力的层次结构理论。他认为，能力的结构是按层次排列的。智力的最高层次是一般因素（G)；第二层次分两大因素群，即言语和教育方面的因素以及操作和机械方面的因素；第三层次为小因素群，包括言语理解、数量、机械信息、空间信息、用手操作等；第四层次为特殊因素，即各种各样的特殊能力。弗农的能力层次结构理论像生物分类学的分类系统那样来设想能力的结构。"},{"q":"三维结构模型","a":"吉尔福特认为智力应当包括三个维度，即内容、操作和产物。1．智力活动的内容包括听觉、视觉、符号（字母、数字及其他符号）、语义（语言的意义概念）和行为（本人及别人的行为）。它们是智力活动的对象或材料。2．智力操作指智力活动的过程，它是由上述种种对象或材料引起的。其中包括认知（理解、再认）、记忆（保持）、发散思维（对一个问题寻找多种答案或思想）、聚合思维（对一个问题寻找最好、最适当、最普通的答案）和评 86（务必结合校区强化课使用）价（对一个人的思维品质做出某种决定）。 3．智力活动的产物是指运用上述智力操作得到的结果，这些结果可以按单元计算，可以按类别处理，也可以表现为关系、系统、转换和蕴含。"},{"q":"多元智力理论（21L）","a":"多元智力理论是由加德纳提出的，加德纳认为，智力的内涵是多元的，它由8种相对独立的智力成分构成。1．言语智力：包括阅读、写文章或小说，以及用于日常会话的能力。2．逻辑一数学智力：包括数学运算与逻辑思考的能力，如做数学证明题及逻辑推理的能力。3．空间智力：包括认识环境、辨别方向的能力，如查阅地图等。4．音乐智力：包括对声音的辨别与韵律表达的能力，如拉小提琴或写一首曲子等。5．运动智力：包括支配肢体完成精密作业的能力，如打篮球、跳舞等。6．人际智力：包括与人交往且能和睦相处的能力，如理解别人的行为、动机或情绪。7．自知智力：包括认识自己并选择自己生活方向的能力。8．自然智力：包括认识、感知自然界事物的各种能力，例如敏锐地觉知周围环境的改变等。"},{"q":"情绪智力理论","a":"目前较公认的理论有三个：梅耶和萨洛维提出情绪智力结构的四维模型、戈尔曼的情绪胜任力模型、巴昂的情绪和社会智力结构模型。梅耶和萨洛维提出情绪智力结构的四维模型的四个维度分别是：1．情绪知觉、评价和表达的能力；2．情绪对思维的促进能力；3．理解、分析情绪，运用情绪知识的能力；4．对情绪自我调节的能力。在这个模型中，情绪智力具有层次结构，情绪知觉、评价和表达的能力处于最底层，是最基本的能力，其他能力在它的基础上不断递进，前一种能力是后一种能力的基础。（第六版P379）"},{"q":"能力形成的影响因素／能力形成的原因和条件","a":"1．遗传的影响遗传是指把生物具有的性状，相对稳定地传给后代的现象。研究显示，遗传关系越近的人，在智力发展水平上确实有接近的趋势。遗传对智力的影响主要表现在身体素质上，身体素质是能力发展的自然前提，对能力的发展有重要的影响。但身体素质不等于能力本身，能力无法直接通过生物学的方式遗传给后代。2．环境和教育的影响（1）产前环境的影响：胎儿在出生前生活在母体中的环境对其生长发育以及出生后智力的发展都有重要的影响。（2）早期经验的作用：从出生到青少年这一时期，是个人生长发育的时期，也是能力发展的重要时间。发展能力要重视早期环境的作用，丰富的环境刺激有利于儿童能力的发展。（3）学校教育的作用：学校教育能够对年青一代施加有目的、有计划、有组织的影响。学生通过系统地接受教育，不仅能掌握知识和技能，而且可以发展能力和其他心理品质。 3．实践活动的影响人的各种能力是在社会实践活动中最终形成起来的。离开了实践活动，即使有良好的素质、环境和教育，能力也难以形成和发展起来。4．人的主观能动性的影响能力的提高离不开人的主观努力，即人的自觉能动性。一个人越是积极地运用自身的能力去解决各类问题，尤其是复杂的问题，抓住各种能够自我提升的机会，其潜能就越有可能充分地表现出来。"},{"q":"斯腾伯格的智力理论","a":"1．三元智力理论P417 斯腾伯格认为，一个完备的智力理论应该包括三个方面，即智力内在成分、智力成分与经验的关系以及智力成分的外部作用。这三个方面构成了智力成分亚理论、智力情境亚理论和智力经验亚理论。（1）智力成分亚理论智力成分亚理论认为智力包括三种成分及相应的过程，即元成分、操作成分和知识获得成分。①元成分是用于计划、控制和决策的高级执行过程。元成分在智力成分中起着核心作用，它决定人们解决问题时所使用的策略。②操作成分表现在任务的执行过程，指接收刺激，将信息保持在短时记忆中并进行比较，负责执行元成分的决策。③知识获得成分是指获取和保存新信息的过程，负责接收新刺激，做出判断与反应以及对新信息进行编码与存储。（2）智力情境亚理论智力情境亚理论认为智力是指获得与情境拟合的心理活动。在日常生活中，智力表现为有目的地适应环境、塑造环境和选择新环境的能力，这些能力统称为情境智力。（3）智力经验亚理论智力经验亚理论提出智力包括两种能力，一种是处理新任务和新环境所要求的能力，另一种是信息加工过程自动化的能力。2．成功智力理论P419（第六版P396）成功智力理论是斯腾伯格在三元智力理论基础上结合大量实验研究提出的更具现实意义的智力理论。该理论关注个体能否使用智力更好地应对生活中各种各样的问题，完成人生的主要目标，因此这种智力也被称为成功智力。智力包括三种类型：分析性智力、创造性智力以及实践性智力。（1）分析性智力分析性智力是人们用来解决问题的关键，涉及对问题的正确表征以及对信息的加工处理过程。分析性智力与学业紧密相关，在阅读文章、解答数学题目时所用到的分析、判断、比较等技能均可体现分析性智力。（2）创造性智力创造性智力与创造力关系密切，涉及发现、创造、想象和假设等创造性思维的能力。创造性智力同样需要基（务必结合校区强化课使用）87 本的认知能力，但更强调的是一种发散性思维。 （3）实践性智力实践性智力涉及解决实际生活中问题的能力，它通常是来自个体自身的生活，而不是通过学校教育获得。成功智力理论强调智力是一个有机整体，而不是一个单维的特质，用分析性智力发现好的解决办法，用创造性智力找对问题，用实践性智力解决实际问题，只有这三个方面协调、平衡时才最为有效。有研究者对成功智力理论提出了怀疑，一方面，该理论可能夸大了实践性智力与传统智力理论的差异；另一方面，有研究表明分析性智力、创造性智力以及实践性智力的测验结果存在高度相关，并且与标准智力测验的结果也相关，因此认为三种测验测量的可能是相同的认知过程，也证实了G因素的存在。（第六版P398）"},{"q":"能力与知识、技能的关系","a":"能力是一种心理特征，是顺利完成活动的心理条件。知识是人脑对客观事物的主观表征，是人们对实践经验或实践活动的认知成果。技能是指人们通过练习而获得的合乎法则的认知活动或动作方式。1．区别知识和技能是能力的基础。但只有那些能够广泛应用和迁移的知识和技能，才能转化为能力。能力不仅包含了一个人现在已经达到的成就水平，而且包含了一个人具有的潜力。例如，一个读书很多的人，可能有较丰富的 84（务必结合校区强化课使用）知识，但在解决实际问题时，却显得能力低下，说明他的知识只停留在书本上，既不能广泛迁移，也不能用来解决实际问题。技能主要表现为动作执行的经验，因而与知识有区别。 2．联系知识、技能与能力又有密切的关系。首先，能力的形成与发展依赖于知识、技能的获得。随着人的知识、技能的积累，人的能力也会不断提高。其次，能力的高低又会影响到掌握知识、技能的水平，一个能力强的人往往付出较小的代价就能获得知识和技能；而一个能力较弱的人可能要付出更大的努力才能掌握同样的知识和技能。所以，从一个人掌握知识、技能的速度与质量上，可以看出其能力的大小。综上所述，能力是掌握知识、技能的前提，又是掌握知识、技能的结果。两者是互相转化、互相促进的。"}]},{"name":"第十二章 人格","items":[{"q":"人格的社会学习理论（社会认知理论）","a":"班杜拉提出了社会学习理论，认为人是有意识的、可以思考的个体。他主张交互决定论，即个人的内部因素、行为、环境三者相互作用，从而影响人格的形成。在影响人格的众多因素中，班杜拉特别强调自我效能感对行为的影响。当一个人的反应受到所观察的他人的影响时，观察学习就产生了，被观察的他人叫作榜样。班杜拉认为，人的行为模式的特点是由榜样塑造的。"},{"q":"人格类型理论","a":"类型理论强调群体间的人格差异，描述了人格的质的差异。1．单一类型理论弗兰克·法利提出的T型人格，就是单一类型理论的代表。法利认为T型人格是一种好冒险、爱刺激的人格特征。依据冒险行为的性质（积极性质与消极性质），他又将T型人格分为T＋型和T-型两种。在T＋型人格中，又可依据活动的特点进一步分为体格T＋型和智力T＋型。2．对立类型理论这种理论认为，人格类型包含了某一人格维度的两个相反的方向。（1)A-B型人格福利曼和罗斯曼描述了A-B人格类型。A型人格的主要特点是：性情急躁，缺乏耐性。他们的成就欲高、上进心强、有苦干精神、工作投入、做事认真负责、时间紧迫感强、富有竞争意识、外向、动作敏捷、说话快、生活常处于紧张状态，但办事匆忙、社会适应性差，属不安定型人格。具有这种人格特征的人易患冠心病。B型人格的特点是：性情不温不火，举止稳当，对工作和生活的满足感强，喜欢慢步调的生活节奏，在需要审慎思考和耐心的工作中，B型人往往比A型好，他们属于较平凡的人。对冠心病患者的调查表明，B型人格只占患者的三分之一。（2）内一外倾人格荣格依据“心理倾向”来划分人格类型，最先提出了内一外倾人格类型学说。荣格认为，当一个人的兴趣和关注点指向外部客体时，就是外倾人格；而当一个人的兴趣和关注点指向主体时，就是内倾人格。任何人都具有内倾和外倾两种特征，但只有一种可能表现出优势。①外倾人格的特点是：注重外部世界、情感表露在外、热情奔放、当机立断、独立自主、善于交往、行动快捷、有时轻率。②内倾人格的特点是：自我剖析、做事谨慎、深思熟虑、疑虑困惑、交往面窄、有时适应困难。荣格认为，人的心理活动有思维、感情、感觉和直觉这四种基本功能。结合两种心理倾向可以构成以下8种人格类型：①外倾思维型：这种人尊重客观规律和伦理法则，不感情用事。96（务必结合校区强化课使用） ②外倾感情型：这种人对事物的评价往往感情用事，容易凭借主观判断来衡量外界事物的价值。 ③外倾感觉型：这种人以具体事物为出发点，容易凭借感觉来估量生活的价值，遇事不假思索，随波逐流，但善于应付现实。④外倾直觉型：这种人以主观态度探求各种现象，不接受过去的经验，只憧憬未来，容易悲观失望。⑤内倾思维型：这种人不关心外部价值，以主观观念决定自己的思想，感情冷淡，好独断，偏执，易被人误解。⑥内倾感情型：这种人情绪稳定，不露声色。⑦内倾感觉型：这种人不能深入到事物的内部，在自己与事物之间常插入自己的感觉。⑧内倾直觉型：这种人不关心外界事物，脱离实际，好幻想。"},{"q":"多元类型理论","a":"这种理论认为，人格类型是由几种不同质的人格特性构成的。1．气质类型学说P461（第六版P427）气质说源于希波克拉底的体液说，他认为人体内有四种液体：黏液、黄胆汁、黑胆汁、血液，这四种体液的比例不同，形成了四种不同类型的人。盖伦进一步确定了气质类型，提出人的四种气质类型是胆汁质、多血质、黏液质、抑郁质。现代的气质学说仍将气质分为四种典型的类型：（1）胆汁质：这种人情绪体验强烈、爆发迅猛、平息快速，思维灵活但粗枝大叶，精力旺盛、争强好斗、勇敢果断，为人热情直率、朴实真诚、表里如一，行动敏捷、生气勃勃、刚毅顽强；但这种人遇事常欠思量，鲁莽冒失，易感情用事，刚愎自用。（2）多血质：这种人情感丰富、外露但不稳定，思维敏捷但不求甚解，活泼好动、热情大方、善于交往但交情浅薄，行动敏捷、适应力强；他们的弱点是缺乏耐心和毅力，稳定性差，见异思迁。（3）黏液质：这种人情绪平稳、表情平淡，思维灵活性略差但考虑问题细致而周到，安静稳重、踏踏实实、沉默寡言、喜欢沉思，自制力强、耐受力高、内刚外柔、交往适度、交情深厚；但这种人的行为主动性较差，缺乏生气，行动迟缓。（4）抑郁质：这种人情绪体验深刻、细腻持久，情绪抑郁、多愁善感，思维敏锐、想象力丰富，不善交际、孤僻离群，踏实稳重、自制力强，但他们的行为举止缓慢，软弱胆小，优柔寡断。现实生活中，单一气质的人并不多，绝大多数的人是四种气质互相混合、渗透、兼而有之的。巴甫洛夫用高级神经活动类型说解释气质的生理基础。他依据神经过程的基本特性，即兴奋过程和抑制过程的强度、平衡性和灵活性，划分了四种类型，即：高级神经活动过程高级神经活动类型气质类型强、不平衡不可遏制型胆汁质强、平衡、灵活活泼型多血质强、平衡、不灵活安静型黏液质弱抑制型抑郁质 2．性格类型说P463 斯普兰格依据人类社会文化生活的六种形态，将人划分为六种性格类型。不同的性格类型具有不同的价值观成分。这六种类型是：经济型、理论型、审美型、权力型、社会型和宗教型。（1）经济型：这种人注重实效，其生活目的是追求利润和获得财富。（2）理论型：这种人表现出具有探究世界的兴趣，能客观而冷静地观察事物，力图把握事物的本质，尊重事物的合理性，重视科学探索，以追求真理为人生的目的。（务必结合校区强化课使用）97 （3）审美型：这种人对现实生活不太关注，富于想象力，追求美感，以感受事物的美作为人生的价值。 （4）权力型：这种人倾向于权力意识和权力享受，支配性强，其全部的生活价值和最高的人生目标就在于满足自己的权力欲望，得到某种权力和地位。（5）社会型：这种人能关心他人，献身社会，助人为乐，以奉献社会为人生追求的最高目标。（6）宗教型：这种人信奉宗教，相信神的存在，把信仰视为人生的最高价值。"},{"q":"整合理论","a":"整合理论将特质理论和类型理论的特点综合起来，更全面地描述了人格的结构。艾森克是整合理论的代表人物，他提出了人格结构的四层次模型，这种理论将类型理论和特质理论有机地结合起来了。1．模型的最下层“特殊反应层”是日常观察到的反应，偶然性与随机性较大，属误差因子；2．上一层“习惯反应层”是由反复进行的日常反应形成的，常与某一情景下的行为有关，属特殊因子；3．再上一层是特质层，是由习惯反应形成的，具有比较强的概括性，属群因子；4．最上层是类型层，由特质形成，影响范围很大，属一般因子。"},{"q":"精神分析的人格理论","a":"精神分析理论是由弗洛伊德创立的一种关于潜意识的心理动力理论。1．人格结构与动力（1）意识、前意识、潜意识 ①意识：是人对客观现实的自觉反映，是人清醒地觉知到的思想与情绪等，因而是可以观察到的心理现象。②前意识：是没有浮现出意识表面的心理现象，但可以通达意识的心理内容。前意识的内容会不断出现在意识中，而意识中的内容又会不断回到前意识中。③潜意识：也叫无意识，是那些被排斥到意识之外的内容，代表那些深藏于心的、不可通达的部分，包括人的各种原始冲动与本能及其相关欲望等。由于不被风俗习惯、伦理道德、法律允许而得不到自由表现，因此被压抑与排斥在意识之外。但潜意识中的本能欲望并没有消失，而是构成人们心理与行为的深层动力。潜意识不能被人们意识到，却深藏于人的内心，时刻都在发挥作用，是人的心理与行为的动力源泉，这是精神分析的人格理论的一个核心观点。（2）本我、自我、超我从字间状 ①本我：由生物本能和欲望组成，遵循快乐原则，要求立刻满足本能的欲望。本我为人的活动提供能量，这种能量被称为力比多，源自人的本能。本我的冲动是潜意识的，个体不能觉察到，但它是人们行为的内在动力。②自我：是在调节本我与外界的关系中形成的现实的我，遵循现实原则，满足本我的欲望与需要。③超我：是从自我中发展而来的道德化了的自我，遵循道德原则。超我的一部分被称为良心，是个人的道德标准：另一部分被称为自我理想，是个人目标和抱负的源泉。人格结构的本我、自我、超我三个部分处在相互抗衡中，健康人的自我既要与现实保持联系，又要防止本我和超我过分操纵人格。2．人格发展弗洛伊德以身体的不同部位获得性冲动的满足为标准，将人格发展分为五个时期：口唇期、肛门期、性器期、潜伏期和生殖期。前三个阶段是人格发展的重要阶段，为成人后的人格模式奠定了基础。潜伏期个体的力比多受到压抑，没有明显的表现。生殖期个体的性器官开始发育成熟，生殖器成为主导的性敏感区，其他性敏感区成为辅助的性敏感区。"},{"q":"人本主义的人格理论","a":"1．马斯洛的自我实现理论在马斯洛的需要层次理论中，最高级的需要是自我实现的需要，即实现个人潜能。马斯洛认为，如果一个人不能完全发挥他的才能，他就会产生挫败感。马斯洛认为自我实现者有以下特征：（1）对现实有清晰、有效的认识并和现实保持舒适的关系。（2）简单、自然。（3）以问题为中心，而不是以自我为中心。（4）具有超然独立的性格。 （5）具有自主性，在自然条件和文化环境中能保持相对的独立性。（6）具有持续的欣赏力，能够充分体验自然和人生中的一切美好的东西，对日常生活永远保持新鲜感。（7）具有高峰体验，这是人感受到的一种强烈的、心醉神迷的狂喜或敬畏的情绪体验。马斯洛认为所有人都具有享受高峰体验的潜在能力，但只有自我实现者更可能拥有这种体验。（8）对人充满爱心。（9）拥有有质量的友谊。（10）具有民主精神。自我实现者谦虚待人，尊重别人的权利和个性，善于倾听不同的意见。（11）能区分手段与目的，不会为达到目的而不择手段。（12）有创造力，能在某个方面有独到之处和创造性。（13）幽默、风趣。（14）反对盲目遵从，对随意附和他人的观点和行为十分反感，他们认为人必须有自己的主见，认定的事情就应坚持去做，而不应顾及传统的力量或舆论的压力。2．罗杰斯的人格理论罗杰斯认为，每个人都生活在自己的主观世界里，个人的主观世界决定了他的行为方式。（1）自我自我是罗杰斯人格理论中一个核心的概念。自我或自我概念是一个人对自己的天性、独特的特质和典型行为的信念的集合。罗杰斯认为，自我概念是个体能够意识到的，没有深藏在潜意识中。当自我概念与知觉的、内在的经验协调一致时，他便是一个整合的、真实而适应的人；反之，他就会经历或体验到人格的不协调状态。自我概念有两种：一种是真实的自我，即较符合现实的自我形象；另一种是理想的自我，即期望实现的自我形象。这两种自我的和谐与接近程度直接影响心理健康，如果两者相差太远，就会削弱一个人的心理幸福感，影响人格健康。（2）无条件积极关注无条件的积极关注是一种没有预设条件的被积极关注的体验，即使在自我行为不够理想时，他也仍觉得自己会受到父母或他人真正的尊重、理解和关怀。罗杰斯认为，在自我发展过程中，最重要的是在婴幼儿时期能够得到无条件的积极关注。这样成长起来的人能在自我实现的道路上自由地发挥潜能，完成人生的最终目标，成为一个有健康人格的人。"}]},{"name":"第十三章 学习","items":[{"q":"学习的联结理论","a":"1．经典性条件作用说（22J)(19J） （1）经典条件反射的形成实验中，如果将肉末放在一条狗口中或嘴附近，肉末可自动引起狗的唾液分泌反应。在此，肉末被称为无条件刺激（UCS)，狗的唾液分泌反应，因为无需任何训练和经验而自动出现，被称为无条件反射（UR）。如果给狗呈现其他刺激如铃声，狗不会产生唾液分泌反应，此时铃声被称作中性刺激（NS）。如果将中性刺激与无条件刺激反复多次配对呈现，中性刺激就能成为条件刺激（CS)，能够引起原先只有无条件刺激引发的反应，也就是唾液分泌反应，这种反应叫条件反射（CR）。（2）经典条件反射的规律 ①习得：在条件刺激（CS）与无条件刺激（UCS）之间建立联结的过程叫做条件反射的习得过程。②消退：条件反射形成之后，如果得不到强化，条件反应会逐渐削弱，直到消失。③泛化：条件反射形成后的初期，另外一些类似的刺激也会引起条件反射（以对有机体具有恐惧性质的刺激作为无条件刺激进行的条件反应最易泛化）。④分化：对事件的差异的反应。通过选择性强化和消退，使机体学会对条件刺激和与条件刺激相似的刺激做出不同的反应。⑤延迟：某些情况下，条件刺激出现后，无条件刺激隔一段时间才出现，此时机体条件反射被暂时抑制，若时间间隔到一定程度后行为又呈现出来，即是延迟。⑥二级条件作用：又称为高级条件作用。中性刺激一旦成为条件刺激，就可以作为无条件刺激与另一个中性刺激结合，形成新的条件反射，这种双重条件作用就是二级条件作用。【第一信号系统】是由具体事物及其属性作为条件刺激（第一信号）而建立起来的条件反射系统。【第二信号系统】是对人类使用的语言、文字（第二信号）发生反应的大脑皮层机能系统。2．操作性条件作用说（22J）操作性条件作用是指机体的行为结果能决定这一行为在将来是否会被重复的一种效应。（第六版P481） （1）桑代克的尝试一错误学习理论学习的实质是通过“尝试”在一定的情境与特定的反应之间建立某种联结。强化会促进行为，而惩罚会削弱行为。桑代克认为存在三条学习定律：（补充） ①效果律：导致满意后果的行为会被加强，带来烦恼的行为则被减弱甚至淘汰。②练习律：联结的应用会增强联结的力量，不练习则导致联结的减弱甚至淘汰。③准备律：学习者有准备而给予活动就感到满意，有准备而不活动或无准备而强制活动都会烦恼。（2）斯金纳的操作性条件作用斯金纳发明了“斯金纳箱”，箱内装一个操纵杆，动物从初始的混乱动作中无意地碰到杠杆，得到食物，进而学会了按压杠杆与得到食物之间的联结。通过研究，斯金纳认为，存在两种类型的学习，即应答性反应与操作性反应。①应答性反应：由刺激情境引发的反应，与经典性条件作用类似。②操作性反应：是有机体的自发行为引发的反应。 （3）操作性条件作用的主要规律 ①强化与惩罚强化是增加反应的概率，惩罚是降低反应的概率，按照呈现或取消刺激的不同方式可将强化分为正、负强化；将惩罚分为正、负惩罚。行为增强行为减弱呈现刺激正强化正惩罚取消刺激负强化负惩罚 ②强化程序根据强化出现的时机和频率，可将强化程序分为连续强化和间隔强化程序。1）连续强化：每次行为之后都给予强化；2）间隔强化：间隔一定时间或比例才给予强化。间隔强化可分为四种延缓强化程序：过程中反应维持举例固定时间强化强化来临前高，过后下降效果差基本工资固定比例强化强化后暂停效果较差计件工资变化时间强化平缓稳定比较好老师点名，变化比例强化非常高速稳定非常好老虎机连续强化在教学新反应时最有效，间隔强化比连续强化有更高的反应率和较低的消退率。当学习一个新行为时，应以经常的、可预测的方式来强化。该行为一旦建立，相应的强化就应该适当减少，且强化的给予是不可预测的。3．联结理论在学习和教育情境下的应用（第六版P483） （1）增加规范行为；（2）减少不良行为。"},{"q":"学习的认知理论","a":"1．格式塔学派的顿悟学习（1）学习是一种完形的过程，是通过学习者对情境的重新组织来实现的，个体在认知结构中将已有的知识经验进行重新组合，最终找到了解决问题的新方法，苛勒将这种学习叫做顿悟学习。（2）顿悟依赖于情境，当答案的基本部分与当前情境的关系较易觉察时，才容易出现顿悟；顿悟产生后，可以重复出现：在一种情境中产生的顿悟可以迁移到新的场合。（3）在顿悟学习中，个体学习到的是手段和目的间的一种认知关系。当学会用一种手段达到目的后，也可以用另一种手段达到同样的目的。2．托尔曼的认知学习理论托尔曼认为一个完整的行为由外部环境或内部生理状态激发，经由某些中间变量表现行为和反应。要分析一个完整的行为，必须考虑个体的认知，认知就是行为的中介变量。（1）位置学习托尔曼等人的位置学习实验认为，白鼠学到的不是一系列动作而是关于迷津的位置信息。认知地图是关于某一局部环境的综合表象，包括事件的简单顺序、方向、距离甚至时间关系等。而位置学习就是根据对情境的认知，在当前情境与达到目的的手段、途径间建立起一个完整的符号系统。 （2）潜伏学习托尔曼等人的潜伏学习实验认为，外在强化并不是学习产生的必要因素，不强化也可能出现学习，只是由于没有受到强化，学习效果没有表现出来。托尔曼将这种学习称为潜伏学习。3．班杜拉的社会认知学习理论（第六版P486） （1）经典实验班杜拉等人把儿童分为实验组和控制组，实验组中的儿童被一个个地带到放有玩具的房间里，然后让他们看到一个成人对波比娃娃进行攻击的行为。控制组的儿童则被带到另外的房间里，他们看到的是一个成人在安静地玩游戏，并没有对波比娃娃进行攻击。然后，成人离开了房间，通过单向玻璃观察儿童在放有玩具的房间里如何玩耍。结果发现，实验组的儿童比控制组的儿童表现出更多的攻击行为。这就表明儿童通过观察成人的行为习得了某种行为模式。（2）观察学习观察学习是通过观察并模仿他人而进行的学习。①基本子过程（补充）观察学习包括四个子过程：注意、保持、复制、动机。1）注意过程：观察者注意并知觉榜样情景的各个方面。观察者比较容易观察与自身相似或被认为优秀的榜样。有依赖性、自身概念水平低或焦虑的观察者更容易模仿行为。个体决定观察的内容受到强化的可能性或外在的期望的影响。2）保持过程：观察者记住从榜样情景了解的行为，以表象和言语形式将它们在记忆中进行表征、编码及储存。3）复制（再现）过程：观察者将头脑中有关榜样情景的表象和符号概念转为外显行为。选择和组织榜样情景中的要素，进行模仿和练习并在信息反馈的基础上精炼行为。4）动机过程：观察者因表现所观察到的行为而受到激励。②模仿的动机来源（补充） 1）直接强化-通过外部因素对学习行为予以强化；2）替代强化-通过一定的榜样或他人的行为来强化相应的学习行为或学习行为的倾向；3）自我强化-根据一定的评价标准进行自我评价和监督，从而强化相应的学习行为。③关键因素 1）榜样 a.个体做出某种行为并被其他个体观察到，这是观察学习发生的必要条件。无论是真实的榜样还是象征性的榜样，榜样的行为都要与观察者有所关联，观察者必须对榜样的行为产生兴趣。b.榜样必须是观察者所认为的被观察行为中的佼佼者。c.地位较高的榜样更有可能被他人模仿。d.在波比娃娃实验中，与女性榜样相比，房间的男孩和女孩更倾向于模仿男性榜样的攻击行为。这是因为与女性相比，男性的肢体攻击行为更符合男性的性别特征。2）模仿者 a.模仿者需要关注榜样。b.模仿者不仅要注意到榜样的行为，而且要在记忆中保持该行为，并在适当的时候提取出来。c.模仿者之所以能够注意加工榜样的行为，与其自身的动机水平有密切关系。3）环境 a.如果榜样的行为被强化，这个行为将会被频繁地模仿，这种现象被称为替代强化。b.如果榜样行为受到惩罚，这个行为被模仿的概率就会显著降低，这种现象被称为替代惩罚。c.榜样的不良行为带来的影响可能要比良好行为带来的影响更大。4．建构主义的学习理论建构主义理论认为，知识是学习者试图理解他们的经验而发展起来的。学习者并不是一个被动地等待灌输的容器；相反，学习者是一个积极寻求意义的机体。这些学习者建构了心理图式，并不断修正这些图式，以便更好地理解自身的经验。每个学习者对知识都有自己独一无二的解释。（1）个体建构主义从信息加工的角度来看，学习就是个体建构可被记忆和提取的内部表征的过程。根据这种观点，虽然外部世界是信息输入的来源，但是一旦外部信息被感知，并进入工作记忆中，对信息的加工就只发生在人脑中了。个体建构主义的主要观点如下：①知识不是对现实的准确表征，只是一种解释、假设；知识不是问题的最终答案，会随着人类的进步而不断得到更新。②学习过程不是由教师向学生传递知识的过程，而是学生主动建构知识的过程。建构就是学习者通过新旧知识经验间反复的、双向的相互作用，来形成和调整自己的经验结构的过程。③学习者在日常生活和以往的学习中已经具有了一定的经验。在教学中，应该把儿童现有的知识经验作为新知识的生长点，引导儿童生长出新的知识经验。教学不是知识的传递，而是知识的相互作用和转换。（2）社会建构主义（第六版P488）维果茨基认为，社会互动和文化塑造了个体的发展与学习。通过与他人共同参与各种活动，个体能内化通过共同活动而获得的东西，包括新策略和新知识。5．认知学习理论的应用（第六版P488） （1）榜样和个人因素；（2）帮助学生集中注意力；（3）帮助学生掌握建构知识的策略。"},{"q":"练习及其在学习中的作用","a":"1．练习曲线练习是指在反馈的参与下，反复多次地进行一种学习。练习包括重复和反馈，它的主要作用是促使学习成绩提高。练习是动作技能形成的基本条件。练习曲线也叫学习曲线，是指用图解的形式来表现练习期间学习效率的变化。【学习进程】是指随着时间的推移，学习成绩呈现动态变化的过程，可以通过学习曲线来表示。2．练习进程（学习进程）的特点（1）练习成绩随练习的进程而逐步提高；（2）存在高原现象（练习成绩出现暂时停顿的现象）；（3）练习进程不均匀（练习成绩时而提高，时而下降，时而停顿的情况）；（4）练习中存在个体差别。108（务必结合校区强化课使用） 3．提高练习效率的条件 （1）确定练习的目标；（2）灵活应用整体练习和分解练习；（3）恰当安排练习时间；（4）对于基本的技能，过度学习可以保证发生较大程度的迁移；（第六版P470） （5）从练习结果中得到反馈；（6）发挥原有知识在学习中的作用；（第六版P471） （7）发挥元认知的作用；（第六版P471） （8）发挥情绪的作用：（9）发挥动机和性格特征的作用。【元认知】是个体对自己认知过程的认知和控制。从学习的角度来说，是指学习者关于自己如何学习知识，以及对学习过程的控制。（第六版P471）"},{"q":"学习与脑可塑性","a":"（务必结合校区强化课使用）109 脑可塑性是指脑的功能和结构在先天遗传和后天经验的相互作用下发生改变的能力。这些改变包括消除和增加新的连接、增加或者减少脑皮层的厚度和体积、增加或者减少脑皮层沟回的数量和扩大或缩小其分布范围、增强或者减弱脑活动的强度和扩大或缩小其面积等。 脑可塑性的进程与学习的进程一致，并且表现为功能转移和功能代偿。心理练习在一定程度上对脑可塑性可以起到跟实际练习一样的效果。"},{"q":"学习的含义","a":"学习是个体在一定情境下由于经验而产生的行为或行为潜能的比较持久的变化，有三个含义：首先，学习是以行为或行为潜能的改变为标志的；其次，学习引起的行为变化是相对持久的；最后，学习是由练习或经验引起的。102（务必结合校区强化课使用）"},{"q":"认知学习","a":"认知学习是指以认知加工过程为对象的学习。认知学习可以提高个体的认知能力。认知学习与学校教育和个人能力发展的关系非常密切。1．认知学习的种类根据参与学习的认知过程的特点，认知学习可以分为初级认知学习和高级认知学习。（1）初级认知学习：指以初级认知过程为对象的学习，如知觉学习。人的知觉能力会随着训练而逐渐改变。这种改变一旦获得，就可以保持相当长的时间。（2）高级认知学习：指以高级认知过程为对象的学习，如语言学习。高级认知学习中包含了一些初级认知学习的因素，如在语言学习中包含了语音分辨和字形感知等。2．认知学习的特点（1）特异性和非特异性；（务必结合校区强化课使用）107 （2）阶段性和连续性； （3）层次性和逆层次性。"}]}]});

window.__MODULES.push({"module":"short","subject":"实验心理学","icon":"🔬","desc":"郭秀艳《实验心理学》· 精选高频简答与论述","chapters":[{"name":"简答题","items":[{"q":"最小变化法实验中常常出现哪些种类的系统误差？如何鉴别实验中是否出现了这些系统误差？如何克服这些可能的系统误差？","a":"（1）实验中的误差主要包括：习惯误差、期望误差和系列误差，其中系列误差主要是由于随着实验进程的增加，被试出现的疲劳效应和练习效应。（3分） （2）如果是前半部分的阈限值大于后半部分测得的阈限值，那么显示出实验中存在明显的练习效应；如果是前半部分测得的阈限值小于后半部分测得的阈限值，那么显示出实验中存在明显的疲劳效应。（2分）如果是递增系列的阈限值大于递减系列的阈限值，那么显示出实验中存在明显的习惯误差；如果是递增系列的阈限值小于递减系列的阈限值，那么显示出实验中存在明显的期望误差。（2分） （3）习惯误差和期望误差可以通过“↓↑↑↓”（ABBA也可以）或“↑↓↓↑”的实验顺序加以克服，但是疲劳效应和练习效应难以进行较为有效的控制，只能通过二者相加进行平衡，因为疲劳效应和练习效应对测试结果的影响方向相反。另外，实验中采用不确定的刺激起点也是为了克服被试的反应定势带来的实验误差。（3分）"},{"q":"自变量的类型","a":"心理学实验涉及到的自变量种类很多，但是大致可以分为三类： （1）作业变量。作业就是指实验中被试的任务，或者实验中所呈现的、和被试任务有关的某种刺激，例如：迅速呈现的字母串、记忆词表、错觉图形等（呈现这些刺激时要求被试作出特定的反应）。如果把这些任务的任何特性作为自变量来操纵，则这种自变量就是一种作业变量。（2）环境变量。当被试进行某种作业时，如果改变实验环境的任何特性，那么改变了的环境特性就是环境自变量。例如，实验室的照明情况或噪音强度都可以作为自变量加以研究。（3）被试变量。可能影响对某种刺激的反应的被试的特性因素称为被试变量。这些因素包括：被试的性别、年龄、健康状况、智力、教育水平、人格特征、动机、态度、内驱力等。这种变量也是可以被实验者操纵而成为自变量的。其中有的是实验者可以主动操纵加以改变的（通过主动操纵产生几个自变量水平），而有的则是被试本身固有的、不能主动操纵的，只能进行测量（根据被试本身的特性分为几个自变量水平）。"},{"q":"采用建构认知模型法进行思维研究时存在哪些优缺点？","a":"建构认知模型作为思维研究的一种方法论，是有它的优点和局限性的：它的优点主要表现在： （1）符合如今科学发展的趋势，即先依靠人的理性提出某个观点，然后再以实践去加以验证。而不是像原始的科学一样，依靠对经验的归纳来得出科学理论。这就是为何认知心理学如今受到广大研究者青睐的原因。（2）有利于揭示思维的本质及其内在的心理机制，而不仅仅停留在现象的层面上。（3）对人的思维过程进行某种模型上的猜测与拟合是十分有应用价值的。认知模型范式的局限主要表现在：（1）先验模型有时可能不可靠。基于先验模型进行实验研究，并将实验的结论解释为先验模型的预期有时是不正确的。因为，在摆脱先验模型束缚的情况下，我们也许对实验结论做出不同的解释。（2）有时难以找到具体的实验方法可以验证先验模型。有些研究者在设计模型时，往往会将模型设计得过于复杂，这给实验验证带来了难度。（3）不是任何的思维过程都能找到一个认知模型与之相匹配的。"},{"q":"简述实验法的重要特点。","a":"（1）研究者处于主动地位，可以主动引起或改变被试的心理活动，不必消极等待某种心理活动的自然发生。（1分） （2）研究者可以控制一切偶发的额外变量，保证研究课题的顺利进行及其有效性，科学地揭示心理活动的规律。（2分） （3）可以主动改变各种条件，多次进行重复实验，对实验结果进行核实和验证，保证实验的可信度。（1分）"},{"q":"论述额外变量常用的控制方法。","a":"（1）消除法。对于有些可能影响被试心理或行为的因素，可采取消除法，即避免该因素在实验过程中出现。（2分） （2）恒定法。有些额外变量无法消除或没有条件消除，可以使其保持恒定，即使其在整个实验进程中保持恒定水平，以保证其对所有被试的影响基本一致。（2分） （3）匹配法。首先就是要对所有被试的有关因素进行预测，根据预测的结果来进行匹配。匹配中不仅要使各组的平均数几乎相等，而且要保证其标准差几乎相等。（2分） （4）抵消平衡法。这种方法常用于克服实验中的空间效应和时间效应。在心理学实验中，空间效应往往是指刺激呈现的位置或被试操作键的位置引起的因变量的变化；时间效应也叫做顺序效应，一般包括练习效应和疲劳效应两种。（2分） （5）随机化的方法。就是抽取被试或实验编排上完全按照随机的方法，不附加任何别的条件。（2分）"},{"q":"序列反应时范式。","a":"序列反应时范式是尼森和比勒姆于1987年提出的。这种研究范式以反应时为指标，整个实验过程十分类似一个选择反应时实验：处于不同空间位置的视觉刺激分别对应不同的反应键，每次呈现一个视觉刺激，被试按相应键尽快予以反应，该刺激随即消失，短暂的时间间隔后出现下一个视觉刺激。而SRT的特点在于，整个实验中刺激的呈现序列是有规律的。在尼森和比勒姆的实验中，屏幕上从左到右的四个位置依次被设定为位置1、2、3、4，每个位置都对应着一个按键。视觉刺激是一个星状图形，并按固定的位置序列呈现。在实验前，被试只被告知将要进行的是反应时测试，他们不知道在任务中刺激是按某个固定但不明显的模式依次呈现的。主试会在多次重复该固定位置序列的情况下插入一个随机的位置序列，之后再恢复固定的位置序列。序列反应时范式是用以内隐学习的重要范式之一。"},{"q":"接受者操作特性曲线。","a":"曲线上各点反映着相同的感受性，它们都是对同一信号刺激的反应，只不过是在几种不同的判定标准下所得的结果而已。接受者操作特性曲线就是以虚惊概率为横轴，击中概率为纵轴所组成的坐标图，和被试在特定刺激条件下由于采用不同的判断标准得出的不同结果画出的曲线。ROC曲线具有以下属性：（1）β值的改变独立于d’的变化，考察β值变化对P(y/SN)和P(y/N)的影响时发现：当β接近0时，击中概率几乎为0，即信号全当成噪音接受；当β接近无穷大时，虚惊概率几乎为0，即噪音全当成信号接受；而当β从接近0向无穷大渐变的过程中，将形成一条完整地ROC曲线，曲线在某一处达到最佳的标准βOPT。（2）ROC曲线的曲率反应敏感性指标d’：被试者的辨别力d’为0，ROC曲线离这条线愈远，表示被试者辨别力愈强，d’的值当然就愈大。"},{"q":"注意的早期选择理论。","a":"布罗德本特，根据双耳分听实验提出了早期选择模型。该模型认为，注意瓶颈位于信息加工的早期阶段，以避免中枢系统超载。在这个瓶颈中作为过滤器的注意对进入的信息加以调节，选择一些信息进入高级分析阶段，其余信息则可能暂存于记忆中，然后迅速衰退。它是按“全或无”方式进行工作的，即接通一个通道的同时关闭所有其他通道。过滤器的选择作用不是随机的，只有新异的、较强的和具有生物意义的刺激才易于通过，并最终受到注意。后来布罗德本特又强调期待的作用，凡为人所期待的信息容易受到注意。另外，他还进一步指出，该过滤器位于语义分析（知觉）之前。故而布罗德本特的过滤器模型被称为早期选择模型。"},{"q":"注意的中期选择理论。","a":"特雷斯曼提出了注意的衰减模型。特雷斯曼认为，过滤器并非依“全或无”的原则工作，而是按衰减方式进行的；不是只允许一个通道（追随耳）的信息通过，而是既允许追随耳的信息通过，也允许非追随耳的信息通过，只是非追随耳的信号受到衰减，强度减弱了。但若这些减弱的非追随耳信号具有特别的意义（比如自己的名字），具有较低的阈值，那么仍可得到高级加工而被最终识别。她还提出，影响记忆中各个项目阈限的因素不仅包括上下文、指示语等刺激特点方面的情境因素，还包括个性倾向、项目意义以及熟悉程度等高级分析水平的状态因素。可见，她重视了中枢系统的二次选择功能。总之，特雷斯曼的模型强调：（1）信息是大量输入的，这与早期选择模型一致；（2）加工过程是“衰减”式的；（3）过滤器的位置有两个，一为语义分析之前的外周过滤器，一为语义分析之后的中枢过滤器。可见，特雷斯曼强调了中枢过滤器的作用，因而又被称为中期选择模型。"},{"q":"注意的的晚期选择理论。","a":"注意选择所在的位置可能并不在信息加工的早期，也不在中期，而是在晚期。这就是晚期选择模型。晚期选择模型是由多依奇和多依奇首先提出的。他们认为，多个输入通道的信息均可进入高级分析水平，得到全部的知觉加工。信息加工瓶颈位于知觉和工作记忆之间。因此，注意不在于选择知觉刺激，而在于选择对刺激的反应。多依奇和多依奇设想，中枢的分析结构可以识别一切输入，但输出是按其重要性来安排的，只对重要的刺激反应，而对不重要的刺激则不反应。此外，这种重要性的安排有赖于长期的倾向、上下文和指示语等，并且其衡量标准还随新刺激的不断输入而变动。后来，诺曼又进一步对此模型进行了修订。他认为，一些东西之所以未被注意、未被说出，是因为个体一味地注意和反应其他东西，从而使它们在识别之外未得到继续加工（如从记忆中提取等）的缘故。晚期选择模型由于强调反应的选择，因而又被称为反应选择模型。"},{"q":"何谓前景理论。","a":"卡内曼和特弗斯基做了一系列心理实验研究，发现人的实际决策行为和期望效用理论的预期有所偏离，并且这些偏离都是系统的、有规律的。因此，卡纳曼和特弗斯基提出了前景理论，对这些系统偏离进行解释。下面是该理论的一些重要组成部分：回避损失是指损失的效用要比等量收益的效用得到更大的权重。卡纳曼和特弗斯基总结了一条损失－收益函数曲线，当收益逐渐增加时，价值增长很少，而当损失增加时，价值却降得很快。参照效应指人们一般是依据某一参照点来定义价值，而不是依据纯价值进行决策。捐赠效应是指对于获得本不属于自己财产的东西，人们倾向于给予高的评价。卡纳曼认为被试获得了本来不属于自己的东西，由于不想放弃，所以对此样物品估价很高。"},{"q":"威尔逊的双重态度模型。","a":"该模型认为人们对于同一态度客体能同时存在两种态度，一种是能被人们所意识到、所承认的外显态度，另一种则是无意识的、自动激活的内隐态度。从这一理论模型出发，威尔逊等人提出了以下理论假设：相同态度客体的外显态度与内隐态度能共存于人的记忆中。内隐态度是被自动激活的，而外显态度的提取则需要较多的认知资源和动机。即使外显态度被人们从记忆中检索出来，内隐态度也还会影响人们那些无法有意识控制的行为反应和那些人们不试图去努力控制的行为反应。外显态度相对易于改变，内隐态度的改变则较难，态度改变技术通常只能改变外显态度，而非内隐态度。双重态度区别于个体的心理冲突，拥有双重态度的人通常报告的是一种更易获取的态度。内隐态度概念的提出引发了人们对传统的态度概念及其测量方式和态度改变技术等方面研究结果的反思，这也为社会心理学研究提供了一个新的研究方向。"},{"q":"简述在进行文献检索与分析时可以借鉴或采用的方法。","a":"（1）注视学科发展的生长点。（2）寻找学科研究中的空白区。（3）注意心理学与临近学科之间的边缘区和“结合部”。（4）运用其它学科的理论与方法审视心理学问题。（5）揭示已有心理学资料间的内在联系。（6）接受哲学预见和科学幻想的启迪。"},{"q":"简述刺激变量、机体变量、额外变量、自变量之间的关系。","a":"（1）刺激变量可分为两类，一类是研究者需要操作的自变量，另一类是研究者要控制，防止成为混淆变量的额外变量。（2分） （2）机体变量也可分为两类，一类是自变量，另一类是额外变量。（1分） （3）随着研究目的的变化，刺激变量或机体变量中的部分因素可能会由自变量变为额外变量，当然也可能由额外变量变为自变量。（1分）"},{"q":"为什么说信号检测论引进到心理实验中来，是心理物理学方法的一个重大突破？","a":"（1）在感受性的测量上，把主观态度与辨别力分开，获得了成功。（1分） （2）在解决辨别力指数的问题上，明确地建立起反映噪音变量的虚报概念，这一点对于辨别力的估量不可缺少，而且对于被试主观态度或反应偏好的测量具有重要意义。（1分） （3）信号检测论不仅把信号当信息，也把噪音当信息，这相对于传统心理物理学来说是一个发展，因为噪音引起的感觉分布是信号检测的主要困难，只有充分地分析噪音信息才能更好地研究被试的辨别力的性质。（2分）"},{"q":"霍夫兰德的说服模型","a":"霍夫兰德提出的说服模型着重分析了影响态度改变的四个关键因素——沟通者、沟通本身、接受者或者及沟通情境。 （1）沟通者——信息源。沟通者是最主要的信息源（source）。沟通者的专业性、权威性、可靠性、吸引力等因素都会影响态度改变的效果。（2）信息传递方式。在沟通过程中，信息的安排与选择、信息的情绪特征（恐惧唤起）、信息的单方面呈现或双方面呈现、信息传递途径等等都会影响说服效果。（3）目标对象——接受者。被说服者身上的某些特征会影响说服的效果。一是被说服者的人格；二是被说服者的心境。此外，被说服者的卷入程度、自身的免疫力以及认知需求、自我监控性和年龄等个体差异也都会以某种方式影响说服的效果。（4）沟通情境。说服过程在一定的背景条件下和特定的情境中进行的。这些背景或情境因素，对说服效果也有着重要的影响。"},{"q":"简述实验心理学的发展史。","a":"第一阶段，从18世纪中叶到19世纪中叶，可称为是实验心理学的酝酿时期。（1分）第二阶段，实验心理学的建立与心理学家共同体的建立。实验心理学的建立开始于19世纪60年代。1879年，冯特在莱比锡大学创建心理实验室，即标志着科学心理学的诞生。（1分）第三阶段，分疆割据的时代。20世纪前半叶，是继构造主义心理学之后的第一个多学派林立的时代。其中，以实验为主要研究方法的心理学流派是完形主义和行为主义。（1分）第四阶段，实验的扩展。20世纪50年代，认知心理学兴起。今天它已经成为世界心理学的潮流和前沿。（1分）"},{"q":"简述心理学研究报告的组成部分。","a":"（1）标题、作者和机构。（2）摘要和关键词。（3）引言。（4）方法。（5）结果与分析。（6）讨论。（7）结论与建议。（8）参考文献和附录。以上每点1分，少1点（或该点回答不完整）扣1分，扣完4分为止。"},{"q":"请从误差方面比较三种古典心理物理法。","a":"从误差方面来分析，三种实验方法都会产生较大误差。（1）极限法产生的是期望误差、习惯误差和系列误差。（1分） （2）恒定刺激法用于那些不方便随意改变的刺激的感觉阈限较方便，但是在使用三类反应时，不确定性区间受主观因素影响明显。使用二类反应虽然可以避免不确定性区间稳定性方面的问题，但是迫使被试作出某种反应很不自然，容易产生逆反情绪。还有，在恒定刺激实验中，刺激随机呈现，被试具有较多猜测的成分。（2分） （3）平均差误法实际上测到的只是一个近似值，结果不能与其它方法的结果相比较。（1分）"},{"q":"影响空间视敏度的因素。","a":"（1）光照条件。一般而言，随着刺激物亮度的增加，空间视敏度也增加，但是当视敏度达到2.0以后便趋于稳定。（2）刺激物与背景亮度的对比关系。（3）视网膜部位。（4）观察者的身心状况。（5）观察者的年龄。以上每点1分，少1点扣1分，扣完4分为止。论述题与计算题"},{"q":"论述影响实验内外效度的因素。","a":"⑴影响内部效度的因素有：①历史（经历）；②成熟（自然发展）；③选择；④测验；⑤被试的亡失；⑥统计回归；⑦使用仪器材料；⑧交互作用；⑨其他因素。（至少答对8个要点，满分6分。否则，每少1点扣1分，扣完为止。） ⑵影响外部效度的因素有：①测验的反作用结果；②选择偏差与实验变量的交互作用；③实验安排的反作用效果；④重复实验处理的干扰。（每点1分，共4分）"},{"q":"请描述一下信号检测论的实验过程。","a":"1.准备工作（确定信号与噪音）（5分） （1）把100克的圆柱体（标准刺激）与104克、108克、112克这另三个圆柱体（也可以与其他重量的圆柱体相比较）分别比较10次，选出一个在10次比较中7次或8次觉得重于100克的圆柱体作为信号刺激。100克的圆柱体则作为噪音。（2）主试按以下三种不同的SN和N出现的先定概率安排实验顺序，即：表1 信号检测论的预定信号概率 \u0007实验1 \u0007实验2 \u0007实验3 \u0007 \u0007P（SN） \u000720% \u000750% \u000780% \u0007 \u0007P（N） \u000780% \u000750% \u000720% \u0007 \u0007每种先定概率做100次，100次中信号和噪音出现的次数随先定概率变化，出现的顺序按随机原则排列。"},{"q":"简述反应时间的研究简史。","a":"（1）对反应时间的研究最早始于德国孔里格斯堡格天文台的贝塞尔“人差方程”的研究。（2分） （2）1850年，生理学家赫尔姆霍兹运用反应时间来测定神经的传导速度。他的发现确立了与神经过程不可分离的心理过程是在时间和空间中完成的观点。（2分） （3）荷兰生理学家唐德斯，受到“人差方程”的启发，最早将反应时间的测量用于心理实验。他借助反应时间的相减，确定了三种反应时间，被称为唐德斯A、B和C反应时间。（2分） （4）冯特及其学生对反应时间进行了一系列的实验研究。卡特尔曾通过反应时间的研究揭示了选择反映时为什么长于简单反映时的原因。（2分） （5）斯腾伯格（1969）的反应时间的相加因素法。（1分） （6）汉密尔顿（1977）和霍克（1981）等人提出了反应时间的“开窗”实验。（1分）"},{"q":"论述影响反应时间的主要因素。","a":"（1）反应时间受刺激变量影响。①反应时间的通道效应。②刺激强度与反应时间的关系。③刺激呈现时间的时空特征对反应时间的影响。④刺激复杂度对反应时间的影响。（2）反应时间受机体变量影响。①被试的适应与准备状态。②年龄与教育训练。③动机因素。④个体差异。⑤被试心向：速度与正确性权衡。每小点1分，另1分根据论述程度酌情给予。六、实验设计题（本大题共1道小题，共12分）"},{"q":"音高和强度的关系。","a":"心理上的音高主要与声音刺激的频率大小有关，但并不是完全由刺激频率决定的，它也取决于声音刺激的强度。当强度改变时，各频率的音高也会随之发生变化。对于低音来说，音高随强度增加而降低，对于高音来说，音高随强度增加而升高，对于中等频率的声音来说，两种影响都有轻微程度的表现。例如2000赫的声音，当强度初增加时，音高略有升高，但强度再增加时，其音高略微降低了。音高随强度改变的曲线叫等高线。"},{"q":"环境心理学的研究方法有哪些？","a":"环境心理学的研究方法独具特色，主要包括相关法、实验法、现场研究法、观察法和档案法等。相关法。环境心理学的很多研究是在真实情境中进行的，这类研究难以真正操纵和控制研究的变量，而解决的方法就是使用相关法。实验法。实验室研究的优点是能够做出最可靠的因果推论，但可能会限制实验结果的推广。另外，因为研究中得到的问题，实验研究多采用动物被试。现场研究。在真实环境中进行的现场研究，可以弥补实验室研究的某些不足。现场研究更接近真实的情境，生态效度往往比较高。观察法。观察法对环境心理学也同样适用。不过在环境心理学的研究中，但是一般并不单独使用，而是与现场研究或实验室研究结合起来档案研究法。档案法是指使用非学术的档案资料来进行研究的方法，档案资料通常是书面文件，如书籍、手稿等。"}]},{"name":"论述题","items":[{"q":"Müller-Lyer错觉量与箭头方向和夹角有关，有人选择了2种箭头方向，均选择了4种夹角水平，即300、600、900、1200，16名被试接受所有的实验处理，实验顺序是先做箭头向内的，按300、600、900、1200的顺序进行，随后再做箭头向外的，也按以上顺序进行。该实验设计为何种类型的实验设计？应用什么统计方法？该实验设计有无问题？","a":"（1）该实验设计为二因素重复实验设计。（1分） （2）应该用的重复实验设计的方差分析。（1分） （3）该实验设计有问题，表现在：①在实验刺激的呈现次序上没有做到随机化，可能会出现练习效应或疲劳效应。②实验次数太少，可能具有偶然性。③被试来源可能具有显著的区组差异，从而影响实验结果，要尽可能做到随机化。④其他问题。（每答出1点得1分，最多得2分）"},{"q":"请设计一个研究方案，探讨文章的生字密度、文章的类型和文章的句子长短对学生阅读理解的影响。要求写明：被试数量；实验中的自变量、因变量和可能的额外变量；实验设计类型；实验基本步骤；数据处理方法和可能的结果。","a":"（1）被试：被试类型、人数等根据需要可以选择，具体不确定。（2分） （2）变量：①自变量有3个，分别是生字密度、文章类型、句子长短。变量水平根据需要设置。②因变量根据研究需要，可以选择阅读成绩（正确率、错误率等也可以）、阅读速度、阅读效率等。③可能的额外变量有文章长度、字体类型（如黑体、宋体、隶书等），被试的教育水平（或者年龄、年级）、对文章的熟悉度等，刺激材料的呈现方式（如计算机、纸质文稿等）。（3分） （3）实验设计类型：根据需要，可以选择重复实验设计、完全随机化实验设计和混合设计中的1种。如果是混合设计，必须指明组内变量和组间变量（要注意考虑被试的疲劳程度）。（3分） （4）实验基本步骤：①根据实验设计类型、处理个数和研究需要，选择被试；②选编实验材料（注意呈现方式）；③呈现实验材料（注意随机化），进行实验；④实验记录、数据分析和结果处理。（2分） （5）数据处理方法：用多因素方差分析方法。（1分） （6）可能的结果：在主效应方面，生字密度和文章类型可能具有显著差异（可以有变化）；在交互效应方面，鼓励大胆假设。（1分）"},{"q":"某本科生想以混合设计模式研究生字密度、文章类型、句子长度和主题熟悉度四个因素对初中生阅读理解的影响。请指明被试数量；实验中的自变量、因变量和可能的额外变量；实验设计类型；实验基本步骤；数据处理方法和可能的结果。","a":"（1）被试：被试人数等根据需要可以选择，具体不确定。（2分） （2）变量：①自变量有4个，分别是生字密度、文章类型、句子长短和主题熟悉度。变量水平根据需要设置。②因变量根据研究需要，可以选择阅读成绩（正确率、错误率等也可以）、阅读速度、阅读效率等。③可能的额外变量有文章长度、字体类型（如黑体、宋体、隶书等），被试的阅读水平、对文章的熟悉度等，刺激材料的呈现方式（如计算机、纸质文稿等）。（3分） （3）实验设计类型：该实验设计为4因素混合实验设计，根据需要指明组内变量和组间变量（要注意考虑被试的疲劳程度）。（3分） （4）实验基本步骤：①根据实验设计类型、处理个数和研究需要，选择被试；②选编实验材料（注意呈现方式）；③呈现实验材料（注意随机化），进行实验；④实验记录、数据分析和结果处理。（2分） （5）数据处理方法：用多因素方差分析方法。（1分） （6）可能的结果：在主效应方面，生字密度和文章类型可能具有显著差异（可以有变化）；在交互效应方面，鼓励大胆假设。（1分）"},{"q":"为了试验三种新教材和两种教法的匹配关系，研究者同时考虑到学生现有成绩水平的影响。现在请您设计一个研究方案以探明这些因素对学生成绩的影响。要求写明：被试数量；主要实验变量；实验设计类型；实验基本步骤；指明变异来源及对应的具体自由度。","a":"（1）被试：被试类型等根据需要可以选择，具体人数不确定。（1分） （2）主要实验变量：①自变量有2个，分别是教材类型、教法类型。变量水平可选择。②因变量根据研究需要，可以选择考试成绩。③额外变量有1个——学生成绩水平，可以选择优等班、中等班和差等班。可能的额外变量主要有教师因素等。（3分） （3）实验基本类型：二因素随机区组实验设计。（1分） （4）实验基本步骤：①选编教学测验工具；②根据研究需要选择被试，可以选择优等班、中等班和差等班；③进行一个阶段的教学实验；④教学实验结束后，进行测验；⑤实验记录、数据分析和结果处理。（2分） （5）变异来源及对应的具体自由度分别是：教材的主效应（a－1），教法的主效应（b－1），教材与教法的交互效应（(a-1)(b-1)），学生现有成绩水平分组的主效应（c－1），误差（总的自由度－以上四项）。（5分）"},{"q":"已有研究表明，汉字的视觉识别受到汉字的笔划数、结构类型（如独体字、左右结构、上下结构）、字体大小等因素的影响。请设计一个研究方案以探明这三个方面因素对汉字视觉识别的影响是各自独立的还是有交互作用的。要求写明：被试数量；实验中的自变量、因变量和可能的额外变量；实验设计类型；实验基本步骤；数据处理方法和可能的结果。","a":"（1）被试：被试类型、人数等根据需要可以选择，具体不确定。（2分） （2）变量：①自变量有3个，分别是汉字笔划、结构类型、字体大小。变量水平根据需要设置。②因变量根据研究需要，可以选择阅读成绩（正确率、错误率等也可以）、阅读时间、阅读速度等。③可能的额外变量有字体颜色、字体类型（如黑体、宋体、隶书等），被试的教育水平（或者年龄、年级），刺激材料的呈现方式（如计算机、纸质文稿等）。（3分） （3）实验设计类型：根据需要，可以选择重复实验设计、完全随机化实验设计和混合设计中的1种。如果是混合设计，必须指明组内变量和组间变量，例如，本实验可采取2（汉字笔划：＜10划或≥10划）×3（结构类型：独体字、左右结构或上下结构）×3（字体大小：16磅、32磅或48磅）的混合实验设计，其中汉字笔划为组间变量，结构类型与字体大小为组内变量。（3分） （4）实验基本步骤：①根据实验设计类型、处理个数和研究需要，选择被试；②选编实验材料（注意呈现方式）；③呈现实验材料（注意随机化），进行实验；④实验记录、数据分析和结果处理。（2分） （5）数据处理方法：用多因素方差分析方法。（1分） （6）可能的结果：在主效应方面，要适当具有现实性；在交互效应方面，鼓励大胆假设。（1分）另一参考答案：答：（1）被试：被试类型、人数等根据需要可以选择，具体不确定。（2分） （2）变量：①自变量有3个，分别是汉字笔划、结构类型、字体大小。变量水平根据需要设置。②因变量根据研究需要，可以选择阅读成绩（正确率、错误率等也可以）、阅读时间、阅读速度等。③可能的额外变量有字体颜色、字体类型（如黑体、宋体、隶书等），被试的教育水平（或者年龄、年级），刺激材料的呈现方式（如计算机、纸质文稿等）。（3分） （3）实验设计类型：本实验可采取2（汉字笔划：＜10划或≥10划）×3（结构类型：独体字、左右结构或上下结构）×3（字体大小：16磅、32磅或48磅）的混合实验设计，其中为字体大小组间变量，汉字笔划与结构类型为组内变量。（3分） （4）实验基本步骤：①首先，根据研究需要，选择3组被试，每组10人，共30人；②选编符合实验设计要求汉字60个，分别为汉字笔划与汉字结构类型的6种处理，每种10个汉字，随后，对汉字进行编辑，以图片的形式呈现于计算机屏幕；③在计算机屏幕上，随机呈现实验材料，引入被试逐一进行实验；④实验记录、数据分析和结果处理。（2分） （5）数据处理方法：用多因素方差分析方法。（1分） （6）可能的结果：被试在汉字笔划、结构类型方面可能会存在显著差异，其中10划以下的阅读效果可能显著优于10划以上的汉字，左右结构的阅读效果可能最优，独体字的阅读效果可能最差。三种字体大小之间可能没有显著差异。在交互效应方面，汉字笔划和结构类型之间可能具有显著的交互效应，有待进一步进行简单效应检验。（1分）"},{"q":"情绪诱导法及其种类","a":"为了探讨情绪和其他心理变量间的共变关系，研究者运用一些方法，来直接操纵情绪状态，然后记录或观察积极或消极情绪下，被试的各种心理、行为或生理指标。这种对情绪状态的操纵办法，就是情绪诱导法。 （1）单词诱导法。单词诱导法就是使用带有情绪色彩的词来诱导积极或消极情绪的方法，这是早期情绪诱导经常使用的一种方法。（2）图片诱导法。图片诱导法就是使用带有情绪色彩的图片来诱导积极或消极情绪的方法。（3）其他诱导。除了单词和图片外，还有一些其他的方法可以诱导情绪的产生。比如特以不同内容的影片来诱导情绪。除了本身的活动外，他人对被试的评价也可以成为情绪诱导刺激。在实际运用中，情绪诱导技术的具体实现方式还有很多，例如通过控制被试完成某项测试后的成败体验来诱发积极或消极情绪、通过阅读带有情感色彩的文章段落来诱导出相应情绪等等。灵活运用诱导技术，将对情绪实验研究的控制有所帮助。"},{"q":"采用建构认知模型方法进行思维的研究一般要经历哪些步骤? 建构认知模型虽然没有一成不变的具体方法，却仍能总结出大致的步骤和脉络。","a":"（1）先验模型阶段。第一步，是要先建立一个有关思维心理机制和内部表征的先验模型。这里说先验模型，就是指研究者头脑中的理论模型，即还未得到实验验证的思想雏形。（2）实验验证阶段。在先验模型指导下，进行实验验证是认知模型范式的第二个步骤。实验验证，即要通过对各种变量的操纵来获得有利的结果，提出支持或否定先验模型的证据，为模型的进一步完善打好基础。（3）模型完善阶段。在对认知模型进行实验验证之后，认知模型的建构就可以进入第三个阶段——对模型进行完善。在新的实验事实基础上，对其原有的模型进行了修正。"},{"q":"解释一个2×3×4的完全随机因素实验设计（要指出该实验设计中的自变量数、每个自变量的水平数、可检验几个主效应、交互作用等）。假如同一实验条件（即一个实验单元）需要5名被试，那么完成该实验需要多少名被试？如果将实验设计改为混合设计，其中前两个变量为组间变量，第三个变量为组内变量，同一实验条件仍需要5名被试，则该实验需要多少组被试？","a":"（1）该设计中，自变量有3个，分别有2、3、4个水平，可检测3个主效应和4个交互作用。（2分） （2）假如同一实验条件需要5名被试，该实验共需120名被试。（1分） （3）如果该实验设计为混合设计，且前两个变量为组间变量，另一变量为组内变量，同一实验条件仍需要5名被试，该实验则需要30名被试。（1分）"},{"q":"有一个研究者想知道照明强度与阅读效果的关系，他选择了一个较强和较弱的光照条件。结果发现，阅读成绩与光照强度无关，你同意该结论吗？为什么？","a":"不同意，该实验设计存在很多问题，具体表现在：（1）自变量的两个水平之间的差异不够明确；（2）被试的选择可能没有做到随机选择和随机分配，被试的阅读水平可能并没有做到匹配；（3）缺乏对照组的比较；（4）两种水平的先后次数并不明确，如果没有做到随机化，可能会造成疲劳效应；（5）阅读材料的等值性问题不够明确；可能材料之间存在较大偏差；（6）实验条件的控制程度不清晰，特别是额外变量，如灯光颜色、材料呈现方式等因素；（7）统计手段不明确；（8）其他因素。以上各点，每答出1点得1分，最多得4分。"},{"q":"试评观察法的优缺点","a":"观察法是科学研究方法的第一步，其特点是直接和描述性。观察法在心理学研究的早期阶段非常实用，它可以帮助研究者选择和限定研究的范围作一些前期探索，为进一步的研究，尤其是实验研究提供资料和课题。然而，因为观察法是描述性的，这种特性必定为其带来如下限制： （1）观察法无法让研究者对各因素间的关系作出推论，不能依靠观察法作进一步的研究，因为它无法操纵这些先行条件。（2）有时，观察法所提供的资料并不充分。许多观察（比如个案研究）却根本无法再现，所以难以重复验证。（3）观察法的描述性限制常常被忽略。观察法的效力仅仅到客观描述水平为止，但是实际使用观察法的研究者却往往超出了描述水平上的研究范围，或多或少对观察结果趋向主观化的解释。（4）观察法本身并不一定客观无偏。如科学哲学家所言，我们的观察活动总是极大地受着各自世界观的影响。因而来自于研究者的期望等主观因素往往会干扰观察结果，这种干扰比起被试的反应性来更难排除。"},{"q":"因变量的类型对于实验研究来说，因变量的种类是很多的，也是很复杂的。一般来说，对于因变量的测量有客观指标也有主观指标。其中客观指标主要有：","a":"（1）反应速度。例如，简单反应时、或潜伏期，走完一个迷津所需要的时间，在一定时间内完成某项作业的数量等。（2）反应速度的差异。在现代认知心理学实验中，经常以反应速度的差异作为考察被试各种高级认知机能的指标。例如：在内隐学习的研究中，被试对随机组字母和规则组字母的反应时之差就可以作为内隐学习量的指标。（3）反应的正确性。例如，选择反应的正确次数、走迷宫入盲巷的次数、跟踪盘离靶的次数或距离等。（4）反应标准。随着信号检测理论的广泛使用，诸如似然比β、报告标准C等就常被用来作为一种客观因变量指标。（5）反应的难度。有些作业可以定出一个难易等级，看被试或动物能达到什么水平，如斯金纳箱就有三个难度等级。而因变量的主观指标主要是指被试的口语记录。口语记录是指被试在实验时对自己心理活动进程所作叙述的记录，或在实验之后，被试对主试提出问题所作回答的记录。在心理学实验中,口语记录是很重要的参考资料,有助于我们分析被试的内部心理活动。"},{"q":"请按照二因素二水平随机化实验设计的模式设计一个研究方案，研究某一地区的人对本地方言的理解程度是否好于对普通话的理解程度，同时研究材料播音员的性别是否影响其理解程度。要求写明：被试数量；实验中的自变量、因变量和可能的额外变量；实验基本方案；实验基本步骤；数据处理方法和方案分析表（根据选择被试人数计算出自由度）。","a":"（1）被试：被试类型等根据需要可以选择，被试人数为4组，具体人数不确定。（1分） （2）变量：①自变量有2个，分别是语言类型、播音员性别。变量水平根据各有2个。②因变量根据研究需要，可以选择成绩（正确率、错误率等也可以）。③可能的额外变量有播音员的音色、语调、速度、节奏等，被试的性别、教育水平（或者年龄、年级）等。（3分） （3）实验基本方案（2分）本实验采取2（播音员性别：男或女）×2（语言类型：方言、普通话）的完全随机化实验设计。\u0007语言类型 \u0007 \u0007 \u0007方言 \u0007普通话 \u0007 \u0007播音员性别 \u0007男 \u0007处理1 \u0007处理2 \u0007 \u0007 \u0007女 \u0007处理3 \u0007处理4 \u0007 \u0007 （4）实验基本步骤：①根据实验设计类型、处理个数和研究需要，选择被试；②选编实验材料；③选择男女性别的播音员；④呈现实验材料（注意随机化），进行实验；⑤实验记录、数据分析和结果处理。（2分） （5）数据处理方法：用多因素方差分析方法。（1分） （6）可能的结果：（3分）变异来源 \u0007自由度 \u0007均方 \u0007F \u0007 \u0007A的主效应 B的主效应 A×B交互效应误差 \u0007a-1 b-1 (a-1)(b-1) ab(r-1) \u0007MSA MSB MSAB MSE \u0007MSA/MSE MSB/MSE MSAB/MSE \u0007 \u0007合计 \u0007abr-1 \u0007 \u0007 \u0007 \u0007"},{"q":"科学方法的本质特征是什么？","a":"科学方法具有两个重要标志：经验观察与自我校正。正是这两种特征使得科学方法优于其它方式。科学方法的第一个特征是强调系统的经验观察。任何一种信念确立方法都不曾像科学方法那样，依靠对现实世界的系统观察所获得的资料来确立信念。它要求研究者通过大量现象观察、认真查阅文献、系统的科学实验研究之后，才谨慎地得出结论。因此，科学方法的系统经验观察特征令信念确立过程独具客观性、可靠性。科学方法的第二个特征是能够自我校正。由科学系统的经验观察所得出的科学事实具备两个特点：可公开、可反复获得。正是这两个特点使得科学拥有了自我校正的属性：经由公开的观察，可以清楚地知晓备选信念，从而在新、旧信念之间不断比较并决定取舍；经由反复的观察，人们接受或排除信念的过程就倍显慎重，只有多次验证后再确立信念才可保证信念的可靠性，同时多次否定后再排除信念才可避免轻率地抛弃某信念。因此，可公开、可反复获得的经验观察是科学方法的基石，正是它使得科学拥有了自我校正的属性。"},{"q":"资源限制理论和可证伪标准。","a":"资源限制理论是由卡纳曼最初提出的。他把注意看作心理资源，认为人的心理资源总量是有限的，注意的有限性不是过滤器作用的结果，而是受到了从事操作的有限心理资源的限制。注意的功能就是资源分配（因此该理论也称为资源分配理论）。如果一个任务没有用尽所有的资源，那么注意可以同时指向另外的任务。后来，诺曼和博布罗又通过对资源限制的区分进一步精确化了心理资源的概念。他们提出了“材料限制”和“资源限制”的划分。所谓材料限制是指其作业受到任务的低劣质量或不适宜的记忆信息的限制，因而即使分配到较多的资源也不能改善其作业水平。虽然资源分配理论适用性很强，但是仍存在严重的软肋：资源分配理论的可证伪性不像过滤器理论那么高。按照资源分配理论，如果两个任务无法在任务作业水平不下降的情况下被同时执行，那么它们需要同一个资源；但如果没有观察到任务作业水平下降，那么它们不需要同一个有限资源。这样一来，似乎所有注意机制都是资源分配机制，没有哪种数据不能用这种理论来解释。"},{"q":"加德纳的多元智力理论。","a":"加德纳从跨文化、心理、心理测量、发展以及神经等方面提出证据证明智力存在七个侧面，它们是：（1）言语—语言智力，表现为个体顺利而高效地利用语言描述事件、表达思想并与人交流的能力；（2）音乐—节奏智力，表现为个体对节奏、音调、音色和旋律的敏感以及通过作曲、演奏和歌唱等表达自己思想和情感的能力；（3）逻辑—数理智力，表现为个体对事物间各种关系（如类比、对比、因果和逻辑等关系）的敏感以及通过数理运算和逻辑推理等进行思维的能力；（4）视觉—空间智力，表现为个体对线条、形状、结构、色彩和空间关系的敏感以及通过平面图形和立体造型将它们表现出来的能力。（5）身体—动觉智力，表现为个体控制身体动作、对事件做出身体反应以及利用身体语言等表达自己思想和情感的能力。（6）自知—自省智力，表现为个体意识自身的情绪、欲望、个性等并在自我评价的基础上形成自尊、自律和自制的能力。（7）交流—交往智力，表现为个体觉察他人情绪、欲望和意图并能据此做出适宜反应的能力。对于七个智力中的每一个来说，加德纳都试图证明它有一个独立的神经结构和一个独立的发展史。"},{"q":"在信号检测论实验中，被试的判断标准主要受到何种因素的影响？判断标准与辨别力指数的关系如何？","a":"以随机方式呈现给被试100次信号和100次噪音，结果发现，甲、乙、丙被试在呈现100次信号报告说是信号的分别是16次、50次、93次，在呈现100次噪音报告说是信号的分别是2次、16次、69次。请比较3名被试的判断标准与辨别力指数（结果请保留3位小数）。表 PZO转换表 P \u0007Z \u0007O \u0007P \u0007Z \u0007O \u0007 \u00070.02 \u0007－2.053 \u00070.048 \u00070.50 \u00070.000 \u00070.399 \u0007 \u00070.07 \u0007－1.476 \u00070.134 \u00070.69 \u00070.495 \u00070.353 \u0007 \u00070.16 \u0007－0.994 \u00070.243 \u00070.84 \u00070.994 \u00070.243 \u0007 \u00070.31 \u0007－0.495 \u00070.353 \u00070.93 \u00071.476 \u00070.134 \u0007 \u00070.49 \u0007－0.025 \u00070.399 \u00070.98 \u00072.053 \u00070.048 \u0007 \u0007 （1）被试的判断标准主要受被试的价值取向、性格特征、外在奖惩条件、噪音与信号的先定概率等因素的影响。（2分） （2）被试的判断标准独立于辨别力指数。（1分） （3）3名被试的判断标准与辨别力指数分别如下：\u0007 \u0007y/SN \u0007y/N \u0007判断标准（β） \u0007辨别力指数（d’） \u0007 \u0007甲 \u0007P \u00070.16 \u00070.02 \u00075.063 \u00071.059 \u0007 \u0007 \u0007Z \u0007－0.994 \u0007－2.053 \u0007 \u0007 \u0007 \u0007 \u0007O \u00070.243 \u00070.048 \u0007 \u0007 \u0007 \u0007乙 \u0007P \u00070.50 \u00070.16 \u00071.642 \u00070.994 \u0007 \u0007 \u0007Z \u00070.000 \u0007－0.994 \u0007 \u0007 \u0007 \u0007 \u0007O \u00070.399 \u00070.243 \u0007 \u0007 \u0007 \u0007丙 \u0007P \u00070.93 \u00070.69 \u00070.380 \u00070.981 \u0007 \u0007 \u0007Z \u00071.476 \u00070.495 \u0007 \u0007 \u0007 \u0007 \u0007O \u00070.134 \u00070.353 \u0007 \u0007 \u0007 \u0007（计算6分，每点1分）结论：被试A的判断标准最高，被试C的判断标准最低。3名被试的辨别力指数接近，相对而言，被试甲的辨别力指数更高一些。（1分）"},{"q":"现有四种小学语文实验教材，为比较其教学效果，分别从城镇重点小学、城镇一般小学和乡村小学随机地各抽取四所学校，它们分别被随机地指派实验一种教材。经一年教学后通过统一考试得到各校的平均成绩。请指出实验设计的基本类型，实验目的和假设、被试选取、实验过程，列出方差分析表，并写出具体的自由度。","a":"实验设计类型：单因素完全随机区组实验设计（2分）。实验目的：考察不同地区学校四种小学语文教材的教学效果（1分）。实验假设：假设一，不同地区小学在使用同一教材时有显著差异；假设二，不同语文实验教材之间有显著差异（2分）。被试：从城镇重点小学、城镇一般小学和乡村小学随机地各抽取×所学校××班，分别使用四种语文实验教材（2分）。实验过程：（略）（2分）方差分析表（2分）及自由度根据选取被试数确定（1分）：方差来源 \u0007自由度 \u0007均方 \u0007F值 \u0007 \u0007处理 \u0007k－1 \u0007MS处理 \u0007MS处理/MS误差 \u0007 \u0007区组 \u0007a－1 \u0007MS区组 \u0007MS区组/MS误差 \u0007 \u0007误差 \u0007(k-1)（a-k） \u0007MS误差 \u0007 \u0007 \u0007合计 \u0007n－1 \u0007 \u0007 \u0007 \u0007"},{"q":"试评相关法的优缺点","a":"相关研究法是比观察法更为进步的描述性研究方法，相关研究法的优点在于可以显示变量间的共变关系，从而提示研究者注意到各种现象间可能存在的因果关系。但是由于其方法学特性，决定了相关研究法的缺点在于： （1）相关研究的结果往往取决于其选用相关法的前提条件是否得到了满足。当前提不满足的时候，相关研究得出的结果并不能反映真正的事物间的关系。（2）相关研究法无法确定因果关系的方向。相关研究法难以对各种假设作出取舍。"},{"q":"什么叫做组间设计？它有什么优缺点？","a":"组间设计，也叫做被试间实验设计，其基本原理是：将被试随机分配到不同的自变量上或自变量的不同水平上，各自在不同的处理条件下接受因变量的测量。（2分）组间设计的优点在于，不同处理条件下的实验由各不同被试组独立完成，得到的各组数据互不关联，相互独立，实验中也不存在各种处理条件间的相互干扰，同时每一被试的实验任务相对较少，易于完成。（1分）组间设计的缺点在于，如果被试分组出现偏差，则会出现各组间被试的差异，降低研究的内部效度，另外也往往需要较多被试。（1分）"},{"q":"什么叫做组内设计？它有什么优缺点？","a":"组内设计，也叫做被试内实验设计，是把抽取来的所有被试作为一组，接受自变量的多种处理，也就是说所有被试要在实验中自变量的所有处理水平上重复进行实验。（2分）组内设计的优点在于，不同处理下的实验均由同一组被试完成，被试差异不会成为混淆因子，研究的内部效度较高，而且这种设计较为节省被试。（1分）组内设计的缺点在于，组内设计中不同处理条件下的实验并不独立，容易出现相互干扰和顺序效应的影响，被试的实验任务往往较大。（1分）"},{"q":"请简要评价拉丁方实验设计的优缺点。","a":"拉丁方设计的优点是，在许多研究情境中，这种设计比完全随机和随机区组设计更加有效，它可以使研究者分离出两个额外变量的影响，因而减小实验误差，可获得对实验处理效应的更精确的估价。另外，通过对方格单元内误差与残差的F检验，可以检验额外变量与自变量是否有交互作用，以检验采用拉丁方设计是否合适。（2分）拉丁方设计的缺点是，它的关于自变量与额外变量不存在交互作用的假设在很多情况下都难以保证，尤其当实验中含有多个自变量的时候。因此，拉丁方实验设计在多因素实验中不常用。另外，拉丁方实验设计要求每个额外变量的水平数与实验处理数必须相等也在一定程度上限制了拉丁方实验设计的使用。（2分）"},{"q":"简述科学方法的主要特征，并就其中某一点适当加以阐述。","a":"（1）经验性。（2）公开性。（3）结构性。（4）操作性。（5）系统性。以上5点共3分，每少1点扣1分，扣完为止。就某一点阐述为1分，本题满分4分。"},{"q":"比较古典心理物理学的几种方法，信号检测论相对于古典心理物理学的优势是什么？","a":"（1）感觉阈限操作定义方面的比较。最小变化法最能说明感觉阈限的定义。（2分） （2）被试方面的比较。最小变化法和恒定刺激法容易造成被试疲劳和厌倦，而且被试主动性差。相对而言，平均差误法的实验程序容易引起被试的兴趣，因而也最能调动被试的主动积极性。（2分） （3）误差方面的比较。恒定刺激法的误差最小，恒定刺激法的刺激是随机呈现的，不会像最小变化法那样产生期望误差或习惯误差。最小变化法的误差次之，最小变化法由于其渐增和渐减的刺激系列，会产生习惯误差与期望误差。相对而言，平均差误法的误差最大。（2分） （4）效率方面的比较。最小变化法的效率最低，需要测定的次数最多，误差也较大。恒定刺激法所选用的刺激数目较少，每一个刺激得到的数据都是有效的，而且不需要随时调整刺激。恒定刺激法的实验结果可以应用各种数学方法加以处理，因而便于与其他测定感受性的方法进行比较。平均差误法的实验测定的次数较少。后两者的效率都高于最小变化法。（2分）在三种古典的心理物理法中，往往是感受性和被试反应的主观因素相混合的。因此，古典心理物理法中的科学性和可靠性就必然受到一定的影响，最根本问题是无法把感受性的测量和被试的动机、态度等个性因素所造成的反应偏好区分开。在此背景下，随着信息论的发展，信号检测论就应运而生了。（2分）"},{"q":"注意研究有哪些方法？","a":"注意实验的研究方法有很多种，主要的有提示范式、搜索范式、过滤范式、双任务范式以及电生理学的研究方法。提示范式（Cuing Paradigms）的基本原理是：用刺激或指导语来引导被试注意一个明确的输入源，然后把对这一输入源的加工和对其他输入源的加工作比较。搜索范式的基本原理是：要求被试寻找一个或多个混杂在非目标刺激中的目标刺激，实验时这些刺激可以同时呈现，也可以相继呈现。过滤范式（Filtering Paradigms）的基本原理是：使被试的注意指向一个信息源，而实验者评估的则是那些未被注意的信息的加工过程，以此来研究注意的某些特征。过滤范式下有不同的变形：整体－局部范式，双侧范式和负启动范式。双任务范式则关心注意是如何在多个并行任务间起到指向和调节作用的。注意的电生理学研究方法主要有脑电图技术和事件相关电位技术。由于脑电图技术只是在完全清醒条件下对人的注意进行生理分析，而未真正涉及注意的本质，所以现在注意的电生理研究更多使用事件相关电位技术。"}]}]});

window.__MODULES.push({"module":"term","subject":"普通心理学","icon":"🧠","desc":"彭聃龄《普通心理学》第 5/6 版","chapters":[{"name":"第1章 心理学的研究对象和方法","items":[{"q":"心理学","a":"心理学，是一门研究心理和行为的科学，其研究对象具体包括个体心理、行为、意识与无意识以及团体心理等。其中，个体心理，即个人所具有的心理现象，包括 3 个方面：认知、动机和情绪、心理特征。"},{"q":"认知","a":"认知，也叫认知过程，是指人获得知识或应用知识的过程，即信息加工的过程，包括感觉、知觉、记忆、思维和语言等。人接收外界输入的信息，并将这些信息经过神经系统的加工处理，转换成内在的心理活动，进而支配人的行为。"},{"q":"动机","a":"动机，是指人的心理活动和外在行为，在需要的推动下，或者在身心不平衡的状态下发生。动机不同，人们对现实的态度以及相应的行为方式也不同。"},{"q":"调查法","a":"调查法，是指就某一问题要求被调查者自由表达意见或态度，以此来分析群体心理倾向的研究方法，主要包括问卷调查和晤谈法两种研究方法。"},{"q":"观察法","a":"观察法，又称自然观察法，指在自然条件下对表现心理现象的外部活动进行有系统、有计划的观察，从而发现心理现象产生和发展的规律。"},{"q":"实验法","a":"实验法，是在控制条件下对某种心理现象进行研究的方法，目的在于寻找现象之间的因果联系。是科学心理学研究最高级的方法。根据实验条件的要求严格程度可分为：实验室实验和自然实验。"}]},{"name":"第2章 心理与行为的脑神经基础","items":[{"q":"动作电位","a":"动作电位，是神经元受刺激时的短暂电位变化，是神经元兴奋的标志，与静息电位交替出现。其产生原因是细胞膜对离子的通透性发生了改变（Na+迅速向细胞膜内扩散）。"},{"q":"神经回路","a":"神经回路，是大量神经元之间通过突触建立的神经通路或网络，可以传递神经信号和进行复杂的信息加工与处理，从而实现特定功能"},{"q":"神经元","a":"神经元，也称神经细胞，是神经系统结构和机能的基本单位，它的基本作用是接收和传送信息，由胞体、树突、轴突 3 个部分组成。"},{"q":"神经系统","a":"神经系统，是指由神经元相互联系构成的一个异常复杂的机能系统，分为中枢神经系统和周围神经系统。中枢神经系统，由脊髓和脑组成。脑包括大脑、边缘系统、间脑、脑干、小脑等几个部分。"},{"q":"网状系统","a":"网状结构又叫网状系统，是一种由白质与灰质交织混杂的结构，对觉醒与意识状态、躯体活动起重要的调节作用。按功能可分成 2 个部分：上行网状结构（或上行激活系统）和下行网状结构（或下行激活系统）。"},{"q":"边缘系统","a":"边缘系统，位于大脑内侧面最深处的边缘，包括广泛的脑组织。其中，海马与学习和记忆有关，杏仁核与情绪有关，扣带回与注意有关。"}]},{"name":"第3章 感觉","items":[{"q":"感觉","a":"感觉，是人脑对直接作用于感觉器官的客观事物的个别属性的反映。感觉也是神经系统对外界刺激的反应，具有反射的性质，包含感受器和效应器两种活动。"},{"q":"感觉编码","a":"感觉编码，指神经系统不能直接加工外界输入的物理或化学能量（如光波和声音）。这些能量必须经过感官的换能作用，转化为神经系统能接受的神经能或神经冲动。"},{"q":"绝对感受性","a":"绝对感受性，是指人的感官觉察到微弱刺激的能力，可以用绝对感觉阈限来衡量。在实际测量时，我们用 50%觉察到刺激来代表绝对感受性。"},{"q":"绝对感觉阈限","a":"绝对感觉阈限，是指刚刚能引起感觉的最小刺激量，与绝对感受性在数值上成反比，用公式表示为：E = 1/R（E代表绝对感受性，R代表绝对感受阈限）。"},{"q":"差别感受性","a":"差别感受性，是指对能引起差别感觉的同类刺激最小差异量的感觉能力，可以用差别感觉阈限来衡量。在实际测量时，我们用50%觉察到刺激的差异来代表差别感受性。"},{"q":"差别感觉阈限","a":"差别感觉阈限，也叫最小可觉差（JND），指刚刚能引起差别感觉的刺激物间的最小差异量。"},{"q":"韦伯定律","a":"韦伯系统研究了触觉的差别阈限。他发现，人对刺激物的差别感觉依赖于刺激物的增量与原刺激量的比值，用公式表示为：K = ∆I/I（I为标准刺激的强度/原刺激量，∆I为引起差别感觉的刺激增量，K即韦伯分数，它是一个常数，感觉不同，K 的数值则不同）。"},{"q":"幂定律","a":"斯蒂文斯用数量估计法研究了刺激强度与感觉大小的关系，他认为心理量与刺激量的幂成正比，用公式表示为：P = KI ￿（P代表感觉大小，I代表刺激量，K和n是被评定的某类经验的常定特征）。"},{"q":"感觉适应","a":"感觉适应，是指刺激物持续作用于同一感受器而使感受性发生变化的现象（如视觉适应）。"},{"q":"感觉后效","a":"感觉后效，是指在刺激作用停止后暂时保留的感觉现象，在视觉中表现尤为明显，称为后像。"},{"q":"视锥细胞","a":"视锥细胞，又称锥体细胞，数量相对较少，短粗，呈锥形；分布在视网膜中央窝；是昼视器官，在中等和强光下起作用，主要感受物体的细节和颜色。"},{"q":"视杆细胞","a":"视杆细胞，又称棒体细胞，数量相对较多，细长，呈棒状；分布在视网膜边缘；是夜视器官，在弱光下起作用，主要感受物体的明暗。"},{"q":"普肯耶现象","a":"在不同光照条件下（昼夜），人们的视觉机制不同。当从视锥视觉（昼视觉）向视杆视觉（夜视觉）转变时，人眼对光谱最大感受性将向短波方向移动，出现明度的变化（在阳光照射下，红花与蓝花可能显得同样亮，而当夜幕降临时，蓝花似乎比红花更亮）。"},{"q":"马赫带","a":"马赫带现象，指人们在明暗变化的边界上，常常在亮区看到一条更亮的光带，而在暗区看到一条更暗的线条，即边界更加突出。这不是刺激能量的实际分布，而是由于神经网络对视觉信息进行加工所导致的结果，可以用侧抑制来解释。"},{"q":"明适应","a":"明适应，是指照明开始，或由暗处转入亮处时视觉感受性下降的时间过程。1s 就已经很明显，5min 已全部完成。"},{"q":"暗适应","a":"暗适应，是指照明停止，或由亮处转入暗处时视觉感受性提高的时间过程。早期由视杆、视锥细胞共同完成，之后只有视杆细胞继续起作用。整个暗适应持续 30-40min，之后感受性不再提高。"}]},{"name":"第4章 知觉","items":[{"q":"知觉","a":"知觉，是客观事物直接作用于感官而在头脑中产生的对事物整体的认识，是对感觉信息进行解释并赋予其意义的过程。其作用包括：觉察、分辨和确认。"},{"q":"知觉恒常性","a":"恒常性，是指当知觉的客观条件在一定范围内发生改变时，我们的知觉映象在相当程度上保持其稳定性。这是知觉的一种普遍特性说明人的认识具有能动性，在形状、大小、明度和颜色知觉中都有存在。知觉的恒常性受到 2 个因素的影响：知识经验、视觉线索。"},{"q":"知觉理解性","a":"理解性，是指在知觉过程中，人不是被动地认识知觉对象的特点，而是以过去的知识经验为依据，力求对知觉对象做出某种解释，使它具有一定的意义。"},{"q":"时间知觉","a":"时间知觉，是指我们知觉到客观事物或事件的连续性和顺序性。它不是某个特定感觉通道的功能，而是多种感知系统联合活动的结果，其参照物主要是自然界的周期性现象和人体的各种节律性活动。包括时序知觉、时距知觉、时点知觉三种类型。"},{"q":"单眼线索","a":"单眼线索，是指用一只眼睛就能感受的深度线索。包括：对象的遮挡、线条透视、空气透视、相对高度、纹理梯度、运动视差、运动透视、相对大小、明暗阴影。"},{"q":"双眼线索","a":"双眼线索，即双眼视差，体现了物体左右眼视网膜像的差异。当我们观看一个物体时，如果将两眼视网膜重叠起来，视像重合，即看到单一、清晰的物体。当视像落在视网膜非对应部位且差别不大时，人将看到深度与距离。随着两眼视差进一步加大，人将看到双像。"},{"q":"似动","a":"似动，是指在一定的时间和空间条件下，人们在静止的物体间看到了运动，或在没有连续位移的地方看到了连续的运动。主要有动景运动、诱发运动、自主运动、运动后效等 4 种形式。"},{"q":"动景运动","a":"动景运动，又称最佳运动或 Phi（φ）运动，由格式塔心理学家韦特海默最早发现，是指当两个刺激物按一定空间间隔和时间距离相继呈现时，会看到从一个刺激物向另一个刺激物的连续运动。它实际上是一种运动错觉，受到了视觉后像机制的影响。"},{"q":"Tau效应","a":"陶效应，由赫尔森等提出，指时间知觉对空间距离的知觉产生影响。时距越长，知觉到的距离也越长。"},{"q":"Kappa 效应","a":"卡帕效应，由科恩提出，与陶效应相反，指时间知觉受到空间事件影响。距离越长，知觉到的时距也越长。"},{"q":"错觉","a":"错觉，是指我们的知觉不能正确地表达外界事物的特性而出现的种种歪曲，往往着带有固定的属性。不同于幻觉，错觉是在一定条件下必然产生的正常现象。严格来说，任何知觉都带有错觉。"}]},{"name":"第5章 意识和注意","items":[{"q":"意识","a":"意识，是我们对自身、外界环境事件以及对二者关系的主观觉知，是一种高级心理功能，负责统合、管理和调控个体身心系统，也是一种心理状态，可以分为不同层次或水平，还存在一般性变化（如惊奇、愤怒、觉醒等）。"},{"q":"无意识","a":"无意识，又称潜意识，是个体不曾觉察到的心理活动（相对于意识而言）。弗洛伊德认为，某些冲动和欲望（多数与性欲有关）被排除在意识之外，压抑到潜意识中，直接或间接地影响人的心理和行为（如梦、失言、笔误）。"},{"q":"快速眼动睡眠","a":"快速眼动睡眠阶段，通常伴随梦境出现。睡眠者眼球快速运动，心律和血压变得不规则，呼吸急促，肌肉依然松软。在一个睡眠周期中，多数的 REM 发生于睡眠后期，持续时间也越来越长；而在人的一生中，随年龄增长，REM 时间逐渐缩短。"},{"q":"注意","a":"注意，是心理活动指向和聚焦于特定的对象或事物，同时忽略其他事物的心理现象。从信息加工的角度看，注意是个体主动地选择和处理环境中的特定信息，忽略和抑制其他无关信息的过程。"},{"q":"选择性注意","a":"选择性注意，是指个体在同时呈现的两种或两种以上刺激中选择一种进行注意，而忽略另外的刺激，可通过双耳分听实验进行研究。"},{"q":"内源性注意","a":"内源性注意，也称目标指向控制注意、随意（有意）注意，是一种主动的、积极的、费心神的注意，由个体的行为目标或意图引起，即引起注意的线索来自内部。受活动目的和任务、兴趣、活动的组织、知识经验、人格特征等因素的影响。"},{"q":"外源性注意","a":"外源性注意，也称刺激驱动注意、不随意（无意）注意，是一种被动的、不随意的、不费心神的注意，由外部刺激或信息引起，即引起注意的线索来自外部。其影响因素包括刺激物自身的特点和人的主观因素。"},{"q":"催眠","a":"催眠，是一种特殊意识状态，指催眠师向被催眠者进行引导或提供暗示，使被催眠者进入一种特殊的意识状态。在此状态下，人们的主动性降低，会轻易地对暗示做出反应（脑电波与清醒状态一致）。"},{"q":"冥想","a":"冥想，是一类自我调节方法或心理训练形式的总称，旨在通过身心调节和意识觉知训练来提升个体的自我觉察能力与对心理过程的控制能力，进而提升整体的心理幸福感，培养出诸如平和、专注等心理特征。"}]},{"name":"第6章 记忆","items":[{"q":"记忆","a":"记忆，是在头脑中积累和保存个体经验的心理过程。用信息加工的术语来讲，就是人脑对外界输入的信息进行编码、存储和提取的过程。记忆与其他心理活动密切相关，在个体心理发展和人类社会发展中起重要作用。"},{"q":"感觉记忆","a":"感觉记忆，也叫感觉登记、瞬时记忆，是记忆的开始阶段。客观刺激停止作用后，感觉信息会在极短时间内被保存下来，即对外界信息进一步加工前的暂时登记。"},{"q":"短时记忆","a":"短时记忆，是感觉记忆和长时记忆的中间阶段，保持时间约为 1min，其功能是暂时存储信息，以使信息进入长时记忆。因此，短时记忆中的信息有意识，可以操作。"},{"q":"长时记忆","a":"长时记忆，是指保持时间在 1min 以上的记忆。它存储着我们的过去和现在，为心理活动提供了必要的知识基础。长时记忆的信息容量没有限制，大部分来源于对短时记忆内容的加工，也可能由于印象深刻而一次性获得。"},{"q":"工作记忆","a":"工作记忆，由巴德利等提出，是对短时记忆概念的扩展，指对信息进行暂时存储和加工的容量有限的记忆系统。它是一种当前工作状态的记忆，为复杂的认知活动（如问题解决、推理等）提供存储和加工的空间，从而保证其顺利完成。"},{"q":"前瞻性记忆","a":"前瞻性记忆，是指对未来完成某项活动的记忆。在实验中一般采用双任务范式对前瞻性记忆进行研究。它涉及到记忆、注意、计划等一系列认知过程，对维系人的正常生活具有重要的现实意义。"},{"q":"程序性记忆","a":"程序性记忆，是指如何做某件事的记忆，包括对知觉、认知和运动技能的记忆。它们难以用语言表达，需要多次练习才能逐渐获得。在利用这类记忆时，往往不需要意识的参与。"},{"q":"内隐记忆","a":"内隐记忆，也称无意识记忆，是指过去经验对当前任务产生的无意识的影响。"},{"q":"外显记忆","a":"外显记忆，也称有意识记忆，是指过去经验对当前任务产生的有意识的影响。"},{"q":"前摄抑制","a":"前摄抑制，指先学习的材料或从事的活动，对识记和回忆后学习的材料有干扰作用。先学的材料数量越多，干扰效果越强。"},{"q":"倒摄抑制","a":"倒摄抑制，指后学习的材料或从事的活动，对识记和回忆先学习的材料有干扰作用。干扰效果受先后两种学习材料类似程度、难度、时间安排以及巩固的程度等因素影响。"},{"q":"遗忘","a":"遗忘，是记忆保持的最大变化，指记忆的内容不能保持，或者提取时发生困难。又可以分为不完全遗忘、完全遗忘、临时性遗忘和永久性遗忘四种类型。"},{"q":"遗忘曲线","a":"艾宾浩斯最早对遗忘的发展进行研究。他以自己为被试，采用节省法（重学法）研究无意义音节。研究结果表明，遗忘在学习之后立即开始，并表现为先快后慢。艾宾浩斯将研究结果绘制为艾宾浩斯遗忘曲线，反映了记忆保持量和回忆时间的关系。"}]},{"name":"第7章 思维","items":[{"q":"思维","a":"思维，是借助语言、概念、表象等实现的，对客观事物概括的、间接的反映。它能揭示事物的本质特征和内部联系，是认识的高级形式，是认识过程的核心成分。"},{"q":"表象","a":"表象，指人们在头脑中出现的关于事物的形象，是人类知识的重要表征方式，是思维活动的感性支柱，有助于思维活动的顺利进行。从信息加工的角度来说，表象是指物体或事件的一种像图画一样的心理表征。"},{"q":"概念","a":"概念，是具有共同属性的一类事物的总称。掌握概念可以使认识超越感知觉的范围，透过事物的表面现象，更好地认识事物。每一个概念都包括 2 个方面：即内涵（概念的共同属性）和外延（具有这些属性的事物）。概念的内涵增大，外延就会变小。"},{"q":"再造想象","a":"再造想象，有意想象的一种形式，是指根据语言的描述或图形符号的示意，在人脑中形成相应事物新形象的过程。"},{"q":"定势","a":"定势，指重复先前的心理操作所引起对活动的准备状态，具有两面性：（1）积极作用：在条件不变的情况下，能运用先前的方法能够快速解决问题；（2）消极作用：运用旧方法解决新的问题，阻碍新方法或者简单方法的发现和运用，阻碍创新（陆钦斯的量杯实验）。"},{"q":"推理","a":"推理，是指从具体事物或现象中归纳出一般规律，或者根据一般原理推出新结论的思维活动。前者叫归纳推理，后者叫演绎推理。演绎推理主要有三段论推理和条件推理 2 种类型。"},{"q":"问题解决","a":"问题解决，是指根据一定的问题情境，按照一定的目标，应用一系列的认知操作，使问题得以解决的过程。问题解决是一种重要的生存技能，是一种高级认知能力，体现了思维的水平，影响着个人的生活和工作质量。"},{"q":"功能固着","a":"功能固着，指人们把某种功能赋予某种物体的倾向。在其影响下人们不易摆脱事物用途的固有观念，因而直接影响到问题解决（邓克的盒子问题）。"},{"q":"代表性启发","a":"人们倾向于根据事物或者人代表某范畴的程度来判断其是否属于某范畴。具体来说，事物或人越能代表某范畴，就越容易被归入该范畴，但忽视了其发生的基础概率（如长发男是艺术家）。"},{"q":"手段—目的分析","a":"手段—目的分析法，是将需要达到的目标状态分成若干子目标，通过实现一系列的子目标，不断减少当前状态和目标状态之间的差别，最终达到总目标（如汉诺塔问题的解决）。"},{"q":"逆向搜索","a":"逆向搜索法，又称目标递归策略，是从问题的目标状态开始搜索直至找到通往初始状态的通路或方法。更适合解决那些从初始状态到目标状态只有少数通路的问题（如一些几何类问题）。"},{"q":"爬山法","a":"爬山法，是指逐步缩短始状态和目标状态的距离，以实现问题解决的一种策略（如登山）。"},{"q":"创造性思维","a":"创造性，指人们应用新颖的方式解决问题，并产生新的、有社会价值的产品的心理过程，总是体现在复杂问题解决的活动中。创造是人类最高智慧的体现，是人类思维的高级形式，也是多种思维的结晶，可以通过训练进行培养。"}]},{"name":"第8章 语言","items":[{"q":"语言","a":"语言，可以分为口头语言和书面语言，是人类通过高度结构化的声音、文字或手势等构成的一种用于交流的符号系统，同时也指使用这种符号系统进行交流的能力。"},{"q":"句子理解","a":"句子理解，是在词汇加工的基础上，通过对组成句子的各成分进行句法分析和语义分析，获得句子意义的过程。"},{"q":"语篇理解","a":"语篇理解，是语言理解的最高水平，是在词汇和句子理解的基础上，运用推理、整合等方式揭示语篇意义、形成连贯的心理表征过程，包括 3 个层次：①字词水平的表层表征；②语义水平的文本基础表征；③语篇水平的情境模型。"},{"q":"双语者","a":"双语者，即多语者，指一个人能同时说两种或多种语言。先学会的语言叫作母语（L1），后学会的语言叫做第二语言（简称二语，L2）或第三语言（简称三语）等。"}]},{"name":"第9章 动机","items":[{"q":"需要","a":"需要，是有机体内部某种缺乏或不平衡状态（包括生理和心理层面），它表现在有机体对内部环境或外部生活条件的一种稳定需求，是动机的产生基础和活动的基本动力。"},{"q":"耶克斯-道德森定律","a":"耶克斯-道德森定律，可表现出动机强度、任务类型和工作效率间的关系，有如下要点：（1）各种活动都存在一个最佳的动机水平。（2）动机强度与工作效率不是简单的线性关系，而是倒 U 型曲线关系。（3）动机的最佳水平随任务性质的不同而发生改变。"},{"q":"成就动机","a":"成就动机，是人们希望从事有重要意义，且有一定困难、具有挑战性的活动，并能取得优异的成绩，超过他人的动机。"},{"q":"权力动机","a":"权力动机，是指人们具有某种支配和影响他人以及周围环境的动机。权力动机强者常常表现为主动参与社会事物，并试图在其中起支配和领导作用；权力动机弱者虽然也参与社会活动，但主动性不强，缺乏在群体中起领导、支配作用的欲望。"},{"q":"学习动机","a":"学习动机，是推动人们积极学习的内部动力，是人类重要的社会性动机，对学业成绩有直接的影响，受多方面因素的制约。"},{"q":"兴趣","a":"兴趣，是以认识或探索外界的需要为基础，推动人们认识事物或从事活动的动机，表现为对事物、活动的选择性态度和积极的情绪反应。"},{"q":"自我效能感","a":"自我效能感，是个体对自己实施某一行为的能力的主观判断，是个体对自己在特定情境中是否有能力得到满意结果的预期。"}]},{"name":"第10章 情绪","items":[{"q":"情绪","a":"情绪，是以主体的愿望和需要为中介的一种心理活动。客观事物或情境符合主体的愿望和需要时引起积极、肯定的情绪，反之则引起消极、否定的情绪。因此，情绪是个体与环境之间某种关系的维持或改变，是一种混合的心理现象，有暂时性、情境性、激动性的特点。"},{"q":"心境","a":"心境，是一种微弱的、弥漫的、持久的情绪状态。它不是关于某一事物的特定体验，而是以同样的态度体验对待一切事物。心境对人的生活、工作、学习等影响很大，其持续时间依赖于引起心境的客观刺激性质。"},{"q":"激情","a":"激情，是一种强烈的、爆发性的、短暂的情绪状态。它通常由对个人有重大意义的事件引起，伴随着明显的生理变化和外部行为表现，甚至出现“激情休克”现象（过度兴奋、语言紊乱、动作失调）。在激情状态下，人往往会出现“意识狭窄”现象。"},{"q":"应激","a":"应激，指人对某种意外的环境刺激所做出的适应性反应，是一种紧张而带有不愉快色调的情绪状态。应激的产生与面临的情境和个体对自己能力的估计有关。一个人在意识到无力应对当前情境的要求时，就会处于应激状态。"},{"q":"情绪智力","a":"情绪智力，是一种监控/识别自己和他人情绪、对情绪进行评估和调节、利用情绪促进思维发展等方面的能力。对情绪智力的研究始于萨洛维和梅耶发表的“情绪智力”一文。后来，戈尔曼撰写的《情绪智力》和巴昂主编的《情绪智力手册》等书籍，标志着情绪智力的研究进入了新的发展阶段。"},{"q":"情绪调节","a":"情绪调节，是指个体对情绪体验、生理唤醒及表情进行监控、调整和修正，以达到动态平衡的过程，从而保证个体良好的适应性。"}]},{"name":"第11章 能力","items":[{"q":"智力","a":"智力，是个体顺利完成某种活动所必需的各种认知能力的有机结合，是个人有目的地行动，合理地思考，有效应付环境的一种综合能力。"},{"q":"能力","a":"能力，是顺利完成某种活动所必备的心理特征。它比智力的概念更加庞杂，在日常用语中出现的频率更高。"},{"q":"一般能力倾向","a":"一般能力倾向，是指在不同种类的活动中都会表现出来的能力（如工作记忆能力、语言理解能力等）。其中，抽象推理能力通常被看作一般能力倾向的核心。"},{"q":"特殊能力倾向","a":"特殊能力倾向，是指在某种专业活动中表现出来的能力，与能否顺利完成特定的专业活动密切相关（如音乐家的辨别旋律的能力、音乐表象能力等）。"},{"q":"晶体智力","a":"晶体智力，又称晶态智力，是一个人通过其液态智力所学到并得以完善的能力，即经过教育培养，通过掌握社会文化经验而获得的智力，具体由个体习得的知识、技能以及将它们用于特定情境的能力组成，主要取决于后天学习。"},{"q":"流体智力","a":"流体智力，又称液态智力，是在信息加工和问题解决过程中所表现出的能力，依赖于先天禀赋，主要与神经系统的生理机能有关，较少受后天教育和文化的影响，具体包括知觉速度、机械记忆、识别图形等。"},{"q":"成功智力","a":"成功智力，又称三因素理论，由斯腾伯格提出，主要关注个体能否使用智力更好地应对生活中各种各样的问题，完成人生的主要目标。认为智力包括三种类型：分析性智力、创造性智力以及实践性智力。"}]},{"name":"第12章 人格","items":[{"q":"人格","a":"人格，是构成一个人的思想、情感及行为的独特模式，包含了一个人区别于他人、稳定而统一的心理品质。人格可以说明一个人的整体精神面貌，既能反映出一个人的过去与现在的心理和行为特征，也能预示他将来的行为反应。"},{"q":"气质","a":"气质，是个体生来就有的心理活动的动力性特征，受高级神经活动类型的影响，表现在心理活动的强度、速度、灵活性与指向性等方面。气质具有先天性，在很大程度上来自于遗传，反映了人格的自然属性，无好坏之分。但在后天环境和教育的影响下，也具有一定的可塑性。"},{"q":"性格","a":"性格，是个人对现实稳定的态度及与之相应的行为方式，强调个人的典型行为表现。性格具有后天性，是个人在活动中与特定社会环境相互作用的产物，表现了一个人的品德，反映了人格的社会属性，具有道德评价含义，有好坏之分。"},{"q":"认知风格","a":"认知方式，也叫认知风格、认知模式，是指个人所偏爱使用的信息加工方式，其差异体现了人格特征的不同。研究发现，当学习材料与学生的认知风格匹配时，学习效果更好。"},{"q":"特质","a":"奥尔波特首次对特质进行了描述与分类。他认为，特质是人格的结构单元，是一种潜在的反应倾向，决定个体行为的基本特性。因此，可以将特质作为基本单位，用于对人格的测评。"},{"q":"首要特质","a":"首要特质，也叫首要倾向，是一种占绝对优势的行为倾向，具有极强的普遍性和渗透性，个人的所有行为几乎都受此倾向的影响（如林黛玉的多愁善感）。"},{"q":"根源特质","a":"根源特质，是行为的内在根源，支配着人的一贯行为。指相互联系并以相同原因为基础的行为特质（如害怕考试、发抖都基于焦虑）。"},{"q":"自我控制系统","a":"自我控制系统，是人格中的自我整合系统，保证了人格的完整、协调与统一。在自我控制中，意志是一种核心的人格力量，代表人格功能最高级和最完整的形式。"},{"q":"自陈测验","a":"自陈量表，又称自陈问卷，是让被试依据自己的实际情况，对自己的人格特征进行评价的一种方法。自陈量表通常由一系列问题组成，涉及各种可能的症状、态度、兴趣、情绪反应、行为和价值观等方面，要求被试判断自己的实际情况与每个问题所陈述情况相符合的程度。"},{"q":"投射测验","a":"投射测验，以弗洛伊德精神分析的人格理论为依据建构。通过向被试呈现模棱两可的刺激材料，要求被试自由解释，使他们在不知不觉中将自己的动机、情绪、态度等投射出来，然后由主试对其反应进行分析，从而推出被试的人格特征。"}]},{"name":"第13章 学习","items":[{"q":"学习","a":"是个体在一定情境下由于经验而产生的行为或行为潜能的比较持久的变化。这个概念有三个含义：首先，学习以行为或行为潜能的改变为标志；其次，学习引起的行为变化是相对持久的；最后，学习是由练习或经验引起的。"},{"q":"消退","a":"条件反射形成以后，如果得不到强化，条件反应会逐渐削弱，直至消失。比如狗对铃声形成唾液分泌的条件反射之后得到了食物，那么条件反射将进一步巩固，如果只给铃声不给食物的话，已经形成的条件反射就会消退。"},{"q":"泛化","a":"指在条件反射形成后，另外一些类似的刺激也会引起条件反应，即刺激越相似，便越可能将其当作相同的刺激来反应。比如狗形成了对三声铃声的条件反射之后，那么它也会对一声或者是两声铃声作出相同的反应，新刺激越接近于原来的条件刺激，泛化现象就越容易发生。"},{"q":"分化","a":"是指对事物的差异进行反应，即区分那些相似却不同刺激的能力。比如狗狗可以学会只对三声铃声作出唾液分泌的条件反射，但是对一声或者是两声铃声没有唾液分泌的反应，这就是分化。"},{"q":"学习的迁移","a":"是指人们在一种情境中所获得的知识或技能，会影响之后学习的另一种知识或技能。"},{"q":"顿悟学习","a":"顿悟学习，由苛勒提出，是指在认知结构中将已有的知识经验进行了重新组合，因而找到了解决问题的新方法。在顿悟学习中，个体学到的东西不是刺激和反应之间的一种特定的联系，而是手段和目的之间的一种认知关系。"},{"q":"位置学习","a":"就是根据对情境的认知，在当前情境与达到目的的手段、途径间建立起一个完整的符号系统。"},{"q":"潜伏学习","a":"托尔曼认为，强化不是学习所必需的。他在实验中发现没有受到强化的小白鼠同样进行了学习，只是学习的效果没有及时表现出来，一旦受到了强化，学习效果就会表现出来，这种学习被称为“潜伏学习”。"}]},{"name":"第14章 人生全程发展","items":[{"q":"个体发展","a":"个体发展，是指个体在生命全程中所经历的各种身体、行为或心理上的变化。这种变化具有相对持久性、连续性及内在规律性。"},{"q":"关键期","a":"关键期，指生命中的一段时期，如果个体不能获得某种经验，将会失去发展出与该种经验相联系的功能的机会。"},{"q":"依恋","a":"依恋，是指人与人之间建立起来的、双方互有的亲密感受以及互相给予温暖和支持的关系。"},{"q":"观察学习","a":"观察学习，是指人们可以通过观察他人的行为以及行为后果，间接地产生学习。影响观察学习发生的条件：①榜样的特征；②观察者的特征；③榜样的行为结果。"}]}]});

window.__MODULES.push({"module":"term","subject":"实验心理学","icon":"🔬","desc":"郭秀艳《实验心理学》（人民教育出版社 2019）","chapters":[{"name":"第1章 实验心理学概述","items":[{"q":"操作定义","a":"根据测量心理现象的程序来对一个概念下定义，由布里奇曼提出。例如把疲劳定义为从事某种劳动的时间量。操作定义明确了自变量的内涵，同时指出了自变量操纵的方法。"},{"q":"心理学实验","a":"在严格控制的条件下，有组织地逐次变化条件，对伴随的心理现象进行观察、记录和测量，从而确定条件与心理现象的关系。"},{"q":"因素型实验","a":"主要探索所要研究的心理现象产生的条件是什么,与哪些因素有关。"},{"q":"函数型实验","a":"主要研究条件与心理现象的函数关系。因素型实验可以初步探索哪些因素会对结果变量造成影响，从而进行更详细的函数型实验，找到具体的影响效应值。"},{"q":"实验范式","a":"在心理学中，为了验证某种假设以及发现某些有意思的现象，实验者会设计具有验证性目的的实验。有些实验比较经典，被有相同或类似目的的后人多次沿用，就形成了一种实验范式。实验范式就是一种相对固定的实验程序，它包括实验的目的、具体流程、手段以及实验设计等。如启动范式、Stroop 范式、内隐联想范式等。"}]},{"name":"第2章 变量与额外变量","items":[{"q":"变量","a":"（Variable）是指在数量上或质量上可变化，操作和测量的条件、现象或特征。在一个具体的试验中，变量分为自变量、因变量和额外变量。"},{"q":"自变量","a":"即实验者所操纵的、对被试的反应产生影响的变量，也称独立变量或刺激变量"},{"q":"因变量","a":"操纵自变量的变化而引起的被试某种特定反应的变化，也称依从变量或反应变量。"},{"q":"天花板效应","a":"被试的反应超过了所能测量的最大值。天花板效应的出现是由于实验任务过于简单，对于不同水平的自变量，被试都取得了很好的结果。"},{"q":"地板效应","a":"被试反应低于所能测量的最小值。这种效应的出现，必然使实验者的实验不能获得任何有意义的结果。地板效应的出现可能是实验者要求被试完成的任务过于困难，对于各种不同水平的自变量，被试都获得了很差的结果。"},{"q":"额外变量","a":"与实验目的无关但能对被试反应有一定影响的变量，也称控制变量或无关变量。"},{"q":"实验者偏见或实验者效应","a":"由美国著名心理学家罗森塔尔和雅格布森提出，又称皮格马利翁效应、罗森塔尔效应、毕马龙效应、期望效应主试在实验中可能以某种方式（如他的表情、手势、语气等）有意无意地影响被试，使他们的反应符合实验者的期望。常见的实验者效是罗森塔尔效应。"},{"q":"要求特征","a":"被试自发地对实验者的实验目的产生一个假设或猜想，然后再以一种自以为能满足这一假象的实验目的的方式进行反应。"},{"q":"好被试现象","a":"被试在实验过程中根据自己对实验目的的假设而努力使自己的行为符合实验者的要求，成为一个好被试。"},{"q":"霍桑效应","a":"由哈佛大学心理专家乔治·埃尔顿·梅奥教授为首的研究小组提出此概念，是指那些意识到自己正在被别人观察的个人具有改变自己行为的倾向。心理学上的一种要求特征。"},{"q":"安慰剂效应","a":"又称伪药效应、假药效应。病人虽然接受的是无效治疗，但却“相信″ 治疗有效，而让病患症状得到舒缓的现象。被试认为某种无效刺激具有某种功能，从而有意无意中按照这种功能的结果来行动或者是表现出对刺激有效的反应。"}]},{"name":"第3章 实验设计与效度","items":[{"q":"抵消平衡法","a":"采用某些综合平衡的方法，使额外变量的效果互相抵消，达到控制额外变量的目的。常见的抵消平衡法有 ABBA 法和拉丁方设计。"},{"q":"不完全抵消平衡法","a":"一般指拉丁方法。指每个自变量或实验处理都能同等地出现实验顺序的每个位置这样一种设计类型。尽管它不能将所有可能的实验顺序完全平衡，但是它能保证不同的实验处理所受的顺序效应的影响均等。拉丁方法要求自变量与额外变量之间不能存在交互作用，同时要求每个额外变量的水平数必须与自变量的水平数相等。"},{"q":"被试间设计","a":"每个被试只接受一个自变量水平处理的实验设计，又称为组间设计、独立组设计、完全随机设计。"},{"q":"被试内设计","a":"每个被试或被试组接受所有自变量水平处理的实验设计，又称为组内设计、相关组设计、重复测量设计。被试内设计完全不会受到来自被试个体差异的困扰。"},{"q":"混合设计","a":"一个多自变量设计中，有些自变量是被试间变量，有些自变量是被试内变量。"},{"q":"准实验设计","a":"介于真实验设计和非实验设计之间，虽然可以设置控制组，但不能随机选择和分配被试，准实验设计对额外变量的控制比非实验设计严格，但不如真实验设计控制得充分和广泛。"},{"q":"小样本设计","a":"被试内设计的一种变式，实验时向少数几个或单个被试呈现自变量不同水平或处理方式。"},{"q":"相等时间样本设计","a":"使用两个相等的时间样本，在其中的一个时间样本中出现实验处理，另一个时间样本中不出现实验处理。基本模式为：X1 O1 X 0O2 X1 O3 X 0O4。其中，O1、O3表示接受实验处理后的测验结果，O2、O4 表示没有接受实验处理后的测验结果。"},{"q":"交叉滞后组相关设计","a":"要求在时间 1 对两个变量的关系作出测定和相关分析，再在时间 2 作相似测定和分析，求得同步相关系数 rA1B1、rA1B1 和稳定性相关系数 rA1A2、rA1A2。在同步相关稳定的情况下，如果 rA1B2＞rB1A2，可以认为与 B 引起 A 相比较，A 是B 的更强的原因；反之，B 是A 的更强的原因。"},{"q":"完全随机化设计","a":"也称简单随机化设计，是指用随机化方法将被试分为几组，然后依据实验目的对各组被试实施不同的处理。"},{"q":"所罗门四组设计","a":"随机选择被试，并将被试随机分成四组，两组为实验组，两组为控制组，两组有前测，两组无前测，可以分离出前测的反作用效果。"},{"q":"完全随机析因设计","a":"在实验中有两个或两个以上因素（自变量），并且每个因素至少有两个水平，各因素的各个水平互相结合，构成多种组合处理。然后用随机分配的方法将被试分为若干同质组（分组的个数等于实验处理的个数），同时用随机的方法分配每一组被试接受一种实验处理。"},{"q":"交互作用","a":"两个或两个以上的自变量的不同水平之间的相互作用：一个因素的水平在另一个因素的不同水平上变化趋势不一致的现象。"},{"q":"两因素交互作用的含义和检验方法","a":"两因素交互作用，即一个因素的水平在另一个因素的不同水平上变化趋势不一致的现象，即因素和因素的结合，而对因变量产生的影响如果两个因素彼此独立，即不管其中一个因素处于哪种水平，另一个因素的不同水平均值间的差异都保持一致，则不会产生交互作用。产生交互作用时需进行简单效应分析。"},{"q":"主效应","a":"同时考察各自变量对同一因变量的主要影响效应（交互作用不显著时分析) =单独考虑某个因素对因变量产生的影响。"},{"q":"简单效应","a":"考察一个因素的各个水平在另一个因素的某个水平上的效应（交互作用显著时分析)=一个因素的各个水平在另一个因素某水平上的变异。"},{"q":"随机区组设计","a":"先将被试在无关变量上进行匹配，分为若干区组（保证每个区组内部被试尽量同质，区组之间被试尽量异质），然后将每个区组的被试随机分配到自变量的各个水平。"},{"q":"顺序效应","a":"如果被试参加多个实验处理，会产生两种顺序效应。"},{"q":"疲劳效应","a":"疲劳效应是指随着实验的进行，被试因疲劳而导致完成任务的成绩下降。"},{"q":"练习效应","a":"练习效应是指随着实验的进行，被试对完成实验任务的经验越来越多而引起的行为改变。无论是积极的改变，还是消极的改变，实验者将这种随练习而伴随逐渐改变的现象，称为累计误差。"},{"q":"实验效度","a":"实验方法能达到实验目的的程度，也就是实验结果的准确性和有效性程度，可分为内部效度、外部效度、构想效度和统计结论效度。"},{"q":"内部效度","a":"实验中的自变量与因变量之间因果关系的明确程度，内部效度与无关变量的控制有关。"},{"q":"统计回归效应","a":"在实验处理前选择了在某一特征方面具有极端分数（高分或低分）的被试，实验处理后的测验分数有回归到平均数的趋向（变得不优也不差）。"},{"q":"双盲实验","a":"通过在实验过程中让主试和被试都不知晓实验真实意图，从而排除实验者效应和要求特征效应对实验结果污染的方法。"},{"q":"真实验设计","a":"在随机化原则上选择和分配被试，可有效控制额外变量的影响。可分为完全随机化设计和随机区组化设计。"},{"q":"实验设计","a":"实验设计是实验心理学中最基本的问题，它一般包括考察行为的内容、定义总体和样本、变量的选择、建立操作定义、预期变量的关系等步骤。"}]},{"name":"第4章 实验效度","items":[{"q":"外部效度","a":"实验结果能够普遍推论到样本所在的总体和其他同类现象中去的程度，即实验结果的普遍代表性和适用性，又称生态效度。"},{"q":"现场实验","a":"提高实验结果外部效度最好的方法就是在实验室外进行研究。现场实验是指真实生活情景中进行的有控制的实验，所以又称自然实验。克服了实验室实验的缺点虽然也对实验条件进行适当的控制，但往往是在真实生活情境中进行的，被试不知道自己在被研究，因而实验结果真实性高，其局限为对现实情境的控制有限，因而很难得到精密的实验结果。研究可能受到干扰，现场实验中自变量的操作也比较困难。"},{"q":"构想效度","a":"指变量及变量之间关系构想的准确性，以及实验变量在实验时的操作定义与推论时的定义一致性程度，即对所研究的特质在理论上构想的全面性。理论上构想的代表性不足或过于宽泛都会威胁构想效度，如仅将智力定义为数理逻辑能力，或将平时课堂表现纳入期末成绩考核。"},{"q":"统计结论效度","a":"由于统计方法引起的统计结论有效性的程度，它主要反映统计量与总体参数之间的关系。如一个按几何级数变化的数据，若用几何平均数计算统计量，就可能较好地反映总体参数的情况，若选算术平均数作为代表值，就不能很好地代表总体参数，据此得出的统计结论，其效度当然就存在问题。"}]},{"name":"第5章 反应时法","items":[{"q":"反应时","a":"刺激呈现与反应开始之间的时间间隔，也称“反应的潜伏期”。在反应的潜伏期中包含着感觉器官、大脑加工、神经传入传出所需的时间以及肌肉效应器反应所需的时间，其中大脑加工所耗费的时间最多。"},{"q":"生物墙","a":"即刺激强度较弱时，反应时间较长，且随强度增加，反应时会缩短，到一定程度时，反应时会停留在某一水平。"},{"q":"速度—准确率权衡","a":"实验中被试能根据不同的实验要求或在不同的实验条件下，建立一个权衡反应速度与反应准确率的标准来指导他的反应，如有时会以牺牲准确率为代价去换取反应速度，有时则会以牺牲反应速度为代价去换取反应准确率，这就是速度与准确率权衡现象。单一考虑速度或准确率都会损害实验信度，在进行反应时实验时必须同时考虑两个因变量。"},{"q":"减法反应时","a":"一种用相减的方法将反应时分解成各个成分，然后用来分析信息加工过程的方法，又称唐德斯反应时、ABC 反应时。"},{"q":"C反应","a":"C反应，也称辨别反应，指给被试呈现两个或以上的刺激，要求被试对其中特定的刺激作出反应，对其他刺激不作反应，即只作一个反应，对应于多个刺激中的事先规定好的刺激。"}]},{"name":"第6章 心理物理学方法","items":[{"q":"最小变化法","a":"又称极限法、序列探索法、最小可觉差法，是测量阈限的直接方法。其特点是：将刺激按递增或递减系列的方式，以间隔相等的小步变化，寻求从一种反应到另一种反应的瞬时转换点或阈限的位置。"},{"q":"平均差误法","a":"又称调整法、再造法、均等法，其基本程序是主是呈现一个标准刺激，被时再造、复制或调节一个比较刺激，使它与标准刺激相等，是最古老且基本的心理物理学方法之一。"},{"q":"恒定刺激法","a":"恒定刺激法又叫正误法、次数法，是心理物理学中最准确、应用最广的方法，不仅可用于测定阈限，还可以用于测定等值和多种心理值。恒定刺激法中刺激通常由5~7个组成，在实验过程中恒定不变。"},{"q":"信号检测论","a":"信号检测论可以借助两种独立指标分别表示被试的辨别力和反应偏向，从而将阈限测量中的客观感受性和反应偏向、主观动机等区分开来，从而解决了传统心理物理学所无法解决的问题。"},{"q":"辨别力指数","a":"敏感性可以表现为噪音分布与信号加噪音分布之间的分离程度。两者的分离程度越大，敏感性越高；分离程度越小，敏感性越低。噪音分布与信号加噪音分布的分离程度既受信号的物理性质影响，也受被试特性的影响。因此，噪音分布与信号加噪音分布之间的距离就可作为敏感性的指标，称为辨别力d'。"},{"q":"似然比 β","a":"数学定义为：区分信号与噪音反应的心理感受水平所对应的信号分布纵轴与噪音分布纵轴之比。（写出计算公式）"},{"q":"报告标准C","a":"第二个表示反应偏向的指标。报告标准C是表示反应偏向的较为直接的方法,C是横轴上的判定标准位置,即某一感受经验强度。"},{"q":"接受者操作特性曲线","a":"（ROC 曲线）是以虚惊概率为横轴、击中概率为纵轴所组成的坐标图，以被试在特定刺激条件下由于采用不同的判断标准得出的不同结果画出的曲线。"},{"q":"比例量表","a":"比例量表又称等比量表、比率量表，是最高水平的心理物理量表。它既有相等单位，又有绝对零点，可以运用算术的基本运算方法计算。制定比例量表的主要方法有分段法和数量估计法。"},{"q":"心理物理法","a":"心理物理法是实验心理学中的一种重要方法，它主要研究心理量与物理量之间的关系，从而推断出心理活动的规律和特点。"},{"q":"极限法","a":"将刺激按递增或递减系列的方式，以间隔相等的小步变化，寻求一种反应到另一种反应的转折点，即阈限的位置。又叫最小变化法、序列探索法、最小可觉差法。"}]},{"name":"第7章 典型实验与效应","items":[{"q":"麦考乐效应","a":"麦考乐最初的实验分两个阶段。第一阶段，让被试注视红色背景下的纵方向黑白相间的条纹，然后再注视绿色背景下的横方向黑白条纹，并进行轮换。第二阶段，几分钟后，再呈现一个复合刺激（一半横向、一半纵向的黑白相间条纹，不存在彩色背景）。这时，被试会报告说图片上所有白色竖条被看成是绿色，而白色横条被看成紫红色。这是一种颜色适应现象，其后像是适应色的补色。这种颜色互补效应还受测验图形的条纹方向的影响，因此说这是一种随方向而变化的颜色后效。"},{"q":"启动效应","a":"启动效应是指先前的加工活动对随后的加工活动的影响，包括正启动效应和负启动效应。正启动效应也称促进性启动效应，指起促进作用的启动效应。负启动效应也称抑制性启动效应，指起抑制作用的启动效应。"}]},{"name":"第8章 变量控制与统计方法","items":[{"q":"机体变量","a":"机体变量是指可能对被试的心理或行为产生影响的被试自身的特征或身心状态，可分为准自变量和额外变量。"},{"q":"统计控制法","a":"统计控制法是一种实验后控制，指在实验完成后通过一定的统计技术来事后避免实验中额外变量的干扰。"}]}]});

</script>
<script>

   ========================================================================== */
(function () {
'use strict';

/* ------------------------------ 1. 基础工具 ------------------------------ */

const $ = (s, r = document) => r.querySelector(s);
const $ = (s, r = document) => Array.prototype.slice.call(r.querySelectorAll(s));

const SVG_TAGS = new Set(['svg', 'circle', 'path', 'g', 'rect', 'line', 'polyline',
  'polygon', 'ellipse', 'defs', 'linearGradient', 'stop']);

function createEl(tag) {
  if (SVG_TAGS.has(tag)) {
    try { return document.createElementNS('http://www.w3.org/2000/svg', tag); } catch (e) {}
  }
  return document.createElement(tag);
}

function h(tag, props, ...kids) {
  const el = createEl(tag);
  if (props) {
    for (const k in props) {
      const v = props[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k === 'dataset') Object.assign(el.dataset, v);
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') {
        el.addEventListener(k.slice(2).toLowerCase(), v);
      } else el.setAttribute(k, v === true ? '' : v);
    }
  }
  append(el, kids);
  return el;
}
function append(parent, kids) {
  for (const k of kids) {
    if (k === null || k === undefined || k === false || k === true) continue;
    if (Array.isArray(k)) { append(parent, k); continue; }
    parent.appendChild(k instanceof Node ? k : document.createTextNode(String(k)));
  }
}
function hash(str) {
  let h1 = 5381, h2 = 52711;
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    h1 = (h1 * 33) ^ c;
    h2 = (h2 * 31) ^ c;
  }
  return ((h1 >>> 0) * 4096 + (h2 >>> 0) % 4096).toString(36);
}
function pct(a, b) { return b > 0 ? Math.round((a / b) * 100) : 0; }
function todayKey(d) {
  d = d || new Date();
  const p = n => (n < 10 ? '0' + n : '' + n);
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function vibrate(ms) {
  if (!SET.haptic) return;
  try { navigator.vibrate && navigator.vibrate(ms || 8); } catch (e) {}
}

/* ------------------------------ 2. 存储与设置 ------------------------------ */

const LS = {
  get(k, dft) {
    try {
      const v = localStorage.getItem(k);
      if (v === null || v === undefined) return dft;
      const p = JSON.parse(v);
      return p === null || p === undefined ? dft : p;
    } catch (e) { return dft; }
  },
  set(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch (e) { toast('存储空间不足'); return false; }
  }
};

const K = { study: 'psy.study.v2', open: 'psy.open.v2', set: 'psy.set.v2', days: 'psy.days.v2' };
const DEFAULT_SET = { theme: 'auto', fs: 16, haptic: true, onlyWeak: false };
let SET = Object.assign({}, DEFAULT_SET, LS.get(K.set, {}));
let STUDY = LS.get(K.study, {});
let OPEN = LS.get(K.open, {});
let DAYS = LS.get(K.days, {});
const saveSet = () => LS.set(K.set, SET);
const saveStudy = () => LS.set(K.study, STUDY);

/* ------------------------------ 3. 模块与内容 ------------------------------ */

const MODULES = [
  { id: 'term',   name: '名词解释', icon: '📘', desc: '考试第一题，直接背原文' },
  { id: 'short',  name: '简答',     icon: '📝', desc: '6 题 × 15 分，按点作答' },
  { id: 'comp',   name: '综合',     icon: '🧩', desc: '4 题 × 30 分，论述 + 材料分析' },
  { id: 'recall', name: '快速回忆', icon: '⚡', desc: '思维导图框架，先想再看' }
];
const MODULE_BY_ID = {};
MODULES.forEach(m => { MODULE_BY_ID[m.id] = m; });

const ITEMS = [];
const BY_ID = {};
const TREE = {};
MODULES.forEach(m => { TREE[m.id] = []; });

function loadModules() {
  for (const bank of (window.__MODULES || [])) {
    const mod = bank.module;
    if (!MODULE_BY_ID[mod]) continue;
    let subj = TREE[mod].find(s => s.name === bank.subject);
    if (!subj) {
      subj = { name: bank.subject, icon: bank.icon || '📗', desc: bank.desc || '',
               chapters: [], ids: [] };
      TREE[mod].push(subj);
    }
    for (const ch of (bank.chapters || [])) {
      const chap = { name: ch.name || '未分类', ids: [] };
      for (const it of (ch.items || [])) {
        const q = String(it.q || '').trim();
        const a = String(it.a || '').trim();
        if (!q || !a) continue;
        const item = {
          id: hash(mod + '|' + bank.subject + '|' + chap.name + '|' + q),
          module: mod, subject: bank.subject, chapter: chap.name,
          q, a, src: it.src || '', stars: it.stars || 0
        };
        ITEMS.push(item);
        BY_ID[item.id] = item;
        chap.ids.push(item.id);
        subj.ids.push(item.id);
      }
      if (chap.ids.length) subj.chapters.push(chap);
    }
  }
}

function stateOf(id) { return STUDY[id] || ''; }
function setState(id, s) {
  if (STUDY[id] === s) delete STUDY[id];
  else {
    STUDY[id] = s;
    const d = todayKey();
    DAYS[d] = (DAYS[d] || 0) + 1;
    LS.set(K.days, DAYS);
  }
  saveStudy();
}
function countOf(ids) {
  let ok = 0, weak = 0;
  for (const id of ids) {
    const s = STUDY[id];
    if (s === 'ok') ok++;
    else if (s === 'no' || s === 'vague') weak++;
  }
  return { total: ids.length, ok, weak, done: ok + weak };
}
function filterIds(ids, weakOnly) {
  return weakOnly ? ids.filter(id => stateOf(id) === 'no' || stateOf(id) === 'vague') : ids;
}

/* ------------------------------ 4. 主题 / toast / 弹层 ------------------------------ */

function applyTheme() {
  let t = SET.theme;
  if (t === 'auto') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.dataset.theme = t;
  const meta = $('meta[name=theme-color]');
  if (meta) meta.setAttribute('content', t === 'dark' ? '#161822' : '#6c5ce7');
}
function applyFont() { document.documentElement.style.setProperty('--fs', SET.fs + 'px'); }
if (window.matchMedia) {
  try {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (SET.theme === 'auto') applyTheme();
    });
  } catch (e) {}
}

let toastTimer = null;
function toast(msg, ms) {
  const t = $('#toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, ms || 1800);
}
function openSheet(title, nodes) {

/* ------------------------------ 5. 路由 ------------------------------ */

function go(route) { if (current) nav.push(current); render(route); }
function back() { const r = nav.pop(); render(r || homeRoute()); }
function reset(route) { nav.length = 0; render(route); }

function render(route) {
  current = route;
  const v = $('#view');

  const tabId = route.name === 'home' ? route.module : TAB_OF[route.name];
  const showTab = !!tabId;
  $('#tabbar').hidden = !showTab;

/* ------------------------------ 8. 一题一卡（名词解释 / 简答 / 综合 / 快速回忆） ------------------------------ */

VIEWS.cards = function (route) {
  if (route && route.ids) {
    RC = { ids: route.ids.slice(), idx: 0, flip: false,
           title: route.title || '练习', module: route.module || 'recall',

  }
  if (!RC || !RC.ids.length) {
    return h('div', { class: 'empty' },

  }
  if (RC.finished) return recallSummary();

      h('div', { class: 'rcard-title' }, it.q),
      RC.flip
        ? h('div', { class: 'rcard-body' }, h('div', { class: 'ans' }, it.a))
        : h('div', { class: 'rcard-hint' },
            h('div', { class: 'rcard-hint-ic' }, RC.module === 'recall' ? '🧠' : '✍️'),
            RC.module === 'recall' ? '先在心里回忆一遍这一节的框架' : '先在心里把答案过一遍',
            h('br'),
            RC.module === 'recall' ? '想好了点这张卡看原文' : '想好了点这张卡看答案'),
      s ? h('div', { class: 'rcard-state ' + s },

      ? h('div', { class: 'q-actions' },
          h('button', { class: 'btn ghost sm', style: { flex: '0 0 auto', padding: '13px 13px' },
            onClick: recallPrev }, '‹'),
          h('button', { class: 'btn rc-no', onClick: () => gradeRecall('no') }, '没记住'),
          h('button', { class: 'btn rc-vague', onClick: () => gradeRecall('vague') }, '有点模糊'),
          h('button', { class: 'btn rc-ok', onClick: () => gradeRecall('ok') }, '记住了'))
      : h('div', { class: 'q-actions' },

            ? h('button', { class: 'btn ghost sm', style: { flex: '0 0 auto', padding: '13px 15px' },
                onClick: recallPrev }, '上一张')
            : null,
          h('button', { class: 'btn primary', onClick: flipRecall }, '看原文'),

function flipRecall() { RC.flip = !RC.flip; refreshRecall(); }

/** 小宫格图标 */
function iconGrid() {
  const sq = (x, y) => h('rect', { x: String(x), y: String(y), width: '7', height: '7', rx: '2' });
  return h('svg', { viewBox: '0 0 24 24', width: '15', height: '15',
    style: { fill: 'none', stroke: 'currentColor', strokeWidth: '2' } },
    sq(3.5, 3.5), sq(13.5, 3.5), sq(3.5, 13.5), sq(13.5, 13.5));
}

/** 卡片导航：一屏看到本轮全部卡片，点哪张跳哪张 */
function openCardNav() {
  if (!RC || !RC.ids.length) return;
  const n = RC.ids.length;
  let ok = 0, vague = 0, no = 0, fresh = 0;
  const cells = RC.ids.map((id, i) => {
    const s = stateOf(id);
    if (s === 'ok') ok++; else if (s === 'vague') vague++;
    else if (s === 'no') no++; else fresh++;
    const it = BY_ID[id] || {};
    const cls = ['qn'];
    if (s) cls.push(s === 'ok' ? 'ok' : (s === 'vague' ? 'warn' : 'bad'));
    if (i === RC.idx) cls.push('cur');
    return h('button', {
      class: cls.join(' '),
      title: (i + 1) + '. ' + (it.q || '') + (it.stars ? ' ' + '★'.repeat(it.stars) : ''),
      onClick: () => {
        closeSheet();
        RC.idx = i; RC.flip = false; RC.finished = false; RC.last = null;
        $('#tbMore').hidden = false;
        refreshRecall();
        $('#view').scrollTop = 0;
      }
    }, String(i + 1));
  });

  const jumpTo = (pred) => {
    for (let k = 1; k <= n; k++) {
      const i = (RC.idx + k) % n;
      if (pred(stateOf(RC.ids[i]))) {
        closeSheet();
        RC.idx = i; RC.flip = false; RC.finished = false; RC.last = null;
        $('#tbMore').hidden = false;
        refreshRecall();
        return;
      }
    }
    toast('没有符合条件的卡片');
  };

  openSheet('卡片导航', [
    h('p', { class: 'muted tiny', style: { marginBottom: '12px' } },
      '当前第 ' + (RC.idx + 1) + ' 张 · 共 ' + n + ' 张'),
    h('div', { class: 'row', style: { gap: '8px', flexWrap: 'wrap', marginBottom: '12px' } },
      h('span', { class: 'pill ok' }, '记住了 ' + ok),
      h('span', { class: 'pill', style: { background: 'var(--warn-soft)', color: 'var(--warn)' } }, '模糊 ' + vague),
      h('span', { class: 'pill bad' }, '没记住 ' + no),
      h('span', { class: 'pill gray' }, '未评 ' + fresh)),
    h('div', { class: 'row', style: { gap: '9px', marginBottom: '14px' } },
      h('button', { class: 'btn sm', style: { flex: '1' }, onClick: () => {
          closeSheet(); RC.idx = 0; RC.flip = false; RC.finished = false; RC.last = null;
          refreshRecall();
        } }, '回到第 1 张'),
      h('button', { class: 'btn sm', style: { flex: '1' },
        onClick: () => jumpTo(s => s === 'no' || s === 'vague') }, '跳到没记住的'),
      h('button', { class: 'btn sm', style: { flex: '1' }, onClick: () => {
          closeSheet(); RC.idx = n - 1; RC.flip = false; RC.finished = false; RC.last = null;
          refreshRecall();
        } }, '最后一张')),
    h('div', { class: 'qgrid' }, cells),
    h('div', { class: 'qlegend' },
      h('span', null, '灰色=还没评'),
      h('span', null, h('i', { class: 'g' }), '记住了'),
      h('span', null, h('i', { class: 'w' }), '模糊'),
      h('span', null, h('i', { class: 'r' }), '没记住'),
      h('span', null, '紫圈=当前这张'))
  ]);
}

function refreshRecall() {
  const v = $('#view');
  v.textContent = '';
  append(v, [VIEWS.cards({ name: 'cards' })]);
}
function gradeRecall(g) {
  const id = RC.ids[RC.idx];
  RC.last = { id, prev: STUDY[id] || '', grade: g, idx: RC.idx };
  setState(id, g);
  if (g === 'ok') RC.ok++; else if (g === 'vague') RC.weak++; else RC.wrong++;
  RC.flip = false;
  if (RC.idx >= RC.ids.length - 1) RC.finished = true; else RC.idx++;
  $('#tbMore').hidden = RC.finished;
  refreshRecall();
}
function recallNext() {
  if (RC.idx >= RC.ids.length - 1) {
    RC.finished = true; $('#tbMore').hidden = true; refreshRecall(); return;
  }
  RC.idx++; RC.flip = false; refreshRecall();
}
function recallPrev() { if (RC.idx > 0) { RC.idx--; RC.flip = false; refreshRecall(); } }

function recallUndoBar() {
  if (!RC || !RC.last) return null;
  const label = { ok: '记住了', vague: '有点模糊', no: '没记住' }[RC.last.grade] || '';
  return h('button', { class: 'undo-bar', onClick: () => {
      const { id, prev, grade, idx } = RC.last;
      if (prev) STUDY[id] = prev; else delete STUDY[id];
      saveStudy();
      if (grade === 'ok') RC.ok--; else if (grade === 'vague') RC.weak--; else RC.wrong--;
      RC.idx = idx; RC.flip = true; RC.finished = false; RC.last = null;
      $('#tbMore').hidden = false;
      refreshRecall();
    } },
    h('span', { class: 'ellipsis' }, '上一张标了「' + label + '」'),
    h('b', null, '↩ 撤销'));
}

function recallSummary() {
  const total = RC.ok + RC.weak + RC.wrong;
  const rate = pct(RC.ok, total);
  const C = 2 * Math.PI * 56;
  return h('div', { class: 'result' },
    h('div', { class: 'ring' },
      h('svg', { viewBox: '0 0 132 132',
        style: { position: 'absolute', inset: '0', width: '100%', height: '100%',
                 transform: 'rotate(-90deg)' } },
        h('circle', { cx: '66', cy: '66', r: '56',
          style: { fill: 'none', stroke: 'var(--line)', strokeWidth: '10' } }),
        h('circle', { cx: '66', cy: '66', r: '56',
          style: { fill: 'none', stroke: 'var(--accent)', strokeWidth: '10',
                   strokeLinecap: 'round', strokeDasharray: String(C),
                   strokeDashoffset: String(C * (1 - rate / 100)) } })),
      h('div', { class: 'inner' }, h('b', null, total), h('span', null, '张卡片'))),
    h('h2', null, rate >= 80 ? '框架记得很牢 👏' : '不错，明天再过一遍'),
    h('p', { class: 'muted tiny' }, RC.title),
    h('div', { class: 'res-grid' },
      h('div', null, h('b', { style: { color: 'var(--ok)' } }, RC.ok), h('span', null, '记住了')),
      h('div', null, h('b', { style: { color: 'var(--warn)' } }, RC.weak), h('span', null, '模糊')),
      h('div', null, h('b', { style: { color: 'var(--bad)' } }, RC.wrong), h('span', null, '没记住'))),
    recallUndoBar(),
    h('div', { class: 'sec', style: { textAlign: 'left', marginTop: '20px' } },
      h('div', { class: 'list' },
        (RC.wrong + RC.weak) > 0
          ? liRow('🔁', '马上再过一遍没记住的', (RC.wrong + RC.weak) + ' 张', () => {
              const ids = RC.ids.filter(id => STUDY[id] === 'no' || STUDY[id] === 'vague');
              go({ name: 'cards', module: 'recall', title: RC.title, ids });
            })
          : null,
        liRow('📚', '这一科再滚一轮', RC.ids.length + ' 张', () => {
          go({ name: 'cards', module: 'recall', title: RC.title, ids: RC.ids.slice() });
        }))),
    h('button', { class: 'btn primary', style: { marginTop: '16px' },
      onClick: () => { RC = null; reset({ name: 'home', module: 'recall' }); } },
      '回到快速回忆首页')
  );
}

/* ------------------------------ 10. 我的 ------------------------------ */

function liRow(icon, title, sub, onClick) {
  return h('button', { class: 'li', onClick },
    h('div', { class: 'ic' }, icon),
    h('div', { class: 'grow' }, h('b', null, title), sub ? h('span', null, sub) : null),
    h('div', { class: 'chev' }, '›'));
}

VIEWS.me = function () {
  const ids = ITEMS.map(i => i.id);
  const st = countOf(ids);
  return h('div', null,
    h('div', { class: 'card', style: { padding: '16px', marginBottom: '14px' } },
      h('div', { class: 'row' },
        h('div', { class: 'subj-icon', style: { width: '48px', height: '48px', fontSize: '23px' } }, '📚'),
        h('div', { class: 'grow' },
          h('b', { style: { fontSize: '17px' } }, '心理学专业课背诵'),
          h('div', { class: 'tiny muted' }, ITEMS.length + ' 条内容 · 已学 ' + st.done +
            ' 条 · 待巩固 ' + st.weak + ' 条')))),

    h('div', { class: 'sec' },
      h('div', { class: 'sec-hd' }, h('h2', null, '外观')),
      h('div', { class: 'list' },
        h('div', { class: 'sw' },
          h('div', { class: 'grow' }, h('b', null, '深色模式'),
            h('span', null, '跟随系统或手动切换')),
          h('div', { class: 'seg', style: { width: '170px' } },
            [['auto', '跟随系统'], ['light', '浅色'], ['dark', '深色']].map(([v, t]) =>
              h('button', { class: SET.theme === v ? 'on' : '', onClick: (e) => {
                  SET.theme = v; saveSet(); applyTheme();
                  $('button', e.currentTarget.parentNode).forEach(b => b.classList.remove('on'));
                  e.currentTarget.classList.add('on');
                } }, t)))),
        h('div', { class: 'sw' },
          h('div', { class: 'grow' }, h('b', null, '字号'), h('span', null, '感觉字小就调大')),
          h('div', { class: 'seg', style: { width: '170px' } },
            [['15', '小'], ['16', '标准'], ['18', '大'], ['20', '特大']].map(([v, t]) =>
              h('button', { class: String(SET.fs) === v ? 'on' : '', onClick: (e) => {
                  SET.fs = +v; saveSet(); applyFont();
                  $('button', e.currentTarget.parentNode).forEach(b => b.classList.remove('on'));
                  e.currentTarget.classList.add('on');
                } }, t)))),
        h('div', { class: 'sw' },
          h('div', { class: 'grow' }, h('b', null, '震动反馈'), h('span', null, '标记时轻轻震一下')),
          h('button', { class: 'toggle' + (SET.haptic ? ' on' : ''), onClick: (e) => {
              SET.haptic = !SET.haptic; saveSet();
              e.currentTarget.classList.toggle('on', SET.haptic);
            } })))),

    h('div', { class: 'sec' },
      h('div', { class: 'sec-hd' }, h('h2', null, '数据')),
      h('div', { class: 'list' },
        liRow('📥', '导出备份', '记录 + 设置，换手机用', openExportSheet),
        liRow('❓', '使用说明', '每个模块怎么用', openHelpSheet),
        liRow('🧹', '清空学习记录', '内容不受影响', () => confirmSheet(
          '清空学习记录', '会清掉所有「记住了 / 有点模糊 / 没记住」的标记。确定吗？', '清空', () => {
            STUDY = {}; DAYS = {}; OPEN = {};
            saveStudy(); LS.set(K.days, DAYS); LS.set(K.open, OPEN);
            toast('已清空'); render({ name: 'me' });
          })))),

    h('p', { class: 'tiny muted center', style: { marginTop: '18px', lineHeight: '1.9' } },
      '广东外语外贸大学 应用心理（347）',
      h('br'),
      '记录只存在这台手机上，不上传、不联网也能用')
  );
};

function openExportSheet() {
  const dump = JSON.stringify({
    app: 'psy-recite', version: 2, exportedAt: new Date().toISOString(),
    set: SET, study: STUDY, days: DAYS
  });
  openSheet('导出备份', [
    h('p', { class: 'muted tiny', style: { marginBottom: '12px', lineHeight: '1.8' } },
      '包含所有学习标记和设置，约 ' + (dump.length / 1024).toFixed(1) + ' KB。'),
    h('div', { class: 'field' },
      h('label', null, '备份内容'),
      h('textarea', { id: 'exportText', readonly: true, style: { minHeight: '110px' } }, dump)),
    h('div', { class: 'row', style: { gap: '9px' } },
      h('button', { class: 'btn primary', onClick: () => {
          const blob = new Blob([dump], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = '背诵备份-' + todayKey() + '.json';
          document.body.appendChild(a); a.click();
          setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
          toast('已保存');
        } }, '保存为文件'),
      h('button', { class: 'btn ghost', onClick: () => {
          const ta = $('#exportText'); ta.select();
          if (navigator.clipboard) {
            navigator.clipboard.writeText(dump).then(() => toast('已复制'), () => toast('请长按文本框复制'));
          } else toast('请长按文本框复制');
        } }, '复制')),
    h('div', { class: 'sec mt16' },
      h('div', { class: 'sec-hd' }, h('h2', null, '从备份恢复')),
      h('div', { class: 'field' },
        h('textarea', { id: 'restoreText', placeholder: '粘贴之前导出的 JSON',
          style: { minHeight: '80px' } })),
      h('button', { class: 'btn', onClick: () => {
          const txt = ($('#restoreText').value || '').trim();
          let d;
          try { d = JSON.parse(txt); } catch (e) { toast('不是有效的备份文件'); return; }
          if (!d || d.app !== 'psy-recite') { toast('这不是本应用的备份'); return; }
          confirmSheet('恢复备份', '会覆盖当前的标记，确定吗？', '恢复', () => {
            if (d.study) STUDY = d.study;
            if (d.days) DAYS = d.days;
            if (d.set) SET = Object.assign({}, DEFAULT_SET, d.set);
            saveStudy(); saveSet(); LS.set(K.days, DAYS);
            applyTheme(); applyFont(); closeSheet();
            toast('已恢复'); render(current);
          });
        } }, '恢复'))
  ]);
}

function openHelpSheet() {
  openSheet('使用说明', [
    h('div', { class: 'expl', style: { borderTop: 'none', paddingTop: '0' } },
      h('span', { class: 'lbl' }, '四个模块'),
      '名词解释（普心 120 条 + 实验 66 条）、简答、综合、快速回忆，全部出自你的备考资料。',
      '底部导航切换模块，进去先选科目、再选章节，就能一条条往下过。',
      h('span', { class: 'lbl', style: { marginTop: '12px' } }, '都是「一题一卡」'),
      '正面是题目（考点标题），先在脑子里把答案过一遍，点一下翻面看答案；',
      '然后在下面点一下「没记住 / 有点模糊 / 记住了」。',
      h('span', { class: 'lbl', style: { marginTop: '12px' } }, '卡片导航'),
      '点右上角的「3 / 26」展开卡片导航：一屏看到本轮全部卡片，',
      '按哪张跳哪张，也能一键回到第 1 张、跳到没记住的、或直接到最后一卡。',
      h('span', { class: 'lbl', style: { marginTop: '12px' } }, '考前突击'),
      '进章节后点右上角「⋯ → 只背这轮没记住的」，只过标记过「没记住 / 模糊」的题。',
      h('span', { class: 'lbl', style: { marginTop: '12px' } }, '数据'),
      '所有标记只存在本机浏览器，不上传。偶尔到「我的 → 导出备份」存一份。')
  ]);
}

/* ------------------------------ 11. 启动 ------------------------------ */

function init() {
  applyTheme();
  applyFont();
  loadModules();

  $('#tbBack').addEventListener('click', back);
  $('#tbMore').addEventListener('click', () => {
    if (current && current.name === 'cards' && RC) openRecallSheet();
  });
  $('#sheetClose').addEventListener('click', closeSheet);
  $('#sheetMask').addEventListener('click', (e) => { if (e.target === $('#sheetMask')) closeSheet(); });
  $('.tab').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.tab;
    RC = null;
    if (id === 'me') reset({ name: 'me' });
    else reset({ name: 'home', module: id });
  }));
  window.addEventListener('popstate', () => {
    if (!$('#sheetMask').hidden) closeSheet();
    else if (nav.length) back();
    keepHistory();
  });
  keepHistory();
  reset(homeRoute());

  if (!window.__NO_SW && 'serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    const hadController = !!navigator.serviceWorker.controller;
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloading) return;
      reloading = true;
      location.reload();
    });
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
function keepHistory() { try { history.pushState(null, ''); } catch (e) {} }

function openRecallSheet() {
  const left = RC.ids.length - RC.idx - 1;
  openSheet('本轮设置', [
    h('p', { class: 'muted tiny', style: { marginBottom: '14px' } },
      RC.title + ' · 还剩 ' + left + ' 张 · 已评 ' + (RC.ok + RC.weak + RC.wrong) + ' 张'),
    h('div', { class: 'list', style: { boxShadow: 'none', border: '1px solid var(--line)' } },
      liRow('▦', '卡片导航', '一眼看到全部，点哪张跳哪张', () => {
        closeSheet(); openCardNav();
      }),
      liRow('🏁', '结束本轮，看小结', '不想背完就能先结算', () => {
        closeSheet(); RC.finished = true; $('#tbMore').hidden = true; refreshRecall();
      }),
      liRow('🔁', '只背这轮没记住的', '把队列换成待巩固的', () => {
        const ids = RC.ids.filter(id => STUDY[id] === 'no' || STUDY[id] === 'vague');
        if (!ids.length) { toast('这轮都记住了 👍'); return; }
        closeSheet();
        go({ name: 'cards', module: 'recall', title: '待巩固', ids });
      }),
      liRow('🎲', '打乱剩下没背的', '已评过的顺序不动', () => {
        const head = RC.ids.slice(0, RC.idx + 1);
        const tail = RC.ids.slice(RC.idx + 1).sort(() => Math.random() - 0.5);
        RC.ids = head.concat(tail);
        RC.last = null;
        closeSheet(); refreshRecall(); toast('已打乱');
      }),
      liRow('🚪', '先退出（进度已保存）', '回快速回忆首页', () => {
        closeSheet(); RC = null; reset({ name: 'home', module: 'recall' });
        toast('已评过的都保存了');
      }))
  ]);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();

</script>
</body>
